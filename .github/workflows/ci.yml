name: CI

# Runs the project quality gate on every push and pull request: `just check` →
# `just test-rust` → `just build` → `just cov-gate` → `pytest tests/integration`, with the
# ruff, layer-independence, structure, duplication, guardrail, skip-budget and docstring
# linters.
#
# This used to claim it mirrored `just test-py`, and it did not — the only Python test step
# was `just cov-gate`, whose COV_PATHS deliberately excludes tests/integration. The result was
# that 167 integration files were never *collected* here, which is how a test module that
# failed to import survived five days with every gate green. The integration step below closes
# that; keep this comment honest against the steps if you change them.
#
# Heavy optional backends (torch/tensorflow/gpu) are not installed in `gate`, so tests needing
# them skip via `importorskip`. That hole is real and intentional — `just lint-skips` ratchets
# its size so it cannot grow unnoticed — and torch and TensorFlow are no longer inside it:
# `ml-frameworks.yml` installs both on CPU and runs every suite that needs them.
#
# **Ray is no longer part of that hole.** The `distributed` job below installs it and runs
# every Ray-gated suite, because `dist/` is 34k lines that the gate never executed: a green
# CI said nothing whatsoever about the distributed path, and every defect in it was found by
# a person, in a recorded cluster run, after the fact. See that job for why one runner is
# enough to exercise it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # `release.yml` calls this whole workflow on a version tag and publishes only if it passes.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install engine + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip freeze > "$RUNNER_TEMP/resolved-requirements.txt"

      # The dependency ranges in pyproject.toml are open, so a fresh install tomorrow can
      # resolve a different pyarrow, numpy, sqlglot or duckdb than the one that passed here.
      # Keep the exact set this run tested, so a later break can be diffed against it.
      - name: Record the resolved dependency set
        uses: actions/upload-artifact@v4
        with:
          name: resolved-requirements-gate
          path: ${{ runner.temp }}/resolved-requirements.txt

      - name: Rust check + clippy
        run: |
          just check
          cargo clippy --workspace --exclude bc-py -- -D warnings

      - name: Rust tests
        run: just test-rust

      - name: Python lint (ruff)
        run: just lint-py

      - name: Layer independence
        run: just lint-layers

      - name: Structure limits
        run: just lint-structure

      - name: Duplication gate
        run: just lint-duplication

      - name: Guardrail docs are true
        run: just lint-guardrails

      - name: Unreachable-suite budget
        run: just lint-skips

      - name: Layering exemption ratchet
        run: just lint-layer-debt

      - name: Gate-suppression ratchet
        run: just lint-suppressions

      # CLAUDE.md lists both as the gate for any test change; neither ran anywhere until here.
      - name: Tests that cannot fail
        run: just lint-tests

      - name: Tests arranged not to fail
        run: just lint-methodology

      - name: Public-API docstrings
        run: just lint-docstrings

      - name: Build engine into the environment
        run: just build

      # After the build, because it introspects the live engine surface.
      - name: One spelling per capability
        run: just lint-aliases

      - name: Python tests + coverage gate
        run: just cov-gate

      # `cov-gate` runs the deterministic subset only (COV_PATHS), which excludes
      # tests/integration because those flake under coverage instrumentation's timing. That
      # exclusion was silently load-bearing: CI ran *only* cov-gate, so 167 integration files
      # were never collected at all — not skipped, never looked at. A deleted helper
      # (`plan.feedback.faulted_bytes`, removed in b2fe98ee as "nothing calls it") left
      # test_hardware_telemetry.py failing to import for five days with every gate green.
      # Run them here without coverage: the flake reason does not apply, and the ~1,000 tests
      # that need no Ray actually execute.
      # `--timeout` is not optional here. Run locally against a Ray cluster this suite can
      # block indefinitely — a hung distributed test looks identical to a slow one, and
      # without a per-test limit it wedges the job until the runner's own timeout kills it
      # with no indication of which test was at fault. CI installs no Ray, so those tests skip
      # and this mainly guards the ~1,000 that do run; keep it anyway, because the failure it
      # prevents is the one that wastes the most time to diagnose.
      - name: Integration tests (no coverage instrumentation)
        run: pytest tests/integration -q --timeout=300
        timeout-minutes: 30

  # `rust-version` in Cargo.toml is a promise to anyone building from source, and the other
  # jobs install `stable`, which says nothing about it. It said 1.88 while a locked dependency
  # (`crc-fast` 1.10) required 1.89, so the documented source install failed on the version it
  # named. The toolchain is read from Cargo.toml, so the check cannot drift from the claim.
  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # bc-py's PyO3 build script needs an interpreter even for `cargo check`.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read the declared minimum
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - name: Install that toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Check the workspace on the declared minimum
        run: cargo check --workspace --locked

  distributed:
    name: Distributed (Ray) ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    # Independent of `gate` on purpose. This suite is slower, and a Rust clippy warning
    # should not withhold the answer to "does the distributed path still work" — nor should
    # a distributed failure delay the lint feedback everyone reads first.
    #
    # Sharded because these suites are genuinely slow: each one stands up its own Ray
    # cluster, and a single job running all 59 files risks hitting a wall-clock limit, which
    # reports as a red build that says nothing about the code. Four shards keep each job
    # bounded and make a timeout mean "this shard is slow" rather than "the lane is broken".
    strategy:
      # One shard's failure must not cancel the other three. A cancelled job is not evidence
      # about the job it was cancelled for.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install engine + dev dependencies + Ray
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,ray]'

      - name: Build engine into the environment
        run: just build

      # One runner is enough, and that is a property of the architecture rather than a
      # compromise. `dist/` distributes across *processes*: Ray schedules tasks, splits are
      # pickled to workers, and bulk batches move between them over Arrow Flight, bypassing
      # the object store. Every one of those boundaries exists between two processes on one
      # machine exactly as it does between two machines. What a single runner cannot see is
      # network partition, cross-AZ latency, and heterogeneous hardware — real gaps, and far
      # narrower than "none of it ever runs".
      #
      # The file list is computed, never hardcoded: a hardcoded list silently stops covering
      # files added after it was written, which is the failure mode where the suite keeps
      # passing while covering less. `tools/backend_suites.py` reads the test AST rather than
      # grepping one spelling of `importorskip("ray")`, which missed single quotes, a
      # `ray.serve` gate, a gate in a conftest, a shared helper such as `_ray_cluster`, and
      # every test reaching the cluster through `distributed=True` — each of those skipped in
      # `gate` and was never selected here, so it ran nowhere. The first call holds the
      # selection against the committed inventory (`tools/backend_suites.json`) and names any
      # file that dropped out, which a "at least N files" floor could not see.
      - name: Collect this shard's Ray-gated suites
        id: suites
        run: |
          python tools/backend_suites.py --dep ray
          files=$(python tools/backend_suites.py --dep ray --shard ${{ matrix.shard }}/4)
          echo "shard ${{ matrix.shard }} runs $(printf '%s' "$files" | wc -w) files"
          echo "files=$files" >> "$GITHUB_OUTPUT"

      # RAY_ADDRESS=local makes each run start its own cluster rather than attaching to a
      # shared one. `--timeout` is not optional: a hung distributed test is indistinguishable
      # from a slow one, and without a per-test limit it wedges the job until the runner's own
      # timeout kills it with no indication of which test was at fault.
      - name: Distributed tests
        env:
          RAY_ADDRESS: local
          RAY_DEDUP_LOGS: "0"
        run: pytest ${{ steps.suites.outputs.files }} -q --timeout=600 -p no:randomly
        timeout-minutes: 45

      # The invariant the whole distributed design rests on: a result must be identical
      # whether produced on one node or many. On shard 1 only, and last, so a failure here
      # reads as what it is — a mergeability defect — rather than as one more red test.
      - name: Single-node equals distributed
        if: matrix.shard == 1
        env:
          RAY_ADDRESS: local
        run: pytest tests/differential -q -k "distributed" --timeout=600
        timeout-minutes: 30
