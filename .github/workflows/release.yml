name: Release

# Builds the engine into platform wheels, publishes them to PyPI as `batcher-engine`, and
# publishes multi-arch container images to GHCR.
#
# - On every push to main / pull request / manual run: build all wheels + sdist, smoke-test
#   every wheel on its own platform, and build + smoke-test both images (nothing is published).
# - On a version tag (`vX.Y.Z`): the same, then publish to PyPI via Trusted Publishing and push
#   ghcr.io/<owner>/batcher:<version> and :<version>-ray (plus :latest and :latest-ray).
#
# The wheel set is every platform pyarrow publishes wheels for, because Batcher cannot install
# anywhere pyarrow cannot: Linux glibc and musl on x86_64 and aarch64, macOS on x86_64 and
# arm64, and Windows x86_64. There is no pyarrow wheel for Windows on ARM, ppc64le, or s390x.
#
# Releasing: bump `version` in the workspace `Cargo.toml`, commit, then
# `git tag vX.Y.Z && git push --tags`. The tag must match the package version.
#
# One-time PyPI setup (Trusted Publishing — no API token stored in the repo):
#   PyPI → project `batcher-engine` → Publishing → add a GitHub publisher with
#   owner `stephenoffer`, repo `batcher`, workflow `release.yml`, environment `pypi`.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      # One target's failure must not cancel the other. While the aarch64 cross build was
      # broken it failed ~2 minutes in and cancelled x86_64 every single time, so across two
      # months of red runs the x86_64 wheel was never once observed to build or fail on its
      # own merits. A cancelled job is not evidence about the job it was cancelled for.
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            # glibc 2.17 (manylinux2014). Builds natively, so the widest floor costs nothing.
            manylinux: auto
          - target: aarch64
            # glibc 2.28 (manylinux_2_28), NOT `auto`, and this arch needs it: `ring` — pulled
            # in transitively by `bc-io`'s object_store TLS stack — compiles its own ARM
            # assembly, and since 0.17 that assembly will not build against the GCC-4.8-era
            # sysroot in the manylinux2014 *cross* image, failing with "ARM assembler must
            # define __ARM_ARCH". Upstream declines to support sysroots that old and names
            # manylinux_2_28 as the supported target (PyO3/maturin-action#222,
            # briansmith/ring#1789). That floor is RHEL 8+, Debian 10+, Ubuntu 18.10+ — every
            # distro shipping a Python this package supports (>=3.11) clears it.
            manylinux: "2_28"
          # musllinux: Alpine and other musl-based images, where a manylinux wheel cannot load.
          # pyarrow publishes musllinux_1_2 wheels for both architectures, so these install
          # without compiling anything. Both were cross-built and the x86_64 one run on Alpine
          # 3.20 before they were added here.
          - target: x86_64
            manylinux: musllinux_1_2
            suffix: -musl
          - target: aarch64
            manylinux: musllinux_1_2
            suffix: -musl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: ${{ matrix.manylinux }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}${{ matrix.suffix }}
          path: dist

  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  # A wheel that builds is not a wheel that imports. Install each one on a runner of its own
  # architecture and run packaging/smoke_test.py against it, which refuses to run on a package
  # imported from a source tree. Nothing publishes unless this passes.
  #
  # The musllinux wheels run inside the python:alpine image on the host's Docker, because
  # GitHub's JavaScript actions cannot run inside an Alpine job container. The abi3 wheel is
  # run on both the floor (3.11) and a newer Python, since "one wheel for every 3.11+" is the
  # claim abi3 makes. macOS x86_64 is not smoke-tested: GitHub's Intel macOS runners are being
  # retired, and that wheel is cross-compiled from the same source the arm64 one is.
  smoke:
    needs: [linux, macos, windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            wheels: wheels-linux-x86_64
            python: "3.11"
          - runner: ubuntu-latest
            wheels: wheels-linux-x86_64
            python: "3.13"
          - runner: ubuntu-24.04-arm
            wheels: wheels-linux-aarch64
            python: "3.11"
          - runner: ubuntu-latest
            wheels: wheels-linux-x86_64-musl
            python: "3.11"
            alpine: true
          - runner: ubuntu-24.04-arm
            wheels: wheels-linux-aarch64-musl
            python: "3.11"
            alpine: true
          - runner: macos-latest
            wheels: wheels-macos-aarch64
            python: "3.11"
          - runner: windows-latest
            wheels: wheels-windows
            python: "3.11"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: packaging
          path: src
      - uses: actions/setup-python@v5
        if: ${{ !matrix.alpine }}
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.wheels }}
          path: wheelhouse
      - name: Install the wheel and run the smoke test
        if: ${{ !matrix.alpine }}
        shell: bash
        run: |
          python -m pip install wheelhouse/*.whl
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/src/packaging/smoke_test.py"
      - name: Install the wheel on Alpine and run the smoke test
        if: ${{ matrix.alpine }}
        run: |
          docker run --rm -v "$PWD/wheelhouse:/w:ro" -v "$PWD/src/packaging:/p:ro" -w /tmp \
            python:${{ matrix.python }}-alpine \
            sh -c "pip install --root-user-action=ignore /w/*.whl && python /p/smoke_test.py"

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [smoke, sdist]
    # Only publish on a version tag; pushes/PRs stop after the build sanity check.
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write # Trusted Publishing (OIDC) — no stored API token
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Check the tag matches the package version
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -f "dist/batcher_engine-${version}.tar.gz" || {
            echo "tag ${GITHUB_REF_NAME} does not match the built version:"; ls dist; exit 1; }
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  # Container images, built from the wheels the smoke job just proved rather than compiled again
  # under QEMU. Every run builds each variant for the runner's architecture and runs the smoke
  # test inside it; only a version tag pushes, and only after the PyPI publish succeeded, so an
  # image never names a version PyPI does not have.
  docker:
    name: Container image${{ matrix.variant }}
    needs: [smoke, publish]
    if: ${{ !cancelled() && needs.smoke.result == 'success' && needs.publish.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: ""
            extras: cloud
          - variant: "-ray"
            extras: cloud,ray
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-linux-*
          merge-multiple: true
          path: wheelhouse
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build for this runner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          build-args: |
            WHEELS=prebuilt
            EXTRAS=${{ matrix.extras }}
          load: true
          tags: batcher-smoke:local
      - name: Run the smoke test inside the image
        run: docker run --rm -v "$PWD/packaging:/p:ro" batcher-smoke:local python /p/smoke_test.py
      - name: Compute the image tags
        if: startsWith(github.ref, 'refs/tags/v')
        id: tags
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/batcher"
          version="${GITHUB_REF_NAME#v}"
          echo "tags=${image}:${version}${{ matrix.variant }},${image}:latest${{ matrix.variant }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push linux/amd64 + linux/arm64
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          build-args: |
            WHEELS=prebuilt
            EXTRAS=${{ matrix.extras }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
