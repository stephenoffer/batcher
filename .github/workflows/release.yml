name: Release

# Builds the engine into platform wheels and publishes to PyPI as `batcher-engine`.
#
# - On every push to main / pull request / manual run: build all wheels + sdist as a
#   sanity check (nothing is published).
# - On a version tag (`vX.Y.Z`): build, then publish to PyPI via Trusted Publishing.
#
# Releasing: bump `version` in the workspace `Cargo.toml`, commit, then
# `git tag vX.Y.Z && git push --tags`. The tag must match the package version.
#
# One-time PyPI setup (Trusted Publishing — no API token stored in the repo):
#   PyPI → project `batcher-engine` → Publishing → add a GitHub publisher with
#   owner `stephenoffer`, repo `batcher`, workflow `release.yml`, environment `pypi`.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      # One target's failure must not cancel the other. While the aarch64 cross build was
      # broken it failed ~2 minutes in and cancelled x86_64 every single time, so across two
      # months of red runs the x86_64 wheel was never once observed to build or fail on its
      # own merits. A cancelled job is not evidence about the job it was cancelled for.
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            # glibc 2.17 (manylinux2014). Builds natively, so the widest floor costs nothing.
            manylinux: auto
          - target: aarch64
            # glibc 2.28 (manylinux_2_28), NOT `auto`, and this arch needs it: `ring` — pulled
            # in transitively by `bc-io`'s object_store TLS stack — compiles its own ARM
            # assembly, and since 0.17 that assembly will not build against the GCC-4.8-era
            # sysroot in the manylinux2014 *cross* image, failing with "ARM assembler must
            # define __ARM_ARCH". Upstream declines to support sysroots that old and names
            # manylinux_2_28 as the supported target (PyO3/maturin-action#222,
            # briansmith/ring#1789). That floor is RHEL 8+, Debian 10+, Ubuntu 18.10+ — every
            # distro shipping a Python this package supports (>=3.11) clears it.
            manylinux: "2_28"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: ${{ matrix.manylinux }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [linux, macos, windows, sdist]
    # Only publish on a version tag; pushes/PRs stop after the build sanity check.
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write # Trusted Publishing (OIDC) — no stored API token
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
