sin = { status = "canonical", batcher = "Expr.sin" }
sinh = { status = "canonical", batcher = "Expr.sinh" }
sqrt = { status = "canonical", batcher = "Expr.sqrt" }
tan = { status = "canonical", batcher = "Expr.tan" }
tanh = { status = "canonical", batcher = "Expr.tanh" }
try_add = { status = "gap", need = "addition returning null on overflow (Batcher integer arithmetic wraps)", wave = "W3" }
try_divide = { status = "canonical", batcher = "Expr.safe_divide" }
try_mod = { status = "canonical", batcher = "op:mod" }
try_multiply = { status = "gap", need = "multiplication returning null on overflow (Batcher integer arithmetic wraps)", wave = "W3" }
try_subtract = { status = "gap", need = "subtraction returning null on overflow (Batcher integer arithmetic wraps)", wave = "W3" }
uniform = { status = "gap", need = "uniform random value in [min, max) with seed", wave = "W3" }
width_bucket = { status = "canonical", batcher = "bt.width_bucket" }
