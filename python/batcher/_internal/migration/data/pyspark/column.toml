bitwiseOR = { status = "canonical", batcher = "Expr.bitwise_or" }
bitwiseXOR = { status = "canonical", batcher = "Expr.bitwise_xor" }
cast = { status = "param", batcher = "Expr.cast", need = "Spark DataType objects and DDL type strings (array<int>, map<string,int>, struct<...>)", wave = "W11" }
contains = { status = "canonical", batcher = "Expr.str.contains" }
desc = { status = "canonical", batcher = "Dataset.sort" }
desc_nulls_first = { status = "canonical", batcher = "Dataset.sort" }
desc_nulls_last = { status = "canonical", batcher = "Dataset.sort" }
dropFields = { status = "gap", need = "drop nested struct fields in place", wave = "W8" }
