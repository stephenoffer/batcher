# PySpark 4.2.0 -> Batcher migration registry: pyspark.sql.functions, aggregates, window functions and sketches.
# One row per name in tools/parity/surfaces/pyspark.json; see batcher/_internal/migration/schema.py
# for the statuses. Seeded from the plan's Appendix A census and re-verified against the live surface.

