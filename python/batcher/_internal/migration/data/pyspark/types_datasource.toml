DataSourceStreamWriter = { status = "param", batcher = "batcher.io.Sink", need = "streaming writer with per-micro-batch commit/abort", wave = "W10" }
DataSourceWriter = { status = "param", batcher = "batcher.io.Sink", need = "writer protocol with per-task commit messages and abort()", wave = "W11" }
