IsNull = { status = "param", batcher = "batcher.io.Source", need = "Spark DataSourceReader.pushFilters protocol and its filter classes (Batcher sources take pushdown through the plan, not filter objects)", wave = "W11" }
LessThan = { status = "param", batcher = "batcher.io.Source", need = "Spark DataSourceReader.pushFilters protocol and its filter classes (Batcher sources take pushdown through the plan, not filter objects)", wave = "W11" }
