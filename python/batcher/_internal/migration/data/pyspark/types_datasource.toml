# PySpark 4.2.0 -> Batcher migration registry: types and the Python DataSource API.
# One row per name in tools/parity/surfaces/pyspark.json; see batcher/_internal/migration/schema.py
# for the statuses. Seeded from the plan's Appendix A census and re-verified against the live surface.

[types]
ArrayType = { status = "param", batcher = "Expr.cast", need = "nested list type names in cast and schema (array<int> / list<int64>)", wave = "W11" }
BinaryType = { status = "canonical", batcher = "Expr.cast" }
BooleanType = { status = "canonical", batcher = "Expr.cast" }
ByteType = { status = "canonical", batcher = "Expr.cast" }
CalendarIntervalType = { status = "gap", need = "calendar interval type", wave = "W6" }
CharType = { status = "param", batcher = "Expr.cast", need = "char(n) with fixed length and padding semantics", wave = "W11" }
DataType = { status = "param", batcher = "Expr.cast", need = "DataType objects with fromDDL/simpleString/json round-trips", wave = "W11" }
DateType = { status = "canonical", batcher = "Expr.cast" }
DayTimeIntervalType = { status = "gap", need = "day-time interval type", wave = "W6" }
DecimalType = { status = "canonical", batcher = "Expr.cast" }
DoubleType = { status = "canonical", batcher = "Expr.cast" }
FloatType = { status = "canonical", batcher = "Expr.cast" }
Geography = { status = "gap", need = "geography value type", wave = "W14" }
GeographyType = { status = "gap", need = "geography logical type with SRID", wave = "W14" }
Geometry = { status = "param", batcher = "bt.st_geom_from_wkb", need = "a logical Geometry value type (Batcher geometries are WKB binary)", wave = "W14" }
GeometryType = { status = "param", batcher = "bt.st_geom_from_wkb", need = "a logical Geometry column type with SRID (Batcher geometries are WKB binary)", wave = "W14" }
IntegerType = { status = "canonical", batcher = "Expr.cast" }
LongType = { status = "canonical", batcher = "Expr.cast" }
MapType = { status = "param", batcher = "Expr.cast", need = "map type names in cast and schema (map<string,int>)", wave = "W11" }
NullType = { status = "param", batcher = "Expr.cast", need = "cast to the null type (Batcher raises 'Casting from Int64 to Null not supported')", wave = "W11" }
Row = { status = "mismatch", batcher = "Dataset.to_pylist", note = "Spark results are Row objects with attribute access; Batcher rows are dicts (to_pylist) or tuples (iter_rows)", wave = "W0" }
ShortType = { status = "canonical", batcher = "Expr.cast" }
StringType = { status = "canonical", batcher = "Expr.cast" }
StructField = { status = "param", batcher = "Expr.cast", need = "Spark StructField objects and their DDL spelling as cast/schema targets", wave = "W11" }
StructType = { status = "param", batcher = "Expr.cast", need = "Spark StructType objects and their DDL spelling as cast/schema targets (struct<...> and 'a INT, b STRING' schemas)", wave = "W11" }
TimeType = { status = "gap", need = "TIME type", wave = "W6" }
TimestampNTZType = { status = "canonical", batcher = "Expr.cast" }
TimestampType = { status = "mismatch", batcher = "Expr.cast", note = "Spark TimestampType is an instant rendered in the session time zone (LTZ); Batcher timestamps are naive and read as UTC", wave = "W6" }
VarcharType = { status = "param", batcher = "Expr.cast", need = "varchar(n) length enforcement", wave = "W11" }
VariantType = { status = "gap", need = "VARIANT semi-structured type", wave = "W7" }
VariantVal = { status = "gap", need = "VARIANT value object", wave = "W7" }
YearMonthIntervalType = { status = "gap", need = "year-month interval type", wave = "W6" }

