# Daft 0.7.25 -> Batcher: Session, Catalog and Table.
# Semantics checked by side-by-side runs where a mapping was in doubt; the row contract is in ../../schema.py.

[Session]
attach = { status = "param", batcher = "Session.register", need = "one attach() dispatching on Catalog, Table, UDF, provider or DataFrame", wave = "W9" }
attach_catalog = { status = "gap", need = "Catalog/Table/Identifier objects with namespaces and table lifecycle", wave = "W9" }
attach_function = { status = "canonical", batcher = "Session.register_function" }
attach_provider = { status = "param", batcher = "Session.register_engine", need = "a session provider/model registry (attach_provider/set_provider/set_model/current_model) that AI functions resolve against", wave = "W12" }
attach_table = { status = "gap", need = "Catalog/Table/Identifier objects with namespaces and table lifecycle", wave = "W9" }
attach_view = { status = "canonical", batcher = "Session.register" }
create_namespace = { status = "gap", need = "Catalog/Table/Identifier objects with namespaces and table lifecycle", wave = "W9" }
create_namespace_if_not_exists = { status = "gap", need = "Catalog/Table/Identifier objects with namespaces and table lifecycle", wave = "W9" }
create_table = { status = "gap", need = "catalog-backed create_table from a schema or DataFrame", wave = "W9" }
create_table_if_not_exists = { status = "gap", need = "catalog-backed create_table_if_not_exists", wave = "W9" }
create_temp_table = { status = "param", batcher = "Session.register", need = "a materialized session temp table (register binds a lazy plan)", wave = "W9" }
create_temp_view = { status = "canonical", batcher = "Session.register" }
current_catalog = { status = "gap", need = "Catalog/Table/Identifier objects with namespaces and table lifecycle", wave = "W9" }
current_model = { status = "param", batcher = "Session.list_models", need = "a session provider/model registry (attach_provider/set_provider/set_model/current_model) that AI functions resolve against", wave = "W12" }
current_namespace = { status = "gap", need = "Catalog/Table/Identifier objects with namespaces and table lifecycle", wave = "W9" }
current_provider = { status = "param", batcher = "Session.list_engines", need = "a session provider/model registry (attach_provider/set_provider/set_model/current_model) that AI functions resolve against", wave = "W12" }
detach_catalog = { status = "gap", need = "Catalog/Table/Identifier objects with namespaces and table lifecycle", wave = "W9" }
detach_function = { status = "gap", need = "unregistering a session function", wave = "W9" }
detach_provider = { status = "gap", need = "a session provider/model registry (attach_provider/set_provider/set_model/current_model) that AI functions resolve against", wave = "W12" }
detach_table = { status = "param", batcher = "Session.drop", need = "raise when the table is absent (Session.drop is silent)", wave = "W9" }
drop_namespace = { status = "gap", need = "Catalog/Table/Identifier objects with namespaces and table lifecycle", wave = "W9" }
drop_table = { status = "mismatch", batcher = "Session.drop", note = "Daft drop_table drops the table from the current catalog; Batcher Session.drop only unregisters a session name and never touches storage", wave = "W9" }
get_aggregate_function = { status = "gap", need = "look up a registered aggregate function as an Expression", wave = "W9" }
get_catalog = { status = "gap", need = "Catalog/Table/Identifier objects with namespaces and table lifecycle", wave = "W9" }
get_function = { status = "gap", need = "look up a registered function as an Expression", wave = "W9" }
get_provider = { status = "gap", need = "a session provider/model registry (attach_provider/set_provider/set_model/current_model) that AI functions resolve against", wave = "W12" }
get_table = { status = "gap", need = "Catalog/Table/Identifier objects with namespaces and table lifecycle", wave = "W9" }
has_catalog = { status = "gap", need = "Catalog/Table/Identifier objects with namespaces and table lifecycle", wave = "W9" }
has_namespace = { status = "gap", need = "Catalog/Table/Identifier objects with namespaces and table lifecycle", wave = "W9" }
has_provider = { status = "gap", need = "a session provider/model registry (attach_provider/set_provider/set_model/current_model) that AI functions resolve against", wave = "W12" }
has_table = { status = "gap", need = "has_table predicate over session and catalog tables", wave = "W9" }
list_catalogs = { status = "gap", need = "Catalog/Table/Identifier objects with namespaces and table lifecycle", wave = "W9" }
list_namespaces = { status = "gap", need = "Catalog/Table/Identifier objects with namespaces and table lifecycle", wave = "W9" }
list_tables = { status = "param", batcher = "Session.list", need = "pattern= filtering and catalog-backed tables", wave = "W9" }
load_extension = { status = "out_of_scope", reason = "loads a Daft native extension library; Batcher extends through Python registries, not dynamic native loading" }
read_table = { status = "param", batcher = "Session.table", need = "catalog-backed tables and read options", wave = "W9" }
set_catalog = { status = "gap", need = "Catalog/Table/Identifier objects with namespaces and table lifecycle", wave = "W9" }
set_model = { status = "param", batcher = "Session.register_model", need = "a session provider/model registry (attach_provider/set_provider/set_model/current_model) that AI functions resolve against", wave = "W12" }
set_namespace = { status = "gap", need = "Catalog/Table/Identifier objects with namespaces and table lifecycle", wave = "W9" }
set_provider = { status = "param", batcher = "Session.register_engine", need = "a session provider/model registry (attach_provider/set_provider/set_model/current_model) that AI functions resolve against", wave = "W12" }
sql = { status = "canonical", batcher = "Session.sql" }
use = { status = "gap", need = "Catalog/Table/Identifier objects with namespaces and table lifecycle", wave = "W9" }
write_table = { status = "gap", need = "catalog-backed write_table(identifier, df, mode=)", wave = "W9" }

