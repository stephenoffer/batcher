from_gravitino = { status = "gap", need = "Apache Gravitino catalog backend", wave = "W9" }
from_iceberg = { status = "gap", need = "PyIceberg catalog wrapped as a Catalog object (bt.read.iceberg takes catalog= by name only)", wave = "W9" }
from_paimon = { status = "gap", need = "Apache Paimon catalog backend", wave = "W9" }
from_postgres = { status = "gap", need = "PostgreSQL catalog backend", wave = "W9" }
from_pydict = { status = "param", batcher = "Session.register", need = "an in-memory Catalog object built from a dict of tables", wave = "W9" }
