# Daft 0.7.25 -> Batcher: Date, time and timestamp functions, on Expression and daft.functions.
# Semantics checked by side-by-side runs where a mapping was in doubt; the row contract is in ../../schema.py.

[Expression]
convert_time_zone = { status = "mismatch", batcher = "Expr.dt.convert_timezone", note = "Daft returns a timezone-aware timestamp in the target zone; Batcher convert_timezone(from_tz, to_tz) rewrites a naive wall-clock and returns a naive timestamp. Needs tz-aware timestamps", wave = "W6" }
date = { status = "canonical", batcher = "Expr.dt.date" }
date_trunc = { status = "param", batcher = "Expr.dt.truncate", need = "multi-unit intervals ('15 minutes') and relative_to= origin", wave = "W6" }
day = { status = "canonical", batcher = "Expr.dt.day" }
day_of_month = { status = "canonical", batcher = "Expr.dt.day" }
day_of_week = { status = "canonical", batcher = "Expr.dt.dayofweek", template = 'day_of_week() -> self.dt.dayofweek(start="monday")' }
day_of_year = { status = "canonical", batcher = "Expr.dt.dayofyear" }
hour = { status = "canonical", batcher = "Expr.dt.hour" }
microsecond = { status = "canonical", batcher = "Expr.dt.microsecond" }
millisecond = { status = "canonical", batcher = "Expr.dt.millisecond" }
minute = { status = "canonical", batcher = "Expr.dt.minute" }
month = { status = "canonical", batcher = "Expr.dt.month" }
nanosecond = { status = "canonical", batcher = "Expr.dt.nanosecond" }
partition_days = { status = "canonical", batcher = "bt.partition_days", template = 'partition_days() -> bt.partition_days(self, as_date=True)' }
partition_hours = { status = "canonical", batcher = "bt.partition_hours" }
partition_months = { status = "canonical", batcher = "bt.partition_months" }
partition_years = { status = "canonical", batcher = "bt.partition_years" }
quarter = { status = "canonical", batcher = "Expr.dt.quarter" }
replace_time_zone = { status = "gap", need = "replace_time_zone (attach a zone keeping the local time)", wave = "W6" }
second = { status = "canonical", batcher = "Expr.dt.second" }
strftime = { status = "param", batcher = "Expr.dt.strftime", need = "optional format (Daft defaults to ISO 8601 with fractional seconds)", wave = "W2" }
time = { status = "mismatch", batcher = "Expr.dt.time_of_day", note = "Daft time() returns a TIME value; Batcher time_of_day returns microseconds since midnight as Int64. Needs a TIME type", wave = "W6" }
to_date = { status = "canonical", batcher = "Expr.str.to_date" }
to_datetime = { status = "param", batcher = "Expr.str.to_datetime", need = "timezone= for the parsed timestamp", wave = "W6" }
to_unix_epoch = { status = "canonical", batcher = "Expr.dt.timestamp", template = 'to_unix_epoch(time_unit="s") -> self.dt.timestamp(time_unit)' }
total_days = { status = "gap", need = "Duration total_days", wave = "W6" }
total_hours = { status = "gap", need = "Duration total_hours", wave = "W6" }
total_microseconds = { status = "gap", need = "Duration total_microseconds", wave = "W6" }
total_milliseconds = { status = "gap", need = "Duration total_milliseconds", wave = "W6" }
total_minutes = { status = "gap", need = "Duration total_minutes", wave = "W6" }
total_nanoseconds = { status = "gap", need = "Duration total_nanoseconds", wave = "W6" }
total_seconds = { status = "gap", need = "Duration total_seconds", wave = "W6" }
unix_date = { status = "canonical", batcher = "bt.partition_days" }
week_of_year = { status = "canonical", batcher = "Expr.dt.week" }
year = { status = "canonical", batcher = "Expr.dt.year" }

[functions]
add_months = { status = "param", batcher = "Expr.dt.offset_by", need = "column-valued argument (Batcher accepts only a literal here; Daft accepts an Expression) (months; offset_by takes a literal '1mo' string)", wave = "W2" }
convert_time_zone = { status = "mismatch", batcher = "Expr.dt.convert_timezone", note = "Daft returns a timezone-aware timestamp in the target zone; Batcher convert_timezone(from_tz, to_tz) rewrites a naive wall-clock and returns a naive timestamp. Needs tz-aware timestamps", wave = "W6" }
convert_timezone = { status = "mismatch", batcher = "Expr.dt.convert_timezone", note = "Daft returns a timezone-aware timestamp in the target zone; Batcher convert_timezone(from_tz, to_tz) rewrites a naive wall-clock and returns a naive timestamp. Needs tz-aware timestamps", wave = "W6" }
current_date = { status = "mismatch", batcher = "bt.current_date", note = "Daft current_date is the UTC date; Batcher current_date is the local date bound at plan build, so they differ across midnight in non-UTC zones. Param: tz='UTC'", wave = "W6" }
current_timestamp = { status = "mismatch", batcher = "bt.current_timestamp", note = "Daft current_timestamp is UTC; Batcher current_timestamp is a naive local wall clock bound at plan build (22:06 vs 15:06 on a UTC-7 host). Param: tz='UTC'", wave = "W6" }
current_timezone = { status = "gap", need = "session timezone expression", wave = "W6" }
date = { status = "canonical", batcher = "Expr.dt.date" }
