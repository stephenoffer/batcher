# Daft 0.7.25 -> Batcher: String functions, on Expression and daft.functions.
# Semantics checked by side-by-side runs where a mapping was in doubt; the row contract is in ../../schema.py.

[Expression]
ascii = { status = "canonical", batcher = "Expr.str.ascii" }
capitalize = { status = "canonical", batcher = "Expr.str.capitalize" }
compress = { status = "canonical", batcher = "Expr.str.compress" }
concat = { status = "mismatch", batcher = "bt.concat_str", note = "Daft concat(a, b) is null if either side is null; Batcher concat_str skips nulls ('z' vs null). Param: ignore_nulls=False", wave = "W0" }
contains = { status = "param", batcher = "Expr.str.contains", need = "column-valued argument (Batcher accepts only a literal here; Daft accepts an Expression)", wave = "W2" }
count_matches = { status = "mismatch", batcher = "Expr.str.count_matches", note = "Daft count_matches counts literal patterns (with whole_words= and case_sensitive=); Batcher count_matches counts regex matches ('.' on 'a.b.c' is 2 vs 5). Param: literal=True, whole_words=, case_sensitive=", wave = "W0" }
damerau_levenshtein_distance = { status = "mismatch", batcher = "Expr.str.damerau_levenshtein", note = "Daft computes the restricted (optimal string alignment) distance; Batcher computes unrestricted Damerau-Levenshtein ('ca' vs 'abc' is 3 vs 2), and takes only a constant target. Param: restricted=True", wave = "W0" }
decode = { status = "mismatch", batcher = "Expr.str.from_base64", note = "Daft encode/decode switch charset ('utf-8', 'base64', 'hex', ...) and return binary; Batcher spells each codec separately (str.base64/from_base64, str.hex/unhex, cast('binary')) and returns strings. Param: a charset= codec on one pair of methods", wave = "W3" }
