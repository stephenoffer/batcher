# Batcher's own second spellings, and the one spelling each collapses to.
#
# One table per receiver (the receiver spellings of tools/parity/batcher_targets.py); each key
# is a spelling being removed. The choice follows the parity plan's naming rule: the spelling
# shared by the most of Polars, Spark, Daft, Ray Data and DuckDB, with a tie going to Polars.
#
# A value is the kept attribute name, or an inline table when the replacement is not a plain
# rename: `{ to = "write.csv" }` (a dotted path from the same receiver), `{ to = "count",
# call = true }` (a property replaced by a call), `{ operator = "add" }` (an operator), or
# `{ transform = "...", to = "..." }` (an argument reshaping). Any of them may add
# `keys = ["<param>", ...]` (the call's positional arguments become those keywords, in order:
# `clip_max(2)` is `clip(upper=2)`), or `fill = ["<param>@<position>=<python literal>"]`: when the removed call omits that argument,
# the rewrite passes the removed spelling's default explicitly, because the kept one differs
# (`head()` is `limit(5)`). The rule types and their
# validation live in python/batcher/_internal/migration/renames.py.
#
# Three consumers read this: the `batcher.migrate` codemod rewrites the removed spelling in
# existing code, the migration-error guidance names the replacement when the removed spelling
# is typed, and tests/unit/test_migration_renames.py checks that every second spelling
# `tools/lint_aliases.py` finds has a decision here. Where the kept spelling is today the
# delegate and the removed one holds the implementation (`acos` -> `arccos`), the
# implementation moves under the kept name as part of the removal.


[Dataset]
copy = { transform = "identity", to = "self" }
lazy = { transform = "identity", to = "self" }
skewness = "skew"
n_unique = "count_distinct"
approx_n_unique = "approx_count_distinct"
append = "union"
assign = "with_columns"
astype = "cast"
coalesce = "repartition"
difference = "except_"
drop_duplicates = "distinct"
dropna = "drop_nulls"
empty = { to = "is_empty", call = true }
fillna = "fill_null"
groupby = "group_by"
head = { to = "limit", fill = ["n@0=5"] }
height = { to = "count", call = true }
melt = "unpivot"
merge = "join"
nlargest = "top_k"
nsmallest = "bottom_k"
persist = "cache"
sample_frac = "sample"
slice = { transform = "slice_to_limit", to = "limit" }
sort_values = "sort"
to_csv = { to = "write.csv" }
to_dict = "to_pydict"
to_dicts = "to_pylist"
to_json = { to = "write.json" }
to_parquet = { to = "write.parquet" }
to_tf = { to = "ml.to_tf" }
to_torch_dataloader = { to = "ml.to_torch_dataloader" }
