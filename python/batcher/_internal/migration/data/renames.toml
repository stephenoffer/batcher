# Batcher's own second spellings, and the one spelling each collapses to.
#
# One table per receiver (the dotted receiver spellings of tools/parity/batcher_targets.py);
# each key is a spelling being removed and its value the spelling that stays. The choice
# follows the parity plan's naming rule: the spelling shared by the most of Polars, Spark,
# Daft, Ray Data and DuckDB, with a tie going to Polars.
#
# Three consumers read this: the `batcher.migrate` codemod rewrites the removed spelling to the
# kept one in existing code, the migration-error guidance names the kept spelling when the
# removed one is typed, and tests/unit/test_migration_renames.py checks that every second
# spelling `tools/lint_aliases.py` finds has a decision here. Where the kept spelling is today
# the delegate and the removed one holds the implementation (`acos` -> `arccos`), the
# implementation moves under the kept name as part of the removal.

[Dataset]
append = "union"
assign = "with_columns"
astype = "cast"
coalesce = "repartition"
difference = "except_"
drop_duplicates = "distinct"
dropna = "drop_nulls"
empty = "is_empty"
fillna = "fill_null"
groupby = "group_by"
head = "limit"
height = "count"
merge = "join"
nlargest = "top_k"
nsmallest = "bottom_k"
persist = "cache"
sample_frac = "sample"
to_dict = "to_pydict"
to_dicts = "to_pylist"
transform = "pipe"
unique = "distinct"
unpersist = "uncache"
vstack = "union"
with_row_count = "with_row_index"

["Dataset.meta"]
# `none_match` stays: it completes the `all_match`/`any_match` family a reader scans first.
