<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 680" role="img" width="980" height="680"><defs><style>
  .surface { fill: #ffffff; stroke: #cbd5e1; }
  .band-blue { fill: #eff6ff; stroke: #3b82f6; }
  .band-amber { fill: #fffbeb; stroke: #f59e0b; }
  .band-grey { fill: #f8fafc; stroke: #cbd5e1; }
  .t-title { fill: #1e293b; }
  .t-sub { fill: #5b6675; }
  .t-arrow { fill: #475569; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1e293b; stroke: #334155; }
    .band-blue { fill: #172554; stroke: #3b82f6; }
    .band-amber { fill: #2c1f06; stroke: #f59e0b; }
    .band-grey { fill: #131c31; stroke: #334155; }
    .t-title { fill: #e2e8f0; }
    .t-sub { fill: #94a3b8; }
    .t-arrow { fill: #cbd5e1; }
  }
</style>
<filter id="sh" x="-20%" y="-30%" width="140%" height="180%">
  <feDropShadow dx="0" dy="2.5" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.18"/>
</filter>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><rect x="20" y="20" width="230" height="490" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">YOUR SPLIT</text><g filter="url(#sh)"><rect x="44" y="90" width="182" height="110" rx="10" class="surface" stroke-width="1.2"/></g><text x="135.0" y="145.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">train split</text><text x="135.0" y="164.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">fit may see these</text><g filter="url(#sh)"><rect x="44" y="330" width="182" height="110" rx="10" class="surface" stroke-width="1.2"/></g><text x="135.0" y="385.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">test split</text><text x="135.0" y="404.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">held out</text><text x="135" y="468" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">ds.ml.train_test_split(0.3, seed=0)</text><text x="135" y="486" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">a seeded hash of each row's content</text><rect x="290" y="20" width="670" height="210" rx="16" class="band-blue" stroke-width="1.5"/><text x="308" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">FIT ON THE TRAINING SPLIT ONLY</text><g filter="url(#sh)"><rect x="320" y="74" width="280" height="110" rx="10" class="surface" stroke-width="1.2"/></g><text x="460.0" y="129.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">scaler.fit(train)</text><text x="460.0" y="148.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">mean_, scale_ from train rows</text><g filter="url(#sh)"><rect x="690" y="74" width="250" height="110" rx="10" class="surface" stroke-width="1.2"/></g><text x="815.0" y="129.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">transform both</text><text x="815.0" y="148.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">one scale, learned once</text><path d="M 226 129 L 314 129" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="270" y="112" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">fit</text><path d="M 600 129 L 684 129" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="642" y="112" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">transform</text><text x="625" y="210" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">The held-out statistics never existed.</text><path d="M 226 340 Q 470 290 684 176" fill="none" stroke="#94a3b8" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#arG)"/><text x="462" y="264" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">transform only, never fitted</text><rect x="290" y="300" width="670" height="210" rx="16" class="band-amber" stroke-width="1.5"/><text x="308" y="324" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#f59e0b">FIT ON EVERYTHING</text><g filter="url(#sh)"><rect x="320" y="354" width="280" height="110" rx="10" class="surface" stroke-width="1.2"/></g><text x="460.0" y="409.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">scaler.fit(ds)</text><text x="460.0" y="428.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">mean_, scale_ from every row</text><g filter="url(#sh)"><rect x="690" y="354" width="250" height="110" rx="10" class="surface" stroke-width="1.2"/></g><text x="815.0" y="409.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">transform both</text><text x="815.0" y="428.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">the held-out rows set the scale</text><path d="M 226 175 L 314 352" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="256" y="250" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">train rows</text><path d="M 226 385 L 314 400" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="268" y="372" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">test rows too</text><path d="M 600 409 L 684 409" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="642" y="392" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">transform</text><text x="625" y="490" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Every offline score afterwards is optimistic.</text><rect x="20" y="540" width="940" height="118" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="564" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">WHAT THE ENGINE DOES, AND DOES NOT DO</text><text x="260" y="584" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">fit executes one aggregate and reads</text><text x="260" y="602" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">a few scalars back to the driver;</text><text x="260" y="620" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">transform bakes them in and stays lazy.</text><text x="720" y="584" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Nothing detects the leak. fit runs the same</text><text x="720" y="602" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">aggregate over whatever you hand it:</text><text x="720" y="620" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">no error, no warning, no flag.</text></svg>