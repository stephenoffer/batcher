<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" role="img" width="980" height="520"><defs><style>
  .surface { fill: #ffffff; stroke: #cbd5e1; }
  .band-blue { fill: #eff6ff; stroke: #3b82f6; }
  .band-amber { fill: #fffbeb; stroke: #f59e0b; }
  .band-grey { fill: #f8fafc; stroke: #cbd5e1; }
  .t-title { fill: #1e293b; }
  .t-sub { fill: #5b6675; }
  .t-arrow { fill: #475569; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1e293b; stroke: #334155; }
    .band-blue { fill: #172554; stroke: #3b82f6; }
    .band-amber { fill: #2c1f06; stroke: #f59e0b; }
    .band-grey { fill: #131c31; stroke: #334155; }
    .t-title { fill: #e2e8f0; }
    .t-sub { fill: #94a3b8; }
    .t-arrow { fill: #cbd5e1; }
  }
</style>
<filter id="sh" x="-20%" y="-30%" width="140%" height="180%">
  <feDropShadow dx="0" dy="2.5" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.18"/>
</filter>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><rect x="20" y="20" width="556" height="300" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">SAME STATE IN ANY MERGE ORDER</text><g filter="url(#sh)"><rect x="44" y="72" width="508" height="66" rx="10" class="surface" stroke-width="1.2"/></g><text x="298.0" y="105.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">HyperLogLog</text><text x="298.0" y="124.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">distinct count -- folds by register-wise max</text><g filter="url(#sh)"><rect x="44" y="152" width="508" height="66" rx="10" class="surface" stroke-width="1.2"/></g><text x="298.0" y="185.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Count-Min</text><text x="298.0" y="204.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">how often is THIS key -- folds by cell-wise sum</text><g filter="url(#sh)"><rect x="44" y="232" width="508" height="66" rx="10" class="surface" stroke-width="1.2"/></g><text x="298.0" y="265.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Bloom</text><text x="298.0" y="284.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">membership, data skipping -- folds by bitwise OR</text><text x="298" y="312" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">ColumnStats' min, max, count and ndv fold the same way.</text><rect x="604" y="20" width="356" height="300" rx="16" class="band-amber" stroke-width="1.5"/><text x="622" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#f59e0b">WITHIN ITS OWN RANK ERROR</text><g filter="url(#sh)"><rect x="628" y="72" width="308" height="66" rx="10" class="surface" stroke-width="1.2"/></g><text x="782.0" y="105.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">KLL</text><text x="782.0" y="124.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">quantiles -- its merge compacts</text><g filter="url(#sh)"><rect x="628" y="152" width="308" height="66" rx="10" class="surface" stroke-width="1.2"/></g><text x="782.0" y="185.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">TDigest</text><text x="782.0" y="204.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">quantiles -- re-clusters centroids</text><text x="782" y="246" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Two merge orders give two answers.</text><text x="782" y="266" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Worst measured gap in rank: 0.0097 at</text><text x="782" y="286" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">k=200, and 0.0050 at compression 100.</text><text x="782" y="312" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">That is the error the sketch promises.</text><g filter="url(#sh)"><rect x="300" y="386" width="380" height="88" rx="10" class="surface" stroke-width="1.2"/></g><text x="490.0" y="430.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">The cardinality estimate</text><text x="490.0" y="449.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">row counts and per-column stats</text><path d="M 298 320 L 400 382" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="292" y="364" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">exact counts</text><path d="M 782 320 L 600 382" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="700" y="356" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">quantiles, selectivity</text><text x="490" y="502" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Never assert that a quantile sketch merges to an identical state, and never set out to fix the fact that it does not.</text></svg>