<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 750" role="img" width="980" height="750"><defs><style>
  .surface { fill: #ffffff; stroke: #cbd5e1; }
  .band-blue { fill: #eff6ff; stroke: #3b82f6; }
  .band-amber { fill: #fffbeb; stroke: #f59e0b; }
  .band-grey { fill: #f8fafc; stroke: #cbd5e1; }
  .t-title { fill: #1e293b; }
  .t-sub { fill: #5b6675; }
  .t-arrow { fill: #475569; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1e293b; stroke: #334155; }
    .band-blue { fill: #172554; stroke: #3b82f6; }
    .band-amber { fill: #2c1f06; stroke: #f59e0b; }
    .band-grey { fill: #131c31; stroke: #334155; }
    .t-title { fill: #e2e8f0; }
    .t-sub { fill: #94a3b8; }
    .t-arrow { fill: #cbd5e1; }
  }
</style>
<filter id="sh" x="-20%" y="-30%" width="140%" height="180%">
  <feDropShadow dx="0" dy="2.5" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.18"/>
</filter>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><rect x="20" y="20" width="940" height="96" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">EMBED THE COLUMN ONCE</text><g filter="url(#sh)"><rect x="150" y="44" width="680" height="56" rx="10" class="surface" stroke-width="1.2"/></g><text x="490.0" y="72.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">ds.ml.embed(model, column='text', output_type='fixed_size_list')</text><text x="490.0" y="91.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">one fixed_size_list&lt;float32&gt; vector per row, computed in the engine</text><path d="M 250 104 L 250 196" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="264" y="140" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">no build step</text><path d="M 730 104 L 730 196" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="744" y="140" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">write.lance first</text><rect x="20" y="152" width="460" height="420" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="176" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">EXACT  -  AN ENGINE OPERATOR</text><g filter="url(#sh)"><rect x="60" y="196" width="380" height="74" rx="10" class="surface" stroke-width="1.2"/></g><text x="250.0" y="233.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">ds.ml.nearest_neighbors(q, k)</text><text x="250.0" y="252.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">cosine, l2, l1, hamming, dot</text><path d="M 250 270 L 250 308" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="264" y="294" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">lowers to</text><g filter="url(#sh)"><rect x="60" y="308" width="380" height="74" rx="10" class="surface" stroke-width="1.2"/></g><text x="250.0" y="345.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">distance, sort, limit k</text><text x="250.0" y="364.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">Rust kernels, one scan</text><path d="M 250 382 L 250 420" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="264" y="406" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">shards</text><g filter="url(#sh)"><rect x="60" y="420" width="380" height="74" rx="10" class="surface" stroke-width="1.2"/></g><text x="250.0" y="457.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">exact top-k</text><text x="250.0" y="476.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">the top-k of the shards' top-ks</text><text x="250" y="518" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Mergeable, so one core or a hundred machines</text><text x="250" y="536" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">run it unchanged. Costs a full scan per query.</text><text x="250" y="558" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">The recommended path to a few million rows.</text><rect x="500" y="152" width="460" height="420" rx="16" class="band-amber" stroke-width="1.5"/><text x="518" y="176" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#f59e0b">APPROXIMATE  -  AN INDEX OVER LANCE</text><g filter="url(#sh)"><rect x="540" y="196" width="380" height="74" rx="10" class="surface" stroke-width="1.2"/></g><text x="730.0" y="233.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">build_vector_index(uri)</text><text x="730.0" y="252.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">index_type='IVF_PQ', metric='L2'</text><path d="M 730 270 L 730 308" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="744" y="294" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">delegates to Lance</text><g filter="url(#sh)"><rect x="540" y="308" width="380" height="74" rx="10" class="surface" stroke-width="1.2"/></g><text x="730.0" y="345.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">vector_search(uri, q, k)</text><text x="730.0" y="364.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">nprobes, refine_factor</text><path d="M 730 382 L 730 420" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="744" y="406" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">one driver call</text><g filter="url(#sh)"><rect x="540" y="420" width="380" height="74" rx="10" class="surface" stroke-width="1.2"/></g><text x="730.0" y="457.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">approximate top-k</text><text x="730.0" y="476.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">k rows and a _distance column</text><text x="730" y="518" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Both knobs default to None, so Lance decides.</text><text x="730" y="536" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Raising either probes more of the index:</text><text x="730" y="558" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">you buy recall back with time.</text><rect x="20" y="604" width="940" height="126" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="628" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">WHAT APPROXIMATE ACTUALLY COSTS YOU</text><text x="490" y="648" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">The exact path is the one that distributes. The index path runs on the driver, against one Lance dataset, unsharded.</text><text x="490" y="670" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Nothing here measures the recall you gave up: recall_at_k scores a set you hand it, and no code wires it to the index.</text><text x="490" y="700" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">ds.ml.embed defaults to output_type='tensor', which Lance cannot index. build_vector_index raises rather than mis-index it.</text></svg>