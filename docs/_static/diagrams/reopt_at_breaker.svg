<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img" width="980" height="560"><defs><style>
  .surface { fill: #ffffff; stroke: #cbd5e1; }
  .band-blue { fill: #eff6ff; stroke: #3b82f6; }
  .band-amber { fill: #fffbeb; stroke: #f59e0b; }
  .band-grey { fill: #f8fafc; stroke: #cbd5e1; }
  .t-title { fill: #1e293b; }
  .t-sub { fill: #5b6675; }
  .t-arrow { fill: #475569; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1e293b; stroke: #334155; }
    .band-blue { fill: #172554; stroke: #3b82f6; }
    .band-amber { fill: #2c1f06; stroke: #f59e0b; }
    .band-grey { fill: #131c31; stroke: #334155; }
    .t-title { fill: #e2e8f0; }
    .t-sub { fill: #94a3b8; }
    .t-arrow { fill: #cbd5e1; }
  }
</style>
<filter id="sh" x="-20%" y="-30%" width="140%" height="180%">
  <feDropShadow dx="0" dy="2.5" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.18"/>
</filter>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><rect x="20" y="20" width="940" height="216" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">ONE TURN OF THE LOOP  ·  AT A SINGLE PIPELINE BREAKER</text><g filter="url(#sh)"><rect x="48" y="88" width="252" height="88" rx="10" class="surface" stroke-width="1.2"/></g><text x="174.0" y="132.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Plan the query</text><text x="174.0" y="151.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">a join operand sized by a guess</text><g filter="url(#sh)"><rect x="364" y="88" width="252" height="88" rx="10" class="surface" stroke-width="1.2"/></g><text x="490.0" y="132.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Execute one breaker</text><text x="490.0" y="151.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">the lowest whose inputs all stream</text><g filter="url(#sh)"><rect x="680" y="88" width="252" height="88" rx="10" class="surface" stroke-width="1.2"/></g><text x="806.0" y="132.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Exact row count</text><text x="806.0" y="151.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">measured on the materialized result</text><path d="M 300 132 L 364 132" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="332" y="122" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">cut here</text><path d="M 616 132 L 680 132" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="648" y="122" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">measure</text><text x="490" y="208" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Provenance.DEFAULT: the optimizer knows it is guessing this one.</text><g filter="url(#sh)"><rect x="80" y="312" width="330" height="88" rx="10" class="surface" stroke-width="1.2"/></g><text x="245.0" y="356.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Stop cutting</text><text x="245.0" y="375.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">finish the rest in one shot</text><g filter="url(#sh)"><rect x="570" y="312" width="330" height="88" rx="10" class="surface" stroke-width="1.2"/></g><text x="735.0" y="356.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Re-plan the residual</text><text x="735.0" y="375.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">on the size just measured</text><path d="M 760 180 L 420 308" fill="none" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arG)"/><text x="556" y="252" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">held: within 3x</text><path d="M 830 180 L 760 308" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="872" y="250" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">missed by more</text><g filter="url(#sh)"><rect x="570" y="440" width="330" height="84" rx="10" class="surface" stroke-width="1.2"/></g><text x="735.0" y="482.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Build side, broadcast, join order</text><text x="735.0" y="501.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">chosen on rows, not on a guess</text><path d="M 735 400 L 735 440" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="750" y="426" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">re-optimize</text><text x="80" y="440" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">The splice is a Scan over the stage's</text><text x="80" y="458" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">result, so the next stage's estimator</text><text x="80" y="476" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">reads an exact size rather than one</text><text x="80" y="494" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">more inherited guess.</text><text x="490" y="526" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">"Held" is the symmetric q-error, against optimizer.reoptimize_error (2.0). Same mechanism and granularity as Spark AQE -- nothing re-plans inside a stage.</text><text x="490" y="546" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">A breaker whose output size is already known exactly is not cut at all: 17 of 51 across the 22 TPC-H shapes ran inline, fused into the subplan above them.</text></svg>