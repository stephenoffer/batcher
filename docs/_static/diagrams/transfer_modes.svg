</defs><rect x="20" y="20" width="940" height="96" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">ONE PARTITION, FETCHED BY A CONSUMER</text><g filter="url(#sh)"><rect x="300" y="44" width="380" height="56" rx="10" class="surface" stroke-width="1.2"/></g><text x="490.0" y="72.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">select_mode(source, local)</text><text x="490.0" y="91.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">pure: placement in, mode out</text><text x="193" y="152" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">Same Flight address?</text><text x="193" y="172" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">one process</text><path d="M 193 186 L 193 244" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="205" y="220" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">yes</text><text x="490" y="152" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">Same node identity?</text><text x="490" y="172" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">one host, two processes</text><path d="M 490 186 L 490 244" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="502" y="220" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">no, but</text><text x="787" y="152" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">Neither is known equal</text><text x="787" y="172" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">including unknown placement</text><path d="M 787 186 L 787 244" fill="none" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arG)"/><text x="799" y="220" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">no</text><rect x="20" y="208" width="940" height="262" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="232" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">TRANSFER MODE, CHEAPEST FIRST</text><g filter="url(#sh)"><rect x="48" y="250" width="290" height="92" rx="10" class="surface" stroke-width="1.2"/></g><text x="193.0" y="296.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">DIRECT_MEMORY</text><text x="193.0" y="315.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">read from the local store</text><text x="193" y="372" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">No serialization, no socket.</text><text x="193" y="390" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">The concrete win over an object store.</text><g filter="url(#sh)"><rect x="358" y="250" width="264" height="92" rx="10" class="surface" stroke-width="1.2"/></g><text x="490.0" y="296.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">SHARED_MEMORY</text><text x="490.0" y="315.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">Arrow IPC over a memory map</text><text x="490" y="372" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Selected today, not yet executed:</text><text x="490" y="390" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">a planned Rust fast path.</text><g filter="url(#sh)"><rect x="642" y="250" width="290" height="92" rx="10" class="surface" stroke-width="1.2"/></g><text x="787.0" y="296.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">NETWORK</text><text x="787.0" y="315.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">credit-bounded Arrow Flight</text><text x="787" y="372" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">One credit is one batch slot.</text><text x="787" y="390" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">The producer blocks at zero.</text><text x="490" y="440" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">locality_ratio reports the fraction of transfers that stayed off the network.</text></svg>