<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 508" role="img" width="980" height="508"><defs><style>
  .surface { fill: #ffffff; stroke: #cbd5e1; }
  .band-blue { fill: #eff6ff; stroke: #3b82f6; }
  .band-amber { fill: #fffbeb; stroke: #f59e0b; }
  .band-grey { fill: #f8fafc; stroke: #cbd5e1; }
  .t-title { fill: #1e293b; }
  .t-sub { fill: #5b6675; }
  .t-arrow { fill: #475569; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1e293b; stroke: #334155; }
    .band-blue { fill: #172554; stroke: #3b82f6; }
    .band-amber { fill: #2c1f06; stroke: #f59e0b; }
    .band-grey { fill: #131c31; stroke: #334155; }
    .t-title { fill: #e2e8f0; }
    .t-sub { fill: #94a3b8; }
    .t-arrow { fill: #cbd5e1; }
  }
</style>
<filter id="sh" x="-20%" y="-30%" width="140%" height="180%">
  <feDropShadow dx="0" dy="2.5" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.18"/>
</filter>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><rect x="20" y="20" width="940" height="372" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">ONE MICRO-BATCH · THE ORDER IS THE GUARANTEE</text><g filter="url(#sh)"><rect x="90" y="104" width="200" height="88" rx="10" class="surface" stroke-width="1.2"/></g><text x="190.0" y="148.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Trigger fires</text><text x="190.0" y="167.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">processing_time · available_now</text><g filter="url(#sh)"><rect x="390" y="104" width="200" height="88" rx="10" class="surface" stroke-width="1.2"/></g><text x="490.0" y="148.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Stage the epoch</text><text x="490.0" y="167.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">read, compute, publish nothing</text><g filter="url(#sh)"><rect x="690" y="104" width="200" height="88" rx="10" class="surface" stroke-width="1.2"/></g><text x="790.0" y="148.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Write ahead</text><text x="790.0" y="167.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">record the source position</text><path d="M 290 148.0 L 384 148.0" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="340" y="92" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">one poll of the source</text><path d="M 590 148.0 L 684 148.0" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="640" y="92" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">nothing is published yet</text><path d="M 790.0 192 L 790.0 262" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="776" y="232" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">the position is durable first</text><g filter="url(#sh)"><rect x="690" y="268" width="200" height="88" rx="10" class="surface" stroke-width="1.2"/></g><text x="790.0" y="312.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Publish</text><text x="790.0" y="331.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">hand the rows to the sink</text><g filter="url(#sh)"><rect x="390" y="268" width="200" height="88" rx="10" class="surface" stroke-width="1.2"/></g><text x="490.0" y="312.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Commit</text><text x="490.0" y="331.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">snapshot state, then commit</text><path d="M 684 312.0 L 596 312.0" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="640" y="254" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">rows land in the sink</text><path d="M 384 312.0 Q 190.0 312.0 190.0 198" fill="none" stroke="#d97706" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#arA)"/><text x="370" y="340" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">sleep the rest of the interval</text><text x="190" y="364" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">A draining trigger (once · available_now) skips the wait and stops when the source is spent.</text><rect x="20" y="412" width="940" height="76" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="436" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">IF THE PROCESS DIES</text><text x="490" y="456" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">The only epoch a crash can lose is one that was staged and not published.</text><text x="490" y="474" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">The next run replays it, and a sink that records its own query name and batch id commits nothing the second time.</text></svg>