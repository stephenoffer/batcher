<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 530" role="img" width="980" height="530"><defs><style>
  .surface { fill: #ffffff; stroke: #cbd5e1; }
  .band-blue { fill: #eff6ff; stroke: #3b82f6; }
  .band-amber { fill: #fffbeb; stroke: #f59e0b; }
  .band-grey { fill: #f8fafc; stroke: #cbd5e1; }
  .t-title { fill: #1e293b; }
  .t-sub { fill: #5b6675; }
  .t-arrow { fill: #475569; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1e293b; stroke: #334155; }
    .band-blue { fill: #172554; stroke: #3b82f6; }
    .band-amber { fill: #2c1f06; stroke: #f59e0b; }
    .band-grey { fill: #131c31; stroke: #334155; }
    .t-title { fill: #e2e8f0; }
    .t-sub { fill: #94a3b8; }
    .t-arrow { fill: #cbd5e1; }
  }
</style>
<filter id="sh" x="-20%" y="-30%" width="140%" height="180%">
  <feDropShadow dx="0" dy="2.5" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.18"/>
</filter>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><rect x="20" y="56" width="340" height="280" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="80" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">RUN N</text><g filter="url(#sh)"><rect x="44" y="110" width="292" height="80" rx="10" class="surface" stroke-width="1.2"/></g><text x="190.0" y="150.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Kyber plans</text><text x="190.0" y="169.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">on whatever it knows now</text><g filter="url(#sh)"><rect x="44" y="222" width="292" height="80" rx="10" class="surface" stroke-width="1.2"/></g><text x="190.0" y="262.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Core measures</text><text x="190.0" y="281.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">rows, times, column sketches</text><path d="M 190 190 L 190 222" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="202" y="212" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">executes it</text><g filter="url(#sh)"><rect x="390" y="150" width="220" height="140" rx="10" class="surface" stroke-width="1.2"/></g><text x="500.0" y="220.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">MetadataHub</text><text x="500.0" y="239.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">keyed by plan signature</text><text x="500" y="246" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">and, for anything in machine</text><text x="500" y="264" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">units, by hardware fingerprint</text><text x="500" y="338" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Core writes after every run; Kyber reads before every plan.</text><text x="500" y="366" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">measured cardinalities  ·  operator wall times</text><text x="500" y="386" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">column sketches  ·  fitted cost coefficients  ·  bandit arm rewards</text><rect x="640" y="56" width="320" height="280" rx="16" class="band-blue" stroke-width="1.5"/><text x="658" y="80" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">RUN N + 1</text><g filter="url(#sh)"><rect x="664" y="110" width="272" height="80" rx="10" class="surface" stroke-width="1.2"/></g><text x="800.0" y="150.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Kyber plans again</text><text x="800.0" y="169.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">on measured numbers</text><g filter="url(#sh)"><rect x="664" y="222" width="272" height="80" rx="10" class="surface" stroke-width="1.2"/></g><text x="800.0" y="262.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Core measures</text><text x="800.0" y="281.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">and records again</text><path d="M 800 190 L 800 222" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="812" y="212" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">executes it</text><path d="M 336 258 L 390 232" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="363" y="222" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">writes</text><path d="M 610 198 L 664 166" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="637" y="140" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">reads</text><path d="M 40 442 L 940 442" fill="none" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arG)"/><text x="40" y="428" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">the query ends; the hub does not</text><text x="940" y="428" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">a later query, another process, minutes or days on</text><text x="490" y="490" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">This is the same stage-boundary mechanism Spark AQE uses, with one difference worth claiming: AQE keeps nothing once the</text><text x="490" y="510" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">query finishes, so it re-learns the same shape every time. Core measures, Kyber consumes -- and never the other way round.</text></svg>