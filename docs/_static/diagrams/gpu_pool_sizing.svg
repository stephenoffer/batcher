</defs><rect x="16" y="20" width="948" height="100" rx="16" class="band-grey" stroke-width="1.5"/><text x="34" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">YOU DECLARE  ·  ANY OF THESE, OR NONE</text><rect x="44" y="73" width="67.6" height="20" rx="10" class="pill-blue"/><text x="77.8" y="87" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.4" class="pt-blue">num_gpus</text><rect x="129.6" y="73" width="87.7" height="20" rx="10" class="pill-blue"/><text x="173.45" y="87" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.4" class="pt-blue">concurrency</text><rect x="235.3" y="73" width="81.0" height="20" rx="10" class="pill-blue"/><text x="275.8" y="87" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.4" class="pt-blue">batch_size</text><rect x="334.3" y="73" width="114.5" height="20" rx="10" class="pill-blue"/><text x="391.55" y="87" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.4" class="pt-blue">model_memory_gb</text><text x="940" y="86" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">a value you set always wins</text><rect x="16" y="160" width="948" height="118" rx="16" class="band-blue" stroke-width="1.5"/><text x="34" y="184" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">KYBER  ·  BEFORE THE RUN</text><g filter="url(#sh)"><rect x="48" y="200" width="430" height="62" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="48" y="212" width="4" height="38" rx="2" fill="#3b82f6"/><text x="266.0" y="230.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">GPU fraction from model_memory_gb</text><text x="266.0" y="248.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">light: several per device; over one GPU: whole GPUs</text><g filter="url(#sh)"><rect x="502" y="200" width="430" height="62" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="502" y="212" width="4" height="38" rx="2" fill="#3b82f6"/><text x="720.0" y="230.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">A starting batch_size</text><text x="720.0" y="248.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">seeded from the VRAM left over</text><rect x="16" y="314" width="948" height="118" rx="16" class="band-blue" stroke-width="1.5"/><text x="34" y="338" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">DURING THE RUN</text><g filter="url(#sh)"><rect x="48" y="354" width="430" height="62" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="48" y="366" width="4" height="38" rx="2" fill="#3b82f6"/><text x="266.0" y="384.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">concurrency=(min, max)</text><text x="266.0" y="402.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">adds actors while batches queue, drops to min</text><g filter="url(#sh)"><rect x="502" y="354" width="430" height="62" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="502" y="366" width="4" height="38" rx="2" fill="#3b82f6"/><text x="720.0" y="384.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Throughput controller</text><text x="720.0" y="402.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">refines batch_size from VRAM and throughput</text><rect x="16" y="468" width="948" height="118" rx="16" class="band-amber" stroke-width="1.5"/><text x="34" y="492" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#f59e0b">THE NEXT RUN  ·  WHEN concurrency IS UNSET</text><g filter="url(#sh)"><rect x="48" y="508" width="430" height="62" rx="11" fill="url(#tintAmber)" stroke="#fcd34d" stroke-width="1.2"/></g><rect x="48" y="520" width="4" height="38" rx="2" fill="#f59e0b"/><text x="266.0" y="538.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Pack toward 90% utilization</text><text x="266.0" y="556.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">bounded by measured peak memory, 8 per device max</text><g filter="url(#sh)"><rect x="502" y="508" width="430" height="62" rx="11" fill="url(#tintAmber)" stroke="#fcd34d" stroke-width="1.2"/></g><rect x="502" y="520" width="4" height="38" rx="2" fill="#f59e0b"/><text x="720.0" y="538.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Hold a fed device</text><text x="720.0" y="556.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">at 80% or more, density stays put</text><path d="M 490 124 L 490 156" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="504" y="145.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">fills only what is unset</text><path d="M 490 282 L 490 310" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="504" y="301.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">starts the pool</text><path d="M 490 436 L 490 464" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="504" y="455.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">records utilization and peak memory</text></svg>