ont-weight="700" class="pt-amber">validate</text><rect x="412" y="222" width="66" height="34" rx="7" class="pill-blue"/><text x="445.0" y="243.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" class="pt-blue">train</text><text x="44" y="283.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">pair 4</text><rect x="124" y="262" width="66" height="34" rx="7" class="pill-blue"/><text x="157.0" y="283.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" class="pt-blue">train</text><rect x="196" y="262" width="66" height="34" rx="7" class="pill-blue"/><text x="229.0" y="283.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" class="pt-blue">train</text><rect x="268" y="262" width="66" height="34" rx="7" class="pill-blue"/><text x="301.0" y="283.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" class="pt-blue">train</text><rect x="340" y="262" width="66" height="34" rx="7" class="pill-blue"/><text x="373.0" y="283.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" class="pt-blue">train</text><rect x="412" y="262" width="66" height="34" rx="7" class="pill-amber"/><text x="445.0" y="283.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" class="pt-amber">validate</text><text x="44" y="66" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">hash(row) picks a fold index in [0, k)</text><text x="44" y="324" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Each row validates exactly once, however the</text><text x="44" y="342" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">data is partitioned.</text><text x="44" y="380" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">stratify=</text><text x="116" y="380" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">deals each label round-robin across folds.</text><text x="44" y="408" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">group=</text><text x="100" y="408" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">hashes the group, so an entity stays in one fold.</text><text x="534" y="66" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Cut at quantiles of the time column</text><text x="635.0" y="88" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">1</text><text x="703.0" y="88" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">2</text><text x="771.0" y="88" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">3</text><text x="839.0" y="88" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">4</text><text x="907.0" y="88" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">5</text><text x="534" y="88" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">window</text><text x="534" y="123.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">split 0</text><rect x="604" y="102" width="62" height="34" rx="7" class="pill-blue"/><text x="635.0" y="123.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" class="pt-blue">train</text><rect x="672" y="1