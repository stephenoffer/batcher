<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><text x="490" y="50" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Three micro-batches of (key, value) pairs, into group_by(k).agg(m = col('v').max()). Each cell is what the sink receives on that trigger.</text><rect x="20" y="96" width="940" height="366" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="120" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">THE SAME INPUT, THREE OUTPUT MODES</text><text x="324.0" y="128" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">trigger 1</text><text x="324.0" y="145" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">arrives: (a,5) (a,3) (b,2)</text><text x="570.0" y="128" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">trigger 2</text><text x="570.0" y="145" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">arrives: (b,7) (c,1)</text><text x="816.0" y="128" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">trigger 3</text><text x="816.0" y="145" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">arrives: (a,1) (b,4)</text><text x="38" y="190" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">APPEND</text><text x="38" y="208" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">a stateless pipeline</text><text x="38" y="224" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">over the same input;</text><text x="38" y="240" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">refused over this agg</text><rect x="206" y="160" width="236" height="78" rx="8" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.6"/><text x="324.0" y="204.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" class="t-title">(a,5) (a,3) (b,2)</text><rect x="452" y="160" width="236" height="78" rx="8" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.6"/><text x="570.0" y="204.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" class="t-title">(b,7) (c,1)</text><rect x="698" y="160" width="236" height="78" rx="8" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.6"/><text x="816.0" y="204.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" class="t-title">(a,1) (b,4)</text><text x="38" y="284" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">COMPLETE</text><text x="38" y="302" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">the whole running</text><text x="38" y="318" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">result, every trigger</text><rect x="206" y="254" width="236" height="78" rx="8" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.6"/><text x="324.0" y="290.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" class="t-title">a = 5</text><text x="324.0" y="307.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" class="t-title">b = 2</text><rect x="452" y="254" width="236" height="78" rx="8" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.6"/><text x="570.0" y="282.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" class="t-title">a = 5</text><text x="570.0" y="299.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" class="t-title">b = 7</text><text x="570.0" y="316.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" class="t-title">c = 1</text><rect x="698" y="254" width="236" height="78" rx="8" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.6"/><text x="816.0" y="282.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" class="t-title">a = 5</text><text x="816.0" y="299.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" class="t-title">b = 7</text><text x="816.0" y="316.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" class="t-title">c = 1</text><text x="38" y="378" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">UPDATE</text><text x="38" y="396" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">only the rows that</text><text x="38" y="412" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">changed since the</text><text x="38" y="428" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">last trigger</text><rect x="206" y="348" width="236" height="78" rx="8" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.6"/><text x="324.0" y="384.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" class="t-title">a = 5</text><text x="324.0" y="401.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" class="t-title">b = 2</text><rect x="452" y="348" width="236" height="78" rx="8" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="1.6"/><text x="570.0" y="384.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" class="t-title">b = 7</text><text x="570.0" y="401.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" class="t-title">c = 1</text><rect x="698" y="348" width="236" height="78" rx="8" fill="#94a3b8" fill-opacity="0.14" stroke="#94a3b8" stroke-width="1.6"/><text x="816.0" y="392.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" class="t-title">nothing</text><rect x="20" y="482" width="940" height="108" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="506" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">READING THE THIRD COLUMN</text><text x="490" y="524" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Nothing in the third batch raises any group's maximum, so the running result is the one already emitted. Complete re-sends all three rows anyway;</text><text x="490" y="542" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">update anti-joins against what it last emitted and sends none. On a wide key space that difference is the whole reason to pick update.</text><text x="490" y="566" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">The mode is checked at start(). An aggregate refuses append without a watermark and a windowed group key; a stateless pipeline refuses complete and update.</text></svg>