<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" role="img" width="980" height="520"><defs><style>
  .surface { fill: #ffffff; stroke: #cbd5e1; }
  .band-blue { fill: #eff6ff; stroke: #3b82f6; }
  .band-amber { fill: #fffbeb; stroke: #f59e0b; }
  .band-grey { fill: #f8fafc; stroke: #cbd5e1; }
  .t-title { fill: #1e293b; }
  .t-sub { fill: #5b6675; }
  .t-arrow { fill: #475569; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1e293b; stroke: #334155; }
    .band-blue { fill: #172554; stroke: #3b82f6; }
    .band-amber { fill: #2c1f06; stroke: #f59e0b; }
    .band-grey { fill: #131c31; stroke: #334155; }
    .t-title { fill: #e2e8f0; }
    .t-sub { fill: #94a3b8; }
    .t-arrow { fill: #cbd5e1; }
  }
</style>
<filter id="sh" x="-20%" y="-30%" width="140%" height="180%">
  <feDropShadow dx="0" dy="2.5" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.18"/>
</filter>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><rect x="20" y="24" width="940" height="96" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="48" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">ONE GLOBAL SORT, NOT ONE SORT PER PARTITION</text><text x="490" y="62" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">The rows are sorted once by the PARTITION BY keys and then the ORDER BY keys. The partition keys lead, so</text><text x="490" y="80" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">every partition comes out contiguous, and a near-unique key does not cost a million tiny sorts.</text><text x="490" y="104" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Each function's output column is then scattered back to the row it came from, in the original row order.</text><rect x="20" y="136" width="940" height="248" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="160" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">ONE ORDERED PARTITION, ONE ROW, TWO FRAMES</text><rect x="85" y="168" width="96" height="58" rx="5" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.4"/><text x="133.0" y="198" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" class="t-title">t = 1</text><text x="133.0" y="216" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" class="t-sub">row 0</text><rect x="187" y="168" width="96" height="58" rx="5" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.4"/><text x="235.0" y="198" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" class="t-title">t = 2</text><text x="235.0" y="216" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" class="t-sub">row 1</text><rect x="289" y="168" width="96" height="58" rx="5" fill="#3b82f6" fill-opacity="0.16" stroke="#d97706" stroke-width="2.6"/><text x="337.0" y="198" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" class="t-title">t = 2</text><text x="337.0" y="216" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" class="t-sub">row 2</text><rect x="391" y="168" width="96" height="58" rx="5" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.4"/><text x="439.0" y="198" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" class="t-title">t = 2</text><text x="439.0" y="216" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" class="t-sub">row 3</text><rect x="493" y="168" width="96" height="58" rx="5" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.4"/><text x="541.0" y="198" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" class="t-title">t = 5</text><text x="541.0" y="216" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" class="t-sub">row 4</text><rect x="595" y="168" width="96" height="58" rx="5" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.4"/><text x="643.0" y="198" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" class="t-title">t = 5</text><text x="643.0" y="216" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" class="t-sub">row 5</text><rect x="697" y="168" width="96" height="58" rx="5" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.4"/><text x="745.0" y="198" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" class="t-title">t = 7</text><text x="745.0" y="216" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" class="t-sub">row 6</text><rect x="799" y="168" width="96" height="58" rx="5" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.4"/><text x="847.0" y="198" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" class="t-title">t = 9</text><text x="847.0" y="216" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" class="t-sub">row 7</text><path d="M 187 156 H 487" stroke="#f59e0b" stroke-width="3"/><path d="M 187 156 V 164 M 487 156 V 164" stroke="#f59e0b" stroke-width="3"/><text x="337" y="148" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">peer group: three rows tied on the ORDER BY key</text><text x="337" y="248" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">the current row</text><path d="M 337 228 V 236" stroke="#d97706" stroke-width="2.4"/><path d="M 85 278 H 385" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/><path d="M 85 269 V 287 M 385 269 V 287" stroke="#2563eb" stroke-width="2.4"/><text x="399" y="283" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">ROWS ... CURRENT ROW</text><text x="85" y="300" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">stops at this row: pure position arithmetic, so each tied row gets a different answer</text><path d="M 85 336 H 487" stroke="#d97706" stroke-width="6" stroke-linecap="round"/><path d="M 85 327 V 345 M 487 327 V 345" stroke="#d97706" stroke-width="2.4"/><text x="501" y="341" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">RANGE ... CURRENT ROW</text><text x="85" y="358" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">runs to the end of the peer group, so all three tied rows get the same answer</text><rect x="20" y="400" width="940" height="100" rx="16" class="band-amber" stroke-width="1.5"/><text x="38" y="424" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#f59e0b">THE REST OF THE FAMILY</text><text x="490" y="438" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">GROUPS counts peer groups the way ROWS counts rows. A numeric RANGE offset is a binary search over the</text><text x="490" y="456" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">key's values rather than a walk over peers, and a null order key frames only its own null peer group.</text><text x="490" y="480" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Both frame edges only ever slide right, so a frame is a FIFO queue and no frame is ever rescanned.</text></svg>