<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" role="img" width="980" height="430"><defs><style>
  .surface { fill: #ffffff; stroke: #cbd5e1; }
  .band-blue { fill: #eff6ff; stroke: #3b82f6; }
  .band-amber { fill: #fffbeb; stroke: #f59e0b; }
  .band-grey { fill: #f8fafc; stroke: #cbd5e1; }
  .t-title { fill: #1e293b; }
  .t-sub { fill: #5b6675; }
  .t-arrow { fill: #475569; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1e293b; stroke: #334155; }
    .band-blue { fill: #172554; stroke: #3b82f6; }
    .band-amber { fill: #2c1f06; stroke: #f59e0b; }
    .band-grey { fill: #131c31; stroke: #334155; }
    .t-title { fill: #e2e8f0; }
    .t-sub { fill: #94a3b8; }
    .t-arrow { fill: #cbd5e1; }
  }
</style>
<filter id="sh" x="-20%" y="-30%" width="140%" height="180%">
  <feDropShadow dx="0" dy="2.5" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.18"/>
</filter>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><rect x="20" y="20" width="940" height="250" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">ONE PIPELINE  ·  EACH STAGE ON ITS OWN THREAD</text><g filter="url(#sh)"><rect x="44" y="104" width="176" height="90" rx="10" class="surface" stroke-width="1.2"/></g><text x="132.0" y="149.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Source</text><text x="132.0" y="168.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">Arrow batches</text><g filter="url(#sh)"><rect x="300" y="104" width="200" height="90" rx="10" class="surface" stroke-width="1.2"/></g><text x="400.0" y="149.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">CPU stage</text><text x="400.0" y="168.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">decode, tokenize</text><g filter="url(#sh)"><rect x="580" y="104" width="200" height="90" rx="10" class="surface" stroke-width="1.2"/></g><text x="680.0" y="149.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">GPU stage</text><text x="680.0" y="168.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">the model</text><g filter="url(#sh)"><rect x="830" y="104" width="106" height="90" rx="10" class="surface" stroke-width="1.2"/></g><text x="883.0" y="149.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Out</text><text x="883.0" y="168.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">batches</text><path d="M 220 149 L 300 149" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="260" y="131" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">credits</text><path d="M 500 149 L 580 149" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="540" y="131" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">credits</text><path d="M 780 149 L 830 149" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="400" y="232" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">A stage blocks once its credit window to the next stage is full.</text><rect x="20" y="292" width="940" height="118" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="316" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">WHY THE WINDOW IS BOUNDED</text><text x="180" y="338" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Fast stage cannot</text><text x="180" y="356" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">run ahead into memory.</text><text x="490" y="338" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Stages overlap, so the GPU</text><text x="490" y="356" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">is fed while the CPU decodes.</text><text x="800" y="338" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Output order is preserved,</text><text x="800" y="356" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">and the run streams.</text><text x="490" y="388" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Set credits per stage; num_gpus=0 marks a stage as CPU.</text></svg>