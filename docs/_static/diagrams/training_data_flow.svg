</defs><text x="24" y="80" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="1.8" fill="#5b6675">SHAPE</text><g filter="url(#sh)"><rect x="290" y="40" width="320" height="70" rx="10" class="surface" stroke-width="1.2"/></g><text x="450.0" y="75.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">featured</text><text x="450.0" y="94.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">features computed in the engine</text><text x="24" y="190" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="1.8" fill="#5b6675">SPLIT</text><path d="M 400 110 L 270.0 147" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><path d="M 500 110 L 630.0 147" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="450" y="134" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">hash of key</text><g filter="url(#sh)"><rect x="110" y="150" width="280" height="70" rx="10" class="surface" stroke-width="1.2"/></g><text x="250.0" y="185.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">train</text><text x="250.0" y="204.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">44 rows in the example</text><g filter="url(#sh)"><rect x="510" y="150" width="280" height="70" rx="10" class="surface" stroke-width="1.2"/></g><text x="650.0" y="185.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">test</text><text x="650.0" y="204.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">20 rows, held out</text><text x="24" y="300" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="1.8" fill="#d97706">FIT</text><path d="M 250.0 220 L 250.0 257" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="262.0" y="244" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">fit</text><g filter="url(#sh)"><rect x="110" y="260" width="280" height="70" rx="11" fill="url(#tintAmber)" stroke="#fcd34d" stroke-width="1.2"/></g><rect x="110" y="272" width="4" height="46" rx="2" fill="#f59e0b"/><text x="253.0" y="294.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">scaler.fit(train)</text><text x="253.0" y="312.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">statistics from train only</text><text x="24" y="410" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="1.8" fill="#5b6675">APPLY</text><path d="M 250.0 330 L 250.0 367" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="262.0" y="354" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">transform</text><path d="M 390 295.0 L 570 367" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="470" y="303.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">same stats</text><path d="M 650.0 220 L 650.0 367" fill="none" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arG)"/><text x="662.0" y="299.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">transform</text><g filter="url(#sh)"><rect x="110" y="370" width="280" height="70" rx="10" class="surface" stroke-width="1.2"/></g><text x="250.0" y="405.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">train_x</text><text x="250.0" y="424.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">scaled with train's stats</text><g filter="url(#sh)"><rect x="510" y="370" width="280" height="70" rx="10" class="surface" stroke-width="1.2"/></g><text x="650.0" y="405.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">test_x</text><text x="650.0" y="424.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">scaled with train's stats too</text><text x="24" y="520" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="1.8" fill="#2563eb">LOAD</text><path d="M 250.0 440 L 250.0 477" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="262.0" y="464" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">per rank</text><g filter="url(#glow)"><rect x="110" y="480" width="280" height="76" rx="16" fill="url(#hero)"/></g><text x="250.0" y="516.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="800" fill="#ffffff">stream_loader</text><text x="250.0" y="538.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#ffffff" fill-opacity="0.88">rank 0, rank 1: disjoint slices</text><text x="650.0" y="510" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Split, then fit. A fit on test rows</text><text x="650.0" y="528" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">raises no error and still leaks.</text></svg>