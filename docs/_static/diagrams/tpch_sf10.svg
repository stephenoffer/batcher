</style></defs><rect x="0" y="0" width="980" height="334" rx="14" class="surf"/><text x="40" y="50" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="700" class="t-head">TPC-H scale factor 10, all 22 queries</text><text x="40" y="74" font-family="Helvetica,Arial,sans-serif" font-size="13" class="t-sub">92 cores, best of 3, correctness-gated. Bars show the suite speedup against each engine on the same Arrow input.</text><line x1="500" y1="100" x2="500" y2="238" class="parity" stroke-width="1.6" stroke-dasharray="5 4"/><text x="500" y="258" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-sub">1.0x parity</text><text x="514" y="112" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Batcher ahead &#8594;</text><text x="40" y="140" font-family="Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" class="t-head">DuckDB on the same Arrow</text><text x="40" y="158" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">like-for-like: identical zero-copy input</text><rect x="500" y="120" width="243.63636363636363" height="44" rx="5" class="win"/><text x="755.6363636363636" y="142" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700" class="t-val">3.03x faster</text><text x="755.6363636363636" y="159" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">suite ratio 0.33</text><text x="40" y="206" font-family="Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" class="t-head">Polars</text><text x="40" y="224" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">same Arrow input</text><rect x="500" y="186" width="222.85714285714286" height="44" rx="5" class="win"/><text x="734.8571428571429" y="208" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700" class="t-val">2.86x faster</text><text x="734.8571428571429" y="225" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">suite ratio 0.35</text><text x="40" y="290" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Source: benchmarks/BENCHMARK_RESULTS.md, 2026-08-28. Ratios are suite ratios of Batcher's time over the other engine's.</text><text x="40" y="308" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Against DuckDB's own compressed store the same board reads 1.10, a storage comparison this chart does not plot.</text></svg>