<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 664" role="img" width="980" height="664"><defs><style>
  .surface { fill: #ffffff; stroke: #cbd5e1; }
  .band-blue { fill: #eff6ff; stroke: #3b82f6; }
  .band-amber { fill: #fffbeb; stroke: #f59e0b; }
  .band-grey { fill: #f8fafc; stroke: #cbd5e1; }
  .t-title { fill: #1e293b; }
  .t-sub { fill: #5b6675; }
  .t-arrow { fill: #475569; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1e293b; stroke: #334155; }
    .band-blue { fill: #172554; stroke: #3b82f6; }
    .band-amber { fill: #2c1f06; stroke: #f59e0b; }
    .band-grey { fill: #131c31; stroke: #334155; }
    .t-title { fill: #e2e8f0; }
    .t-sub { fill: #94a3b8; }
    .t-arrow { fill: #cbd5e1; }
  }
</style>
<filter id="sh" x="-20%" y="-30%" width="140%" height="180%">
  <feDropShadow dx="0" dy="2.5" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.18"/>
</filter>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><rect x="24" y="20" width="926" height="74" rx="16" class="band-grey" stroke-width="1.5"/><text x="42" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">WHEN THE IN-MEMORY KERNEL WOULD NOT FIT ITS BUDGET</text><text x="487" y="70" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Which mechanism an operator takes follows from what its state is keyed on.</text><path d="M 400 94 L 300 140" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="296" y="128" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">keyed state</text><path d="M 574 94 L 674 140" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="678" y="128" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">ordered state</text><rect x="24" y="146" width="450" height="330" rx="16" class="band-blue" stroke-width="1.5"/><text x="42" y="170" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">GRACE PARTITIONING</text><g filter="url(#sh)"><rect x="50" y="186" width="398" height="64" rx="10" class="surface" stroke-width="1.2"/></g><text x="249.0" y="218.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">route by hash(key) into P buckets</text><text x="249.0" y="237.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">one Arrow IPC file per bucket</text><path d="M 249 250 L 249 282" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="261" y="272" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">one bucket at a time</text><g filter="url(#sh)"><rect x="50" y="286" width="398" height="64" rx="10" class="surface" stroke-width="1.2"/></g><text x="249.0" y="318.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">read one bucket, run the kernel</text><text x="249.0" y="337.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">the union is the whole answer</text><path d="M 249 350 L 249 382" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="261" y="372" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">bucket still over budget</text><g filter="url(#sh)"><rect x="50" y="386" width="398" height="64" rx="10" class="surface" stroke-width="1.2"/></g><text x="249.0" y="418.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">re-split under a salted hash</text><text x="249.0" y="437.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">fan-out 256 max, depth 3 max</text><text x="249" y="468" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Each sub-bucket is an independent instance of the same operator.</text><rect x="500" y="146" width="450" height="330" rx="16" class="band-grey" stroke-width="1.5"/><text x="518" y="170" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">EXTERNAL MERGE SORT</text><g filter="url(#sh)"><rect x="526" y="186" width="398" height="64" rx="10" class="surface" stroke-width="1.2"/></g><text x="725.0" y="218.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">sort into sized runs, spill each</text><text x="725.0" y="237.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">cut by size, never by key</text><path d="M 725 250 L 725 282" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="737" y="272" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">pass 0 complete</text><g filter="url(#sh)"><rect x="526" y="286" width="398" height="64" rx="10" class="surface" stroke-width="1.2"/></g><text x="725.0" y="318.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">merge up to 16 runs at a time</text><text x="725.0" y="337.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">one batch per run resident</text><path d="M 725 350 L 725 382" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="737" y="372" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">more than one run left</text><g filter="url(#sh)"><rect x="526" y="386" width="398" height="64" rx="10" class="surface" stroke-width="1.2"/></g><text x="725.0" y="418.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">another pass over everything</text><text x="725.0" y="437.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">log16(runs) passes in all</text><text x="725" y="468" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Runs are cut by size (64 MiB by default), not by key, so skew cannot defeat it.</text><rect x="24" y="492" width="926" height="140" rx="16" class="band-grey" stroke-width="1.5"/><text x="42" y="516" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">WHAT EACH OPERATOR ACTUALLY WRITES</text><text x="48" y="532" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">aggregate - partial state: one row per group per morsel reaches the disk, not the input rows</text><text x="48" y="554" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">join - both sides co-partitioned by the join key; only the build bucket is resident, the probe streams through it</text><text x="48" y="576" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">window - whole rows, keyed by PARTITION BY, so every bucket holds complete partitions</text><text x="48" y="598" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">DISTINCT ON - reduced to one row per key per morsel before it is written</text><text x="48" y="620" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">sort - sorted runs; median and n_unique stream one pass over the sorted run instead of holding a per-group list</text><text x="487" y="656" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Both mechanisms return exactly what the in-memory kernel returns. Only peak memory differs.</text></svg>