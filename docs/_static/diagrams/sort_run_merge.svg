  <feDropShadow dx="0" dy="2.5" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.18"/>
</filter>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><rect x="20" y="24" width="940" height="108" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="48" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">DOES THE SORT FIT IN ITS ENVELOPE?</text><g filter="url(#sh)"><rect x="360" y="54" width="260" height="54" rx="10" class="surface" stroke-width="1.2"/></g><text x="490.0" y="81.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">admit(op_id, bytes)</text><text x="490.0" y="100.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">the memory pool answers</text><path d="M 356 81 L 270 81" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="313" y="67" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">fits</text><g filter="url(#sh)"><rect x="48" y="54" width="216" height="54" rx="10" class="surface" stroke-width="1.2"/></g><text x="156.0" y="81.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">parallel_sort_batch</text><text x="156.0" y="100.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">no disk at all</text><path d="M 490 112 L 490 154" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="504" y="140" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">does not fit</text><rect x="20" y="160" width="940" height="184" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="184" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">PASS 0: FILL A RUN, SORT IT, SPILL IT</text><text x="129" y="202" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">morsels</text><rect x="44" y="212" width="30" height="40" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="79" y="212" width="30" height="40" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="114" y="212" width="30" height="40" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="149" y="212" width="30" height="40" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="184" y="212" width="30" height="40" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><path d="M 222 232 L 280 232" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="251" y="220" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">accumulate</text><g filter="url(#sh)"><rect x="286" y="204" width="176" height="60" rx="10" class="surface" stroke-width="1.2"/></g><text x="374.0" y="234.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">one run</text><text x="374.0" y="253.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">budget/4, max 64 MiB</text><path d="M 472 232 L 530 232" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="501" y="220" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">sort_batch</text><g filter="url(#sh)"><rect x="536" y="204" width="176" height="60" rx="10" class="surface" stroke-width="1.2"/></g><text x="624.0" y="234.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">write it out</text><text x="624.0" y="253.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">Arrow IPC stream</text><path d="M 722 232 L 780 232" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="751" y="220" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">one file</text><rect x="790" y="196" width="150" height="18" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="790" y="220" width="150" height="18" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="790" y="244" width="150" height="18" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="790" y="268" width="150" height="18" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><text x="865" y="300" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">one run per file, closed at once</text><text x="400" y="300" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">each input batch is dropped as the run is written, so the relation is never all resident</text><path d="M 865 348 L 865 386" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="760" y="372" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">every run, on disk</text><rect x="20" y="356" width="940" height="194" rx="16" class="band-amber" stroke-width="1.5"/><text x="38" y="380" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#f59e0b">PASS 1..n: MERGE 16 RUNS AT A TIME, AND REPEAT</text><rect x="44" y="400" width="130" height="18" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="44" y="424" width="130" height="18" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="44" y="448" width="130" height="18" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><text x="109" y="484" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">runs in</text><path d="M 184 424 L 242 424" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="213" y="412" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">fan-in 16</text><g filter="url(#sh)"><rect x="248" y="396" width="240" height="60" rx="10" class="surface" stroke-width="1.2"/></g><text x="368.0" y="426.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">min-heap of run heads</text><text x="368.0" y="445.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">one batch per reader</text><path d="M 498 424 L 556 424" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="527" y="412" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">merged</text><rect x="562" y="412" width="130" height="18" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="562" y="436" width="130" height="18" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><text x="627" y="484" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">runs out</text><path d="M 627 466 Q 368 524 109 466" fill="none" stroke="#d97706" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#arA)"/><text x="368" y="538" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">repeat while more than one run remains</text><path d="M 702 424 L 760 424" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="731" y="412" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">last pass</text><g filter="url(#sh)"><rect x="766" y="396" width="180" height="60" rx="10" class="surface" stroke-width="1.2"/></g><text x="856.0" y="426.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">sorted rows</text><text x="856.0" y="445.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">16,384 at a time</text><text x="490" y="572" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">The merged row count is checked against the rows that went in.</text><text x="490" y="590" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">A truncated spill file reads back as a valid shorter stream, which is a sorted prefix rather than an error.</text></svg>