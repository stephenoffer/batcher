class="t-title">live</text><rect x="704" y="334" width="100" height="48" rx="7" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.6"/><text x="754.0" y="364" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="600" class="t-title">live</text><text x="824" y="244" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">read version=1</text><text x="824" y="260" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">reads this row</text><text x="824" y="356" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">read latest</text><text x="824" y="372" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">reads this row</text><path d="M 290.0 392 V 424" stroke="#d97706" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#arA)"/><text x="290.0" y="444" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">delete f1</text><path d="M 406.0 392 V 424" stroke="#d97706" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#arA)"/><text x="406.0" y="444" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">delete f2</text><path d="M 522.0 392 V 424" stroke="#d97706" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#arA)"/><text x="522.0" y="444" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">delete f3</text><rect x="20" y="462" width="940" height="140" rx="16" class="band-amber" stroke-width="1.5"/><text x="38" y="486" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#f59e0b">VACUUM IS THE ONLY OPERATION THAT DELETES</text><text x="40" y="504" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Those three files are referenced by no live version, so vacuum may reclaim them. Until it does, every one of them is still on storage, which is the only</text><text x="40" y="522" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">reason reading version 1 works at all. Time travel is not a backup taken on the side: it is what a log that only ever adds leaves behind.</text><text x="40" y="550" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Compact produced v3 by bin-packing f1 and f3 into f5. Its remove actions retire the two from the log and leave them on storage, so v1 and v2 still read.</text><text x="40" y="572" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Vacuum is the step that makes that irreversible, so it defaults to a dry run and keeps an unreferenced file for a retention window first.</text></svg>