</defs><text x="490" y="54" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Every commit records which files the table now holds. It adds files and retires references; it never rewrites an earlier version.</text><rect x="20" y="90" width="940" height="292" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="114" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">ONE TABLE, FOUR COMMITS, FIVE DATA FILES</text><text x="290.0" y="146" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">f1</text><text x="406.0" y="146" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">f2</text><text x="522.0" y="146" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">f3</text><text x="638.0" y="146" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">f4</text><text x="754.0" y="146" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">f5</text><text x="824" y="146" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">data files on storage</text><text x="40" y="188" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">v0</text><text x="76" y="188" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">create</text><text x="40" y="205" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">add f1, f2</text><rect x="240" y="166" width="100" height="48" rx="7" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.6"/><text x="290.0" y="196" text-anchor="middle" font-family="Helvetica,Arial,san