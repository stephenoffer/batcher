<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><rect x="20" y="20" width="940" height="186" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">AN ORDERING TRAVELS WITH THE PLAN</text><g filter="url(#sh)"><rect x="30" y="86" width="170" height="52" rx="9" class="surface" stroke-width="1.2"/></g><text x="115.0" y="117.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" class="t-title">Scan orders</text><g filter="url(#sh)"><rect x="280" y="86" width="170" height="52" rx="9" class="surface" stroke-width="1.2"/></g><text x="365.0" y="117.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" class="t-title">Filter</text><g filter="url(#sh)"><rect x="530" y="86" width="170" height="52" rx="9" class="surface" stroke-width="1.2"/></g><text x="615.0" y="117.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" class="t-title">Project</text><g filter="url(#sh)"><rect x="780" y="86" width="170" height="52" rx="9" class="surface" stroke-width="1.2"/></g><text x="865.0" y="117.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" class="t-title">Aggregate</text><text x="115.0" y="158" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">establishes it, from</text><text x="115.0" y="174" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">a proved footer order</text><text x="365.0" y="158" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">preserves it</text><text x="615.0" y="158" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">preserves it, under</text><text x="615.0" y="174" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">the new column name</text><text x="865.0" y="158" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">destroys it: a later</text><text x="865.0" y="174" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">sort has to run</text><path d="M 208 112 L 270 112" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="239.0" y="104" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="700" fill="#2563eb">(o_date)</text><path d="M 458 112 L 520 112" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="489.0" y="104" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="700" fill="#2563eb">(o_date)</text><path d="M 708 112 L 770 112" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="739.0" y="104" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="700" fill="#2563eb">(day)</text><text x="865.0" y="76" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="700" fill="#2563eb">and out the far side: ( )</text><rect x="20" y="222" width="940" height="206" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="246" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">A PARTITIONING IS NEVER CARRIED, ONLY RECOMPUTED</text><g filter="url(#sh)"><rect x="60" y="268" width="200" height="52" rx="9" class="surface" stroke-width="1.2"/></g><text x="160.0" y="299.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" class="t-title">Join on k</text><g filter="url(#sh)"><rect x="300" y="268" width="200" height="52" rx="9" class="surface" stroke-width="1.2"/></g><text x="400.0" y="299.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" class="t-title">Filter</text><g filter="url(#sh)"><rect x="540" y="268" width="200" height="52" rx="9" class="surface" stroke-width="1.2"/></g><text x="640.0" y="299.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" class="t-title">Aggregate on (k, x)</text><path d="M 268 294 L 290 294" fill="none" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#arG)"/><path d="M 508 294 L 530 294" fill="none" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#arG)"/><text x="279" y="284" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">rows</text><text x="519" y="284" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">rows</text><g filter="url(#sh)"><rect x="540" y="352" width="400" height="62" rx="10" class="surface" stroke-width="1.2"/></g><text x="740.0" y="383.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">dist scheduling, or the cost model</text><text x="740.0" y="402.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">the point of decision</text><path d="M 620 350 L 182 324" fill="none" stroke="#d97706" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#arA)"/><text x="300" y="348" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#d97706">walks the plan again, here and now</text><text x="60" y="404" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Nothing stores it, and there is no Exchange node to enforce it.</text><text x="60" y="420" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">The delivered (k) sits inside the required (k, x), so the shuffle is skipped.</text><rect x="20" y="444" width="940" height="178" rx="16" class="band-amber" stroke-width="1.5"/><text x="38" y="468" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#f59e0b">AND THE TWO CONTAIN IN OPPOSITE DIRECTIONS</text><g filter="url(#sh)"><rect x="50" y="482" width="400" height="84" rx="10" class="surface" stroke-width="1.2"/></g><text x="250.0" y="524.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">An ordering: longer satisfies shorter</text><text x="250.0" y="543.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">sorted by (a, b) is also sorted by (a)</text><g filter="url(#sh)"><rect x="510" y="482" width="400" height="84" rx="10" class="surface" stroke-width="1.2"/></g><text x="710.0" y="524.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">A partitioning: subset satisfies superset</text><text x="710.0" y="543.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">partitioned on (a) keeps every (a, b) group whole</text><text x="250" y="592" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#d97706">(a) alone does not satisfy (a, b).</text><text x="730" y="592" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#d97706">(a, b) does not keep an (a) group whole.</text><text x="490" y="612" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Getting this backwards drops a sort that was needed, or skips a shuffle that was not optional.</text><text x="490" y="632" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#5b6675">A wrong claim about either is a wrong answer, not a slow one.</text></svg>