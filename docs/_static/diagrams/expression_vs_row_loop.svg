see inside it</text><path d="M 250 380 L 250 424" fill="none" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arG)"/><text x="264" y="407" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">runs in Python</text><g filter="url(#sh)"><rect x="64" y="430" width="372" height="86" rx="10" class="surface" stroke-width="1.2"/></g><text x="250.0" y="473.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Python interpreter</text><text x="250.0" y="492.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">called once per row</text><text x="250" y="552" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Nothing to push down, prune, or fold.</text><rect x="500" y="20" width="460" height="560" rx="16" class="band-blue" stroke-width="1.5"/><text x="518" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">AN EXPRESSION</text><rect x="532" y="62" width="396" height="60" rx="9" class="code-bg" stroke-width="1"/><text x="546" y="88.5" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13" class="t-code" xml:space="preserve">total = bt.col(&quot;x&quot;) * bt.lit(10)</text><text x="546" y="108.5" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13" class="t-code" xml:space="preserve">ds.select(scaled=total)</text><path d="M 730 146 L 730 184" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="744" y="170" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">builds</text><g filter="url(#sh)"><rect x="544" y="190" width="372" height="70" rx="10" class="surface" stroke-width="1.2"/></g><text x="730.0" y="225.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Expression tree</text><text x="730.0" y="244.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">a description, not a loop</text><path d="M 730 260 L 730 304" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="744" y="287" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">shipped in the plan</text><g filter="url(#sh)"><rect x="544" y="310" width="372" height="70" rx="10" class="surface" stroke-width="1.2"/></g><text x="730.0" y="345.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Optimizer</text><text x="730.0" y="364.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">pushes filters, prunes, folds</text><path d="M 730 380 L 730 424" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="744" y="407" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">runs in Rust</text><g filter="url(#glow)"><rect x="544" y="430" width="372" height="86" rx="16" fill="url(#hero)"/></g><text x="730.0" y="471.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="800" fill="#ffffff">Whole Arrow batches</text><text x="730.0" y="493.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#ffffff" fill-opacity="0.88">vectorized kernels, Cranelift for numeric work</text><text x="730" y="552" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">No part of it walks rows in Python.</text></svg>