<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 652" role="img" width="980" height="652"><defs><style>
  .surface { fill: #ffffff; stroke: #cbd5e1; }
  .band-blue { fill: #eff6ff; stroke: #3b82f6; }
  .band-amber { fill: #fffbeb; stroke: #f59e0b; }
  .band-grey { fill: #f8fafc; stroke: #cbd5e1; }
  .t-title { fill: #1e293b; }
  .t-sub { fill: #5b6675; }
  .t-arrow { fill: #475569; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1e293b; stroke: #334155; }
    .band-blue { fill: #172554; stroke: #3b82f6; }
    .band-amber { fill: #2c1f06; stroke: #f59e0b; }
    .band-grey { fill: #131c31; stroke: #334155; }
    .t-title { fill: #e2e8f0; }
    .t-sub { fill: #94a3b8; }
    .t-arrow { fill: #cbd5e1; }
  }
</style>
<filter id="sh" x="-20%" y="-30%" width="140%" height="180%">
  <feDropShadow dx="0" dy="2.5" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.18"/>
</filter>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><rect x="20" y="24" width="940" height="96" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="48" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">DOES THE BUILD SIDE FIT?</text><g filter="url(#sh)"><rect x="352" y="54" width="276" height="54" rx="10" class="surface" stroke-width="1.2"/></g><text x="490.0" y="81.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">admit(build bytes)</text><text x="490.0" y="100.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">Arrow bytes + 12 B per build row</text><path d="M 348 81 L 262 81" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="305" y="67" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">fits</text><g filter="url(#sh)"><rect x="44" y="54" width="214" height="54" rx="10" class="surface" stroke-width="1.2"/></g><text x="151.0" y="81.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">one hash table</text><text x="151.0" y="100.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">on the right, probed by the left</text><path d="M 490 106 L 490 142" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="504" y="130" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">does not fit</text><rect x="20" y="148" width="940" height="232" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="172" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">PARTITION BOTH SIDES BY THE JOIN KEY</text><text x="114" y="190" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">left rows (probe)</text><rect x="44" y="200" width="30" height="32" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="79" y="200" width="30" height="32" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="114" y="200" width="30" height="32" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="149" y="200" width="30" height="32" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><path d="M 189 216 L 366 216" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="277" y="204" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">hash the join key</text><rect x="376" y="190" width="150" height="18" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="376" y="214" width="150" height="18" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="376" y="238" width="150" height="18" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><text x="451" y="276" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">join-left/part-i.arrow</text><text x="114" y="298" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">right rows (build)</text><rect x="44" y="308" width="30" height="32" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="79" y="308" width="30" height="32" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="114" y="308" width="30" height="32" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="149" y="308" width="30" height="32" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><path d="M 189 324 L 366 324" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="277" y="312" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">the same hash, same buckets</text><rect x="376" y="298" width="150" height="18" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="376" y="322" width="150" height="18" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="376" y="346" width="150" height="18" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><text x="451" y="366" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">join-right/part-i.arrow</text><text x="762" y="196" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">One batch at a time, so neither side</text><text x="762" y="214" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">is ever fully materialized.</text><text x="762" y="300" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Bucket count is sized from the LARGER</text><text x="762" y="318" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">side divided by the budget, from 2 to 256.</text><text x="762" y="336" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Equal keys co-partition, so the union of the</text><text x="762" y="354" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">per-bucket joins is the full join, every type.</text><path d="M 451 388 L 451 420" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="465" y="410" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">one pair at a time</text><rect x="20" y="396" width="940" height="214" rx="16" class="band-amber" stroke-width="1.5"/><text x="38" y="420" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#f59e0b">JOIN ONE BUCKET PAIR</text><text x="84" y="450" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">build bucket i</text><rect x="44" y="458" width="80" height="22" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><text x="84" y="578" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">probe bucket i</text><rect x="44" y="586" width="80" height="22" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><path d="M 130 470 L 224 494" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="140" y="462" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">read whole</text><path d="M 130 590 L 224 524" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="138" y="566" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">streamed in chunks</text><g filter="url(#sh)"><rect x="230" y="478" width="250" height="62" rx="10" class="surface" stroke-width="1.2"/></g><text x="355.0" y="509.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">join the bucket pair</text><text x="355.0" y="528.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">index pairs per chunk</text><path d="M 486 509 L 544 509" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="515" y="497" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">indices</text><g filter="url(#sh)"><rect x="550" y="479" width="190" height="60" rx="10" class="surface" stroke-width="1.2"/></g><text x="645.0" y="509.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">output rows</text><text x="645.0" y="528.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">one bucket's share</text><text x="858" y="470" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Only the build bucket is</text><text x="858" y="488" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">resident. The probe side</text><text x="858" y="506" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">streams past it, so the cost</text><text x="858" y="524" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">is one bucket, not two.</text><path d="M 478 544 Q 355 590 232 544" fill="none" stroke="#d97706" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#arA)"/><text x="355" y="602" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">build bucket still over budget: re-partition it with a fresh salt, at most 3 deep</text><text x="490" y="636" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">A re-split is a re-hash, so it cannot separate rows that share a key. One hot key stays in one bucket at every level, which is why the depth is bounded.</text></svg>