</defs><rect x="20" y="20" width="456" height="480" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">WITHOUT CACHE()</text><rect x="504" y="20" width="456" height="480" rx="16" class="band-blue" stroke-width="1.5"/><text x="522" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">WITH CACHE()</text><g filter="url(#sh)"><rect x="44.0" y="84" width="180" height="54" rx="10" class="surface" stroke-width="1.2"/></g><text x="134.0" y="116.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">scan events</text><path d="M 134 140 L 134 178" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="144" y="167" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">rows</text><g filter="url(#sh)"><rect x="44.0" y="184" width="180" height="54" rx="10" class="surface" stroke-width="1.2"/></g><text x="134.0" y="211.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">filter</text><text x="134.0" y="230.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">status == active</text><path d="M 134 240 L 134 278" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="144" y="267" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">active rows</text><g filter="url(#sh)"><rect x="44.0" y="284" width="180" height="54" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="44.0" y="296" width="4" height="30" rx="2" fill="#3b82f6"/><text x="137.0" y="310.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">collect()</text><text x="137.0" y="328.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">first terminal</text><g filter="url(#sh)"><rect x="272.0" y="84" width="180" height="54" rx="10" class="surface" stroke-width="1.2"/></g><text x="362.0" y="116.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">scan events</text><path d="M 362 140 L 362 178" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="372" y="167" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">rows</text><g filter="url(#sh)"><rect x="272.0" y="184" width="180" height="54" rx="10" class="surface" stroke-width="1.2"/></g><text x="362.0" y="211.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">filter</text><text x="362.0" y="230.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">status == active</text><path d="M 362 240 L 362 278" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="372" y="267" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">active rows</text><g filter="url(#sh)"><rect x="272.0" y="284" width="180" height="54" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="272.0" y="296" width="4" height="30" rx="2" fill="#3b82f6"/><text x="365.0" y="310.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">count()</text><text x="365.0" y="328.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">second terminal</text><rect x="163.95" y="373" width="168.1" height="20" rx="10" class="pill-grey"/><text x="248.0" y="387" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.4" class="pt-grey">scan + filter run twice</text><text x="248" y="426" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Each terminal executes the whole plan.</text><text x="248" y="446" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Five reports over one filtered scan</text><text x="248" y="464" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">are five scans.</text><g filter="url(#sh)"><rect x="642.0" y="84" width="180" height="54" rx="10" class="surface" stroke-width="1.2"/></g><text x="732.0" y="116.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">scan events</text><path d="M 732 140 L 732 178" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="742" y="167" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">rows</text><g filter="url(#sh)"><rect x="642.0" y="184" width="180" height="54" rx="10" class="surface" stroke-width="1.2"/></g><text x="732.0" y="211.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">filter</text><text x="732.0" y="230.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">status == active</text><path d="M 732 240 L 732 278" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="742" y="267" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">first collect() stores it</text><g filter="url(#sh)"><rect x="622" y="284" width="220" height="54" rx="11" fill="url(#tintAmber)" stroke="#fcd34d" stroke-width="1.2"/></g><rect x="622" y="296" width="4" height="30" rx="2" fill="#f59e0b"/><text x="735.0" y="310.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">cached result</text><text x="735.0" y="328.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">Arrow, kept after first run</text><path d="M 692 340 L 618 398" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="649.0" y="372" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">hit</text><g filter="url(#sh)"><rect x="513" y="404" width="210" height="54" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="513" y="416" width="4" height="30" rx="2" fill="#3b82f6"/><text x="621.0" y="430.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">collect() again</text><text x="621.0" y="448.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">served, no re-run</text><path d="M 772 340 L 846 398" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="815.0" y="372" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">hit</text><g filter="url(#sh)"><rect x="741" y="404" width="210" height="54" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="741" y="416" width="4" height="30" rx="2" fill="#3b82f6"/><text x="849.0" y="430.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">count()</text><text x="849.0" y="448.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">served from warm cache</text><rect x="651.3" y="473" width="161.4" height="20" rx="10" class="pill-blue"/><text x="732.0" y="487" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.4" class="pt-blue">scan + filter run once</text></svg>