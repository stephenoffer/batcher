<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 668" role="img" width="980" height="668"><defs><style>
  .surface { fill: #ffffff; stroke: #cbd5e1; }
  .band-blue { fill: #eff6ff; stroke: #3b82f6; }
  .band-amber { fill: #fffbeb; stroke: #f59e0b; }
  .band-grey { fill: #f8fafc; stroke: #cbd5e1; }
  .t-title { fill: #1e293b; }
  .t-sub { fill: #5b6675; }
  .t-arrow { fill: #475569; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1e293b; stroke: #334155; }
    .band-blue { fill: #172554; stroke: #3b82f6; }
    .band-amber { fill: #2c1f06; stroke: #f59e0b; }
    .band-grey { fill: #131c31; stroke: #334155; }
    .t-title { fill: #e2e8f0; }
    .t-sub { fill: #94a3b8; }
    .t-arrow { fill: #cbd5e1; }
  }
</style>
<filter id="sh" x="-20%" y="-30%" width="140%" height="180%">
  <feDropShadow dx="0" dy="2.5" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.18"/>
</filter>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><rect x="20" y="24" width="940" height="176" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="48" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">PARTIAL: A STATE, NOT AN ANSWER</text><text x="126" y="68" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">morsels</text><rect x="44" y="78" width="28" height="40" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="77" y="78" width="28" height="40" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="110" y="78" width="28" height="40" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="143" y="78" width="28" height="40" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="176" y="78" width="28" height="40" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="209" y="78" width="28" height="40" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><path d="M 247 98 L 305 98" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="278" y="86" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">group ids</text><g filter="url(#sh)"><rect x="311" y="70" width="214" height="56" rx="10" class="surface" stroke-width="1.2"/></g><text x="418.0" y="98.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">dense group ids</text><text x="418.0" y="117.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">a hash table, or none at all</text><path d="M 535 98 L 593 98" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="564" y="86" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">scatter</text><g filter="url(#sh)"><rect x="599" y="70" width="280" height="56" rx="10" class="surface" stroke-width="1.2"/></g><text x="739.0" y="98.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">state columns per group</text><text x="739.0" y="117.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">Arrow, one row per group</text><text x="490" y="152" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">The state is not the answer. mean carries (sum, count); var carries (mean, M2, count);</text><text x="490" y="170" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">median carries the group's values as a list. Only finalize turns one into a number.</text><path d="M 490 202 L 490 228" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="504" y="220" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">partials</text><rect x="20" y="232" width="940" height="180" rx="16" class="band-amber" stroke-width="1.5"/><text x="38" y="256" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#f59e0b">SPILL: ROUTE EVERY PARTIAL BY A HASH OF THE GROUP KEY</text><text x="126" y="274" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">partials</text><rect x="44" y="284" width="28" height="36" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="77" y="284" width="28" height="36" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="110" y="284" width="28" height="36" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="143" y="284" width="28" height="36" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="176" y="284" width="28" height="36" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="209" y="284" width="28" height="36" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><path d="M 247 302 L 400 302" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="324" y="290" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">hash the group key</text><rect x="410" y="268" width="150" height="18" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="410" y="292" width="150" height="18" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="410" y="316" width="150" height="18" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="410" y="340" width="150" height="18" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><text x="485" y="380" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">part-0 .. part-P, Arrow IPC</text><text x="772" y="274" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Every partial is spilled. Nothing is kept</text><text x="772" y="292" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">resident, so this is not an eviction policy.</text><text x="772" y="326" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">P is the state bytes over the budget, 2 to 256.</text><text x="772" y="360" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">A key always hashes to the same partition,</text><text x="772" y="378" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">so a group is never split across two of them.</text><path d="M 485 414 L 485 440" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="499" y="432" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">one partition at a time</text><rect x="20" y="444" width="940" height="180" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="468" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">MERGE ONE PARTITION AT A TIME</text><text x="109" y="486" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">partition i</text><rect x="44" y="494" width="130" height="18" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="44" y="518" width="130" height="18" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><path d="M 184 512 L 242 512" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="213" y="500" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">read it</text><g filter="url(#sh)"><rect x="248" y="484" width="200" height="58" rx="10" class="surface" stroke-width="1.2"/></g><text x="348.0" y="513.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">combine</text><text x="348.0" y="532.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">merge the states by key</text><path d="M 454 513 L 512 513" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="483" y="501" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">one state</text><g filter="url(#sh)"><rect x="518" y="484" width="200" height="58" rx="10" class="surface" stroke-width="1.2"/></g><text x="618.0" y="513.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">finalize</text><text x="618.0" y="532.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">the answer at last</text><path d="M 724 513 L 782 513" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="753" y="501" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">rows</text><g filter="url(#sh)"><rect x="788" y="484" width="158" height="58" rx="10" class="surface" stroke-width="1.2"/></g><text x="867.0" y="513.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">output rows</text><text x="867.0" y="532.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">this partition's groups</text><path d="M 446 548 Q 345 590 244 548" fill="none" stroke="#d97706" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#arA)"/><text x="345" y="606" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">partition still over budget: re-partition it with a fresh salt</text><text x="490" y="644" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Peak memory is one partition, not one hash table.</text><text x="490" y="662" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">This is the algebra the distributed path runs, with combine reading from disk instead of from the network.</text></svg>