<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 630" role="img" width="980" height="630"><defs><style>
  .surface { fill: #ffffff; stroke: #cbd5e1; }
  .band-blue { fill: #eff6ff; stroke: #3b82f6; }
  .band-amber { fill: #fffbeb; stroke: #f59e0b; }
  .band-grey { fill: #f8fafc; stroke: #cbd5e1; }
  .t-title { fill: #1e293b; }
  .t-sub { fill: #5b6675; }
  .t-arrow { fill: #475569; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1e293b; stroke: #334155; }
    .band-blue { fill: #172554; stroke: #3b82f6; }
    .band-amber { fill: #2c1f06; stroke: #f59e0b; }
    .band-grey { fill: #131c31; stroke: #334155; }
    .t-title { fill: #e2e8f0; }
    .t-sub { fill: #94a3b8; }
    .t-arrow { fill: #cbd5e1; }
  }
</style>
<filter id="sh" x="-20%" y="-30%" width="140%" height="180%">
  <feDropShadow dx="0" dy="2.5" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.18"/>
</filter>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><rect x="20" y="20" width="940" height="270" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">WHAT THIS PROCESS REALLY GETS  ·  NOT WHAT THE HOST REPORTS</text><g filter="url(#sh)"><rect x="44" y="64" width="250" height="64" rx="10" class="surface" stroke-width="1.2"/></g><text x="169.0" y="96.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Affinity mask</text><text x="169.0" y="115.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">the cpuset pin</text><g filter="url(#sh)"><rect x="44" y="138" width="250" height="64" rx="10" class="surface" stroke-width="1.2"/></g><text x="169.0" y="170.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">cgroup CFS quota</text><text x="169.0" y="189.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">the Kubernetes cpu limit</text><g filter="url(#sh)"><rect x="44" y="212" width="250" height="64" rx="10" class="surface" stroke-width="1.2"/></g><text x="169.0" y="244.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Scheduler grant</text><text x="169.0" y="263.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">Slurm, PBS, LSF, SGE</text><g filter="url(#sh)"><rect x="430" y="120" width="300" height="120" rx="10" class="surface" stroke-width="1.2"/></g><text x="580.0" y="180.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">The effective machine</text><text x="580.0" y="199.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">cores, memory, devices</text><text x="580" y="210" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">the tightest bound wins, never below 1</text><path d="M 294 96 L 430 150" fill="none" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arG)"/><text x="362" y="110" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">min</text><path d="M 294 170 L 430 180" fill="none" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arG)"/><text x="362" y="166" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">min</text><path d="M 294 244 L 430 210" fill="none" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arG)"/><text x="362" y="242" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">min</text><text x="936" y="104" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">available_parallelism honours</text><text x="936" y="124" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">the affinity mask, not the</text><text x="936" y="144" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">bandwidth quota: a pod capped</text><text x="936" y="164" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">at 15 cores on a 16-core node</text><text x="936" y="184" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">reports 16, and sizes every</text><text x="936" y="204" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">pool one thread too wide.</text><text x="936" y="238" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Re-read every 100 ms, so a</text><text x="936" y="258" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">worker pinned after start is</text><text x="936" y="278" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">picked up.</text><rect x="20" y="330" width="940" height="190" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="354" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">WHERE A HARDWARE FACT REACHES A PLAN DECISION</text><g filter="url(#sh)"><rect x="44" y="386" width="280" height="96" rx="10" class="surface" stroke-width="1.2"/></g><text x="184.0" y="434.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Shard and pool width</text><text x="184.0" y="453.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">every physical core, plus a</text><text x="184" y="452" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">third of the SMT siblings</text><g filter="url(#sh)"><rect x="350" y="386" width="280" height="96" rx="10" class="surface" stroke-width="1.2"/></g><text x="490.0" y="434.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Memory budget, spill</text><text x="490.0" y="453.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">the cgroup ceiling, not the</text><text x="490" y="452" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">node's advertised RAM</text><g filter="url(#sh)"><rect x="656" y="386" width="280" height="96" rx="10" class="surface" stroke-width="1.2"/></g><text x="796.0" y="434.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Device placement</text><text x="796.0" y="453.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">inventory, MIG profiles,</text><text x="796" y="452" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">NVLink and PCIe islands</text><path d="M 500 240 L 184 382" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="300" y="300" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">core count</text><path d="M 580 240 L 490 378" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="500" y="300" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">memory ceiling</text><path d="M 660 240 L 796 378" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="740" y="300" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">device inventory</text><text x="490" y="556" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">The same record hashes to a 12-character fingerprint, and that fingerprint scopes every learned value measured in machine units --</text><text x="490" y="576" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">nanoseconds, bytes, batch sizes -- so unlike machines never blend their coefficients. A statement about the data is never scoped:</text><text x="490" y="596" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">a column has the same distinct count whatever machine reads it, and scoping those would fragment the statistics hardest to collect.</text></svg>