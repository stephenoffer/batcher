<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img" width="980" height="560"><defs><style>
  .surface { fill: #ffffff; stroke: #cbd5e1; }
  .band-blue { fill: #eff6ff; stroke: #3b82f6; }
  .band-amber { fill: #fffbeb; stroke: #f59e0b; }
  .band-grey { fill: #f8fafc; stroke: #cbd5e1; }
  .t-title { fill: #1e293b; }
  .t-sub { fill: #5b6675; }
  .t-arrow { fill: #475569; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1e293b; stroke: #334155; }
    .band-blue { fill: #172554; stroke: #3b82f6; }
    .band-amber { fill: #2c1f06; stroke: #f59e0b; }
    .band-grey { fill: #131c31; stroke: #334155; }
    .t-title { fill: #e2e8f0; }
    .t-sub { fill: #94a3b8; }
    .t-arrow { fill: #cbd5e1; }
  }
</style>
<filter id="sh" x="-20%" y="-30%" width="140%" height="180%">
  <feDropShadow dx="0" dy="2.5" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.18"/>
</filter>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><rect x="20" y="20" width="940" height="274" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">WITHIN ONE QUERY  ·  STAGE-BOUNDARY RE-OPTIMIZATION</text><g filter="url(#sh)"><rect x="48" y="76" width="190" height="84" rx="10" class="surface" stroke-width="1.2"/></g><text x="143.0" y="118.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Plan</text><text x="143.0" y="137.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">estimated rows</text><g filter="url(#sh)"><rect x="268" y="76" width="190" height="84" rx="10" class="surface" stroke-width="1.2"/></g><text x="363.0" y="118.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Execute a stage</text><text x="363.0" y="137.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">to a pipeline breaker</text><g filter="url(#sh)"><rect x="488" y="76" width="190" height="84" rx="10" class="surface" stroke-width="1.2"/></g><text x="583.0" y="118.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Measure</text><text x="583.0" y="137.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">actual cardinalities</text><g filter="url(#sh)"><rect x="708" y="76" width="224" height="84" rx="10" class="surface" stroke-width="1.2"/></g><text x="820.0" y="118.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Re-plan the rest</text><text x="820.0" y="137.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">on real numbers</text><path d="M 238 118 L 268 118" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><path d="M 458 118 L 488 118" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><path d="M 678 118 L 708 118" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><path d="M 820 160 Q 490 214 143 160" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#arB)"/><text x="490" y="208" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">the remaining stages, re-planned</text><text x="490" y="250" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Same mechanism and granularity as Spark AQE, and available single-node.</text><text x="490" y="270" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Gated off below 20,000,000 input rows, so most queries never reach it.</text><rect x="20" y="318" width="940" height="218" rx="16" class="band-amber" stroke-width="1.5"/><text x="38" y="342" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#f59e0b">ACROSS RUNS  ·  LEARNED STATISTICS</text><g filter="url(#sh)"><rect x="48" y="372" width="244" height="84" rx="10" class="surface" stroke-width="1.2"/></g><text x="170.0" y="414.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Record what happened</text><text x="170.0" y="433.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">sketches, not raw rows</text><g filter="url(#sh)"><rect x="342" y="372" width="244" height="84" rx="10" class="surface" stroke-width="1.2"/></g><text x="464.0" y="414.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">MetadataHub</text><text x="464.0" y="433.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">cross-query learned stats</text><g filter="url(#sh)"><rect x="636" y="372" width="296" height="84" rx="10" class="surface" stroke-width="1.2"/></g><text x="784.0" y="414.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">The next run plans better</text><text x="784.0" y="433.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">bandit picks what worked</text><path d="M 292 414 L 342 414" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><path d="M 586 414 L 636 414" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="490" y="500" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Core measures, Kyber consumes. This half is what neither DuckDB nor Spark has.</text></svg>