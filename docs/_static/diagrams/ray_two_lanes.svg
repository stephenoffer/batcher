  <feDropShadow dx="0" dy="4" stdDeviation="9" flood-color="#2563eb" flood-opacity="0.35"/>
</filter>
<linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="0.5" stop-color="#2563eb"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
<linearGradient id="heroAmber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#d97706"/></linearGradient>
<linearGradient id="tintBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5f9ff"/><stop offset="1" stop-color="#dbeafe"/></linearGradient>
<linearGradient id="tintAmber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf5"/><stop offset="1" stop-color="#fdecc8"/></linearGradient>
<linearGradient id="ribbonBlue" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#93c5fd"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
<linearGradient id="ribbonAmber" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><g filter="url(#glow)"><rect x="330" y="20" width="320" height="76" rx="16" fill="url(#hero)"/></g><text x="490.0" y="56.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="800" fill="#ffffff">Driver</text><text x="490.0" y="78.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#ffffff" fill-opacity="0.88">collect(distributed=True)</text><path d="M 490 100 L 490 140" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="504" y="124" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">tasks, actors, placement groups</text><rect x="20" y="146" width="680" height="118" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="170" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">RAY  ·  SCHEDULING AND SMALL MESSAGES</text><rect x="44" y="183" width="47.5" height="20" rx="10" class="pill-blue"/><text x="67.75" y="197" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.4" class="pt-blue">tasks</text><rect x="126" y="183" width="54.2" height="20" rx="10" class="pill-blue"/><text x="153.1" y="197" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.4" class="pt-blue">actors</text><rect x="214" y="183" width="121.2" height="20" rx="10" class="pill-blue"/><text x="274.6" y="197" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.4" class="pt-blue">placement groups</text><rect x="44" y="219" width="81.0" height="20" rx="10" class="pill-grey"/><text x="84.5" y="233" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.4" class="pt-grey">file paths</text><rect x="152" y="219" width="121.2" height="20" rx="10" class="pill-grey"/><text x="212.6" y="233" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.4" class="pt-grey">worker addresses</text><rect x="304" y="219" width="60.9" height="20" rx="10" class="pill-grey"/><text x="334.45" y="233" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.4" class="pt-grey">metrics</text><text x="420" y="204" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Everything here is small:</text><text x="420" y="222" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">descriptions of work,</text><text x="420" y="240" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">never the rows themselves.</text><g filter="url(#sh)"><rect x="720" y="146" width="240" height="118" rx="10" class="surface" stroke-width="1.2"/></g><text x="840.0" y="205.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Ray object store</text><text x="840.0" y="224.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">not on the data path</text><path d="M 360 268 L 360 318" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="374" y="298" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">schedules each stage on</text><rect x="20" y="322" width="940" height="218" rx="16" class="band-amber" stroke-width="1.5"/><text x="38" y="346" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#f59e0b">WORKERS  ·  SHUFFLE OVER ARROW FLIGHT (bc-transport)</text><path d="M 840 270 L 840 284 M 840 308 L 840 322" stroke="#94a3b8" stroke-width="2"/><circle cx="840" cy="296" r="10" fill="none" stroke="#94a3b8" stroke-width="1.8"/><path d="M 836.2 292.2 L 843.8 299.8 M 843.8 292.2 L 836.2 299.8" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/><text x="858" y="300" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">bypassed</text><g filter="url(#sh)"><rect x="52" y="372" width="220" height="84" rx="10" class="surface" stroke-width="1.2"/></g><text x="162.0" y="414.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Mapper</text><text x="162.0" y="433.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">Rust engine, Arrow</text><g filter="url(#sh)"><rect x="380" y="372" width="220" height="84" rx="10" class="surface" stroke-width="1.2"/></g><text x="490.0" y="414.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Reducer</text><text x="490.0" y="433.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">Rust engine, Arrow</text><g filter="url(#sh)"><rect x="708" y="372" width="220" height="84" rx="10" class="surface" stroke-width="1.2"/></g><text x="818.0" y="414.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Mapper</text><text x="818.0" y="433.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">Rust engine, Arrow</text><path d="M 276 414 L 374 414" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="325" y="400" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">batches</text><path d="M 704 414 L 606 414" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="655" y="400" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">batches</text><text x="490" y="490" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Worker to worker, credit-bounded: one credit is one in-flight batch slot,</text><text x="490" y="510" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">and a producer blocks when its credits reach zero.</text></svg>