text x="249.0" y="248.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">20%</text><path d="M 36 316 L 278 316" stroke="#94a3b8" stroke-width="1.5"/><path d="M 88 126 L 88 322" stroke="#d97706" stroke-width="1.4" stroke-dasharray="5 4"/><text x="88" y="338" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" class="t-sub">39.8</text><path d="M 134 126 L 134 322" stroke="#d97706" stroke-width="1.4" stroke-dasharray="5 4"/><text x="134" y="338" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" class="t-sub">79.6</text><path d="M 180 126 L 180 322" stroke="#d97706" stroke-width="1.4" stroke-dasharray="5 4"/><text x="180" y="338" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" class="t-sub">119.4</text><path d="M 226 126 L 226 322" stroke="#d97706" stroke-width="1.4" stroke-dasharray="5 4"/><text x="226" y="338" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" class="t-sub">159.2</text><rect x="385" y="256.0" width="40" height="60.0" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4 3"/><text x="405.0" y="248.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">0%</text><rect x="431" y="256.0" width="40" height="60.0" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4 3"/><rect x="431" y="286.0" width="40" height="30.0" rx="3" fill="#d97706" fill-opacity="0.22" stroke="#d97706" stroke-width="1.8"/><text x="451.0" y="248.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">10%</text><rect x="477" y="256.0" width="40" height="60.0" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4 3"/><rect x="477" y="256.0" width="40" height="60.0" rx="3" fill="#d97706" fill-opacity="0.22" stroke="#d97706" stroke-width="1.8"/><text x="497.0" y="248.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">20%</text><rect x="523" y="256.0" width="40" height="60.0" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4 3"/><rect x="523" y="256.0" width="40" height="60.0" rx="3" fill="#d97706" fill-opacity="0.22" stroke="#d97706" stroke-width="1.8"/><text x="543.0" y="248.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">20%</text><rect x="569" y="256.0" width="40" height="60.0" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4 3"/><rect x="569" y="166.0" width="40" height="150.0" rx="3" fill="#d97706" fill-opacity="0.22" stroke="#d97706" stroke-width="1.8"/><text x="589.0" y="158.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">50%</text><path d="M 376 316 L 618 316" stroke="#94a3b8" stroke-width="1.5"/><path d="M 428 126 L 428 322" stroke="#d97706" stroke-width="1.4" stroke-dasharray="5 4"/><text x="428" y="338" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" class="t-sub">39.8</text><path d="M 474 126 L 474 322" stroke="#d97706" stroke-width="1.4" stroke-dasharray="5 4"/><text x="474" y="338" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" class="t-sub">79.6</text><path d="M 520 126 L 520 322" stroke="#d97706" stroke-width="1.4" stroke-dasharray="5 4"/><text x="520" y="338" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" class="t-sub">119.4</text><path d="M 566 126 L 566 322" stroke="#d97706" stroke-width="1.4" stroke-dasharray="5 4"/><text x="566" y="338" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" class="t-sub">159.2</text><text x="44" y="70" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">reference: x = 0..199</text><text x="44" y="92" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">buckets=5, cut at its quantiles</text><text x="384" y="70" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">today: x = 60..259</text><text x="384" y="92" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">binned on the reference edges</text><text x="160" y="364" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Quantile cuts: each bin holds 20%.</text><text x="160" y="384" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">The outer bins are open-ended.</text><text x="500" y="364" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Mass moves between bins.</text><text x="500" y="384" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Dashed outline: the reference share.</text><path d="M 304 200 L 356 200" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="330" y="186" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">edges</text><path d="M 644 200 L 696 200" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="670" y="186" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">shares</text><text x="720" y="70" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">Summed over the five bins:</text><rect x="720" y="84" width="220" height="58" rx="9" class="code-bg" stroke-width="1"/><text x="734" y="110.0" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="12" class="t-code" xml:space="preserve">sum((cur - ref)</text><text x="734" y="129.0" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="12" class="t-code" xml:space="preserve">  * ln(cur / ref))</text><text x="720" y="172" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">An empty bin counts as 1e-6.</text><text x="720" y="222" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700" class="t-arrow">PSI = 2.7854</text><text x="720" y="272" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Reading the number:</text><rect x="720" y="295" width="127.9" height="20" rx="10" class="pill-grey"/><text x="783.95" y="309" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.4" class="pt-grey">below 0.1: stable</text><rect x="720" y="325" width="154.70000000000002" height="20" rx="10" class="pill-grey"/><text x="797.35" y="339" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.4" class="pt-grey">0.1 to 0.25: moderate</text><rect x="720" y="355" width="168.1" height="20" rx="10" class="pill-amber"/><text x="804.05" y="369" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.4" class="pt-amber">above 0.25: significant</text><circle cx="912" cy="363" r="10" fill="#2563eb"/><path d="M 907.5 363 L 911 366.8 L 917 359.2" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>