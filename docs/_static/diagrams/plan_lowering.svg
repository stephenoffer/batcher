<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" role="img" width="980" height="500"><defs><style>
  .surface { fill: #ffffff; stroke: #cbd5e1; }
  .band-blue { fill: #eff6ff; stroke: #3b82f6; }
  .band-amber { fill: #fffbeb; stroke: #f59e0b; }
  .band-grey { fill: #f8fafc; stroke: #cbd5e1; }
  .t-title { fill: #1e293b; }
  .t-sub { fill: #5b6675; }
  .t-arrow { fill: #475569; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1e293b; stroke: #334155; }
    .band-blue { fill: #172554; stroke: #3b82f6; }
    .band-amber { fill: #2c1f06; stroke: #f59e0b; }
    .band-grey { fill: #131c31; stroke: #334155; }
    .t-title { fill: #e2e8f0; }
    .t-sub { fill: #94a3b8; }
    .t-arrow { fill: #cbd5e1; }
  }
</style>
<filter id="sh" x="-20%" y="-30%" width="140%" height="180%">
  <feDropShadow dx="0" dy="2.5" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.18"/>
</filter>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><rect x="20" y="20" width="940" height="172" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">CONTROL PLANE  ·  PYTHON  ·  DECIDES WHAT THE WORK IS</text><g filter="url(#sh)"><rect x="42" y="76" width="160" height="84" rx="10" class="surface" stroke-width="1.2"/></g><text x="122.0" y="118.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Dataset</text><text x="122.0" y="137.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">lazy, immutable</text><g filter="url(#sh)"><rect x="294" y="76" width="160" height="84" rx="10" class="surface" stroke-width="1.2"/></g><text x="374.0" y="118.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">LogicalPlan</text><text x="374.0" y="137.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">validated tree</text><g filter="url(#sh)"><rect x="546" y="76" width="160" height="84" rx="10" class="surface" stroke-width="1.2"/></g><text x="626.0" y="118.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Kyber</text><text x="626.0" y="137.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">seven phases</text><g filter="url(#sh)"><rect x="798" y="76" width="160" height="84" rx="10" class="surface" stroke-width="1.2"/></g><text x="878.0" y="118.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">PhysicalPlan</text><text x="878.0" y="137.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">IR + bounds</text><text x="626.0" y="150" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#2563eb">NORMALIZE .. ENFORCE</text><path d="M 210 118.0 L 284 118.0" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="247.0" y="102.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">each operation</text><text x="247.0" y="146.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">returns a new node</text><path d="M 462 118.0 L 536 118.0" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="499.0" y="102.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">rules rewrite</text><text x="499.0" y="146.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">plan to plan</text><path d="M 714 118.0 L 788 118.0" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="751.0" y="102.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">to_ir() lowers</text><text x="751.0" y="146.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">the rewritten tree</text><path d="M 20 204 H 960" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="9 6"/><text x="20" y="192" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#d97706">The boundary: one JSON document and zero-copy Arrow, and nothing else.</text><path d="M 878.0 168 V 244 H 180.0 V 304" fill="none" stroke="#d97706" stroke-width="2.6" marker-end="url(#arA)"/><text x="864.0" y="238" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#d97706">to_json(), plus the Arrow input batches</text><rect x="20" y="258" width="940" height="172" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="282" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">DATA PLANE  ·  RUST + ARROW  ·  DOES THE WORK</text><g filter="url(#sh)"><rect x="75" y="314" width="210" height="84" rx="10" class="surface" stroke-width="1.2"/></g><text x="180.0" y="356.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">execute_plan</text><text x="180.0" y="375.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">the one FFI entry</text><text x="180.0" y="388" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#2563eb">bc-py</text><g filter="url(#sh)"><rect x="395" y="314" width="210" height="84" rx="10" class="surface" stroke-width="1.2"/></g><text x="500.0" y="356.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">RelOp tree</text><text x="500.0" y="375.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">one relational type</text><text x="500.0" y="388" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#2563eb">bc-ir</text><g filter="url(#sh)"><rect x="715" y="314" width="210" height="84" rx="10" class="surface" stroke-width="1.2"/></g><text x="820.0" y="356.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Operators</text><text x="820.0" y="375.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">over Arrow morsels</text><text x="820.0" y="388" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#2563eb">bc-interp / bc-runtime</text><path d="M 293 356.0 L 385 356.0" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="339.0" y="340.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">serde deserializes</text><text x="339.0" y="384.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">unknown tag: hard error</text><path d="M 613 356.0 L 705 356.0" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="659.0" y="340.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">walked once</text><text x="659.0" y="384.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">16,384-row morsels</text><path d="M 820.0 304 V 276" fill="none" stroke="#94a3b8" stroke-width="2.4" stroke-dasharray="5 4" marker-end="url(#arG)"/><text x="820.0" y="272" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">result batches return the same way</text><text x="490" y="464" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Python never sees a row on the way down and never copies one on the way back.</text><text x="490" y="484" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">A per-row loop above the line is the one thing this shape is designed to prevent.</text></svg>