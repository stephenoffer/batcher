<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" role="img" width="980" height="660"><defs><style>
  .surface { fill: #ffffff; stroke: #cbd5e1; }
  .band-blue { fill: #eff6ff; stroke: #3b82f6; }
  .band-amber { fill: #fffbeb; stroke: #f59e0b; }
  .band-grey { fill: #f8fafc; stroke: #cbd5e1; }
  .t-title { fill: #1e293b; }
  .t-sub { fill: #5b6675; }
  .t-arrow { fill: #475569; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1e293b; stroke: #334155; }
    .band-blue { fill: #172554; stroke: #3b82f6; }
    .band-amber { fill: #2c1f06; stroke: #f59e0b; }
    .band-grey { fill: #131c31; stroke: #334155; }
    .t-title { fill: #e2e8f0; }
    .t-sub { fill: #94a3b8; }
    .t-arrow { fill: #cbd5e1; }
  }
</style>
<filter id="sh" x="-20%" y="-30%" width="140%" height="180%">
  <feDropShadow dx="0" dy="2.5" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.18"/>
</filter>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><rect x="20" y="24" width="940" height="104" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="48" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">THE DEVICE PRODUCED A RESULT</text><g filter="url(#sh)"><rect x="330" y="50" width="320" height="58" rx="10" class="surface" stroke-width="1.2"/></g><text x="490.0" y="79.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">a pyarrow.Table</text><text x="490.0" y="98.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">from cuDF, not from the engine</text><path d="M 490 134 L 490 168" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="504" y="158" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">checked before it is returned</text><rect x="20" y="174" width="940" height="268" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="198" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">TWO ORACLES, AND THEY COST VERY DIFFERENT THINGS</text><g filter="url(#sh)"><rect x="44" y="210" width="274" height="72" rx="10" class="surface" stroke-width="1.2"/></g><text x="181.0" y="246.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">schema contract</text><text x="181.0" y="265.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">enforce_schema_contract</text><text x="181.0" y="302" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">On for every device run.</text><text x="181.0" y="319" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Reads a field list: no rows, no</text><text x="181.0" y="336" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">second execution, no device.</text><text x="181.0" y="353" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Held against the engine's own</text><text x="181.0" y="370" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">available_schema. Sees TYPES.</text><path d="M 181.0 396 L 181.0 476" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="191.0" y="442" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">differs</text><g filter="url(#sh)"><rect x="356" y="210" width="274" height="72" rx="10" class="surface" stroke-width="1.2"/></g><text x="493.0" y="246.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">shadow re-run</text><text x="493.0" y="265.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">shadow_verify</text><text x="493.0" y="302" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Off by default, behind</text><text x="493.0" y="319" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">distributed.gpu_shadow_verify.</text><text x="493.0" y="336" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Re-runs the plan on the CPU</text><text x="493.0" y="353" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">engine: schema first, then</text><text x="493.0" y="370" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">values. The only oracle for VALUES.</text><path d="M 493.0 396 L 493.0 476" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="503.0" y="442" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">differs</text><path d="M 320 246.0 L 350 246.0" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="335" y="202" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">agrees</text><path d="M 632 246.0 L 662 246.0" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="647" y="202" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">agrees</text><g filter="url(#sh)"><rect x="668" y="210" width="274" height="72" rx="10" class="surface" stroke-width="1.2"/></g><text x="805.0" y="246.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">the device result stands</text><text x="805.0" y="265.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">returned unchanged</text><text x="805" y="302" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">A verified run differs from an</text><text x="805" y="319" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">unverified one only in cost.</text><text x="805" y="353" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">If the CPU oracle itself raises,</text><text x="805" y="370" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">that is reported as verifying</text><text x="805" y="387" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">nothing -- never as a pass.</text><rect x="20" y="462" width="940" height="106" rx="16" class="band-amber" stroke-width="1.5"/><text x="38" y="486" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#f59e0b">A DIFFERENCE IS A DEFECT, NEVER A DECLINE</text><g filter="url(#sh)"><rect x="44" y="486" width="420" height="60" rx="10" class="surface" stroke-width="1.2"/></g><text x="254.0" y="516.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">the CPU engine answers</text><text x="254.0" y="535.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">the right columns, the right rows</text><text x="516" y="506" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Reported through note_gpu_failure, which logs at WARNING.</text><text x="516" y="524" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">note_suppressed is for declines, and this is not one: the tier's</text><text x="516" y="542" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">contract is that a device changes where a plan runs, never what</text><text x="516" y="560" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">it computes.</text><rect x="20" y="582" width="940" height="62" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="606" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">EVERY DEFECT ON RECORD: A COLUMN TYPE, WITH CORRECT VALUES</text><text x="44" y="626" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">a DATE returning timestamp[ms] on a device, date32 under pandas</text><text x="430" y="626" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">an integer abs widening to double</text><text x="672" y="626" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">an empty cuDF string column arriving as null</text></svg>