<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" role="img" width="980" height="640"><defs><style>
  .surface { fill: #ffffff; stroke: #cbd5e1; }
  .band-blue { fill: #eff6ff; stroke: #3b82f6; }
  .band-amber { fill: #fffbeb; stroke: #f59e0b; }
  .band-grey { fill: #f8fafc; stroke: #cbd5e1; }
  .t-title { fill: #1e293b; }
  .t-sub { fill: #5b6675; }
  .t-arrow { fill: #475569; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1e293b; stroke: #334155; }
    .band-blue { fill: #172554; stroke: #3b82f6; }
    .band-amber { fill: #2c1f06; stroke: #f59e0b; }
    .band-grey { fill: #131c31; stroke: #334155; }
    .t-title { fill: #e2e8f0; }
    .t-sub { fill: #94a3b8; }
    .t-arrow { fill: #cbd5e1; }
  }
</style>
<filter id="sh" x="-20%" y="-30%" width="140%" height="180%">
  <feDropShadow dx="0" dy="2.5" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.18"/>
</filter>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><rect x="20" y="24" width="940" height="128" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="48" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">WHAT THE LAYOUT ALREADY DID</text><rect x="44" y="58" width="134" height="44" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><text x="111" y="85" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">day=08-01</text><rect x="194" y="58" width="134" height="44" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><text x="261" y="85" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">day=08-02</text><rect x="344" y="58" width="134" height="44" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><text x="411" y="85" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">day=08-03</text><text x="217" y="126" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">one directory per value</text><path d="M 500 80 L 560 80" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="530" y="67" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">assigned whole</text><rect x="566" y="58" width="118" height="44" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><text x="625" y="85" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">worker 0</text><rect x="700" y="58" width="118" height="44" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><text x="759" y="85" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">worker 1</text><rect x="834" y="58" width="118" height="44" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><text x="893" y="85" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">worker 2</text><text x="763" y="126" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">every row for a value lands on one worker --</text><text x="763" y="143" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">exactly what a shuffle by that column arranges</text><path d="M 490 166 L 490 198" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="504" y="190" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">so: may the exchange go?</text><rect x="20" y="204" width="940" height="214" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="228" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">FOUR TESTS, AND ONLY THE LAST IS ABOUT SPEED</text><g filter="url(#sh)"><rect x="44" y="238" width="190" height="60" rx="10" class="surface" stroke-width="1.2"/></g><text x="139.0" y="268.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">same columns?</text><text x="139.0" y="287.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">declared_clustering</text><text x="139.0" y="318" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Every split holds the same</text><text x="139.0" y="335" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">columns constant, or none do.</text><path d="M 139.0 360 L 139.0 392" fill="none" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arG)"/><text x="148.0" y="382" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">no</text><path d="M 236 268.0 L 262 268.0" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="249" y="232" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">yes</text><g filter="url(#sh)"><rect x="266" y="238" width="190" height="60" rx="10" class="surface" stroke-width="1.2"/></g><text x="361.0" y="268.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">assigned together?</text><text x="361.0" y="287.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">group_by_clustering</text><text x="361.0" y="318" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">A value's splits are one unit.</text><text x="361.0" y="335" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">No split can promise this.</text><path d="M 361.0 360 L 361.0 392" fill="none" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arG)"/><text x="370.0" y="382" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">no</text><path d="M 458 268.0 L 484 268.0" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="471" y="232" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">yes</text><g filter="url(#sh)"><rect x="488" y="238" width="190" height="60" rx="10" class="surface" stroke-width="1.2"/></g><text x="583.0" y="268.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">keys contain them?</text><text x="583.0" y="287.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">properties.satisfies</text><text x="583.0" y="318" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Clustering must be a subset</text><text x="583.0" y="335" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">of the group keys.</text><path d="M 583.0 360 L 583.0 392" fill="none" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arG)"/><text x="592.0" y="382" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">no</text><path d="M 680 268.0 L 706 268.0" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="693" y="232" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">yes</text><g filter="url(#sh)"><rect x="710" y="238" width="190" height="60" rx="10" class="surface" stroke-width="1.2"/></g><text x="805.0" y="268.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">enough tasks left?</text><text x="805.0" y="287.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">scan_clustering_for</text><text x="805.0" y="318" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">At least 2, and a quarter of</text><text x="805.0" y="335" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">the shuffle's. A judgment.</text><path d="M 759.0 360 L 759.0 392" fill="none" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arG)"/><text x="768.0" y="382" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">no</text><path d="M 139 394 H 759" fill="none" stroke="#94a3b8" stroke-width="2.4"/><path d="M 254 394 L 254 444" fill="none" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arG)"/><path d="M 851 360 L 851 444" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="864" y="382" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">yes, all four</text><text x="490" y="404" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">the first three are correctness -- a group split across two workers returns two partial sums, each labelled final</text><rect x="20" y="428" width="940" height="110" rx="16" class="band-amber" stroke-width="1.5"/><text x="38" y="452" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#f59e0b">TWO PLANS, THE SAME ROWS</text><g filter="url(#sh)"><rect x="44" y="452" width="420" height="60" rx="10" class="surface" stroke-width="1.2"/></g><text x="254.0" y="482.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">hash shuffle</text><text x="254.0" y="501.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">every row crosses the network</text><g filter="url(#sh)"><rect x="516" y="452" width="420" height="60" rx="10" class="surface" stroke-width="1.2"/></g><text x="726.0" y="482.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">no exchange</text><text x="726.0" y="501.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">each worker folds its own directories</text><text x="254" y="530" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">the fallback, and never wrong</text><text x="726" y="530" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">published to explain(analyze=True) as a core / exchange decision</text><rect x="20" y="552" width="940" height="72" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="576" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">WHAT UNCLAIMS THE LAYOUT</text><text x="44" y="590" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">a glob path</text><text x="44" y="610" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">per-file splits record no partition value</text><text x="370" y="590" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">grouping below the split</text><text x="370" y="610" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">month= sits under every year= directory</text><text x="680" y="590" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">a Limit in the chain</text><text x="680" y="610" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">clustering places rows, it does not finish them</text></svg>