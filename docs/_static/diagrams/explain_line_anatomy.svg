</defs><rect x="20" y="20" width="940" height="190" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">ONE OPERATOR LINE FROM EXPLAIN(ANALYZE=TRUE)</text><text x="230.4" y="88" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.6" class="t-sub">OPERATOR</text><rect x="79.80000000000001" y="100" width="301.2" height="42" rx="7" class="code-bg" style="stroke:#cbd5e1;stroke-width:1.1"/><text x="230.4" y="126" text-anchor="middle" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="14" class="t-code" xml:space="preserve">▶ └─ aggregate  [by region · sum]</text><text x="427.0" y="88" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.6" class="t-sub">ESTIMATE</text><rect x="389.0" y="100" width="76" height="42" rx="7" class="code-bg" style="stroke:#d97706;stroke-width:1.8"/><text x="427.0" y="126" text-anchor="middle" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="14" class="t-code" xml:space="preserve">est≈2</text><text x="518.6" y="88" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.6" class="t-sub">ACTUAL</text><rect x="473.0" y="100" width="91.2" height="42" rx="7" class="code-bg" style="stroke:#d97706;stroke-width:1.8"/><text x="518.6" y="126" text-anchor="middle" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="14" class="t-code" xml:space="preserve">actual=2</text><text x="610.2" y="88" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.6" class="t-sub">MISS</text><rect x="572.2" y="100" width="76" height="42" rx="7" class="code-bg" style="stroke:#d97706;stroke-width:1.8"/><text x="610.2" y="126" text-anchor="middle" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="14" class="t-code" xml:space="preserve">exact</text><text x="694.2" y="88" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.6" class="t-sub">TIME</text><rect x="656.2" y="100" width="76" height="42" rx="7" class="code-bg" style="stroke:#cbd5e1;stroke-width:1.1"/><text x="694.2" y="126" text-anchor="middle" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="14" class="t-code" xml:space="preserve">316µs</text><text x="778.2" y="88" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.6" class="t-sub">OP SHARE</text><rect x="740.2" y="100" width="76" height="42" rx="7" class="code-bg" style="stroke:#cbd5e1;stroke-width:1.1"/><text x="778.2" y="126" text-anchor="middle" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="14" class="t-code" xml:space="preserve">65%</text><text x="862.2" y="88" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.6" class="t-sub">NOTES</text><rect x="824.2" y="100" width="76" height="42" rx="7" class="code-bg" style="stroke:#cbd5e1;stroke-width:1.1"/><text x="862.2" y="126" text-anchor="middle" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="14" class="t-code" xml:space="preserve">interp</text><path d="M 389.0 148 L 389.0 154 L 648.2 154 L 648.2 148" fill="none" stroke="#d97706" stroke-width="2"/><text x="518.6" y="172" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="1.2" fill="#d97706">ESTIMATE VS ACTUAL</text><path d="M 230.4 142 L 230.4 191.0 L 142 191.0 L 142 240" fill="none" stroke="#94a3b8" stroke-width="1.4"/><circle cx="230.4" cy="142" r="3" fill="#94a3b8"/><g filter="url(#sh)"><rect x="36" y="240" width="212" height="94" rx="10" class="surface" stroke="#cbd5e1" stroke-width="1.2"/></g><rect x="36" y="252" width="4" height="70" rx="2" fill="#2563eb"/><text x="54" y="266" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">the optimized plan</text><text x="54" y="288" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">▶ marks the critical path.</text><text x="54" y="306" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">The bracket says what the</text><text x="54" y="324" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">operator does.</text><path d="M 518.6 180 L 518.6 210.0 L 390 210.0 L 390 240" fill="none" stroke="#d97706" stroke-width="1.4"/><circle cx="518.6" cy="180" r="3" fill="#d97706"/><g filter="url(#sh)"><rect x="264" y="240" width="252" height="94" rx="10" class="surface" stroke="#d97706" stroke-width="1.2"/></g><rect x="264" y="252" width="4" height="70" rx="2" fill="#d97706"/><text x="282" y="266" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">rows planned vs produced</text><text x="282" y="288" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">est≈ is what Kyber planned for.</text><text x="282" y="306" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">actual= is what arrived.</text><text x="282" y="324" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">MISS says how far, which way.</text><path d="M 656.2 148 L 656.2 154 L 816.2 154 L 816.2 148" fill="none" stroke="#94a3b8" stroke-width="2"/><path d="M 736.2 154 L 736.2 197.0 L 642 197.0 L 642 240" fill="none" stroke="#94a3b8" stroke-width="1.4"/><circle cx="736.2" cy="154" r="3" fill="#94a3b8"/><g filter="url(#sh)"><rect x="532" y="240" width="220" height="94" rx="10" class="surface" stroke="#cbd5e1" stroke-width="1.2"/></g><rect x="532" y="252" width="4" height="70" rx="2" fill="#2563eb"/><text x="550" y="266" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">where time went</text><text x="550" y="288" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">TIME: the operator's wall time.</text><text x="550" y="306" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">OP SHARE ranks it against</text><text x="550" y="324" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">all operator time.</text><path d="M 862.2 142 L 862.2 191.0 L 862.2 191.0 L 862.2 240" fill="none" stroke="#94a3b8" stroke-width="1.4"/><circle cx="862.2" cy="142" r="3" fill="#94a3b8"/><g filter="url(#sh)"><rect x="768" y="240" width="176" height="94" rx="10" class="surface" stroke="#cbd5e1" stroke-width="1.2"/></g><rect x="768" y="252" width="4" height="70" rx="2" fill="#2563eb"/><text x="786" y="266" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">conditional notes</text><text x="786" y="288" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">interp or jit, broadcast,</text><text x="786" y="306" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">spill, pushed[...]. Each</text><text x="786" y="324" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">only when it applies.</text><rect x="20" y="372" width="940" height="128" rx="16" class="band-amber" stroke-width="1.5"/><text x="38" y="396" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#f59e0b">READING THE MISS COLUMN</text><text x="44" y="424" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="14" class="t-code">exact</text><text x="160" y="424" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">The estimate matched what the operator produced.</text><text x="44" y="452" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="14" class="t-code">10.0x over</text><text x="160" y="452" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">The plan expected ten times the rows that arrived.</text><text x="44" y="480" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="14" class="t-code">100.0x under</text><text x="160" y="480" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Planned for 100 rows, got 10,000. Fix the statistics upstream, not the join.</text></svg>