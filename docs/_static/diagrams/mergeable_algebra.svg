</defs><rect x="20" y="24" width="940" height="136" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="48" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">ONE OPERATOR, WRITTEN ONCE</text><g filter="url(#sh)"><rect x="44" y="62" width="226" height="80" rx="10" class="surface" stroke-width="1.2"/></g><text x="157.0" y="102.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">partial(batch)</text><text x="157.0" y="121.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">rows in, state out</text><g filter="url(#sh)"><rect x="376" y="62" width="228" height="80" rx="10" class="surface" stroke-width="1.2"/></g><text x="490.0" y="102.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">combine(states)</text><text x="490.0" y="121.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">associative + commutative</text><g filter="url(#sh)"><rect x="710" y="62" width="226" height="80" rx="10" class="surface" stroke-width="1.2"/></g><text x="823.0" y="102.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">finalize(state)</text><text x="823.0" y="121.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">state in, rows out</text><path d="M 270 102.0 L 370 102.0" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="320" y="88.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">partial state</text><text x="320" y="124.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">not the answer</text><path d="M 604 102.0 L 704 102.0" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="654" y="88.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">merged state</text><text x="654" y="124.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">one per group</text><rect x="20" y="184" width="940" height="248" rx="16" class="band-amber" stroke-width="1.5"/><text x="38" y="208" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#f59e0b">WHAT CARRIES A PARTIAL FROM partial TO combine</text><path d="M 146 208 H 842" fill="none" stroke="#94a3b8" stroke-width="2.4"/><path d="M 490 208 L 490 148" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="502" y="176" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">the same combine, whatever carried the state</text><g filter="url(#sh)"><rect x="40" y="268" width="212" height="88" rx="10" class="surface" stroke-width="1.2"/></g><text x="146.0" y="312.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">One core</text><text x="146.0" y="331.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">bc-interp::execute</text><path d="M 101 268 L 101 214" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="113" y="236" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">nothing to carry</text><text x="146" y="376" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">one partial, nothing to merge</text><g filter="url(#sh)"><rect x="272" y="268" width="212" height="88" rx="10" class="surface" stroke-width="1.2"/></g><text x="378.0" y="312.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Many cores</text><text x="378.0" y="331.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">bc-interp::par</text><path d="M 333 268 L 333 214" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="345" y="236" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">a thread hand-off</text><text x="378" y="376" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">one partial per morsel</text><g filter="url(#sh)"><rect x="504" y="268" width="212" height="88" rx="10" class="surface" stroke-width="1.2"/></g><text x="610.0" y="312.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Bounded memory</text><text x="610.0" y="331.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">agg::spill</text><path d="M 565 268 L 565 214" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="577" y="236" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">an IPC spill file</text><text x="610" y="376" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">one partition at a time</text><g filter="url(#sh)"><rect x="736" y="268" width="212" height="88" rx="10" class="surface" stroke-width="1.2"/></g><text x="842.0" y="312.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Many machines</text><text x="842.0" y="331.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">bc-interp::dist</text><path d="M 797 268 L 797 214" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="809" y="236" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">a Flight stream</text><text x="842" y="376" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">hash-partitioned by key</text><rect x="20" y="452" width="940" height="68" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="476" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">THE TEST THAT MUST STAY GREEN</text><text x="490" y="492" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" class="t-arrow">combine_finalize(partition(partial(p_k)))  ==  the single-node result</text><path d="M 736 356 Q 640 470 300 462" fill="none" stroke="#d97706" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#arA)"/><text x="500" y="446" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">arrival order cannot change the answer</text></svg>