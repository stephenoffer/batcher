<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" role="img" width="980" height="540"><defs><style>
  .surface { fill: #ffffff; stroke: #cbd5e1; }
  .band-blue { fill: #eff6ff; stroke: #3b82f6; }
  .band-amber { fill: #fffbeb; stroke: #f59e0b; }
  .band-grey { fill: #f8fafc; stroke: #cbd5e1; }
  .t-title { fill: #1e293b; }
  .t-sub { fill: #5b6675; }
  .t-arrow { fill: #475569; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1e293b; stroke: #334155; }
    .band-blue { fill: #172554; stroke: #3b82f6; }
    .band-amber { fill: #2c1f06; stroke: #f59e0b; }
    .band-grey { fill: #131c31; stroke: #334155; }
    .t-title { fill: #e2e8f0; }
    .t-sub { fill: #94a3b8; }
    .t-arrow { fill: #cbd5e1; }
  }
</style>
<filter id="sh" x="-20%" y="-30%" width="140%" height="180%">
  <feDropShadow dx="0" dy="2.5" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.18"/>
</filter>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><g filter="url(#sh)"><rect x="60" y="86" width="330" height="88" rx="10" class="surface" stroke-width="1.2"/></g><text x="225.0" y="130.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">analyze()</text><text x="225.0" y="149.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">which types and ops can compile</text><text x="225.0" y="164" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#2563eb">bc-codegen</text><g filter="url(#sh)"><rect x="60" y="230" width="330" height="88" rx="10" class="surface" stroke-width="1.2"/></g><text x="225.0" y="274.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">CompiledExpr</text><text x="225.0" y="293.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">one Arc, shared by every worker</text><text x="225.0" y="308" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#2563eb">Send + Sync</text><g filter="url(#sh)"><rect x="60" y="374" width="330" height="88" rx="10" class="surface" stroke-width="1.2"/></g><text x="225.0" y="418.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">eval(batch)</text><text x="225.0" y="437.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">16,384 rows at a time</text><text x="225.0" y="452" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#2563eb">bc-interp drives the loop</text><g filter="url(#sh)"><rect x="590" y="86" width="330" height="88" rx="10" class="surface" stroke-width="1.2"/></g><text x="755.0" y="130.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Compile cache</text><text x="755.0" y="149.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">keyed on the expression and the schema</text><text x="755.0" y="164" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#2563eb">1024 entries</text><g filter="url(#sh)"><rect x="590" y="230" width="330" height="88" rx="10" class="surface" stroke-width="1.2"/></g><text x="755.0" y="274.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Expr::eval</text><text x="755.0" y="293.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">the interpreter, and the oracle</text><text x="755.0" y="308" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#2563eb">bc-expr</text><path d="M 225.0 182 L 225.0 220" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="241.0" y="206" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">in the subset: compile,</text><text x="241.0" y="224" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">and compile exactly once</text><path d="M 225.0 326 L 225.0 364" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="241.0" y="350" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">reused for every morsel,</text><text x="241.0" y="368" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">never recompiled</text><path d="M 398 130.0 L 580 130.0" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="490" y="116.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">asked before it compiles</text><text x="490" y="156.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">and a refusal is remembered too</text><path d="M 398 170 L 580 260" fill="none" stroke="#d97706" stroke-width="2.3" stroke-dasharray="6 4" marker-end="url(#arA)"/><text x="486" y="228" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#d97706">outside the subset:</text><text x="486" y="246" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">this operator never compiles at all</text><path d="M 398 396 L 580 302" fill="none" stroke="#d97706" stroke-width="2.3" stroke-dasharray="6 4" marker-end="url(#arA)"/><text x="486" y="384" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#d97706">nulls this body cannot carry:</text><text x="486" y="402" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">this batch only, and the next one tries again</text><text x="490" y="494" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">The subset is narrow on purpose: numeric, date and timestamp columns, arithmetic and comparison. No strings.</text><text x="490" y="516" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6675">A per-morsel compile would lose. One 64-row query paid 16.6 ms of Cranelift before the cache existed.</text></svg>