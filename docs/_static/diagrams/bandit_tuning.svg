<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" role="img" width="980" height="620"><defs><style>
  .surface { fill: #ffffff; stroke: #cbd5e1; }
  .band-blue { fill: #eff6ff; stroke: #3b82f6; }
  .band-amber { fill: #fffbeb; stroke: #f59e0b; }
  .band-grey { fill: #f8fafc; stroke: #cbd5e1; }
  .t-title { fill: #1e293b; }
  .t-sub { fill: #5b6675; }
  .t-arrow { fill: #475569; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1e293b; stroke: #334155; }
    .band-blue { fill: #172554; stroke: #3b82f6; }
    .band-amber { fill: #2c1f06; stroke: #f59e0b; }
    .band-grey { fill: #131c31; stroke: #334155; }
    .t-title { fill: #e2e8f0; }
    .t-sub { fill: #94a3b8; }
    .t-arrow { fill: #cbd5e1; }
  }
</style>
<filter id="sh" x="-20%" y="-30%" width="140%" height="180%">
  <feDropShadow dx="0" dy="2.5" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.18"/>
</filter>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><rect x="20" y="20" width="940" height="210" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">THE ARMS, AND WHAT IS MEASURED</text><g filter="url(#sh)"><rect x="44" y="84" width="280" height="90" rx="10" class="surface" stroke-width="1.2"/></g><text x="184.0" y="129.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Join strategy</text><text x="184.0" y="148.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">hash / broadcast / sort_merge</text><g filter="url(#sh)"><rect x="350" y="84" width="280" height="90" rx="10" class="surface" stroke-width="1.2"/></g><text x="490.0" y="129.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Execution route</text><text x="490.0" y="148.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">one_shot / staged</text><g filter="url(#sh)"><rect x="656" y="84" width="280" height="90" rx="10" class="surface" stroke-width="1.2"/></g><text x="796.0" y="129.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">The reward</text><text x="796.0" y="148.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">measured latency, minimized</text><text x="490" y="206" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Every arm emits the same relation. A wrong pick costs throughput, never correctness -- which is what makes exploring safe at all.</text><g filter="url(#sh)"><rect x="44" y="290" width="260" height="96" rx="10" class="surface" stroke-width="1.2"/></g><text x="174.0" y="338.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Under 3 observations?</text><text x="174.0" y="357.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">yes: the cost model decides</text><g filter="url(#sh)"><rect x="360" y="290" width="260" height="96" rx="10" class="surface" stroke-width="1.2"/></g><text x="490.0" y="338.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">An arm never tried?</text><text x="490.0" y="357.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">yes: give it exactly one turn</text><g filter="url(#sh)"><rect x="676" y="290" width="260" height="96" rx="10" class="surface" stroke-width="1.2"/></g><text x="806.0" y="338.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Otherwise</text><text x="806.0" y="357.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">the lowest bound wins</text><path d="M 304 338 L 360 338" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="332" y="328" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">no</text><path d="M 620 338 L 676 338" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="648" y="328" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">no</text><text x="490" y="412" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">mean - 1.0 x spread x sqrt(2 ln N / n)</text><text x="490" y="430" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">ties break by name. No RNG anywhere, so a plan is reproducible.</text><g filter="url(#sh)"><rect x="676" y="452" width="260" height="84" rx="10" class="surface" stroke-width="1.2"/></g><text x="806.0" y="494.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Evidence decays</text><text x="806.0" y="513.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">0.975 per observation</text><path d="M 806 386 L 806 452" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="818" y="424" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">record the ms</text><text x="806" y="560" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">an effective horizon of about 40 runs</text><path d="M 676 516 Q 420 580 176 394" fill="none" stroke="#d97706" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#arA)"/><text x="420" y="548" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">so an arm that got faster is asked again</text><text x="490" y="600" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Statistics are per plan signature, and anything in machine units is additionally scoped by hardware fingerprint, so unlike machines never blend.</text></svg>