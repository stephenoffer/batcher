</defs><rect x="20" y="20" width="940" height="288" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">THREE FRAMES, TWO LOGGED POSES, ONE COMPOSED POSE</text><g filter="url(#sh)"><rect x="40" y="72" width="200" height="70" rx="10" class="surface" stroke-width="1.2"/></g><text x="140.0" y="107.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">lidar frame</text><text x="140.0" y="126.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">where the returns are</text><g filter="url(#sh)"><rect x="390" y="72" width="200" height="70" rx="10" class="surface" stroke-width="1.2"/></g><text x="490.0" y="107.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">ego frame</text><text x="490.0" y="126.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">the vehicle</text><g filter="url(#sh)"><rect x="740" y="72" width="200" height="70" rx="10" class="surface" stroke-width="1.2"/></g><text x="840.0" y="107.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">world frame</text><text x="840.0" y="126.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">does not move</text><path d="M 240 107.0 L 388 107.0" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="314" y="95.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">ego_from_lidar</text><text x="314" y="129.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">calibration file</text><text x="314" y="147.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">offset (1.2, 0, 1.8)</text><path d="M 590 107.0 L 738 107.0" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="664" y="95.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">world_from_ego</text><text x="664" y="129.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">localizer</text><text x="664" y="147.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">offset (100, 50, 0)</text><path d="M 140 142 Q 490 318 840 146" fill="none" stroke="#d97706" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#arA)"/><text x="490" y="248" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" class="t-arrow">world_from_lidar</text><text x="490" y="268" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">se3_compose(world_from_ego, ego_from_lidar): the adjacent ego cancels</text><text x="490" y="288" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">composed offset (101.2, 50.0, 1.8)</text><rect x="20" y="324" width="940" height="162" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="348" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">THEN, ONCE PER POINT</text><rect x="38" y="362" width="904" height="58" rx="9" class="code-bg" stroke-width="1"/><text x="52" y="388.0" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="12" class="t-code" xml:space="preserve">world_from_lidar = (&quot;w_tx&quot;, &quot;w_ty&quot;, &quot;w_tz&quot;, &quot;w_qx&quot;, &quot;w_qy&quot;, &quot;w_qz&quot;, &quot;w_qw&quot;)</text><text x="52" y="407.0" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="12" class="t-code" xml:space="preserve">bt.se3_transform(world_from_lidar, (&quot;x&quot;, &quot;y&quot;, &quot;z&quot;), prefix=&quot;world_&quot;)</text><text x="38" y="448" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">One transform per point with the composed pose: it rotates, then translates.</text><text x="38" y="468" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">se3_inverse_transform takes a world point back into the lidar frame.</text></svg>