</defs><rect x="20" y="24" width="940" height="130" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="48" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">MAKE THE MORSELS</text><text x="44" y="64" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">input: whatever the source emitted</text><rect x="44" y="78" width="142" height="34" rx="3" fill="#94a3b8" fill-opacity="0.28" stroke="#94a3b8" stroke-width="1.4"/><rect x="192" y="78" width="30" height="34" rx="3" fill="#94a3b8" fill-opacity="0.28" stroke="#94a3b8" stroke-width="1.4"/><rect x="228" y="78" width="96" height="34" rx="3" fill="#94a3b8" fill-opacity="0.28" stroke="#94a3b8" stroke-width="1.4"/><rect x="330" y="78" width="16" height="34" rx="3" fill="#94a3b8" fill-opacity="0.28" stroke="#94a3b8" stroke-width="1.4"/><rect x="352" y="78" width="20" height="34" rx="3" fill="#94a3b8" fill-opacity="0.28" stroke="#94a3b8" stroke-width="1.4"/><rect x="378" y="78" width="58" height="34" rx="3" fill="#94a3b8" fill-opacity="0.28" stroke="#94a3b8" stroke-width="1.4"/><path d="M 456 95 L 516 95" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="486" y="74" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">morselize</text><text x="486" y="132" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">split / coalesce</text><text x="733" y="64" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">full at 16,384 rows OR 1 MiB, whichever trips first</text><rect x="528" y="78" width="46" height="34" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="580" y="78" width="46" height="34" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="632" y="78" width="46" height="34" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="684" y="78" width="46" height="34" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="736" y="78" width="46" height="34" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="788" y="78" width="46" height="34" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="840" y="78" width="46" height="34" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="892" y="78" width="46" height="34" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><text x="733" y="132" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">one over-budget row becomes a one-row morsel</text><path d="M 490 156 L 490 194" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="504" y="180" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">par_iter() over the morsel vector</text><rect x="20" y="200" width="940" height="190" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="224" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">SCHEDULE: ONE POOL, ONE MORSEL PER TASK</text><text x="490" y="244" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">W = operator_cores(), capped by the number of morsels the input can produce (par::auto_width)</text><g filter="url(#sh)"><rect x="44" y="258" width="196" height="82" rx="10" class="surface" stroke-width="1.2"/></g><text x="142.0" y="299.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">worker 0</text><text x="142.0" y="318.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">one morsel at a time</text><g filter="url(#sh)"><rect x="286" y="258" width="196" height="82" rx="10" class="surface" stroke-width="1.2"/></g><text x="384.0" y="299.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">worker 1</text><text x="384.0" y="318.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">one morsel at a time</text><g filter="url(#sh)"><rect x="528" y="258" width="196" height="82" rx="10" class="surface" stroke-width="1.2"/></g><text x="626.0" y="299.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">worker 2</text><text x="626.0" y="318.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">one morsel at a time</text><g filter="url(#sh)"><rect x="770" y="258" width="196" height="82" rx="10" class="surface" stroke-width="1.2"/></g><text x="868.0" y="299.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">worker 3</text><text x="868.0" y="318.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">one morsel at a time</text><path d="M 142 340 Q 490 386 868 340" fill="none" stroke="#d97706" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#arA)"/><text x="490" y="378" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">an idle worker steals: rayon's scheduler, not Batcher's</text><path d="M 490 392 L 490 424" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="504" y="412" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">one task = one morsel</text><rect x="20" y="430" width="940" height="116" rx="16" class="band-amber" stroke-width="1.5"/><text x="38" y="454" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#f59e0b">ONE WORKER, ONE MORSEL, ONE PASS</text><rect x="46" y="468" width="74" height="56" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><text x="83" y="540" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">morsel in</text><path d="M 126 496 L 186 496" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="156" y="484" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">rows</text><g filter="url(#sh)"><rect x="192" y="468" width="218" height="56" rx="10" class="surface" stroke-width="1.2"/></g><text x="301.0" y="496.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">filter</text><text x="301.0" y="515.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">JIT compiled once</text><path d="M 416 496 L 476 496" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="446" y="484" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">survivors</text><g filter="url(#sh)"><rect x="482" y="468" width="218" height="56" rx="10" class="surface" stroke-width="1.2"/></g><text x="591.0" y="496.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">project</text><text x="591.0" y="515.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">never materialized</text><path d="M 706 496 L 766 496" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="736" y="484" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">output</text><rect x="772" y="468" width="74" height="56" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><text x="809" y="540" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">morsel out</text><text x="864" y="492" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">collected in</text><text x="864" y="508" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">index order</text><text x="490" y="572" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Filter and project preserve row order because the morsels are collected in index order. The hash operators do not.</text></svg>