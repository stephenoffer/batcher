</style>
<filter id="sh" x="-20%" y="-30%" width="140%" height="180%">
  <feDropShadow dx="0" dy="2.5" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.18"/>
</filter>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><rect x="20" y="20" width="940" height="92" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">GOVERNANCE RUNS ONCE, BEFORE THE OPTIMIZER</text><g filter="url(#sh)"><rect x="230" y="44" width="520" height="56" rx="10" class="surface" stroke-width="1.2"/></g><text x="490.0" y="72.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">enforce(plan, tables, principal, catalog)</text><text x="490.0" y="91.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">pure: a plan goes in, a governed plan and its audit events come out</text><rect x="20" y="132" width="420" height="388" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="156" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">THE PLAN YOU WROTE</text><g filter="url(#sh)"><rect x="60" y="170" width="340" height="52" rx="10" class="surface" stroke-width="1.2"/></g><text x="230.0" y="196.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">aggregate</text><text x="230.0" y="215.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">sum(amount) by region</text><g filter="url(#sh)"><rect x="60" y="446" width="340" height="52" rx="10" class="surface" stroke-width="1.2"/></g><text x="230.0" y="472.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">scan customers</text><text x="230.0" y="491.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">every column, every row</text><path d="M 230 446 L 230 228" fill="none" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arG)"/><text x="244" y="330" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">all rows, all columns</text><path d="M 444 325 L 514 325" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="479" y="310" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">rewrite</text><rect x="520" y="132" width="440" height="388" rx="16" class="band-blue" stroke-width="1.5"/><text x="538" y="156" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">THE PLAN THAT RUNS</text><g filter="url(#sh)"><rect x="550" y="170" width="380" height="52" rx="10" class="surface" stroke-width="1.2"/></g><text x="740.0" y="196.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">aggregate</text><text x="740.0" y="215.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">your query, untouched</text><g filter="url(#sh)"><rect x="550" y="262" width="380" height="52" rx="10" class="surface" stroke-width="1.2"/></g><text x="740.0" y="288.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">project  (injected)</text><text x="740.0" y="307.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">the columns you may read, through their masks</text><g filter="url(#sh)"><rect x="550" y="354" width="380" height="52" rx="10" class="surface" stroke-width="1.2"/></g><text x="740.0" y="380.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">filter  (injected)</text><text x="740.0" y="399.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">the row-access predicate</text><g filter="url(#sh)"><rect x="550" y="446" width="380" height="52" rx="10" class="surface" stroke-width="1.2"/></g><text x="740.0" y="472.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">scan customers</text><text x="740.0" y="491.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">every column, every row</text><path d="M 740 446 L 740 412" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="754" y="434" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">raw rows</text><path d="M 740 354 L 740 320" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="754" y="342" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">only the rows the policy allows</text><path d="M 740 262 L 740 228" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="754" y="250" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">masked values, pruned columns</text><rect x="20" y="552" width="940" height="128" rx="16" class="band-amber" stroke-width="1.5"/><text x="38" y="576" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#f59e0b">WHY THE ORDER IS LOAD-BEARING</text><text x="180" y="596" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Filter below project:</text><text x="180" y="614" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">a row policy may read a column</text><text x="180" y="632" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">you hold no SELECT on.</text><text x="490" y="596" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Project at the leaf:</text><text x="490" y="614" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">no operator you wrote</text><text x="490" y="632" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">ever sees a raw value.</text><text x="800" y="596" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">A denied column is removed</text><text x="800" y="614" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">from the output, not flagged.</text><text x="800" y="632" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">There is no check to bypass.</text><text x="490" y="662" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">collect, count, iter_batches, write and the distributed path all run this same plan.</text></svg>