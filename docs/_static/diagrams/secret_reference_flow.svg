</defs><rect x="20" y="20" width="280" height="470" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">THE DRIVER</text><text x="38" y="62" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">builds the plan</text><rect x="36" y="84" width="248" height="77" rx="9" class="code-bg" stroke-width="1"/><text x="50" y="110.0" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="12" class="t-code" xml:space="preserve">ds.select(c=bt.aes_encrypt(</text><text x="50" y="129.0" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="12" class="t-code" xml:space="preserve">    bt.col(&quot;ssn&quot;),</text><text x="50" y="148.0" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="12" class="t-code" xml:space="preserve">    &quot;env:AES_KEY&quot;))</text><path d="M 160 190 L 160 316" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="172" y="250" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">an inline key</text><text x="172" y="266" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">instead</text><g filter="url(#sh)"><rect x="36" y="322" width="248" height="76" rx="11" fill="url(#tintAmber)" stroke="#fcd34d" stroke-width="1.2"/></g><rect x="36" y="334" width="4" height="52" rx="2" fill="#f59e0b"/><text x="163.0" y="359.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">SecurityWarning</text><text x="163.0" y="377.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">the key is now in the plan</text><text x="38" y="426" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">With BATCHER_REQUIRE_KEY_REFS=1</text><text x="38" y="444" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">it is a PlanError at plan-build</text><text x="38" y="462" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">time instead.</text><rect x="318" y="20" width="250" height="470" rx="16" class="band-blue" stroke-width="1.5"/><text x="336" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">WHAT TRAVELS</text><path d="M 284 104 L 334 104" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="309" y="92" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">lowers</text><g filter="url(#sh)"><rect x="334" y="62" width="218" height="76" rx="10" class="surface" stroke-width="1.2"/></g><text x="443.0" y="100.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">the plan IR</text><text x="443.0" y="119.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">shipped to every worker</text><rect x="399.15" y="157" width="87.7" height="20" rx="10" class="pill-blue"/><text x="443.0" y="171" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.4" class="pt-blue">env:AES_KEY</text><text x="443" y="200" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">the reference only,</text><text x="443" y="218" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">never the key</text><text x="443" y="270" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="1.8" fill="#5b6675">NEVER SEE THE KEY</text><text x="443" y="296" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">plan logs</text><text x="443" y="316" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">the profile</text><text x="443" y="336" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">explain()</text><text x="443" y="356" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">the FFI boundary</text><text x="443" y="426" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">A missing reference fails,</text><text x="443" y="444" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">naming the reference,</text><text x="443" y="462" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">never the key.</text><rect x="586" y="20" width="374" height="470" rx="16" class="band-blue" stroke-width="1.5"/><text x="604" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">ON EACH WORKER</text><path d="M 552 91 L 604 91" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="578" y="79" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">arrives</text><g filter="url(#sh)"><rect x="604" y="62" width="338" height="58" rx="10" class="surface" stroke-width="1.2"/></g><text x="773.0" y="91.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">resolve the reference</text><text x="773.0" y="110.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">bc-secrets, in the data plane</text><path d="M 662 120 L 662 152" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><path d="M 773 120 L 773 152" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><path d="M 884 120 L 884 152" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="717" y="142" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">by scheme</text><g filter="url(#sh)"><rect x="604" y="156" width="110" height="66" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="604" y="168" width="4" height="42" rx="2" fill="#3b82f6"/><text x="662.0" y="188.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">env:</text><text x="662.0" y="206.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">variable</text><g filter="url(#sh)"><rect x="718" y="156" width="110" height="66" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="718" y="168" width="4" height="42" rx="2" fill="#3b82f6"/><text x="776.0" y="188.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">file:</text><text x="776.0" y="206.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">mounted file</text><g filter="url(#sh)"><rect x="832" y="156" width="110" height="66" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="832" y="168" width="4" height="42" rx="2" fill="#3b82f6"/><text x="890.0" y="188.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">cmd:</text><text x="890.0" y="206.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">helper stdout</text><path d="M 773 222 L 773 254" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="785" y="244" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">the secret</text><g filter="url(#sh)"><rect x="604" y="258" width="338" height="58" rx="10" class="surface" stroke-width="1.2"/></g><text x="773.0" y="287.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">cached per process</text><text x="773.0" y="306.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">BATCHER_SECRET_TTL_SECONDS, 300 s</text><path d="M 773 316 L 773 344" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="785" y="336" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">per batch</text><g filter="url(#sh)"><rect x="604" y="348" width="338" height="58" rx="10" class="surface" stroke-width="1.2"/></g><text x="773.0" y="377.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">the kernel uses the key</text><text x="773.0" y="396.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">on the machine that runs it</text><text x="612" y="436" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">cmd: runs the operator's BATCHER_SECRET_COMMAND</text><text x="612" y="454" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">with NAME as its argument. Unset, it fails.</text><text x="490" y="530" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Connector passwords and storage_options take the same references, resolved once per connection and not cached.</text></svg>