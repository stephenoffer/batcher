</defs><rect x="20" y="20" width="330" height="360" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">ONE SPLIT PER PARTITION</text><rect x="370" y="20" width="590" height="360" rx="16" class="band-amber" stroke-width="1.5"/><text x="388" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#f59e0b">EACH MICRO-BATCH, IN ORDER</text><g filter="url(#sh)"><rect x="40" y="88" width="110" height="64" rx="10" class="surface" stroke-width="1.2"/></g><text x="95.0" y="120.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">P0</text><text x="95.0" y="139.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">partition</text><g filter="url(#sh)"><rect x="212" y="88" width="118" height="64" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="212" y="100" width="4" height="40" rx="2" fill="#3b82f6"/><text x="274.0" y="119.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Reader</text><text x="274.0" y="137.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">own consumer</text><path d="M 154 120 L 206 120" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="180" y="110" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">assign</text><g filter="url(#sh)"><rect x="40" y="188" width="110" height="64" rx="10" class="surface" stroke-width="1.2"/></g><text x="95.0" y="220.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">P1</text><text x="95.0" y="239.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">partition</text><g filter="url(#sh)"><rect x="212" y="188" width="118" height="64" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="212" y="200" width="4" height="40" rx="2" fill="#3b82f6"/><text x="274.0" y="219.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Reader</text><text x="274.0" y="237.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">own consumer</text><path d="M 154 220 L 206 220" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="180" y="210" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">assign</text><g filter="url(#sh)"><rect x="40" y="288" width="110" height="64" rx="10" class="surface" stroke-width="1.2"/></g><text x="95.0" y="320.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">P2</text><text x="95.0" y="339.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">partition</text><g filter="url(#sh)"><rect x="212" y="288" width="118" height="64" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="212" y="300" width="4" height="40" rx="2" fill="#3b82f6"/><text x="274.0" y="319.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Reader</text><text x="274.0" y="337.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">own consumer</text><path d="M 154 320 L 206 320" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="180" y="310" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">assign</text><text x="185" y="368" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Read parallelism = partition count.</text><g filter="url(#sh)"><rect x="446" y="58" width="244" height="58" rx="11" fill="url(#tintAmber)" stroke="#fcd34d" stroke-width="1.2"/></g><rect x="446" y="70" width="4" height="34" rx="2" fill="#f59e0b"/><text x="571.0" y="86.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Poll</text><text x="571.0" y="104.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">no commit at poll time</text><circle cx="448" cy="60" r="14" fill="#d97706"/><text x="448" y="64.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffffff">1</text><g filter="url(#sh)"><rect x="446" y="138" width="244" height="58" rx="11" fill="url(#tintAmber)" stroke="#fcd34d" stroke-width="1.2"/></g><rect x="446" y="150" width="4" height="34" rx="2" fill="#f59e0b"/><text x="571.0" y="166.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Write ahead</text><text x="571.0" y="184.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">the consumed position</text><circle cx="448" cy="140" r="14" fill="#d97706"/><text x="448" y="144.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffffff">2</text><g filter="url(#sh)"><rect x="446" y="218" width="244" height="58" rx="11" fill="url(#tintAmber)" stroke="#fcd34d" stroke-width="1.2"/></g><rect x="446" y="230" width="4" height="34" rx="2" fill="#f59e0b"/><text x="571.0" y="246.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Publish</text><text x="571.0" y="264.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">the micro-batch</text><circle cx="448" cy="220" r="14" fill="#d97706"/><text x="448" y="224.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffffff">3</text><g filter="url(#sh)"><rect x="446" y="298" width="244" height="58" rx="11" fill="url(#tintAmber)" stroke="#fcd34d" stroke-width="1.2"/></g><rect x="446" y="310" width="4" height="34" rx="2" fill="#f59e0b"/><text x="571.0" y="326.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Commit group offset</text><text x="571.0" y="344.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">synchronous, after publish</text><circle cx="448" cy="300" r="14" fill="#d97706"/><text x="448" y="304.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffffff">4</text><path d="M 334 120 L 360 120 M 334 220 L 360 220 M 334 320 L 360 320 M 360 320 L 360 87 L 438 87" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="404" y="78" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">messages</text><g filter="url(#sh)"><rect x="780" y="138" width="150" height="58" rx="10" class="surface" stroke-width="1.2"/></g><text x="855.0" y="167.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Checkpoint</text><text x="855.0" y="186.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">source of truth</text><path d="M 696 167 L 774 167" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="733" y="157" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">offsets</text><g filter="url(#sh)"><rect x="780" y="218" width="150" height="58" rx="10" class="surface" stroke-width="1.2"/></g><text x="855.0" y="247.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Sink</text><text x="855.0" y="266.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">idempotent</text><path d="M 696 247 L 774 247" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="733" y="237" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">rows</text><g filter="url(#sh)"><rect x="780" y="298" width="150" height="58" rx="10" class="surface" stroke-width="1.2"/></g><text x="855.0" y="327.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Consumer group</text><text x="855.0" y="346.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">the fallback</text><path d="M 696 327 L 774 327" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="733" y="317" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">commit</text><rect x="20" y="440" width="940" height="100" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="464" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">ON RESTART</text><path d="M 934 167 L 946 167 L 946 432" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="934" y="412" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">restart</text><text x="44" y="490" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Each partition resumes at its checkpointed offset + 1. Without a checkpointed position it</text><text x="44" y="510" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">keeps the group's committed offset, or starting_offsets for a new group. A crash between</text><text x="44" y="530" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">publish and commit replays a batch: a duplicate, never a gap.</text></svg>