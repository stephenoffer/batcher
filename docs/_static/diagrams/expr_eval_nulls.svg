116" width="54" height="22" rx="4" class="band-blue" stroke-width="1.2"/><text x="565.0" y="131.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="700" fill="#2563eb">1</text><rect x="597" y="116" width="54" height="22" rx="4" class="band-blue" stroke-width="1.2"/><text x="624.0" y="131.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="700" fill="#2563eb">1</text><text x="112" y="100" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">values</text><text x="112" y="132" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">validity</text><text x="684" y="86" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">A null slot still holds a payload.</text><text x="684" y="104" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">The bitmap beside it is the only thing</text><text x="684" y="122" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">that says to ignore that payload.</text><rect x="20" y="186" width="940" height="150" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="210" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">COMPARISON CARRIES THE BITMAP FORWARD</text><text x="235.5" y="238" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" font-weight="700" fill="#2563eb">a &gt; 10</text><rect x="120" y="246" width="54" height="30" rx="5" class="surface" stroke-width="1.2"/><text x="147.0" y="265.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-title">false</text><rect x="179" y="246" width="54" height="30" rx="5" class="surface" stroke-width="1.2"/><text x="206.0" y="265.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-title">true</text><rect x="238" y="246" width="54" height="30" rx="5" class="band-grey" stroke-width="1.2"/><text x="265.0" y="265.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#5b6675">null</text><rect x="297" y="246" width="54" height="30" rx="5" class="surface" stroke-width="1.2"/><text x="324.0" y="265.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-title">true</text><rect x="120" y="282" width="54" height="22" rx="4" class="band-blue" stroke-width="1.2"/><text x="147.0" y="297.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="700" fill="#2563eb">1</text><rect x="179" y="282" width="54" height="22" rx="4" class="band-blue" stroke-width="1.2"/><text x="206.0" y="297.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="700" fill="#2563eb">1</text><rect x="238" y="282" width="54" height="22" rx="4" class="band-amber" stroke-width="1.2"/><text x="265.0" y="297.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="700" fill="#d97706">0</text><rect x="297" y="282" width="54" height="22" rx="4" class="band-blue" stroke-width="1.2"/><text x="324.0" y="297.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="700" fill="#2563eb">1</text><text x="535.5" y="238" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" font-weight="700" fill="#2563eb">b &lt; 5</text><rect x="420" y="246" width="54" height="30" rx="5" class="surface" stroke-width="1.2"/><text x="447.0" y="265.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-title">false</text><rect x="479" y="246" width="54" height="30" rx="5" class="surface" stroke-width="1.2"/><text x="506.0" y="265.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-title">true</text><rect x="538" y="246" width="54" height="30" rx="5" class="surface" stroke-width="1.2"/><text x="565.0" y="265.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-title">false</text><rect x="597" y="246" width="54" height="30" rx="5" class="surface" stroke-width="1.2"/><text x="624.0" y="265.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-title">false</text><rect x="420" y="282" width="54" height="22" rx="4" class="band-blue" stroke-width="1.2"/><text x="447.0" y="297.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="700" fill="#2563eb">1</text><rect x="479" y="282" width="54" height="22" rx="4" class="band-blue" stroke-width="1.2"/><text x="506.0" y="297.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="700" fill="#2563eb">1</text><rect x="538" y="282" width="54" height="22" rx="4" class="band-blue" stroke-width="1.2"/><text x="565.0" y="297.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="700" fill="#2563eb">1</text><rect x="597" y="282" width="54" height="22" rx="4" class="band-blue" stroke-width="1.2"/><text x="624.0" y="297.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="700" fill="#2563eb">1</text><text x="112" y="266" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">values</text><text x="112" y="298" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">validity</text><text x="684" y="252" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Arrow's compare kernels return null,</text><text x="684" y="270" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">never false, where an input is null.</text><text x="684" y="288" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Row 3 is unknown, not excluded.</text><rect x="20" y="352" width="940" height="232" rx="16" class="band-amber" stroke-width="1.5"/><text x="38" y="376" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#f59e0b">AND IS THREE-VALUED, UNTIL IT IS USED</text><text x="235.5" y="404" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" font-weight="700" fill="#2563eb">and_kleene</text><rect x="120" y="412" width="54" height="30" rx="5" class="surface" stroke-width="1.2"/><text x="147.0" y="431.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-title">false</text><rect x="179" y="412" width="54" height="30" rx="5" class="surface" stroke-width="1.2"/><text x="206.0" y="431.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-title">true</text><rect x="238" y="412" width="54" height="30" rx="5" class="surface" stroke-width="1.2"/><text x="265.0" y="431.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-title">false</text><rect x="297" y="412" width="54" height="30" rx="5" class="surface" stroke-width="1.2"/><text x="324.0" y="431.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-title">false</text><rect x="120" y="448" width="54" height="22" rx="4" class="band-blue" stroke-width="1.2"/><text x="147.0" y="463.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="700" fill="#2563eb">1</text><rect x="179" y="448" width="54" height="22" rx="4" class="band-blue" stroke-width="1.2"/><text x="206.0" y="463.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="700" fill="#2563eb">1</text><rect x="238" y="448" width="54" height="22" rx="4" class="band-blue" stroke-width="1.2"/><text x="265.0" y="463.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="700" fill="#2563eb">1</text><rect x="297" y="448" width="54" height="22" rx="4" class="band-blue" stroke-width="1.2"/><text x="324.0" y="463.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="700" fill="#2563eb">1</text><text x="112" y="432" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">values</text><text x="112" y="464" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">validity</text><text x="120" y="498" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">false AND null is false, so row 3 is</text><text x="120" y="516" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">valid again. Arrow's plain and would</text><text x="120" y="534" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">have propagated the null instead.</text><g filter="url(#sh)"><rect x="420" y="396" width="500" height="76" rx="10" class="surface" stroke-width="1.2"/></g><text x="670.0" y="434.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Kept as a column</text><text x="670.0" y="453.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">three values survive: true, false, unknown</text><g filter="url(#sh)"><rect x="420" y="492" width="500" height="76" rx="10" class="surface" stroke-width="1.2"/></g><text x="670.0" y="530.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Used as a filter</text><text x="670.0" y="549.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">truthy() folds unknown to false, and the row goes</text><path d="M 361 427 L 410 434" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><path d="M 361 455 L 410 530" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="378" y="418" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">as a value</text><text x="368" y="478" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#d97706">as a predicate</text><text x="670" y="484" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">truthy(): value AND validity, and no bitmap on the result.</text></svg>