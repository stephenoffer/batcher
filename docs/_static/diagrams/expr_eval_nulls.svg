</defs><rect x="20" y="20" width="940" height="150" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">AN ARROW COLUMN IS TWO BUFFERS, NOT ONE</text><text x="235.5" y="72" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" font-weight="700" fill="#2563eb">column a</text><rect x="120" y="80" width="54" height="30" rx="5" class="surface" stroke-width="1.2"/><text x="147.0" y="99.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-title">3</text><rect x="179" y="80" width="54" height="30" rx="5" class="surface" stroke-width="1.2"/><text x="206.0" y="99.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-title">17</text><rect x="238" y="80" width="54" height="30" rx="5" class="band-grey" stroke-width="1.2"/><text x="265.0" y="99.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#5b6675">null</text><rect x="297" y="80" width="54" height="30" rx="5" class="surface" stroke-width="1.2"/><text x="324.0" y="99.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-title">24</text><rect x="120" y="116" width="54" height="22" rx="4" class="band-blue" stroke-width="1.2"/><text x="147.0" y="131.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="700" fill="#2563eb">1</text><rect x="179" y="116" width="54" height="22" rx="4" class="band-blue" stroke-width="1.2"/><text x="206.0" y="131.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="700" fill="#2563eb">1</text><rect x="238" y="116" width="54" height="22" rx="4" class="band-amber" stroke-width="1.2"/><text x="265.0" y="131.0" text