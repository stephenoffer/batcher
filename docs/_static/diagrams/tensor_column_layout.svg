<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" width="960" height="560"><defs><style>
  .surface { fill: #ffffff; stroke: #cbd5e1; }
  .band-blue { fill: #eff6ff; stroke: #3b82f6; }
  .band-amber { fill: #fffbeb; stroke: #f59e0b; }
  .band-grey { fill: #f8fafc; stroke: #cbd5e1; }
  .t-title { fill: #1e293b; }
  .t-sub { fill: #5b6675; }
  .t-arrow { fill: #475569; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1e293b; stroke: #334155; }
    .band-blue { fill: #172554; stroke: #3b82f6; }
    .band-amber { fill: #2c1f06; stroke: #f59e0b; }
    .band-grey { fill: #131c31; stroke: #334155; }
    .t-title { fill: #e2e8f0; }
    .t-sub { fill: #94a3b8; }
    .t-arrow { fill: #cbd5e1; }
  }
</style>
<filter id="sh" x="-20%" y="-30%" width="140%" height="180%">
  <feDropShadow dx="0" dy="2.5" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.18"/>
</filter>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><rect x="24" y="20" width="440" height="276" rx="16" class="band-grey" stroke-width="1.5"/><text x="42" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">ONE PYTHON OBJECT PER ROW</text><g filter="url(#sh)"><rect x="48" y="72" width="88" height="58" rx="10" class="surface" stroke-width="1.2"/></g><text x="92.0" y="106.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">ndarray</text><g filter="url(#sh)"><rect x="148" y="72" width="88" height="58" rx="10" class="surface" stroke-width="1.2"/></g><text x="192.0" y="106.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">ndarray</text><g filter="url(#sh)"><rect x="248" y="72" width="88" height="58" rx="10" class="surface" stroke-width="1.2"/></g><text x="292.0" y="106.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">ndarray</text><g filter="url(#sh)"><rect x="348" y="72" width="88" height="58" rx="10" class="surface" stroke-width="1.2"/></g><text x="392.0" y="106.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">ndarray</text><text x="48" y="154" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">n separate allocations, one per row.</text><text x="48" y="182" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Every row is a pointer, so the batch's bytes are</text><text x="48" y="200" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">scattered and nothing can be handed to a kernel</text><text x="48" y="218" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">or across the FFI boundary whole.</text><text x="48" y="246" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">This is what RecordBatch.to_pandas() gives for a</text><text x="48" y="264" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">tensor column, which is why the batch is re-wrapped</text><text x="48" y="282" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">before a user function ever sees it.</text><rect x="496" y="20" width="440" height="276" rx="16" class="band-blue" stroke-width="1.5"/><text x="514" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">ONE ARROW COLUMN</text><g filter="url(#sh)"><rect x="520" y="72" width="392" height="54" rx="10" class="surface" stroke-width="1.2"/></g><text x="716.0" y="99.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">validity bitmap</text><text x="716.0" y="118.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">one bit per row</text><g filter="url(#sh)"><rect x="520" y="136" width="392" height="54" rx="10" class="surface" stroke-width="1.2"/></g><text x="716.0" y="163.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">values</text><text x="716.0" y="182.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">n x 150528 uint8, contiguous</text><text x="520" y="212" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">No offsets buffer: every row is the same size,</text><text x="520" y="230" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">so row i begins at byte i x 150528.</text><text x="520" y="258" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">arrow.fixed_shape_tensor over a FixedSizeList, with</text><text x="520" y="276" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">the shape (224, 224, 3) in the field metadata.</text><text x="716" y="322" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">read back</text><path d="M 704 300 L 704 332" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><rect x="24" y="336" width="912" height="180" rx="16" class="band-grey" stroke-width="1.5"/><text x="42" y="360" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">WHAT A READER GETS BACK</text><g filter="url(#sh)"><rect x="48" y="376" width="420" height="72" rx="10" class="surface" stroke-width="1.2"/></g><text x="258.0" y="412.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">to_numpy_ndarray()</text><text x="258.0" y="431.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">(n, 224, 224, 3), shape from the type</text><g filter="url(#sh)"><rect x="496" y="376" width="416" height="72" rx="10" class="surface" stroke-width="1.2"/></g><text x="704.0" y="412.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">arrays_to_torch(zero_copy=True)</text><text x="704.0" y="431.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">a DLPack view over that buffer</text><text x="48" y="480" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">The shape travels with the data, so the column crosses the FFI boundary and comes back shaped:</text><text x="48" y="498" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">no IR tag and no two-sided contract, which is what choosing the canonical type buys.</text><text x="480" y="546" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">The default torch path owns a writable copy instead: a training loop mutates its batch, and the Arrow buffer is read-only.</text></svg>