<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 524" role="img" width="980" height="524"><defs><style>
  .surface { fill: #ffffff; stroke: #cbd5e1; }
  .band-blue { fill: #eff6ff; stroke: #3b82f6; }
  .band-amber { fill: #fffbeb; stroke: #f59e0b; }
  .band-grey { fill: #f8fafc; stroke: #cbd5e1; }
  .t-title { fill: #1e293b; }
  .t-sub { fill: #5b6675; }
  .t-arrow { fill: #475569; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1e293b; stroke: #334155; }
    .band-blue { fill: #172554; stroke: #3b82f6; }
    .band-amber { fill: #2c1f06; stroke: #f59e0b; }
    .band-grey { fill: #131c31; stroke: #334155; }
    .t-title { fill: #e2e8f0; }
    .t-sub { fill: #94a3b8; }
    .t-arrow { fill: #cbd5e1; }
  }
</style>
<filter id="sh" x="-20%" y="-30%" width="140%" height="180%">
  <feDropShadow dx="0" dy="2.5" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.18"/>
</filter>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><text x="490" y="52" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">One batch of 5,000 rows, delivered to the same table twice. The write is what decides whether that is a problem.</text><rect x="20" y="76" width="940" height="300" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="100" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">THE SAME BATCH, DELIVERED TWICE</text><text x="38" y="156" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">APPEND</text><text x="38" y="176" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">write.delta(table)</text><text x="38" y="192" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">mode='append'</text><g filter="url(#sh)"><rect x="190" y="118" width="200" height="84" rx="10" class="surface" stroke-width="1.2"/></g><text x="290.0" y="160.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">first delivery</text><text x="290.0" y="179.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">5,000 rows land</text><g filter="url(#sh)"><rect x="430" y="118" width="200" height="84" rx="10" class="surface" stroke-width="1.2"/></g><text x="530.0" y="160.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">same batch again</text><text x="530.0" y="179.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">5,000 more rows land</text><g filter="url(#sh)"><rect x="670" y="118" width="200" height="84" rx="10" class="surface" stroke-width="1.2"/></g><text x="770.0" y="160.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">10,000 rows</text><text x="770.0" y="179.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">5,000 distinct keys</text><path d="M 390 160.0 L 424 160.0" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="415" y="106" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">replay after a crash</text><path d="M 630 160.0 L 664 160.0" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="655" y="106" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">every key now appears twice</text><text x="38" y="296" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">KEYED MERGE</text><text x="38" y="316" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">write.delta(table,</text><text x="38" y="332" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">merge_on='o_orderkey')</text><g filter="url(#sh)"><rect x="190" y="258" width="200" height="84" rx="10" class="surface" stroke-width="1.2"/></g><text x="290.0" y="300.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">first delivery</text><text x="290.0" y="319.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">5,000 rows land</text><g filter="url(#sh)"><rect x="430" y="258" width="200" height="84" rx="10" class="surface" stroke-width="1.2"/></g><text x="530.0" y="300.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">same batch again</text><text x="530.0" y="319.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">each key already there</text><g filter="url(#sh)"><rect x="670" y="258" width="200" height="84" rx="10" class="surface" stroke-width="1.2"/></g><text x="770.0" y="300.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">5,000 rows</text><text x="770.0" y="319.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">5,000 distinct keys</text><path d="M 390 300.0 L 424 300.0" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="415" y="246" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">replay after a crash</text><path d="M 630 300.0 L 664 300.0" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="655" y="246" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">each row is rewritten, not added</text><rect x="20" y="396" width="940" height="112" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="420" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">WHAT MAKES THE SECOND LANE SAFE</text><text x="490" y="438" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">The merge matches on a key, so a redelivered row overwrites the row it already wrote. Running it a third time changes nothing again:</text><text x="490" y="456" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">the example asserts 5,000 rows and the batch's own total, not a doubled one. The append has no key to match on and cannot tell the two apart.</text><text x="490" y="480" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">A streaming write gets the same property from the Delta txn action: the commit records the query name and batch id, and a replayed id commits nothing.</text><text x="490" y="498" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Resuming also needs the position the write reached, recorded with it. An idempotent write alone does not say where to restart.</text></svg>