</defs><rect x="20" y="20" width="940" height="250" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">THE LOOP</text><g filter="url(#sh)"><rect x="44" y="76" width="250" height="92" rx="10" class="surface" stroke-width="1.2"/></g><text x="169.0" y="122.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Read the plan</text><text x="169.0" y="141.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">explain(), nothing runs</text><circle cx="48" cy="80" r="14" fill="#2563eb"/><text x="48" y="84.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffffff">1</text><g filter="url(#sh)"><rect x="365" y="76" width="250" height="92" rx="10" class="surface" stroke-width="1.2"/></g><text x="490.0" y="122.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Measure it</text><text x="490.0" y="141.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">stats(), per operator</text><circle cx="369" cy="80" r="14" fill="#2563eb"/><text x="369" y="84.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffffff">2</text><g filter="url(#sh)"><rect x="686" y="76" width="250" height="92" rx="10" class="surface" stroke-width="1.2"/></g><text x="811.0" y="122.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Fix that operator</text><text x="811.0" y="141.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">one change at a time</text><circle cx="690" cy="80" r="14" fill="#2563eb"/><text x="690" y="84.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffffff">3</text><path d="M 294 122.0 L 363 122.0" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="329.5" y="110.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">then run</text><path d="M 615 122.0 L 684 122.0" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="650.5" y="110.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">hot spot</text><path d="M 811.0 168 Q 490 262 169.0 172" fill="none" stroke="#d97706" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#arA)"/><text x="490" y="246" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">fixed? explain() and stats() again</text><rect x="20" y="290" width="940" height="160" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="314" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">WHAT THE TUTORIAL FINDS</text><g filter="url(#sh)"><rect x="44" y="334" width="370" height="84" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="44" y="346" width="4" height="60" rx="2" fill="#3b82f6"/><text x="232.0" y="375.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Before: map_batches</text><text x="232.0" y="393.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">no row estimates, fee on 200,000 rows</text><g filter="url(#sh)"><rect x="566" y="334" width="370" height="84" rx="11" fill="url(#tintAmber)" stroke="#fcd34d" stroke-width="1.2"/></g><rect x="566" y="346" width="4" height="60" rx="2" fill="#f59e0b"/><text x="754.0" y="375.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">After: an expression</text><text x="754.0" y="393.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">filter in the scan, fee on 20,000 rows</text><path d="M 414 376 L 564 376" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="489" y="364" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">same answer</text><text x="489" y="396" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">10x less arithmetic</text></svg>