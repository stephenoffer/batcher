cx="680" cy="370" r="10" fill="#2563eb"/><path d="M 675.5 370 L 679 373.8 L 685 366.2" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="704" y="374" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="12.5" class="t-title" xml:space="preserve">dt=c/   v=3    kept</text><text x="500" y="442" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">A plain overwrite replaces the whole output, so partitions the new rows never mention are deleted.</text><text x="500" y="464" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">overwrite_partitions needs partition_by. _SUCCESS is written last, and readers skip it.</text></svg>