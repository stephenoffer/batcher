<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 452" role="img" width="980" height="452"><defs><style>
  .surface { fill: #ffffff; stroke: #cbd5e1; }
  .band-blue { fill: #eff6ff; stroke: #3b82f6; }
  .band-amber { fill: #fffbeb; stroke: #f59e0b; }
  .band-grey { fill: #f8fafc; stroke: #cbd5e1; }
  .t-title { fill: #1e293b; }
  .t-sub { fill: #5b6675; }
  .t-arrow { fill: #475569; }
  .t-code { fill: #1e40af; }
  .code-bg { fill: #f1f5f9; stroke: #e2e8f0; }
  .pill-blue { fill: #dbeafe; } .pill-amber { fill: #fef3c7; } .pill-grey { fill: #e2e8f0; }
  .pt-blue { fill: #1d4ed8; } .pt-amber { fill: #b45309; } .pt-grey { fill: #334155; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1e293b; stroke: #334155; }
    .band-blue { fill: #172554; stroke: #3b82f6; }
    .band-amber { fill: #2c1f06; stroke: #f59e0b; }
    .band-grey { fill: #131c31; stroke: #334155; }
    .t-title { fill: #e2e8f0; }
    .t-sub { fill: #94a3b8; }
    .t-arrow { fill: #cbd5e1; }
    .t-code { fill: #93c5fd; }
    .code-bg { fill: #0f172a; stroke: #334155; }
    .pill-blue { fill: #1e3a8a; } .pill-amber { fill: #78350f; } .pill-grey { fill: #334155; }
    .pt-blue { fill: #bfdbfe; } .pt-amber { fill: #fde68a; } .pt-grey { fill: #e2e8f0; }
    #tintBlue stop[offset="0"] { stop-color: #16233d; }
    #tintBlue stop[offset="1"] { stop-color: #1e3a8a; }
    #tintAmber stop[offset="0"] { stop-color: #2a1e07; }
    #tintAmber stop[offset="1"] { stop-color: #78350f; }
  }
</style>
<filter id="sh" x="-20%" y="-30%" width="140%" height="180%">
  <feDropShadow dx="0" dy="2.5" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.18"/>
</filter>
<filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
  <feDropShadow dx="0" dy="4" stdDeviation="9" flood-color="#2563eb" flood-opacity="0.35"/>
</filter>
<linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="0.5" stop-color="#2563eb"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
<linearGradient id="heroAmber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#d97706"/></linearGradient>
<linearGradient id="tintBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5f9ff"/><stop offset="1" stop-color="#dbeafe"/></linearGradient>
<linearGradient id="tintAmber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf5"/><stop offset="1" stop-color="#fdecc8"/></linearGradient>
<linearGradient id="ribbonBlue" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#93c5fd"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
<linearGradient id="ribbonAmber" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><rect x="20" y="20" width="940" height="318" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">ONE SPATIAL JOIN, TWO FILTERS, CHEAPEST FIRST</text><g filter="url(#sh)"><rect x="40" y="80" width="150" height="76" rx="10" class="surface" stroke-width="1.2"/></g><text x="115.0" y="118.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">cross join</text><text x="115.0" y="137.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">3 points, 2 regions</text><path d="M 190 118.0 L 250 118.0" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="220" y="106.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">6 pairs</text><g filter="url(#sh)"><rect x="254" y="80" width="206" height="76" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="254" y="92" width="4" height="52" rx="2" fill="#3b82f6"/><text x="360.0" y="117.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">st_intersects_extent</text><text x="360.0" y="135.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">compares 4 numbers</text><path d="M 460 118.0 L 528 118.0" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="494" y="106.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">true: 2</text><g filter="url(#sh)"><rect x="532" y="80" width="190" height="76" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="532" y="92" width="4" height="52" rx="2" fill="#3b82f6"/><text x="630.0" y="117.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">st_intersects</text><text x="630.0" y="135.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">decodes, walks segments</text><path d="M 722 118.0 L 780 118.0" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="751" y="106.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">true: 2</text><g filter="url(#sh)"><rect x="784" y="80" width="158" height="76" rx="10" class="surface" stroke-width="1.2"/></g><text x="863.0" y="118.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">2 hits</text><text x="863.0" y="137.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">pid 1 west, pid 2 east</text><path d="M 357 156 L 357 214" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="369" y="190" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">false: 4</text><g filter="url(#sh)"><rect x="254" y="218" width="206" height="70" rx="10" class="surface" stroke-width="1.2"/></g><text x="357.0" y="253.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">certainly disjoint</text><text x="357.0" y="272.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">never a false negative</text><text x="357" y="310" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">pid 3 with both, 1 east, 2 west</text><path d="M 627 156 L 627 214" fill="none" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arG)"/><text x="639" y="190" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">false: 0 here</text><g filter="url(#sh)"><rect x="532" y="218" width="190" height="70" rx="10" class="surface" stroke-width="1.2"/></g><text x="627.0" y="253.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">false positives</text><text x="627.0" y="272.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">removed by the exact test</text><rect x="20" y="354" width="940" height="82" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="378" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">FASTER STILL</text><text x="38" y="398" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Materialize st_xmin, st_ymin, st_xmax and st_ymax once, beside the geometry.</text><text x="38" y="418" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">They are plain Float64, so a range predicate on them pushes down to the scan and to Parquet statistics.</text></svg>