</defs><rect x="20" y="20" width="940" height="504" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">DO YOU NEED A UDF, AND WHICH ONE?</text><circle cx="52" cy="86.0" r="14" fill="#2563eb"/><text x="52" y="90.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffffff">1</text><g filter="url(#sh)"><rect x="75.0" y="58" width="340" height="56" rx="10" class="surface" stroke-width="1.2"/></g><text x="245.0" y="86.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Can an expression say it?</text><text x="245.0" y="105.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">bt.col, .str, .dt, .list ...</text><path d="M 419.0 86.0 L 590 86.0" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="505.5" y="76.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">yes</text><g filter="url(#sh)"><rect x="596" y="58" width="344" height="56" rx="11" fill="url(#tintAmber)" stroke="#fcd34d" stroke-width="1.2"/></g><rect x="596" y="70" width="4" height="32" rx="2" fill="#f59e0b"/><text x="771.0" y="85.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Write the expression</text><text x="771.0" y="103.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">vectorized in Rust, no UDF at all</text><path d="M 245 118 L 245 152" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="257" y="140" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">no</text><circle cx="52" cy="184.0" r="14" fill="#2563eb"/><text x="52" y="188.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffffff">2</text><g filter="url(#sh)"><rect x="75.0" y="156" width="340" height="56" rx="10" class="surface" stroke-width="1.2"/></g><text x="245.0" y="184.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Is the work per group?</text><text x="245.0" y="203.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">a session, a series, a document</text><path d="M 419.0 184.0 L 590 184.0" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="505.5" y="174.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">yes</text><g filter="url(#sh)"><rect x="596" y="156" width="344" height="56" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="596" y="168" width="4" height="32" rx="2" fill="#3b82f6"/><text x="771.0" y="183.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">group_by(k).map_groups(fn)</text><text x="771.0" y="201.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">every row of one group per call</text><path d="M 245 216 L 245 250" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="257" y="238" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">no</text><circle cx="52" cy="282.0" r="14" fill="#2563eb"/><text x="52" y="286.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffffff">3</text><g filter="url(#sh)"><rect x="75.0" y="254" width="340" height="56" rx="10" class="surface" stroke-width="1.2"/></g><text x="245.0" y="282.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Must it see one row at a time?</text><text x="245.0" y="301.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">a Python dict per row</text><path d="M 419.0 282.0 L 590 282.0" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="505.5" y="272.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">yes</text><g filter="url(#sh)"><rect x="596" y="254" width="344" height="56" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="596" y="266" width="4" height="32" rx="2" fill="#3b82f6"/><text x="771.0" y="281.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">map, flat_map, ml.filter</text><text x="771.0" y="299.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">a Python object per row</text><path d="M 245 314 L 245 348" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="257" y="336" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">no</text><circle cx="52" cy="380.0" r="14" fill="#2563eb"/><text x="52" y="384.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffffff">4</text><g filter="url(#sh)"><rect x="75.0" y="352" width="340" height="56" rx="10" class="surface" stroke-width="1.2"/></g><text x="245.0" y="380.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Is there costly setup?</text><text x="245.0" y="399.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">a model, a client, a connection</text><path d="M 419.0 380.0 L 590 380.0" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="505.5" y="370.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">yes</text><g filter="url(#sh)"><rect x="596" y="352" width="344" height="56" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="596" y="364" width="4" height="32" rx="2" fill="#3b82f6"/><text x="771.0" y="379.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">map_batches(MyClass)</text><text x="771.0" y="397.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">built once per worker</text><path d="M 245 412 L 245 446" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="257" y="434" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">no</text><g filter="url(#sh)"><rect x="75.0" y="450" width="340" height="50" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="75.0" y="462" width="4" height="26" rx="2" fill="#3b82f6"/><text x="248.0" y="474.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">map_batches(fn)</text><text x="248.0" y="492.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">a plain function, per batch</text><text x="596" y="438" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Pass the class, not an instance, when construction</text><text x="596" y="456" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">must happen on the worker, such as a CUDA context.</text><rect x="20" y="544" width="940" height="118" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="568" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">WHAT A BATCH FUNCTION RECEIVES: batch_format</text><rect x="102.85" y="583" width="74.30000000000001" height="20" rx="10" class="pill-amber"/><text x="140.0" y="597" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.4" class="pt-amber">"pyarrow"</text><text x="140" y="624" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">RecordBatch, the default</text><rect x="342.55" y="583" width="60.9" height="20" rx="10" class="pill-blue"/><text x="373.0" y="597" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.4" class="pt-blue">"numpy"</text><text x="373" y="624" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">a dict of ndarrays</text><rect x="572.2" y="583" width="67.6" height="20" rx="10" class="pill-blue"/><text x="606.0" y="597" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.4" class="pt-blue">"pandas"</text><text x="606" y="624" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">a DataFrame</text><rect x="808.55" y="583" width="60.9" height="20" rx="10" class="pill-blue"/><text x="839.0" y="597" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.4" class="pt-blue">"torch"</text><text x="839" y="624" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">a dict of tensors</text><text x="490" y="648" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Converted around the call only. The engine boundary stays Arrow.</text></svg>