</defs><rect x="16" y="20" width="968" height="262" rx="16" class="band-blue" stroke-width="1.5"/><text x="34" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">ONE LAZY PLAN  ·  NOTHING RUNS UNTIL A WRITE OR COLLECT</text><g filter="url(#sh)"><rect x="32" y="92" width="128" height="96" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="32" y="104" width="4" height="72" rx="2" fill="#3b82f6"/><text x="99.0" y="139.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Read</text><text x="99.0" y="157.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">Parquet, images</text><g filter="url(#sh)"><rect x="221" y="92" width="128" height="96" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="221" y="104" width="4" height="72" rx="2" fill="#3b82f6"/><text x="288.0" y="139.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Decode</text><text x="288.0" y="157.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">.image, in Rust</text><g filter="url(#sh)"><rect x="410" y="92" width="128" height="96" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="410" y="104" width="4" height="72" rx="2" fill="#3b82f6"/><text x="477.0" y="139.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Filter, join</text><text x="477.0" y="157.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">attach labels</text><g filter="url(#glow)"><rect x="599" y="84" width="184" height="112" rx="16" fill="url(#hero)"/></g><text x="691.0" y="138.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="800" fill="#ffffff">Infer</text><text x="691.0" y="160.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#ffffff" fill-opacity="0.88">ds.ml.infer(Model)</text><g filter="url(#sh)"><rect x="844" y="92" width="128" height="96" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="844" y="104" width="4" height="72" rx="2" fill="#3b82f6"/><text x="911.0" y="139.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Write</text><text x="911.0" y="157.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">or aggregate</text><path d="M 166 140.0 L 215 140.0" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="190.5" y="128.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">bytes</text><path d="M 355 140.0 L 404 140.0" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="379.5" y="128.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">tensors</text><path d="M 544 140.0 L 593 140.0" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="568.5" y="128.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">rows</text><path d="M 789 140.0 L 838 140.0" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="813.5" y="128.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">+ score</text><path d="M 221 216 L 221 224 L 538 224 L 538 216" fill="none" stroke="#94a3b8" stroke-width="1.6"/><rect x="342.35" y="235" width="74.30000000000001" height="20" rx="10" class="pill-grey"/><text x="379.5" y="249" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.4" class="pt-grey">CPU CORES</text><path d="M 599 216 L 599 224 L 783 224 L 783 216" fill="none" stroke="#d97706" stroke-width="1.6"/><rect x="637.1" y="235" width="107.8" height="20" rx="10" class="pill-amber"/><text x="691.0" y="249" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.4" class="pt-amber">GPU ACTOR POOL</text><rect x="16" y="300" width="968" height="132" rx="16" class="band-grey" stroke-width="1.5"/><text x="34" y="324" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">WHAT ONE PLAN BUYS</text><rect x="142.85" y="337" width="74.30000000000001" height="20" rx="10" class="pill-blue"/><text x="180.0" y="351" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.4" class="pt-blue">LOAD ONCE</text><text x="180" y="384" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">The model loads once per</text><text x="180" y="403" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">worker, in __init__.</text><rect x="469.55" y="337" width="60.9" height="20" rx="10" class="pill-blue"/><text x="500.0" y="351" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.4" class="pt-blue">OVERLAP</text><text x="500" y="384" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">The model scores partition k</text><text x="500" y="403" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">while CPU stages prepare k+1.</text><rect x="792.9" y="337" width="54.2" height="20" rx="10" class="pill-blue"/><text x="820.0" y="351" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.4" class="pt-blue">STREAM</text><text x="820" y="384" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Batches stream, so more data than</text><text x="820" y="403" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">fits in memory is the ordinary case.</text></svg>