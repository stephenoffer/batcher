</defs><rect x="20" y="20" width="560" height="400" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">ROW VERBS AND COLUMN VERBS</text><text x="298" y="76" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="1.8" fill="#2563eb">ROWS</text><text x="298" y="96" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">which survive</text><text x="402" y="76" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="1.8" fill="#2563eb">ORDER</text><text x="402" y="96" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">set by the verb</text><text x="506" y="76" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="1.8" fill="#2563eb">COLUMNS</text><text x="506" y="96" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">what they hold</text><path d="M 44 118 H 556" stroke="#cbd5e1" stroke-width="1.2"/><text x="64" y="147" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13" font-weight="700" class="t-code">.filter(pred)</text><circle cx="298" cy="142" r="10" fill="#2563eb"/><path d="M 293.5 142 L 297 145.8 L 303 138.2" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="402" cy="142" r="10" fill="none" stroke="#94a3b8" stroke-width="1.8"/><path d="M 398.2 138.2 L 405.8 145.8 M 405.8 138.2 L 398.2 145.8" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/><circle cx="506" cy="142" r="10" fill="none" stroke="#94a3b8" stroke-width="1.8"/><path d="M 502.2 138.2 L 509.8 145.8 M 509.8 138.2 L 502.2 145.8" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/><text x="64" y="187" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13" font-weight="700" class="t-code">.distinct()</text><circle cx="298" cy="182" r="10" fill="#2563eb"/><path d="M 293.5 182 L 297 185.8 L 303 178.2" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="402" cy="182" r="10" fill="none" stroke="#94a3b8" stroke-width="1.8"/><path d="M 398.2 178.2 L 405.8 185.8 M 405.8 178.2 L 398.2 185.8" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/><circle cx="506" cy="182" r="10" fill="none" stroke="#94a3b8" stroke-width="1.8"/><path d="M 502.2 178.2 L 509.8 185.8 M 509.8 178.2 L 502.2 185.8" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/><text x="64" y="227" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13" font-weight="700" class="t-code">.sample(...)</text><circle cx="298" cy="222" r="10" fill="#2563eb"/><path d="M 293.5 222 L 297 225.8 L 303 218.2" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="402" cy="222" r="10" fill="none" stroke="#94a3b8" stroke-width="1.8"/><path d="M 398.2 218.2 L 405.8 225.8 M 405.8 218.2 L 398.2 225.8" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/><circle cx="506" cy="222" r="10" fill="none" stroke="#94a3b8" stroke-width="1.8"/><path d="M 502.2 218.2 L 509.8 225.8 M 509.8 218.2 L 502.2 225.8" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/><text x="64" y="267" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13" font-weight="700" class="t-code">.sort(key)</text><circle cx="298" cy="262" r="10" fill="none" stroke="#94a3b8" stroke-width="1.8"/><path d="M 294.2 258.2 L 301.8 265.8 M 301.8 258.2 L 294.2 265.8" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/><circle cx="402" cy="262" r="10" fill="#2563eb"/><path d="M 397.5 262 L 401 265.8 L 407 258.2" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="506" cy="262" r="10" fill="none" stroke="#94a3b8" stroke-width="1.8"/><path d="M 502.2 258.2 L 509.8 265.8 M 509.8 258.2 L 502.2 265.8" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/><text x="64" y="307" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13" font-weight="700" class="t-code">.select(...)</text><circle cx="298" cy="302" r="10" fill="none" stroke="#94a3b8" stroke-width="1.8"/><path d="M 294.2 298.2 L 301.8 305.8 M 301.8 298.2 L 294.2 305.8" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/><circle cx="402" cy="302" r="10" fill="none" stroke="#94a3b8" stroke-width="1.8"/><path d="M 398.2 298.2 L 405.8 305.8 M 405.8 298.2 L 398.2 305.8" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/><circle cx="506" cy="302" r="10" fill="#2563eb"/><path d="M 501.5 302 L 505 305.8 L 511 298.2" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="347" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13" font-weight="700" class="t-code">.with_columns(...)</text><circle cx="298" cy="342" r="10" fill="none" stroke="#94a3b8" stroke-width="1.8"/><path d="M 294.2 338.2 L 301.8 345.8 M 301.8 338.2 L 294.2 345.8" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/><circle cx="402" cy="342" r="10" fill="none" stroke="#94a3b8" stroke-width="1.8"/><path d="M 398.2 338.2 L 405.8 345.8 M 405.8 338.2 L 398.2 345.8" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/><circle cx="506" cy="342" r="10" fill="#2563eb"/><path d="M 501.5 342 L 505 345.8 L 511 338.2" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 44 282.0 H 556" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4"/><text x="300" y="400" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Every call returns a new lazy Dataset. Nothing runs until a result is asked for.</text><rect x="620" y="20" width="340" height="400" rx="16" class="band-amber" stroke-width="1.5"/><text x="638" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#f59e0b">THE COLUMN LANGUAGE</text><text x="644" y="68" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">An Expr says what a column contains:</text><rect x="644" y="84" width="296" height="77" rx="9" class="code-bg" stroke-width="1"/><text x="658" y="110.0" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="12" class="t-code" xml:space="preserve">bt.col(&quot;age&quot;) &gt;= 18</text><text x="658" y="129.0" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="12" class="t-code" xml:space="preserve">bt.col(&quot;name&quot;).str.to_case(&quot;title&quot;)</text><text x="658" y="148.0" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="12" class="t-code" xml:space="preserve">(bt.col(&quot;age&quot;) / 10).floor()</text><text x="644" y="194" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">It lowers to a Rust expression tree that</text><text x="644" y="214" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">runs over whole Arrow batches, so column</text><text x="644" y="234" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">work never becomes one Python call per row.</text><path d="M 630 322 L 572 322" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="644" y="316" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">evaluated by .filter,</text><text x="644" y="336" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">.select and .with_columns</text><text x="644" y="376" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">A batch UDF is the escape hatch: your</text><text x="644" y="396" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Python over whole Arrow batches.</text></svg>