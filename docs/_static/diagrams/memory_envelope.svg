<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 716" role="img" width="980" height="716"><defs><style>
  .surface { fill: #ffffff; stroke: #cbd5e1; }
  .band-blue { fill: #eff6ff; stroke: #3b82f6; }
  .band-amber { fill: #fffbeb; stroke: #f59e0b; }
  .band-grey { fill: #f8fafc; stroke: #cbd5e1; }
  .t-title { fill: #1e293b; }
  .t-sub { fill: #5b6675; }
  .t-arrow { fill: #475569; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1e293b; stroke: #334155; }
    .band-blue { fill: #172554; stroke: #3b82f6; }
    .band-amber { fill: #2c1f06; stroke: #f59e0b; }
    .band-grey { fill: #131c31; stroke: #334155; }
    .t-title { fill: #e2e8f0; }
    .t-sub { fill: #94a3b8; }
    .t-arrow { fill: #cbd5e1; }
  }
</style>
<filter id="sh" x="-20%" y="-30%" width="140%" height="180%">
  <feDropShadow dx="0" dy="2.5" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.18"/>
</filter>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><rect x="30" y="26" width="920" height="206" rx="16" class="band-grey" stroke-width="1.5"/><text x="48" y="50" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">WHAT A JOIN HOLDS WHILE ITS PROBE SIDE RUNS</text><g filter="url(#sh)"><rect x="70" y="68" width="230" height="72" rx="10" class="surface" stroke-width="1.2"/></g><text x="185.0" y="104.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">build subtree</text><text x="185.0" y="123.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">peaks, then collapses</text><path d="M 300 104 L 370 104" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="335" y="92" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">materialize</text><g filter="url(#sh)"><rect x="370" y="68" width="230" height="72" rx="10" class="surface" stroke-width="1.2"/></g><text x="485.0" y="104.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">the build table</text><text x="485.0" y="123.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">resident from here on</text><path d="M 600 104 L 670 104" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="635" y="92" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">held while</text><g filter="url(#sh)"><rect x="670" y="68" width="230" height="72" rx="10" class="surface" stroke-width="1.2"/></g><text x="785.0" y="104.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">probe subtree</text><text x="785.0" y="123.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">adds its own peak</text><text x="490" y="178" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">peak(join) = max( peak(build),  resident(join) + peak(probe) )</text><text x="490" y="202" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">On one worked bushy plan the largest single operator reads 18.2 MB where the concurrent figure is 27.4 - a 1.5x under-count.</text><rect x="30" y="248" width="920" height="212" rx="16" class="band-blue" stroke-width="1.5"/><text x="48" y="272" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">THE ENVELOPE THIS QUERY MAY PLAN AGAINST</text><text x="62" y="286" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">available: the process envelope, or total RAM when none is set</text><rect x="62" y="292" width="838" height="16" rx="4" fill="#3b82f6"/><text x="62" y="324" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">x memory.soft_limit</text><rect x="62" y="330" width="708" height="16" rx="4" fill="#3b82f6"/><text x="62" y="362" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">- what concurrent work already holds</text><rect x="62" y="368" width="578" height="16" rx="4" fill="#3b82f6"/><text x="62" y="400" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">/ concurrent queries: 1 / min(active, slots), exactly 1 when unbounded</text><rect x="62" y="406" width="368" height="16" rx="4" fill="#f59e0b"/><text x="62" y="448" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Floored at one morsel, so a streaming plan is never refused for a budget smaller than a single batch.</text><rect x="30" y="478" width="920" height="206" rx="16" class="band-grey" stroke-width="1.5"/><text x="48" y="502" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">OVER BUDGET IS A COUNTER-OFFER, NOT A FAILURE</text><text x="490" y="514" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">is the plan's peak inside that envelope?</text><path d="M 430 522 L 280 548" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="330" y="528" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">yes</text><path d="M 550 522 L 700 548" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="636" y="528" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">no</text><g filter="url(#sh)"><rect x="70" y="552" width="380" height="76" rx="10" class="surface" stroke-width="1.2"/></g><text x="260.0" y="590.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Runs in memory</text><text x="260.0" y="609.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">admitted with no bound imposed</text><g filter="url(#sh)"><rect x="530" y="552" width="380" height="76" rx="10" class="surface" stroke-width="1.2"/></g><text x="720.0" y="590.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">m_max_bytes = the envelope</text><text x="720.0" y="609.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">the operator goes out of core</text><text x="720" y="652" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">The verdict names the binding join, aggregate or sort.</text><text x="720" y="670" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Sized from a guess it is advisory: it routes, it never fails.</text></svg>