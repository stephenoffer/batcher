</defs><text x="490" y="62" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Eight events on one event-time axis. Each window shows how many of them it caught.</text><path d="M 215 106 V 150 M 215 190 V 404" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="3 5"/><path d="M 265 106 V 150 M 265 190 V 404" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="3 5"/><path d="M 290 106 V 150 M 290 190 V 404" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="3 5"/><path d="M 415 106 V 150 M 415 190 V 404" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="3 5"/><path d="M 465 106 V 150 M 465 190 V 404" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="3 5"/><path d="M 740 106 V 150 M 740 190 V 404" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="3 5"/><path d="M 790 106 V 150 M 790 190 V 404" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="3 5"/><path d="M 865 106 V 150 M 865 190 V 404" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="3 5"/><circle cx="215" cy="100" r="5.5" fill="#d97706"/><circle cx="265" cy="100" r="5.5" fill="#d97706"/><circle cx="290" cy="100" r="5.5" fill="#d97706"/><circle cx="415" cy="100" r="5.5" fill="#d97706"/><circle cx="465" cy="100" r="5.5" fill="#d97706"/><circle cx="740" cy="100" r="5.5" fill="#d97706"/><circle cx="790" cy="100" r="5.5" fill="#d97706"/><circle cx="865" cy="100" r="5.5" fill="#d97706"/><path d="M 190 124 H 952" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arG)"/><path d="M 190 120 V 130" stroke="#94a3b8" stroke-width="1.4"/><text x="190" y="144" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" class="t-sub">0</text><path d="M 315 120 V 130" stroke="#94a3b8" stroke-width="1.4"/><text x="315" y="144" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" class="t-sub">5</text><path d="M 440 120 V 130" stroke="#94a3b8" stroke-width="1.4"/><text x="440" y="144" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" class="t-sub">10</text><path d="M 565 120 V 130" stroke="#94a3b8" stroke-width="1.4"/><text x="565" y="144" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" class="t-sub">15</text><path d="M 690 120 V 130" stroke="#94a3b8" stroke-width="1.4"/><text x="690" y="144" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" class="t-sub">20</text><path d="M 815 120 V 130" stroke="#94a3b8" stroke-width="1.4"/><text x="815" y="144" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" class="t-sub">25</text><path d="M 940 120 V 130" stroke="#94a3b8" stroke-width="1.4"/><text x="940" y="144" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" class="t-sub">30</text><text x="948" y="112" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">event time (minutes)</text><rect x="20" y="150" width="940" height="268" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="174" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">THE SAME EIGHT EVENTS, BUCKETED THREE WAYS</text><text x="30" y="210" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">TUMBLING</text><text x="30" y="228" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">window(ts, '10m')</text><rect x="192" y="196" width="246" height="36" rx="6" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.8"/><text x="315.0" y="219.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" class="t-title">n = 4</text><rect x="442" y="196" width="246" height="36" rx="6" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.8"/><text x="565.0" y="219.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" class="t-title">n = 1</text><rect x="692" y="196" width="246" height="36" rx="6" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.8"/><text x="815.0" y="219.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" class="t-title">n = 3</text><text x="30" y="276" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">SLIDING</text><text x="30" y="294" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">window(ts,'10m','5m')</text><text x="30" y="312" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">then unnest</text><rect x="192" y="262" width="246" height="30" rx="6" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.8"/><text x="315.0" y="282.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" class="t-title">n = 4</text><rect x="442" y="262" width="246" height="30" rx="6" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.8"/><text x="565.0" y="282.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" class="t-title">n = 1</text><rect x="692" y="262" width="246" height="30" rx="6" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.8"/><text x="815.0" y="282.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" class="t-title">n = 3</text><rect x="317" y="298" width="246" height="30" rx="6" fill="#f59e0b" fill-opacity="0.16" stroke="#f59e0b" stroke-width="1.8"/><text x="440.0" y="318.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" class="t-title">n = 2</text><rect x="567" y="298" width="246" height="30" rx="6" fill="#f59e0b" fill-opacity="0.16" stroke="#f59e0b" stroke-width="1.8"/><text x="690.0" y="318.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" class="t-title">n = 2</text><text x="30" y="382" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">SESSION</text><text x="30" y="400" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">session_window(gap='5m')</text><rect x="217" y="364" width="246" height="36" rx="6" fill="#f59e0b" fill-opacity="0.16" stroke="#f59e0b" stroke-width="1.8"/><text x="340.0" y="387.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" class="t-title">n = 5</text><rect x="742" y="364" width="121" height="36" rx="6" fill="#f59e0b" fill-opacity="0.16" stroke="#f59e0b" stroke-width="1.8"/><text x="802.5" y="387.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" class="t-title">n = 3</text><rect x="20" y="438" width="940" height="76" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="462" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">READING IT</text><text x="490" y="482" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">A sliding window whose hop equals its width is a tumbling window. The second lane holds the offset windows in between, which is why one event is counted twice.</text><text x="490" y="500" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">A session has no grid: it ends when nothing has arrived for the gap, so the data decides both bounds. The gap here is five minutes, and a gap of exactly five does not split one.</text></svg>