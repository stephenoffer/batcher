<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 524" role="img" width="980" height="524"><defs><style>
  .surface { fill: #ffffff; stroke: #cbd5e1; }
  .band-blue { fill: #eff6ff; stroke: #3b82f6; }
  .band-amber { fill: #fffbeb; stroke: #f59e0b; }
  .band-grey { fill: #f8fafc; stroke: #cbd5e1; }
  .t-title { fill: #1e293b; }
  .t-sub { fill: #5b6675; }
  .t-arrow { fill: #475569; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1e293b; stroke: #334155; }
    .band-blue { fill: #172554; stroke: #3b82f6; }
    .band-amber { fill: #2c1f06; stroke: #f59e0b; }
    .band-grey { fill: #131c31; stroke: #334155; }
    .t-title { fill: #e2e8f0; }
    .t-sub { fill: #94a3b8; }
    .t-arrow { fill: #cbd5e1; }
  }
</style>
<filter id="sh" x="-20%" y="-30%" width="140%" height="180%">
  <feDropShadow dx="0" dy="2.5" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.18"/>
</filter>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><rect x="24" y="30" width="300" height="420" rx="16" class="band-blue" stroke-width="1.5"/><text x="42" y="54" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">PRODUCER</text><rect x="656" y="30" width="300" height="420" rx="16" class="band-grey" stroke-width="1.5"/><text x="674" y="54" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">CONSUMER</text><g filter="url(#sh)"><rect x="681" y="80" width="250" height="66" rx="10" class="surface" stroke-width="1.2"/></g><text x="806.0" y="113.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">opens the exchange</text><text x="806.0" y="132.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">names the ticket, seeds the window</text><g filter="url(#sh)"><rect x="49" y="80" width="250" height="66" rx="10" class="surface" stroke-width="1.2"/></g><text x="174.0" y="113.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">credit semaphore</text><text x="174.0" y="132.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">seeded at 16 permits</text><path d="M 679 113 L 303 113" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="491" y="101" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">seed W = 16 credit slots</text><path d="M 174.0 146 L 174.0 176" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="186.0" y="168" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">per batch</text><g filter="url(#sh)"><rect x="49" y="180" width="250" height="66" rx="10" class="surface" stroke-width="1.2"/></g><text x="174.0" y="213.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">acquire one permit</text><text x="174.0" y="232.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">before the Flight encoder sees it</text><path d="M 303 213 L 679 213" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="491" y="201" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">one batch, one permit spent</text><g filter="url(#sh)"><rect x="681" y="180" width="250" height="66" rx="10" class="surface" stroke-width="1.2"/></g><text x="806.0" y="213.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">consume the batch</text><text x="806.0" y="232.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">pending += 1</text><path d="M 174.0 246 L 174.0 278" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="162.0" y="270" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">permits exhausted</text><g filter="url(#sh)"><rect x="49" y="282" width="250" height="66" rx="10" class="surface" stroke-width="1.2"/></g><text x="174.0" y="315.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">BLOCKED at zero</text><text x="174.0" y="334.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">the next batch is never encoded</text><rect x="49" y="293" width="5" height="44" rx="2.5" fill="#f59e0b"/><path d="M 806.0 246 L 806.0 278" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="818.0" y="270" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">slots freed</text><g filter="url(#sh)"><rect x="681" y="282" width="250" height="66" rx="10" class="surface" stroke-width="1.2"/></g><text x="806.0" y="315.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">pending reaches 8</text><text x="806.0" y="334.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">half the window has come back</text><path d="M 679 315 L 305 315" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="491" y="303" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">one grant for all 8, not one per batch</text><path d="M 310 280 L 310 222" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="306" y="266" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">resume</text><text x="174.0" y="376" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">The top-up is clamped to the seeded</text><text x="174.0" y="394" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">window, so an over-granting consumer</text><text x="174.0" y="412" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">cannot make the producer buffer the</text><text x="174.0" y="430" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">whole partition.</text><text x="806.0" y="376" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Batching the grants cuts control</text><text x="806.0" y="394" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">traffic without loosening the bound:</text><text x="806.0" y="412" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">a grant is deferred, never</text><text x="806.0" y="430" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">anticipated.</text><text x="490" y="482" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">One credit is one in-flight batch slot, so the window is the channel's memory bound -</text><text x="490" y="500" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">about 16 MiB at a 1 MiB morsel. Carbonite's AIMD controller sizes it per channel.</text></svg>