<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 730" role="img" width="980" height="730"><defs><style>
  .surface { fill: #ffffff; stroke: #cbd5e1; }
  .band-blue { fill: #eff6ff; stroke: #3b82f6; }
  .band-amber { fill: #fffbeb; stroke: #f59e0b; }
  .band-grey { fill: #f8fafc; stroke: #cbd5e1; }
  .t-title { fill: #1e293b; }
  .t-sub { fill: #5b6675; }
  .t-arrow { fill: #475569; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1e293b; stroke: #334155; }
    .band-blue { fill: #172554; stroke: #3b82f6; }
    .band-amber { fill: #2c1f06; stroke: #f59e0b; }
    .band-grey { fill: #131c31; stroke: #334155; }
    .t-title { fill: #e2e8f0; }
    .t-sub { fill: #94a3b8; }
    .t-arrow { fill: #cbd5e1; }
  }
</style>
<filter id="sh" x="-20%" y="-30%" width="140%" height="180%">
  <feDropShadow dx="0" dy="2.5" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.18"/>
</filter>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><rect x="20" y="20" width="940" height="96" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">ONE GLOBAL ORDER, INDEPENDENT OF THE CLUSTER SIZE</text><g filter="url(#sh)"><rect x="180" y="44" width="620" height="56" rx="10" class="surface" stroke-width="1.2"/></g><text x="490.0" y="72.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">ds.ml.stream_loader(batch_size, world_size, rank, epoch)</text><text x="490.0" y="91.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">a seeded permutation of every row, computed the same way on every rank</text><path d="M 400 104 L 220 178" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="292" y="132" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">rank 0's rows</text><path d="M 580 104 L 760 178" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="688" y="132" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">rank 1's rows</text><rect x="20" y="140" width="940" height="152" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="164" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">ONE SHARD PER RANK  -  A STRIDE, NOT A SPLIT</text><g filter="url(#sh)"><rect x="60" y="184" width="300" height="82" rx="10" class="surface" stroke-width="1.2"/></g><text x="210.0" y="225.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">rank 0</text><text x="210.0" y="244.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">rows 0, W, 2W, 3W, ...</text><g filter="url(#sh)"><rect x="620" y="184" width="300" height="82" rx="10" class="surface" stroke-width="1.2"/></g><text x="770.0" y="225.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">rank 1</text><text x="770.0" y="244.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">rows 1, W+1, 2W+1, ...</text><text x="490" y="214" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">trimmed or padded to a multiple</text><text x="490" y="232" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">of world_size, so every rank</text><text x="490" y="250" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">yields the same count.</text><rect x="20" y="322" width="940" height="270" rx="16" class="band-amber" stroke-width="1.5"/><text x="38" y="346" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#f59e0b">WHAT ONE RANK THEN DOES</text><text x="329" y="366" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">batched</text><text x="645" y="366" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">non_blocking</text><g filter="url(#sh)"><rect x="44" y="378" width="260" height="86" rx="10" class="surface" stroke-width="1.2"/></g><text x="174.0" y="421.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">shuffle block</text><text x="174.0" y="440.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">fill, then permute once</text><g filter="url(#sh)"><rect x="360" y="378" width="260" height="86" rx="10" class="surface" stroke-width="1.2"/></g><text x="490.0" y="421.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">tensors</text><text x="490.0" y="440.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">numeric columns only</text><g filter="url(#sh)"><rect x="676" y="378" width="260" height="86" rx="10" class="surface" stroke-width="1.2"/></g><text x="806.0" y="421.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">device</text><text x="806.0" y="440.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">its own copy stream</text><path d="M 304 421 L 354 421" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><path d="M 620 421 L 670 421" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="174" y="492" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Fills to shuffle_block_size rows</text><text x="174" y="510" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">or 256 MiB, then one permutation.</text><text x="174" y="534" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Not a reservoir: a row never</text><text x="174" y="552" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">crosses a block boundary.</text><text x="490" y="492" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Non-numeric columns are dropped,</text><text x="490" y="510" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">announced once. zero_copy views</text><text x="490" y="534" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">the buffer through dlpack;</text><text x="490" y="552" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">otherwise it copies.</text><text x="806" y="492" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">The pinned staging tensor is held</text><text x="806" y="510" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">for the next few batches, so an</text><text x="806" y="534" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">in-flight copy cannot read</text><text x="806" y="552" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">memory that was already freed.</text><rect x="20" y="622" width="940" height="88" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="646" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">RESUME</text><text x="490" y="664" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">global_consumed counts positions in the global order, not in a rank's shard, so a run resumes on a differently sized cluster.</text><text x="490" y="686" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">It must land on a multiple of world_size, a synchronized step boundary, or the ranks come back with unequal counts.</text></svg>