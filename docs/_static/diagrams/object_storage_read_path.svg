</defs><rect x="20" y="20" width="940" height="128" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">DRIVER: PLAN THE SCAN</text><g filter="url(#sh)"><rect x="44" y="58" width="300" height="64" rx="10" class="surface" stroke-width="1.2"/></g><text x="194.0" y="90.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">read footers and schema</text><text x="194.0" y="109.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">rows, bytes, column bounds</text><path d="M 350 90 L 420 90" fill="none" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arG)"/><text x="385" y="80" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" class="t-arrow">cache</text><g filter="url(#sh)"><rect x="426" y="58" width="300" height="64" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="426" y="70" width="4" height="40" rx="2" fill="#3b82f6"/><text x="579.0" y="89.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">cached per file identity</text><text x="579.0" y="107.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">path, size, modification time</text><text x="750" y="84" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">A second query over the</text><text x="750" y="102" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">same files reuses it.</text><rect x="20" y="176" width="940" height="294" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="200" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">ONE SCAN TASK ON A WORKER</text><path d="M 310 124 L 310 202" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="322" y="166" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">splits</text><g filter="url(#sh)"><rect x="44" y="208" width="300" height="64" rx="10" class="surface" stroke-width="1.2"/></g><text x="194.0" y="240.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">scan task</text><text x="194.0" y="259.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">its splits, many files</text><path d="M 350 240 L 420 240" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="385" y="230" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" class="t-arrow">lookup</text><g filter="url(#sh)"><rect x="426" y="208" width="250" height="64" rx="11" fill="url(#tintAmber)" stroke="#fcd34d" stroke-width="1.2"/></g><rect x="426" y="220" width="4" height="40" rx="2" fill="#f59e0b"/><text x="554.0" y="239.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">worker scan cache</text><text x="554.0" y="257.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">decoded batches, 0.3 of memory</text><path d="M 682 240 L 740 240" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="711" y="230" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" class="t-arrow">hit</text><g filter="url(#sh)"><rect x="746" y="208" width="190" height="64" rx="10" class="surface" stroke-width="1.2"/></g><text x="841.0" y="240.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">downstream</text><text x="841.0" y="259.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">operators</text><path d="M 551 278 L 551 336" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="563" y="314" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">miss</text><g filter="url(#sh)"><rect x="426" y="342" width="250" height="72" rx="10" class="surface" stroke-width="1.2"/></g><text x="551.0" y="378.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">up to 32 reads in flight</text><text x="551.0" y="397.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">BATCHER_SCAN_PREFETCH</text><path d="M 420 368 L 350 368" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="385" y="358" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" class="t-arrow">GET</text><path d="M 350 390 L 420 390" fill="none" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arG)"/><text x="385" y="408" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" class="t-arrow">bytes</text><g filter="url(#sh)"><rect x="44" y="342" width="300" height="72" rx="10" class="surface" stroke-width="1.2"/></g><text x="194.0" y="378.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">object storage</text><text x="194.0" y="397.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">S3, GCS, Azure</text><path d="M 682 378 L 740 378" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="711" y="368" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" class="t-arrow">decode</text><g filter="url(#sh)"><rect x="746" y="342" width="190" height="72" rx="10" class="surface" stroke-width="1.2"/></g><text x="841.0" y="378.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">yield in file order</text><text x="841.0" y="397.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">reads overlap unseen</text><path d="M 841 336 L 841 278" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="853" y="314" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">batches</text><path d="M 772 338 Q 740 292 676 278" fill="none" stroke="#d97706" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#arA)"/><text x="716" y="318" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">kept</text><text x="490" y="448" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Latency, not bandwidth, caps the scan. The window keeps a task to a few files in memory.</text></svg>