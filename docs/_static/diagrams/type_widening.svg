</defs><rect x="20" y="44" width="250" height="320" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="68" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">IN THE SOURCE</text><rect x="410" y="44" width="230" height="320" rx="16" class="band-blue" stroke-width="1.5"/><text x="428" y="68" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">IN THE ENGINE</text><rect x="700" y="44" width="260" height="320" rx="16" class="band-amber" stroke-width="1.5"/><text x="718" y="68" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#f59e0b">WHAT COMES BACK</text><path d="M 340 34 L 340 374" stroke="#d97706" stroke-width="2" stroke-dasharray="5 5" fill="none"/><text x="340" y="26" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="1.8" fill="#d97706">FFI EDGE</text><text x="44" y="128" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">Int8, Int16, Int32</text><path d="M 210 124 L 432 124" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="386" y="115" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" class="t-arrow">widen</text><text x="444" y="128" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">Int64</text><text x="44" y="184" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">UInt8 to UInt64</text><path d="M 210 180 L 432 180" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="386" y="171" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" class="t-arrow">widen</text><text x="444" y="184" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">Int64</text><text x="44" y="240" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">Float16, Float32</text><path d="M 210 236 L 432 236" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="386" y="227" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" class="t-arrow">widen</text><text x="444" y="240" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">Float64</text><text x="44" y="296" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">dictionary-encoded</text><path d="M 210 292 L 432 292" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="386" y="283" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" class="t-arrow">decode</text><text x="444" y="296" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">its value type</text><text x="525" y="338" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Dataset.schema already reports</text><text x="525" y="354" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">these before anything runs</text><g filter="url(#sh)"><rect x="716" y="96" width="228" height="96" rx="10" class="surface" stroke-width="1.2"/></g><text x="830.0" y="149.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title"></text><text x="830" y="128" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" class="t-arrow">By default</text><text x="830" y="152" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">the widened type, exactly</text><text x="830" y="170" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">what schema promised</text><g filter="url(#sh)"><rect x="716" y="240" width="228" height="96" rx="10" class="surface" stroke-width="1.2"/></g><text x="830.0" y="293.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title"></text><text x="830" y="272" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" class="t-arrow">shrink_output_dtypes=True</text><text x="830" y="296" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">a pass-through column narrows</text><text x="830" y="314" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">back to its source width</text><path d="M 646 194 L 710 148" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="664" y="152" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" class="t-arrow">default</text><path d="M 646 214 L 710 284" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="662" y="270" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" class="t-arrow">opt in</text><text x="490" y="406" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">A UInt64 value above the Int64 maximum raises at the edge rather than wrapping.</text><text x="490" y="428" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Only a lossless pass-through narrows. A derived column stays wide, so cast it explicitly.</text><text x="490" y="450" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">A cast inside a query does produce the narrow type. A bare scan skips the re-narrowing.</text></svg>