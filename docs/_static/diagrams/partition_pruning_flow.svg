</defs><rect x="20" y="20" width="940" height="430" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">PLAN TIME, BEFORE ANY TASK EXISTS</text><g filter="url(#sh)"><rect x="84" y="66" width="220" height="58" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="84" y="78" width="4" height="34" rx="2" fill="#3b82f6"/><text x="197.0" y="94.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">filter(day == ...)</text><text x="197.0" y="112.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">written by you</text><g filter="url(#sh)"><rect x="436" y="66" width="240" height="58" rx="11" fill="url(#tintAmber)" stroke="#fcd34d" stroke-width="1.2"/></g><rect x="436" y="78" width="4" height="34" rx="2" fill="#f59e0b"/><text x="559.0" y="94.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">join on day</text><text x="559.0" y="112.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">small side's key range</text><path d="M 194 126 L 346.0 198" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><path d="M 556 126 L 394.0 198" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="250" y="176" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">predicate</text><text x="482" y="176" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">dynamic pruning</text><text x="706" y="92" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Either becomes a filter on the</text><text x="706" y="110" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">directory list, not on rows.</text><g filter="url(#sh)"><rect x="44" y="206" width="180" height="84" rx="10" class="surface" stroke-width="1.2"/></g><text x="134.0" y="238" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">list top level</text><text x="134.0" y="259" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">driver: day= dirs only</text><text x="134.0" y="275" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">one cheap listing</text><circle cx="48" cy="210" r="14" fill="#2563eb"/><text x="48" y="214.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffffff">1</text><g filter="url(#sh)"><rect x="280" y="206" width="180" height="84" rx="10" class="surface" stroke-width="1.2"/></g><text x="370.0" y="238" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">prune the list</text><text x="370.0" y="259" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">exact: the name records</text><text x="370.0" y="275" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">the partition value</text><circle cx="284" cy="210" r="14" fill="#d97706"/><text x="284" y="214.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffffff">2</text><g filter="url(#sh)"><rect x="516" y="206" width="180" height="84" rx="10" class="surface" stroke-width="1.2"/></g><text x="606.0" y="238" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">list subtrees</text><text x="606.0" y="259" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">one worker per survivor</text><text x="606.0" y="275" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">O(subtree) each</text><circle cx="520" cy="210" r="14" fill="#2563eb"/><text x="520" y="214.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffffff">3</text><g filter="url(#sh)"><rect x="752" y="206" width="180" height="84" rx="10" class="surface" stroke-width="1.2"/></g><text x="842.0" y="238" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">build splits</text><text x="842.0" y="259" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">tasks come from</text><text x="842.0" y="275" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">survivors only</text><circle cx="756" cy="210" r="14" fill="#2563eb"/><text x="756" y="214.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffffff">4</text><path d="M 228 248.0 L 272 248.0" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="248.0" y="236.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" class="t-arrow">dirs</text><path d="M 464 248.0 L 508 248.0" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="484.0" y="236.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" class="t-arrow">survivors</text><path d="M 700 248.0 L 744 248.0" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="720.0" y="236.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" class="t-arrow">files</text><path d="M 370.0 294 L 370.0 348" fill="none" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arG)"/><text x="382.0" y="326" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">ruled out</text><g filter="url(#sh)"><rect x="210" y="354" width="320" height="64" rx="10" class="surface" stroke-width="1.2"/></g><text x="370.0" y="386.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">never listed, opened, or tasked</text><text x="370.0" y="405.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">a pruned day= directory</text><text x="730" y="372" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">A directory per day for ten years:</text><text x="730" y="390" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">3,650 tasks become one, same rows.</text><text x="730" y="414" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Where the layout can't decide, every</text><text x="730" y="432" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">directory survives; rows are filtered.</text></svg>