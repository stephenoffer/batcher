<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 610" role="img" width="980" height="610"><defs><style>
  .surface { fill: #ffffff; stroke: #cbd5e1; }
  .band-blue { fill: #eff6ff; stroke: #3b82f6; }
  .band-amber { fill: #fffbeb; stroke: #f59e0b; }
  .band-grey { fill: #f8fafc; stroke: #cbd5e1; }
  .t-title { fill: #1e293b; }
  .t-sub { fill: #5b6675; }
  .t-arrow { fill: #475569; }
  .t-code { fill: #1e40af; }
  .code-bg { fill: #f1f5f9; stroke: #e2e8f0; }
  .pill-blue { fill: #dbeafe; } .pill-amber { fill: #fef3c7; } .pill-grey { fill: #e2e8f0; }
  .pt-blue { fill: #1d4ed8; } .pt-amber { fill: #b45309; } .pt-grey { fill: #334155; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1e293b; stroke: #334155; }
    .band-blue { fill: #172554; stroke: #3b82f6; }
    .band-amber { fill: #2c1f06; stroke: #f59e0b; }
    .band-grey { fill: #131c31; stroke: #334155; }
    .t-title { fill: #e2e8f0; }
    .t-sub { fill: #94a3b8; }
    .t-arrow { fill: #cbd5e1; }
    .t-code { fill: #93c5fd; }
    .code-bg { fill: #0f172a; stroke: #334155; }
    .pill-blue { fill: #1e3a8a; } .pill-amber { fill: #78350f; } .pill-grey { fill: #334155; }
    .pt-blue { fill: #bfdbfe; } .pt-amber { fill: #fde68a; } .pt-grey { fill: #e2e8f0; }
    #tintBlue stop[offset="0"] { stop-color: #16233d; }
    #tintBlue stop[offset="1"] { stop-color: #1e3a8a; }
    #tintAmber stop[offset="0"] { stop-color: #2a1e07; }
    #tintAmber stop[offset="1"] { stop-color: #78350f; }
  }
</style>
<filter id="sh" x="-20%" y="-30%" width="140%" height="180%">
  <feDropShadow dx="0" dy="2.5" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.18"/>
</filter>
<filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
  <feDropShadow dx="0" dy="4" stdDeviation="9" flood-color="#2563eb" flood-opacity="0.35"/>
</filter>
<linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="0.5" stop-color="#2563eb"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
<linearGradient id="heroAmber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#d97706"/></linearGradient>
<linearGradient id="tintBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5f9ff"/><stop offset="1" stop-color="#dbeafe"/></linearGradient>
<linearGradient id="tintAmber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf5"/><stop offset="1" stop-color="#fdecc8"/></linearGradient>
<linearGradient id="ribbonBlue" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#93c5fd"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
<linearGradient id="ribbonAmber" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><rect x="20" y="20" width="940" height="570" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">YOUR PLATFORM PROVIDES THESE; BATCHER DOES NOT</text><g filter="url(#sh)"><rect x="42" y="56" width="212" height="64" rx="11" fill="url(#tintAmber)" stroke="#fcd34d" stroke-width="1.2"/></g><rect x="42" y="68" width="4" height="40" rx="2" fill="#f59e0b"/><text x="151.0" y="87.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Authentication</text><text x="151.0" y="105.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">at your network edge</text><g filter="url(#sh)"><rect x="270" y="56" width="212" height="64" rx="11" fill="url(#tintAmber)" stroke="#fcd34d" stroke-width="1.2"/></g><rect x="270" y="68" width="4" height="40" rx="2" fill="#f59e0b"/><text x="379.0" y="87.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Tenant isolation</text><text x="379.0" y="105.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">one process per domain</text><g filter="url(#sh)"><rect x="498" y="56" width="212" height="64" rx="11" fill="url(#tintAmber)" stroke="#fcd34d" stroke-width="1.2"/></g><rect x="498" y="68" width="4" height="40" rx="2" fill="#f59e0b"/><text x="607.0" y="87.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Sandboxing</text><text x="607.0" y="105.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">containers for untrusted UDFs</text><g filter="url(#sh)"><rect x="726" y="56" width="212" height="64" rx="11" fill="url(#tintAmber)" stroke="#fcd34d" stroke-width="1.2"/></g><rect x="726" y="68" width="4" height="40" rx="2" fill="#f59e0b"/><text x="835.0" y="87.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Encryption at rest</text><text x="835.0" y="105.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">an encrypted volume</text><rect x="42" y="146" width="896" height="424" rx="16" fill="none" stroke="#d97706" stroke-width="2.2" stroke-dasharray="9 6"/><text x="62" y="174" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="1.8" fill="#d97706">THE PROCESS IS THE TRUST BOUNDARY</text><rect x="62" y="192" width="856" height="222" rx="16" class="band-blue" stroke-width="1.5"/><text x="80" y="216" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">BATCHER ENFORCES INSIDE IT</text><g filter="url(#sh)"><rect x="80" y="230" width="196" height="68" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="80" y="242" width="4" height="44" rx="2" fill="#3b82f6"/><text x="181.0" y="263.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Governance required</text><text x="181.0" y="281.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">governance.mode="strict"</text><g filter="url(#sh)"><rect x="288" y="230" width="196" height="68" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="288" y="242" width="4" height="44" rx="2" fill="#3b82f6"/><text x="389.0" y="263.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Durable audit trail</text><text x="389.0" y="281.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">governance.audit_path</text><g filter="url(#sh)"><rect x="496" y="230" width="196" height="68" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="496" y="242" width="4" height="44" rx="2" fill="#3b82f6"/><text x="597.0" y="263.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Verified identities</text><text x="597.0" y="281.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">require_verified_principal</text><g filter="url(#sh)"><rect x="704" y="230" width="196" height="68" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="704" y="242" width="4" height="44" rx="2" fill="#3b82f6"/><text x="805.0" y="263.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Key references only</text><text x="805.0" y="281.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">BATCHER_REQUIRE_KEY_REFS=1</text><g filter="url(#sh)"><rect x="80" y="318" width="196" height="68" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="80" y="330" width="4" height="44" rx="2" fill="#3b82f6"/><text x="181.0" y="351.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">UDF process ceilings</text><text x="181.0" y="369.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">udf_isolation="strict"</text><g filter="url(#sh)"><rect x="288" y="318" width="196" height="68" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="288" y="330" width="4" height="44" rx="2" fill="#3b82f6"/><text x="389.0" y="351.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Admission control</text><text x="389.0" y="369.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">max_concurrent_queries</text><g filter="url(#sh)"><rect x="496" y="318" width="196" height="68" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="496" y="330" width="4" height="44" rx="2" fill="#3b82f6"/><text x="597.0" y="351.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Owner-only artifacts</text><text x="597.0" y="369.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">0700 dirs, 0600 files, always</text><g filter="url(#sh)"><rect x="704" y="318" width="196" height="68" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="704" y="330" width="4" height="44" rx="2" fill="#3b82f6"/><text x="805.0" y="351.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Governed statistics</text><text x="805.0" y="369.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">no min/max on masked columns</text><text x="62" y="448" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="1.8" fill="#5b6675">AND CANNOT GUARANTEE, EVEN THERE</text><circle cx="82" cy="490" r="10" fill="none" stroke="#94a3b8" stroke-width="1.8"/><path d="M 78.2 486.2 L 85.8 493.8 M 85.8 486.2 L 78.2 493.8" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/><text x="104" y="486" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Code in the process can</text><text x="104" y="503" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">construct any Principal.</text><circle cx="372" cy="490" r="10" fill="none" stroke="#94a3b8" stroke-width="1.8"/><path d="M 368.2 486.2 L 375.8 493.8 M 375.8 486.2 L 368.2 493.8" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/><text x="394" y="486" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">A UDF on a thread reads</text><text x="394" y="503" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">the engine's environment.</text><circle cx="662" cy="490" r="10" fill="none" stroke="#94a3b8" stroke-width="1.8"/><path d="M 658.2 486.2 L 665.8 493.8 M 665.8 486.2 L 658.2 493.8" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/><text x="684" y="486" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Admission bounds one</text><text x="684" y="503" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">process, not the cluster.</text><text x="490" y="552" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Authenticate at the edge, pass the identity into bt.security(), and run untrusted UDFs in a container.</text></svg>