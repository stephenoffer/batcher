<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 490" role="img" width="980" height="490"><defs><style>
  .surface { fill: #ffffff; stroke: #cbd5e1; }
  .band-blue { fill: #eff6ff; stroke: #3b82f6; }
  .band-amber { fill: #fffbeb; stroke: #f59e0b; }
  .band-grey { fill: #f8fafc; stroke: #cbd5e1; }
  .t-title { fill: #1e293b; }
  .t-sub { fill: #5b6675; }
  .t-arrow { fill: #475569; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1e293b; stroke: #334155; }
    .band-blue { fill: #172554; stroke: #3b82f6; }
    .band-amber { fill: #2c1f06; stroke: #f59e0b; }
    .band-grey { fill: #131c31; stroke: #334155; }
    .t-title { fill: #e2e8f0; }
    .t-sub { fill: #94a3b8; }
    .t-arrow { fill: #cbd5e1; }
  }
</style>
<filter id="sh" x="-20%" y="-30%" width="140%" height="180%">
  <feDropShadow dx="0" dy="2.5" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.18"/>
</filter>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><rect x="20" y="20" width="940" height="200" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">COMPOSES  -  ds.agg(m=bt.accuracy('y', 'p'))</text><text x="314" y="74" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">partial</text><text x="645" y="74" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">combine: add</text><g filter="url(#sh)"><rect x="44" y="86" width="230" height="84" rx="10" class="surface" stroke-width="1.2"/></g><text x="159.0" y="128.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">scored rows</text><text x="159.0" y="147.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">one partition per worker</text><g filter="url(#sh)"><rect x="354" y="86" width="250" height="84" rx="10" class="surface" stroke-width="1.2"/></g><text x="479.0" y="128.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">count_if(...)</text><text x="479.0" y="147.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">matched, compared</text><g filter="url(#sh)"><rect x="694" y="86" width="242" height="84" rx="10" class="surface" stroke-width="1.2"/></g><text x="815.0" y="128.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">accuracy</text><text x="815.0" y="147.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">matched / compared</text><path d="M 274 128 L 348 128" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><path d="M 604 128 L 688 128" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="490" y="196" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">No row depends on another, so the partial counts merge in any order, on one core or a hundred.</text><rect x="20" y="250" width="940" height="200" rx="16" class="band-amber" stroke-width="1.5"/><text x="38" y="274" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#f59e0b">DOES NOT COMPOSE  -  roc_auc(ds, 'y', 's')</text><text x="314" y="304" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">sort by score</text><text x="645" y="304" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">then one agg pass</text><g filter="url(#sh)"><rect x="44" y="316" width="230" height="84" rx="10" class="surface" stroke-width="1.2"/></g><text x="159.0" y="358.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">scored rows</text><text x="159.0" y="377.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">one partition per worker</text><g filter="url(#sh)"><rect x="354" y="316" width="250" height="84" rx="10" class="surface" stroke-width="1.2"/></g><text x="479.0" y="358.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">rank, cume_dist</text><text x="479.0" y="377.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">a window over every score</text><g filter="url(#sh)"><rect x="694" y="316" width="242" height="84" rx="10" class="surface" stroke-width="1.2"/></g><text x="815.0" y="358.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">ROC AUC</text><text x="815.0" y="377.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">the rank identity</text><path d="M 274 358 L 348 358" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><path d="M 604 358 L 688 358" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="490" y="426" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">A rank depends on every other row, so this one adds a distributed sort. That is the whole difference.</text><text x="490" y="474" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Both take by= or group_by, so per-segment scoring is the same query with a grouping added.</text></svg>