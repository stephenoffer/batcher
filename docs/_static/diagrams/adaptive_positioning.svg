</style></defs><rect x="0" y="0" width="980" height="400" rx="14" class="surf"/><text x="40" y="46" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="700" class="t-head">What the adaptive loop actually buys</text><text x="40" y="70" font-family="Helvetica,Arial,sans-serif" font-size="13" class="t-sub">Not a finer re-planning grain than Spark AQE. The same grain, in two places AQE and DuckDB do not reach.</text><text x="316" y="120" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="colhead">Re-plans inside</text><text x="316" y="136" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="colhead">one query</text><text x="544" y="120" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="colhead">Runs on a</text><text x="544" y="136" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="colhead">single node</text><text x="772" y="120" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="colhead">Carries what it</text><text x="772" y="136" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="colhead">learned to the next run</text><text x="40" y="176" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" class="t-head">DuckDB</text><text x="40" y="195" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">static optimizer</text><rect x="300" y="150" width="208" height="62" rx="9" class="cell" stroke-width="1.4"/><text x="316" y="176" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" class="t-no">no</text><text x="316" y="196" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">optimizes once, up front</text><rect x="528" y="150" width="208" height="62" rx="9" class="cell-yes" stroke-width="1.4"/><text x="544" y="176" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" class="t-yes">yes</text><text x="544" y="196" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">single-node by design</text><rect x="756" y="150" width="208" height="62" rx="9" class="cell" stroke-width="1.4"/><text x="772" y="176" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" class="t-no">no</text><text x="772" y="196" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">no cross-run state</text><text x="40" y="252" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" class="t-head">Spark AQE</text><text x="40" y="271" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">cluster only</text><rect x="300" y="226" width="208" height="62" rx="9" class="cell-yes" stroke-width="1.4"/><text x="316" y="252" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" class="t-yes">yes</text><text x="316" y="272" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">at stage boundaries</text><rect x="528" y="226" width="208" height="62" rx="9" class="cell" stroke-width="1.4"/><text x="544" y="252" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" class="t-no">no</text><text x="544" y="272" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">needs shuffle stages</text><rect x="756" y="226" width="208" height="62" rx="9" class="cell" stroke-width="1.4"/><text x="772" y="252" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" class="t-no">no</text><text x="772" y="272" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">no cross-run state</text><text x="40" y="328" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" class="t-head">Batcher</text><text x="40" y="347" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">same grain, wider reach</text><rect x="300" y="302" width="208" height="62" rx="9" class="cell-bt" stroke-width="1.4"/><text x="316" y="328" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" class="t-yes">yes</text><text x="316" y="348" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">at stage boundaries</text><rect x="528" y="302" width="208" height="62" rx="9" class="cell-bt" stroke-width="1.4"/><text x="544" y="328" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" class="t-yes">yes</text><text x="544" y="348" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">same loop, one node</text><rect x="756" y="302" width="208" height="62" rx="9" class="cell-bt" stroke-width="1.4"/><text x="772" y="328" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" class="t-yes">yes</text><text x="772" y="348" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">sketches, costs, bandit</text><text x="40" y="358" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">The within-query loop is the same mechanism and granularity as Spark AQE, not something finer. It also engages only on a joined query whose scan input clears 5M rows or roughly 320 MB per pipeline breaker,</text><text x="40" y="376" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">so most small queries never use it. The third column is the half with no DuckDB or Spark equivalent. Source: docs/architecture/internals/competitive_architecture.md.</text></svg>