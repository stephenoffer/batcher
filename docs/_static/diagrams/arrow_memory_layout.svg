<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 642" role="img" width="960" height="642"><defs><style>
  .surface { fill: #ffffff; stroke: #cbd5e1; }
  .band-blue { fill: #eff6ff; stroke: #3b82f6; }
  .band-amber { fill: #fffbeb; stroke: #f59e0b; }
  .band-grey { fill: #f8fafc; stroke: #cbd5e1; }
  .t-title { fill: #1e293b; }
  .t-sub { fill: #5b6675; }
  .t-arrow { fill: #475569; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1e293b; stroke: #334155; }
    .band-blue { fill: #172554; stroke: #3b82f6; }
    .band-amber { fill: #2c1f06; stroke: #f59e0b; }
    .band-grey { fill: #131c31; stroke: #334155; }
    .t-title { fill: #e2e8f0; }
    .t-sub { fill: #94a3b8; }
    .t-arrow { fill: #cbd5e1; }
  }
</style>
<filter id="sh" x="-20%" y="-30%" width="140%" height="180%">
  <feDropShadow dx="0" dy="2.5" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.18"/>
</filter>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><rect x="24" y="20" width="912" height="300" rx="16" class="band-blue" stroke-width="1.5"/><text x="42" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">ONE RECORDBATCH: A SCHEMA, AND BUFFERS PER COLUMN</text><text x="56" y="62" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">id : Int64</text><g filter="url(#sh)"><rect x="56" y="76" width="414" height="54" rx="10" class="surface" stroke-width="1.2"/></g><text x="263.0" y="103.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">validity bitmap</text><text x="263.0" y="122.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">one bit per row, absent when nothing is null</text><g filter="url(#sh)"><rect x="56" y="140" width="414" height="54" rx="10" class="surface" stroke-width="1.2"/></g><text x="263.0" y="167.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">values</text><text x="263.0" y="186.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">eight bytes per row, back to back</text><text x="56" y="222" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">No offsets buffer: every value is the same width,</text><text x="56" y="240" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">so row i begins at byte i x 8.</text><text x="490" y="62" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">name : Utf8</text><g filter="url(#sh)"><rect x="490" y="76" width="414" height="54" rx="10" class="surface" stroke-width="1.2"/></g><text x="697.0" y="103.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">validity bitmap</text><text x="697.0" y="122.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">one bit per row</text><g filter="url(#sh)"><rect x="490" y="140" width="414" height="54" rx="10" class="surface" stroke-width="1.2"/></g><text x="697.0" y="167.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">offsets</text><text x="697.0" y="186.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">n + 1 int32s</text><g filter="url(#sh)"><rect x="490" y="204" width="414" height="54" rx="10" class="surface" stroke-width="1.2"/></g><text x="697.0" y="231.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">values</text><text x="697.0" y="250.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">every row's bytes end to end, unpadded</text><text x="490" y="286" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Row i is values[ offsets[i] .. offsets[i+1] ]:</text><text x="490" y="304" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">a per-row length nobody has to store.</text><rect x="24" y="336" width="912" height="180" rx="16" class="band-grey" stroke-width="1.5"/><text x="42" y="360" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">WHAT A ZERO-COPY SLICE DOES</text><g filter="url(#sh)"><rect x="56" y="376" width="340" height="72" rx="10" class="surface" stroke-width="1.2"/></g><text x="226.0" y="412.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">the parent batch</text><text x="226.0" y="431.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">one allocation per buffer</text><path d="M 396 412 L 520 412" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="458" y="400" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">batch.slice(off, len)</text><g filter="url(#sh)"><rect x="520" y="376" width="384" height="72" rx="10" class="surface" stroke-width="1.2"/></g><text x="712.0" y="412.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">a second RecordBatch</text><text x="712.0" y="431.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">an offset and a length, nothing else</text><text x="56" y="476" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Copied: nothing. But get_array_memory_size still reports the parent's whole allocation, which is why</text><text x="56" y="494" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">every size decision in the engine measures a morsel with bc_arrow::slice_bytes instead.</text><rect x="24" y="532" width="912" height="88" rx="16" class="band-blue" stroke-width="1.5"/><text x="42" y="556" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">WHY THE FFI BOUNDARY COSTS NOTHING</text><text x="56" y="572" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Those same buffer pointers cross to pyarrow through the Arrow C Data Interface. No copy, no</text><text x="56" y="590" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">serialization: the morsel Rust hands back is the batch Python already holds.</text></svg>