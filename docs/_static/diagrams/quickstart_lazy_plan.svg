</defs><rect x="20" y="20" width="940" height="206" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">LAZY  ·  EACH STEP RETURNS A NEW DATASET, NOTHING RUNS</text><rect x="48" y="62" width="380" height="100" rx="9" class="code-bg" stroke-width="1"/><text x="62" y="88.5" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13" class="t-code" xml:space="preserve">bt.read.parquet(&quot;sales.parquet&quot;)</text><text x="62" y="108.5" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13" class="t-code" xml:space="preserve">  .filter(bt.col(&quot;price&quot;) &gt;= 30.0)</text><text x="62" y="128.5" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13" class="t-code" xml:space="preserve">  .with_columns(total=...)</text><text x="62" y="148.5" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13" class="t-code" xml:space="preserve">  .group_by(&quot;category&quot;).agg(...)</text><path d="M 440 123 L 590 123" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="515" y="111" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">describes</text><g filter="url(#glow)"><rect x="600" y="70" width="332" height="106" rx="16" fill="url(#hero)"/></g><text x="766.0" y="121.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="800" fill="#ffffff">A query plan</text><text x="766.0" y="143.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#ffffff" fill-opacity="0.88">scan, filter, project, aggregate</text><text x="490" y="208" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Chain as many steps as you like. No row has been read yet.</text><rect x="20" y="262" width="940" height="234" rx="16" class="band-amber" stroke-width="1.5"/><text x="38" y="286" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#f59e0b">TERMINAL CALL  ·  THE PLAN RUNS ONCE</text><path d="M 766 176 L 766 304 L 179 304 L 179 324" fill="none" stroke="#d97706" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arA)"/><text x="752" y="249" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">collect()  ·  to_pydict()  ·  write</text><g filter="url(#sh)"><rect x="48" y="330" width="262" height="92" rx="10" class="surface" stroke-width="1.2"/></g><text x="179.0" y="376.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Optimize</text><text x="179.0" y="395.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">push filters, prune columns</text><g filter="url(#sh)"><rect x="372" y="330" width="262" height="92" rx="10" class="surface" stroke-width="1.2"/></g><text x="503.0" y="376.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Rust engine</text><text x="503.0" y="395.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">whole Arrow batches</text><g filter="url(#sh)"><rect x="696" y="330" width="236" height="92" rx="11" fill="url(#tintAmber)" stroke="#fcd34d" stroke-width="1.2"/></g><rect x="696" y="342" width="4" height="68" rx="2" fill="#f59e0b"/><text x="817.0" y="375.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Result</text><text x="817.0" y="393.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">Table, dict, or files</text><path d="M 310 376 L 372 376" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="341" y="362" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">plan</text><path d="M 634 376 L 696 376" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="665" y="362" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">rows</text><text x="490" y="466" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">The optimizer sees the whole plan before any work, so it can move a filter into the read.</text></svg>