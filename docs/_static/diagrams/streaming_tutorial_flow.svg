<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" role="img" width="980" height="640"><defs><style>
  .surface { fill: #ffffff; stroke: #cbd5e1; }
  .band-blue { fill: #eff6ff; stroke: #3b82f6; }
  .band-amber { fill: #fffbeb; stroke: #f59e0b; }
  .band-grey { fill: #f8fafc; stroke: #cbd5e1; }
  .t-title { fill: #1e293b; }
  .t-sub { fill: #5b6675; }
  .t-arrow { fill: #475569; }
  .t-code { fill: #1e40af; }
  .code-bg { fill: #f1f5f9; stroke: #e2e8f0; }
  .pill-blue { fill: #dbeafe; } .pill-amber { fill: #fef3c7; } .pill-grey { fill: #e2e8f0; }
  .pt-blue { fill: #1d4ed8; } .pt-amber { fill: #b45309; } .pt-grey { fill: #334155; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1e293b; stroke: #334155; }
    .band-blue { fill: #172554; stroke: #3b82f6; }
    .band-amber { fill: #2c1f06; stroke: #f59e0b; }
    .band-grey { fill: #131c31; stroke: #334155; }
    .t-title { fill: #e2e8f0; }
    .t-sub { fill: #94a3b8; }
    .t-arrow { fill: #cbd5e1; }
    .t-code { fill: #93c5fd; }
    .code-bg { fill: #0f172a; stroke: #334155; }
    .pill-blue { fill: #1e3a8a; } .pill-amber { fill: #78350f; } .pill-grey { fill: #334155; }
    .pt-blue { fill: #bfdbfe; } .pt-amber { fill: #fde68a; } .pt-grey { fill: #e2e8f0; }
    #tintBlue stop[offset="0"] { stop-color: #16233d; }
    #tintBlue stop[offset="1"] { stop-color: #1e3a8a; }
    #tintAmber stop[offset="0"] { stop-color: #2a1e07; }
    #tintAmber stop[offset="1"] { stop-color: #78350f; }
  }
</style>
<filter id="sh" x="-20%" y="-30%" width="140%" height="180%">
  <feDropShadow dx="0" dy="2.5" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.18"/>
</filter>
<filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
  <feDropShadow dx="0" dy="4" stdDeviation="9" flood-color="#2563eb" flood-opacity="0.35"/>
</filter>
<linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="0.5" stop-color="#2563eb"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
<linearGradient id="heroAmber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#d97706"/></linearGradient>
<linearGradient id="tintBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5f9ff"/><stop offset="1" stop-color="#dbeafe"/></linearGradient>
<linearGradient id="tintAmber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf5"/><stop offset="1" stop-color="#fdecc8"/></linearGradient>
<linearGradient id="ribbonBlue" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#93c5fd"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
<linearGradient id="ribbonAmber" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><rect x="20" y="20" width="400" height="594" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">THE PIPELINE</text><rect x="446" y="20" width="514" height="594" rx="16" class="band-grey" stroke-width="1.5"/><text x="464" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">WHAT TO KNOW AT EACH STAGE</text><g filter="url(#sh)"><rect x="64" y="72" width="330" height="72" rx="10" class="surface" stroke-width="1.2"/></g><text x="229.0" y="108.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Unbounded source</text><text x="229.0" y="127.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">from_batches(..., bounded=False)</text><circle cx="64" cy="76" r="14" fill="#2563eb"/><text x="64" y="80.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffffff">1</text><g filter="url(#sh)"><rect x="470" y="72" width="466" height="72" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="470" y="84" width="4" height="48" rx="2" fill="#3b82f6"/><text x="706.0" y="107.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Never ends</text><text x="706.0" y="125.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">consume it with a sink or iter_batches, not collect()</text><path d="M 229.0 144 L 229.0 180" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="241.0" y="168.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">Arrow batches</text><g filter="url(#sh)"><rect x="64" y="184" width="330" height="72" rx="10" class="surface" stroke-width="1.2"/></g><text x="229.0" y="220.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Deduplicate</text><text x="229.0" y="239.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">drop_duplicates_within_watermark</text><circle cx="64" cy="188" r="14" fill="#2563eb"/><text x="64" y="192.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffffff">3</text><g filter="url(#sh)"><rect x="470" y="184" width="466" height="72" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="470" y="196" width="4" height="48" rx="2" fill="#3b82f6"/><text x="706.0" y="219.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Bounded state</text><text x="706.0" y="237.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">keys the watermark has passed are forgotten</text><path d="M 229.0 256 L 229.0 292" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="241.0" y="280.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">first row per key</text><g filter="url(#sh)"><rect x="64" y="296" width="330" height="72" rx="10" class="surface" stroke-width="1.2"/></g><text x="229.0" y="332.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Window by event time</text><text x="229.0" y="351.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">with_watermark, then bt.window</text><circle cx="64" cy="300" r="14" fill="#2563eb"/><text x="64" y="304.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffffff">4</text><g filter="url(#sh)"><rect x="470" y="296" width="466" height="72" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="470" y="308" width="4" height="48" rx="2" fill="#3b82f6"/><text x="706.0" y="331.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Watermark = max(event_time) - lateness</text><text x="706.0" y="349.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">a window closes once the watermark passes its end</text><path d="M 229.0 368 L 229.0 404" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="241.0" y="392.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">window aggregates</text><g filter="url(#sh)"><rect x="64" y="408" width="330" height="72" rx="10" class="surface" stroke-width="1.2"/></g><text x="229.0" y="444.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Write with a trigger</text><text x="229.0" y="463.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">available_now or processing_time</text><circle cx="64" cy="412" r="14" fill="#2563eb"/><text x="64" y="416.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffffff">5</text><g filter="url(#sh)"><rect x="470" y="408" width="466" height="72" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="470" y="420" width="4" height="48" rx="2" fill="#3b82f6"/><text x="706.0" y="443.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">When micro-batches run</text><text x="706.0" y="461.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">drain what is there and stop, or run on a clock</text><path d="M 229.0 480 L 229.0 516" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="241.0" y="504.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">micro-batches</text><g filter="url(#sh)"><rect x="64" y="520" width="330" height="72" rx="10" class="surface" stroke-width="1.2"/></g><text x="229.0" y="556.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Sink with a checkpoint</text><text x="229.0" y="575.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">memory, Parquet files, or Delta</text><circle cx="64" cy="524" r="14" fill="#2563eb"/><text x="64" y="528.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffffff">6</text><g filter="url(#sh)"><rect x="470" y="520" width="466" height="72" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="470" y="532" width="4" height="48" rx="2" fill="#3b82f6"/><text x="706.0" y="555.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Survives a restart</text><text x="706.0" y="573.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">resumes at the last committed offset</text></svg>