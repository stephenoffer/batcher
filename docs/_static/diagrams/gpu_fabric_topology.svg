</defs><rect x="20" y="24" width="458" height="246" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="48" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">PEER ISLANDS</text><text x="44" y="60" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">the connected groups of the NVLink-over-bus overlay</text><rect x="52" y="84" width="44" height="34" rx="5" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><text x="74" y="106" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-title">0</text><rect x="108" y="84" width="44" height="34" rx="5" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><text x="130" y="106" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-title">1</text><rect x="164" y="84" width="44" height="34" rx="5" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><text x="186" y="106" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-title">2</text><rect x="220" y="84" width="44" height="34" rx="5" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><text x="242" y="106" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-title">3</text><rect x="280" y="84" width="44" height="34" rx="5" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><text x="302" y="106" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-title">4</text><rect x="336" y="84" width="44" height="34" rx="5" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><text x="358" y="106" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-title">5</text><rect x="392" y="84" width="44" height="34" rx="5" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><text x="414" y="106" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-title">6</text><rect x="448" y="84" width="44" height="34" rx="5" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><text x="470" y="106" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-title">7</text><path d="M 148 101 L 164 101" fill="none" stroke="#2563eb" stroke-width="4"/><path d="M 204 101 L 220 101" fill="none" stroke="#2563eb" stroke-width="4"/><path d="M 260 101 L 276 101" fill="none" stroke="#2563eb" stroke-width="4"/><path d="M 74 76 L 242 76" fill="none" stroke="#2563eb" stroke-width="4"/><path d="M 376 101 L 392 101" fill="none" stroke="#2563eb" stroke-width="4"/><path d="M 432 101 L 448 101" fill="none" stroke="#2563eb" stroke-width="4"/><path d="M 488 101 L 504 101" fill="none" stroke="#2563eb" stroke-width="4"/><path d="M 302 76 L 470 76" fill="none" stroke="#2563eb" stroke-width="4"/><path d="M 226 101 L 278 101" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 4"/><text x="120" y="140" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">island of 4</text><text x="348" y="140" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">island of 4</text><text x="252" y="140" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">sys</text><text x="44" y="176" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Heavy line: a coherent fabric link. Dashed: the PCI bus.</text><text x="44" y="196" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Two devices under different root complexes are the</text><text x="44" y="216" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">furthest apart the bus can express, and exchange at</text><text x="44" y="236" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">full fabric rate anyway if NVLink joins them. A group</text><text x="44" y="256" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">picked on bus distance alone picks the wrong four.</text><rect x="502" y="24" width="458" height="246" rx="16" class="band-blue" stroke-width="1.5"/><text x="520" y="48" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">RAILS</text><text x="526" y="60" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">which NIC each device leaves the node through</text><rect x="534" y="84" width="44" height="34" rx="5" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><text x="556" y="106" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-title">0</text><rect x="590" y="84" width="44" height="34" rx="5" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><text x="612" y="106" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-title">1</text><rect x="646" y="84" width="44" height="34" rx="5" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><text x="668" y="106" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-title">2</text><rect x="702" y="84" width="44" height="34" rx="5" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><text x="724" y="106" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-title">3</text><rect x="762" y="84" width="44" height="34" rx="5" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><text x="784" y="106" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-title">4</text><rect x="818" y="84" width="44" height="34" rx="5" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><text x="840" y="106" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-title">5</text><rect x="874" y="84" width="44" height="34" rx="5" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><text x="896" y="106" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-title">6</text><rect x="930" y="84" width="44" height="34" rx="5" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><text x="952" y="106" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-title">7</text><g filter="url(#sh)"><rect x="534" y="156" width="196" height="44" rx="10" class="surface" stroke-width="1.2"/></g><text x="632.0" y="183.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">mlx5_0</text><g filter="url(#sh)"><rect x="762" y="156" width="196" height="44" rx="10" class="surface" stroke-width="1.2"/></g><text x="860.0" y="183.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">mlx5_1</text><path d="M 556 118 L 632 154" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 4"/><path d="M 784 118 L 860 154" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 4"/><path d="M 612 118 L 632 154" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 4"/><path d="M 840 118 L 860 154" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 4"/><path d="M 668 118 L 632 154" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 4"/><path d="M 896 118 L 860 154" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 4"/><path d="M 724 118 L 632 154" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 4"/><path d="M 952 118 L 860 154" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 4"/><text x="746" y="140" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">assigned node-wide</text><text x="526" y="224" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Asked one at a time, all eight devices can name the</text><text x="526" y="244" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">same NIC: one rail carries the shuffle and seven sit</text><text x="526" y="264" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">idle, with every counter reporting a healthy fabric.</text><rect x="20" y="292" width="940" height="206" rx="16" class="band-amber" stroke-width="1.5"/><text x="38" y="316" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#f59e0b">THE EXCHANGE SCHEDULE: n-1 ROUNDS OF n/2 DISJOINT PAIRS</text><text x="44" y="328" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">pairwise_rounds([0, 1, 2, 3]) -- no device is the source of one copy and the destination of another in the same round</text><text x="170" y="364" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">round 0</text><rect x="60" y="378" width="44" height="34" rx="5" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><text x="82" y="400" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-title">0</text><rect x="116" y="378" width="44" height="34" rx="5" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><text x="138" y="400" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-title">1</text><rect x="172" y="378" width="44" height="34" rx="5" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><text x="194" y="400" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-title">2</text><rect x="228" y="378" width="44" height="34" rx="5" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><text x="250" y="400" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-title">3</text><path d="M 82 414 L 82 424 L 250 424 L 250 414" fill="none" stroke="#d97706" stroke-width="2.4"/><path d="M 138 414 L 138 435 L 194 435 L 194 414" fill="none" stroke="#d97706" stroke-width="2.4"/><text x="170" y="462" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">0-3 and 1-2</text><text x="470" y="364" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">round 1</text><rect x="360" y="378" width="44" height="34" rx="5" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><text x="382" y="400" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-title">0</text><rect x="416" y="378" width="44" height="34" rx="5" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><text x="438" y="400" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-title">1</text><rect x="472" y="378" width="44" height="34" rx="5" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><text x="494" y="400" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-title">2</text><rect x="528" y="378" width="44" height="34" rx="5" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><text x="550" y="400" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-title">3</text><path d="M 382 414 L 382 424 L 494 424 L 494 414" fill="none" stroke="#d97706" stroke-width="2.4"/><path d="M 438 414 L 438 435 L 550 435 L 550 414" fill="none" stroke="#d97706" stroke-width="2.4"/><text x="470" y="462" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">0-2 and 1-3</text><text x="770" y="364" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">round 2</text><rect x="660" y="378" width="44" height="34" rx="5" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><text x="682" y="400" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-title">0</text><rect x="716" y="378" width="44" height="34" rx="5" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><text x="738" y="400" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-title">1</text><rect x="772" y="378" width="44" height="34" rx="5" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><text x="794" y="400" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-title">2</text><rect x="828" y="378" width="44" height="34" rx="5" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><text x="850" y="400" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-title">3</text><path d="M 682 414 L 682 424 L 738 424 L 738 414" fill="none" stroke="#d97706" stroke-width="2.4"/><path d="M 794 414 L 794 435 L 850 435 L 850 414" fill="none" stroke="#d97706" stroke-width="2.4"/><text x="770" y="462" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">0-1 and 2-3</text><text x="490" y="486" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">The ring for a reduction is ordered by the fabric, not by device index: its rate is its worst hop.</text><rect x="20" y="520" width="940" height="100" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="544" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">WHAT CHANGES BECAUSE OF IT</text><text x="44" y="556" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">a collective is strict-packed inside one island</text><text x="44" y="576" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">a plan covering fewer devices than the stage asked</text><text x="44" y="594" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">for is refused, because a partial gang hangs</text><text x="400" y="556" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">shards are dealt by measured throughput</text><text x="400" y="576" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">largest-remainder apportionment; an unmeasured</text><text x="400" y="594" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">device is treated as average, never as idle</text><text x="700" y="556" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">the device path must win by 1.25x</text><text x="700" y="576" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">an unpriced link makes a plan refuse;</text><text x="700" y="594" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">a plan that merely ties loses</text></svg>