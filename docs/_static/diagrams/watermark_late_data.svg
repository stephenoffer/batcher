</defs><text x="490" y="50" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Seven records, left to right in the order they arrived. The frontier trails the highest event time seen by the allowed lateness.</text><text x="60" y="78" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">event time</text><path d="M 130 70 H 790" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.35"/><text x="120" y="74" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">10:15</text><path d="M 130 135 H 790" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.35"/><text x="120" y="139" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">10:10</text><path d="M 130 200 H 790" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.35"/><text x="120" y="204" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">10:05</text><path d="M 130 265 H 790" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.35"/><text x="120" y="269" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">10:00</text><path d="M 130 330 H 790" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.35"/><text x="120" y="334" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">09:55</text><path d="M 215 265 H 345 M 345 239 H 435 M 435 200 H 615 M 615 174 H 760 M 760 109 H 790 M 345 265 V 239M 435 239 V 200M 615 200 V 174M 760 174 V 109" fill="none" stroke="#94a3b8" stroke-width="2.2" stroke-dasharray="7 4"/><path d="M 215 330 H 345 M 345 304 H 435 M 435 265 H 615 M 615 239 H 760 M 760 174 H 790 M 345 330 V 304M 435 304 V 265M 615 265 V 239M 760 239 V 174" fill="none" stroke="#2563eb" stroke-width="3"/><text x="798" y="113" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">max event time seen</text><text x="798" y="178" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">watermark</text><path d="M 480 200 V 265" stroke="#d97706" stroke-width="2"/><path d="M 474 200 H 486 M 474 265 H 486" stroke="#d97706" stroke-width="2"/><text x="492" y="236.5" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">allowed lateness · 5 min</text><circle cx="165" cy="265" r="7" fill="#2563eb"/><text x="165" y="251" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">10:00</text><text x="165" y="362" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" class="t-sub">1</text><circle cx="255" cy="239" r="7" fill="#2563eb"/><text x="255" y="225" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">10:02</text><text x="255" y="362" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" class="t-sub">2</text><circle cx="345" cy="200" r="7" fill="#2563eb"/><text x="345" y="186" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">10:05</text><text x="345" y="362" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" class="t-sub">3</text><circle cx="435" cy="226" r="7" fill="#2563eb"/><text x="435" y="248" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">10:03 · kept</text><text x="435" y="362" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" class="t-sub">4</text><circle cx="525" cy="174" r="7" fill="#2563eb"/><text x="525" y="160" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">10:07</text><text x="525" y="362" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" class="t-sub">5</text><circle cx="615" cy="291" r="7.5" fill="none" stroke="#d97706" stroke-width="2.4"/><path d="M 608 298 L 622 284" stroke="#d97706" stroke-width="2.4"/><text x="615" y="313" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">09:58 · dropped</text><text x="615" y="362" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" class="t-sub">6</text><circle cx="705" cy="109" r="7" fill="#2563eb"/><text x="705" y="95" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">10:12</text><text x="705" y="362" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" class="t-sub">7</text><path d="M 130 345 H 800" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arG)"/><text x="465" y="382" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">arrival order (processing time)</text><rect x="20" y="396" width="940" height="104" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="420" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">WHAT THE ENGINE DOES WITH EACH ROW</text><text x="490" y="440" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">A row is compared against the frontier as it stood before its own batch, so record 4 arrives out of order and still counts.</text><text x="490" y="458" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Across several partitions the watermark is the minimum of their maxima, so one slow partition holds the whole frontier back.</text><text x="490" y="476" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Record 6 is filtered out in Rust and never reaches the aggregate. It is counted: num_late_inputs_dropped on the progress record.</text></svg>