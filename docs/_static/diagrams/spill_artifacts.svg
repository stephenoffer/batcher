<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" role="img" width="960" height="610"><defs><style>
  .surface { fill: #ffffff; stroke: #cbd5e1; }
  .band-blue { fill: #eff6ff; stroke: #3b82f6; }
  .band-amber { fill: #fffbeb; stroke: #f59e0b; }
  .band-grey { fill: #f8fafc; stroke: #cbd5e1; }
  .t-title { fill: #1e293b; }
  .t-sub { fill: #5b6675; }
  .t-arrow { fill: #475569; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1e293b; stroke: #334155; }
    .band-blue { fill: #172554; stroke: #3b82f6; }
    .band-amber { fill: #2c1f06; stroke: #f59e0b; }
    .band-grey { fill: #131c31; stroke: #334155; }
    .t-title { fill: #e2e8f0; }
    .t-sub { fill: #94a3b8; }
    .t-arrow { fill: #cbd5e1; }
  }
</style>
<filter id="sh" x="-20%" y="-30%" width="140%" height="180%">
  <feDropShadow dx="0" dy="2.5" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.18"/>
</filter>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><rect x="24" y="20" width="912" height="216" rx="16" class="band-grey" stroke-width="1.5"/><text x="42" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">WHAT A SPILL PUTS ON DISK</text><rect x="56" y="58" width="420" height="162" rx="10" class="surface" stroke-width="1.2"/><text x="72" y="84" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">&lt;spill root&gt;/</text><text x="72" y="104" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">memory.spill_dir, else the node's local scratch</text><rect x="80" y="118" width="372" height="90" rx="8" class="band-blue" stroke-width="1.4"/><text x="96" y="142" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">bc-spill-{pid}-{seq}/</text><text x="96" y="160" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">one per store, owner-only where the filesystem allows</text><text x="96" y="184" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">part-0.arrow     part-1.arrow     ...     part-N.arrow</text><text x="96" y="202" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">one Arrow IPC stream each</text><text x="500" y="86" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">A partition is a hash bucket for the grace operators</text><text x="500" y="104" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">and a sorted run for the external sort. Same file.</text><text x="500" y="132" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">A writer opens on the first append, so a bucket that</text><text x="500" y="150" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">received no rows has no file at all.</text><text x="500" y="178" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">The codec comes from the first batch's schema: ZSTD</text><text x="500" y="196" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">for blob-bearing columns, none for anything else.</text><rect x="24" y="252" width="912" height="150" rx="16" class="band-blue" stroke-width="1.5"/><text x="42" y="276" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">THE ORDINARY LIFECYCLE</text><g filter="url(#sh)"><rect x="48" y="294" width="236" height="66" rx="10" class="surface" stroke-width="1.2"/></g><text x="166.0" y="327.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">created</text><text x="166.0" y="346.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">writers open lazily, per file</text><path d="M 286 327 L 370 327" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="328" y="315" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">append</text><g filter="url(#sh)"><rect x="374" y="294" width="236" height="66" rx="10" class="surface" stroke-width="1.2"/></g><text x="492.0" y="327.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">appended</text><text x="492.0" y="346.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">rows and bytes counted per file</text><path d="M 612 327 L 696 327" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="654" y="315" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">merge phase</text><g filter="url(#sh)"><rect x="700" y="294" width="236" height="66" rx="10" class="surface" stroke-width="1.2"/></g><text x="818.0" y="327.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">read back once</text><text x="818.0" y="346.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">then the partition is released</text><text x="480" y="384" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">The store removes its own directory on drop - on success, on an error and on a panic alike.</text><rect x="24" y="418" width="912" height="168" rx="16" class="band-grey" stroke-width="1.5"/><text x="42" y="442" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">THE TWO ENDS DROP DOES NOT REACH</text><g filter="url(#sh)"><rect x="48" y="458" width="400" height="72" rx="10" class="surface" stroke-width="1.2"/></g><text x="248.0" y="494.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">SIGKILL leaves it behind</text><text x="248.0" y="513.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">the OOM killer picks the spilling process</text><path d="M 448 494 L 540 494" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="494" y="482" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">swept by</text><g filter="url(#sh)"><rect x="540" y="458" width="372" height="72" rx="10" class="surface" stroke-width="1.2"/></g><text x="726.0" y="494.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">orphan sweep</text><text x="726.0" y="513.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">removes only directories whose pid is dead</text><text x="48" y="560" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">A truncated IPC stream reads back as a shorter valid one, so every read is checked against the row count taken on the way in.</text></svg>