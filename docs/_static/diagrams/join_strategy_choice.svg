<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 632" role="img" width="980" height="632"><defs><style>
  .surface { fill: #ffffff; stroke: #cbd5e1; }
  .band-blue { fill: #eff6ff; stroke: #3b82f6; }
  .band-amber { fill: #fffbeb; stroke: #f59e0b; }
  .band-grey { fill: #f8fafc; stroke: #cbd5e1; }
  .t-title { fill: #1e293b; }
  .t-sub { fill: #5b6675; }
  .t-arrow { fill: #475569; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1e293b; stroke: #334155; }
    .band-blue { fill: #172554; stroke: #3b82f6; }
    .band-amber { fill: #2c1f06; stroke: #f59e0b; }
    .band-grey { fill: #131c31; stroke: #334155; }
    .t-title { fill: #e2e8f0; }
    .t-sub { fill: #94a3b8; }
    .t-arrow { fill: #cbd5e1; }
  }
</style>
<filter id="sh" x="-20%" y="-30%" width="140%" height="180%">
  <feDropShadow dx="0" dy="2.5" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.18"/>
</filter>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><rect x="20" y="24" width="940" height="98" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="48" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">WHAT THE DECISION IS MADE FROM</text><text x="200" y="64" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">estimated rows x row width</text><text x="200" y="84" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">per side, from Kyber's sketches</text><text x="490" y="64" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">the join type</text><text x="490" y="84" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">only an inner join may swap sides</text><text x="790" y="64" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">the broadcast ceiling</text><text x="790" y="84" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">a quarter of L3; times 16, at least 64 MiB, on a cluster</text><rect x="20" y="138" width="940" height="330" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="162" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">THE DECISION</text><g filter="url(#sh)"><rect x="340" y="170" width="300" height="62" rx="10" class="surface" stroke-width="1.2"/></g><text x="490.0" y="201.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">smaller side under the ceiling?</text><text x="490.0" y="220.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">the right side, unless inner</text><path d="M 336 201 L 232 201" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="284" y="187" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">yes</text><g filter="url(#sh)"><rect x="44" y="171" width="184" height="60" rx="10" class="surface" stroke-width="1.2"/></g><text x="136.0" y="201.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">broadcast</text><text x="136.0" y="220.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">the probe never moves</text><path d="M 490 236 L 490 274" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="504" y="262" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">no</text><g filter="url(#sh)"><rect x="340" y="280" width="300" height="62" rx="10" class="surface" stroke-width="1.2"/></g><text x="490.0" y="311.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">build side very large?</text><text x="490.0" y="330.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">50M rows per worker</text><path d="M 336 311 L 232 311" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="284" y="297" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">yes</text><g filter="url(#sh)"><rect x="44" y="281" width="184" height="60" rx="10" class="surface" stroke-width="1.2"/></g><text x="136.0" y="311.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">sort_merge</text><text x="136.0" y="330.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">no hash table at all</text><path d="M 490 346 L 490 384" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="504" y="372" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">no</text><g filter="url(#sh)"><rect x="340" y="390" width="300" height="60" rx="10" class="surface" stroke-width="1.2"/></g><text x="490.0" y="420.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">hash: the shuffle join</text><text x="490.0" y="439.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">both sides partitioned by key</text><text x="800" y="176" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">The smaller side becomes the build side, and</text><text x="800" y="194" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">the runtime always builds on the right, so</text><text x="800" y="212" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Kyber swaps the inputs when it is the left.</text><text x="800" y="230" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Only an inner join may be swapped.</text><text x="800" y="292" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">The row floor stands down only when the byte</text><text x="800" y="310" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">size is also large, or is a scan's bounded</text><text x="800" y="328" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">ceiling rather than a compounding guess.</text><text x="800" y="404" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Broadcast is limited to inner, left, semi</text><text x="800" y="422" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">and anti. Every other type shuffles.</text><path d="M 400 474 L 268 504" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="272" y="488" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">the chosen arm</text><rect x="20" y="484" width="940" height="106" rx="16" class="band-amber" stroke-width="1.5"/><text x="38" y="508" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#f59e0b">AND THE SAME DECISION IS MADE TWICE MORE</text><g filter="url(#sh)"><rect x="120" y="512" width="286" height="58" rx="10" class="surface" stroke-width="1.2"/></g><text x="263.0" y="541.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">the bandit, before the run</text><text x="263.0" y="560.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">substitutes a learned arm</text><path d="M 412 541 L 464 541" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="438" y="529" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">then</text><g filter="url(#sh)"><rect x="470" y="512" width="300" height="58" rx="10" class="surface" stroke-width="1.2"/></g><text x="620.0" y="541.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">the driver, at run time</text><text x="620.0" y="560.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">a broadcast that no longer fits shuffles</text><text x="866" y="534" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">measured bytes</text><text x="866" y="552" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">beat estimates</text><text x="490" y="614" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">All three produce the same relation, so a wrong pick is slow rather than wrong. That is what makes the choice safe to learn across runs.</text></svg>