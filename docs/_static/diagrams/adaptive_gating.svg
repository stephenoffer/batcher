<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 644" role="img" width="980" height="644"><defs><style>
  .surface { fill: #ffffff; stroke: #cbd5e1; }
  .band-blue { fill: #eff6ff; stroke: #3b82f6; }
  .band-amber { fill: #fffbeb; stroke: #f59e0b; }
  .band-grey { fill: #f8fafc; stroke: #cbd5e1; }
  .t-title { fill: #1e293b; }
  .t-sub { fill: #5b6675; }
  .t-arrow { fill: #475569; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1e293b; stroke: #334155; }
    .band-blue { fill: #172554; stroke: #3b82f6; }
    .band-amber { fill: #2c1f06; stroke: #f59e0b; }
    .band-grey { fill: #131c31; stroke: #334155; }
    .t-title { fill: #e2e8f0; }
    .t-sub { fill: #94a3b8; }
    .t-arrow { fill: #cbd5e1; }
  }
</style>
<filter id="sh" x="-20%" y="-30%" width="140%" height="180%">
  <feDropShadow dx="0" dy="2.5" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.18"/>
</filter>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><rect x="20" y="20" width="940" height="294" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">adaptive="auto"  ·  WHEN THE WITHIN-QUERY LOOP ENGAGES</text><text x="490" y="72" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Two things skip the ladder: an explicit adaptive=True or False wins outright, and a distributed plan the one-shot dispatcher</text><text x="490" y="92" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">cannot route is staged whatever its size, because there staging is the only execution path rather than an optimization.</text><g filter="url(#sh)"><rect x="40" y="140" width="280" height="104" rx="10" class="surface" stroke-width="1.2"/></g><text x="180.0" y="192.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Is there a join?</text><text x="180.0" y="211.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">no join: nothing to re-decide</text><g filter="url(#sh)"><rect x="350" y="140" width="280" height="104" rx="10" class="surface" stroke-width="1.2"/></g><text x="490.0" y="192.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Does it clear the floor?</text><text x="490.0" y="211.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">per breaker, not per query</text><g filter="url(#sh)"><rect x="660" y="140" width="280" height="104" rx="10" class="surface" stroke-width="1.2"/></g><text x="800.0" y="192.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Is an operand unsized?</text><text x="800.0" y="211.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">breaker-produced, and still a guess</text><path d="M 320 192 L 350 192" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="335" y="182" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">yes</text><path d="M 630 192 L 660 192" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="645" y="182" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">yes</text><rect x="20" y="344" width="600" height="96" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="368" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">ANY "NO"  ·  PLAN ONCE, RUN ONCE</text><text x="44" y="392" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">No staging, no per-stage cut, no re-plan. This is where the great</text><text x="44" y="412" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">majority of queries land, and it is the cheaper path for them.</text><path d="M 180 244 L 180 344" fill="none" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arG)"/><text x="192" y="294" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">no</text><path d="M 490 244 L 490 344" fill="none" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arG)"/><text x="502" y="294" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">no</text><path d="M 760 244 L 610 340" fill="none" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arG)"/><text x="660" y="294" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">no</text><g filter="url(#sh)"><rect x="660" y="348" width="280" height="88" rx="10" class="surface" stroke-width="1.2"/></g><text x="800.0" y="392.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Stage, measure, re-plan</text><text x="800.0" y="411.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">one breaker per stage</text><path d="M 870 244 L 870 348" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="882" y="294" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">yes</text><text x="660" y="462" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">...unless the route bandit, having</text><text x="660" y="482" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">measured both arms for this plan</text><text x="660" y="502" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">signature, says one-shot was faster.</text><rect x="20" y="512" width="940" height="112" rx="16" class="band-amber" stroke-width="1.5"/><text x="38" y="536" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#f59e0b">THE FLOOR IS CHARGED PER BREAKER, NOT PER QUERY</text><text x="44" y="558" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">5,000,000 rows  OR  about 320 MB  --  times the pipeline</text><text x="44" y="576" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">breakers the loop would cut at. A cut is what staging costs,</text><text x="44" y="594" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">so a plan with more cuts must be larger to earn them.</text><text x="44" y="612" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">The flat 20,000,000-row whole-query gate is retired.</text><text x="672" y="552" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">2 breakers</text><text x="940" y="552" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="12" class="t-sub">10,000,000 rows</text><text x="672" y="578" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">4 breakers</text><text x="940" y="578" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="12" class="t-sub">20,000,000 rows</text><text x="672" y="604" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">6 breakers</text><text x="940" y="604" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="12" class="t-sub">30,000,000 rows</text><text x="672" y="612" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">or the byte floor, whichever suits the shape.</text></svg>