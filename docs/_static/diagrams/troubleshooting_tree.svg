</defs><rect x="20" y="20" width="940" height="520" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">START FROM THE SYMPTOM</text><text x="344.0" y="80" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="1.8" fill="#2563eb">SYMPTOM</text><text x="614" y="80" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="1.8" fill="#5b6675">USUAL CAUSE</text><text x="872.0" y="80" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="1.8" fill="#d97706">WHAT TO DO</text><g filter="url(#glow)"><rect x="36" y="252.0" width="164" height="104" rx="16" fill="url(#hero)"/></g><text x="118.0" y="302.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="800" fill="#ffffff">Start here</text><text x="118.0" y="324.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#ffffff" fill-opacity="0.88">what do you see?</text><path d="M 200 304.0 C 221.0 304.0, 221.0 124.0, 242 124.0" fill="none" stroke="url(#ribbonBlue)" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/><g filter="url(#sh)"><rect x="244" y="96.0" width="200" height="56" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="244" y="108.0" width="4" height="32" rx="2" fill="#3b82f6"/><text x="347.0" y="123.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Nothing ran</text><text x="347.0" y="141.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">a Dataset repr came back</text><path d="M 450 124.0 L 496 124.0" fill="none" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arG)"/><text x="473.0" y="116.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" class="t-arrow">why</text><text x="506" y="121.0" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">A Dataset is lazy: no terminal</text><text x="506" y="138.0" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">operation was called.</text><path d="M 760 124.0 L 794 124.0" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="777" y="116.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" class="t-arrow">fix</text><g filter="url(#sh)"><rect x="800" y="96.0" width="144" height="56" rx="11" fill="url(#tintAmber)" stroke="#fcd34d" stroke-width="1.2"/></g><rect x="800" y="108.0" width="4" height="32" rx="2" fill="#f59e0b"/><text x="875.0" y="123.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">call collect()</text><text x="875.0" y="141.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">this page</text><path d="M 200 304.0 C 221.0 304.0, 221.0 196.0, 242 196.0" fill="none" stroke="url(#ribbonBlue)" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/><g filter="url(#sh)"><rect x="244" y="168.0" width="200" height="56" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="244" y="180.0" width="4" height="32" rx="2" fill="#3b82f6"/><text x="347.0" y="201.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">ColumnNotFoundError</text><path d="M 450 196.0 L 496 196.0" fill="none" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arG)"/><text x="473.0" y="188.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" class="t-arrow">why</text><text x="506" y="193.0" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">A typo, or an earlier step</text><text x="506" y="210.0" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">dropped or renamed it.</text><path d="M 760 196.0 L 794 196.0" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="777" y="188.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" class="t-arrow">fix</text><g filter="url(#sh)"><rect x="800" y="168.0" width="144" height="56" rx="11" fill="url(#tintAmber)" stroke="#fcd34d" stroke-width="1.2"/></g><rect x="800" y="180.0" width="4" height="32" rx="2" fill="#f59e0b"/><text x="875.0" y="195.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">check .columns</text><text x="875.0" y="213.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">this page</text><path d="M 200 304.0 C 221.0 304.0, 221.0 268.0, 242 268.0" fill="none" stroke="url(#ribbonBlue)" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/><g filter="url(#sh)"><rect x="244" y="240.0" width="200" height="56" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="244" y="252.0" width="4" height="32" rx="2" fill="#3b82f6"/><text x="347.0" y="273.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">PlanError on filter()</text><path d="M 450 268.0 L 496 268.0" fill="none" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arG)"/><text x="473.0" y="260.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" class="t-arrow">why</text><text x="506" y="265.0" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">A string was passed where</text><text x="506" y="282.0" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">an expression belongs.</text><path d="M 760 268.0 L 794 268.0" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="777" y="260.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" class="t-arrow">fix</text><g filter="url(#sh)"><rect x="800" y="240.0" width="144" height="56" rx="11" fill="url(#tintAmber)" stroke="#fcd34d" stroke-width="1.2"/></g><rect x="800" y="252.0" width="4" height="32" rx="2" fill="#f59e0b"/><text x="875.0" y="267.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">use bt.col()</text><text x="875.0" y="285.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">or ds.sql()</text><path d="M 200 304.0 C 221.0 304.0, 221.0 340.0, 242 340.0" fill="none" stroke="url(#ribbonBlue)" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/><g filter="url(#sh)"><rect x="244" y="312.0" width="200" height="56" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="244" y="324.0" width="4" height="32" rx="2" fill="#3b82f6"/><text x="347.0" y="345.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Correct but slow</text><path d="M 450 340.0 L 496 340.0" fill="none" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arG)"/><text x="473.0" y="332.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" class="t-arrow">why</text><text x="506" y="337.0" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">A filter didn't push, a wrong</text><text x="506" y="354.0" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">build side, or an estimate miss.</text><path d="M 760 340.0 L 794 340.0" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="777" y="332.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" class="t-arrow">fix</text><g filter="url(#sh)"><rect x="800" y="312.0" width="144" height="56" rx="11" fill="url(#tintAmber)" stroke="#fcd34d" stroke-width="1.2"/></g><rect x="800" y="324.0" width="4" height="32" rx="2" fill="#f59e0b"/><text x="875.0" y="339.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">read the plan</text><text x="875.0" y="357.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">explain-plans</text><path d="M 200 304.0 C 221.0 304.0, 221.0 412.0, 242 412.0" fill="none" stroke="url(#ribbonBlue)" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/><g filter="url(#sh)"><rect x="244" y="384.0" width="200" height="56" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="244" y="396.0" width="4" height="32" rx="2" fill="#3b82f6"/><text x="347.0" y="417.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Recomputes each time</text><path d="M 450 412.0 L 496 412.0" fill="none" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arG)"/><text x="473.0" y="404.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" class="t-arrow">why</text><text x="506" y="409.0" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">A Dataset is a plan, so every</text><text x="506" y="426.0" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">terminal runs it again.</text><path d="M 760 412.0 L 794 412.0" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="777" y="404.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" class="t-arrow">fix</text><g filter="url(#sh)"><rect x="800" y="384.0" width="144" height="56" rx="11" fill="url(#tintAmber)" stroke="#fcd34d" stroke-width="1.2"/></g><rect x="800" y="396.0" width="4" height="32" rx="2" fill="#f59e0b"/><text x="875.0" y="411.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">cache() it</text><text x="875.0" y="429.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">caching</text><path d="M 200 304.0 C 221.0 304.0, 221.0 484.0, 242 484.0" fill="none" stroke="url(#ribbonBlue)" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/><g filter="url(#sh)"><rect x="244" y="456.0" width="200" height="56" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="244" y="468.0" width="4" height="32" rx="2" fill="#3b82f6"/><text x="347.0" y="489.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Out of memory</text><path d="M 450 484.0 L 496 484.0" fill="none" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arG)"/><text x="473.0" y="476.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" class="t-arrow">why</text><text x="506" y="481.0" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">State is held in memory;</text><text x="506" y="498.0" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">spilling is off by default.</text><path d="M 760 484.0 L 794 484.0" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="777" y="476.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" class="t-arrow">fix</text><g filter="url(#sh)"><rect x="800" y="456.0" width="144" height="56" rx="11" fill="url(#tintAmber)" stroke="#fcd34d" stroke-width="1.2"/></g><rect x="800" y="468.0" width="4" height="32" rx="2" fill="#f59e0b"/><text x="875.0" y="483.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">spill=True</text><text x="875.0" y="501.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">spilling</text></svg>