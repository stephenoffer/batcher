<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 590" role="img" width="980" height="590"><defs><style>
  .surface { fill: #ffffff; stroke: #cbd5e1; }
  .band-blue { fill: #eff6ff; stroke: #3b82f6; }
  .band-amber { fill: #fffbeb; stroke: #f59e0b; }
  .band-grey { fill: #f8fafc; stroke: #cbd5e1; }
  .t-title { fill: #1e293b; }
  .t-sub { fill: #5b6675; }
  .t-arrow { fill: #475569; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1e293b; stroke: #334155; }
    .band-blue { fill: #172554; stroke: #3b82f6; }
    .band-amber { fill: #2c1f06; stroke: #f59e0b; }
    .band-grey { fill: #131c31; stroke: #334155; }
    .t-title { fill: #e2e8f0; }
    .t-sub { fill: #94a3b8; }
    .t-arrow { fill: #cbd5e1; }
  }
</style>
<filter id="sh" x="-20%" y="-30%" width="140%" height="180%">
  <feDropShadow dx="0" dy="2.5" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.18"/>
</filter>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><rect x="20" y="40" width="940" height="150" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="64" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">WHAT THE COST MODEL CONSUMES</text><g filter="url(#sh)"><rect x="40" y="86" width="190" height="86" rx="10" class="surface" stroke-width="1.2"/></g><text x="135.0" y="129.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Estimated rows</text><text x="135.0" y="148.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">per node, from the estimator</text><g filter="url(#sh)"><rect x="278" y="86" width="190" height="86" rx="10" class="surface" stroke-width="1.2"/></g><text x="373.0" y="129.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Row width</text><text x="373.0" y="148.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">type-exact, not a flat 64</text><g filter="url(#sh)"><rect x="516" y="86" width="190" height="86" rx="10" class="surface" stroke-width="1.2"/></g><text x="611.0" y="129.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Machine terms</text><text x="611.0" y="148.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">L3, memory budget, device</text><g filter="url(#sh)"><rect x="754" y="86" width="190" height="86" rx="10" class="surface" stroke-width="1.2"/></g><text x="849.0" y="129.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Coefficients</text><text x="849.0" y="148.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">constants, then calibrated</text><g filter="url(#sh)"><rect x="340" y="250" width="300" height="100" rx="10" class="surface" stroke-width="1.2"/></g><text x="490.0" y="300.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">CostModel.cost(node)</text><text x="490.0" y="319.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">one fold over the plan tree</text><path d="M 135 172 L 355 246" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="200" y="212" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">rows</text><path d="M 373 172 L 430 246" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="350" y="212" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">bytes per row</text><path d="M 611 172 L 540 246" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="620" y="212" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">the machine</text><path d="M 849 172 L 620 246" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="770" y="212" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">work units</text><rect x="20" y="390" width="940" height="140" rx="16" class="band-amber" stroke-width="1.5"/><text x="38" y="414" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#f59e0b">WHAT IT EMITS  ·  FOUR AXES, THREE IN THE SCALAR</text><g filter="url(#sh)"><rect x="100" y="420" width="340" height="88" rx="10" class="surface" stroke-width="1.2"/></g><text x="270.0" y="464.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">One comparable number</text><text x="270.0" y="483.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">1.0 x cpu  +  1.0 x io  +  2.0 x net</text><g filter="url(#sh)"><rect x="540" y="420" width="340" height="88" rx="10" class="surface" stroke-width="1.2"/></g><text x="710.0" y="464.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Peak working set</text><text x="710.0" y="483.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">a max along the tree, never summed</text><path d="M 420 350 L 300 416" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="300" y="382" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">cpu, io, net</text><path d="M 560 350 L 700 416" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="700" y="382" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">mem</text><text x="270" y="552" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">ranks the alternatives:</text><text x="270" y="572" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">join order, join strategy, whether to spill</text><text x="710" y="552" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">gates feasibility, not throughput --</text><text x="710" y="572" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">a peak is not a quantity you can add up</text></svg>