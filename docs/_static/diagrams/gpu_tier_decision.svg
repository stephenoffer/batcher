<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 616" role="img" width="980" height="616"><defs><style>
  .surface { fill: #ffffff; stroke: #cbd5e1; }
  .band-blue { fill: #eff6ff; stroke: #3b82f6; }
  .band-amber { fill: #fffbeb; stroke: #f59e0b; }
  .band-grey { fill: #f8fafc; stroke: #cbd5e1; }
  .t-title { fill: #1e293b; }
  .t-sub { fill: #5b6675; }
  .t-arrow { fill: #475569; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1e293b; stroke: #334155; }
    .band-blue { fill: #172554; stroke: #3b82f6; }
    .band-amber { fill: #2c1f06; stroke: #f59e0b; }
    .band-grey { fill: #131c31; stroke: #334155; }
    .t-title { fill: #e2e8f0; }
    .t-sub { fill: #94a3b8; }
    .t-arrow { fill: #cbd5e1; }
  }
</style>
<filter id="sh" x="-20%" y="-30%" width="140%" height="180%">
  <feDropShadow dx="0" dy="2.5" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.18"/>
</filter>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><rect x="20" y="24" width="940" height="148" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="48" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">WHY THIS TIER IS DIFFERENT</text><g filter="url(#sh)"><rect x="44" y="58" width="396" height="66" rx="10" class="surface" stroke-width="1.2"/></g><text x="242.0" y="91.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">every other tier</text><text x="242.0" y="110.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">consumes the same Rust bc_expr::Expr</text><text x="242" y="144" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">one definition of what a shape means, so it cannot drift</text><g filter="url(#sh)"><rect x="540" y="58" width="396" height="66" rx="10" class="surface" stroke-width="1.2"/></g><text x="738.0" y="91.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">the device tier</text><text x="738.0" y="110.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">cuDF has no Rust binding</text><text x="738" y="144" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">a second statement of the semantics, in another language</text><text x="490" y="96" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">vs</text><path d="M 738 158 L 738 196" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="752" y="186" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">so every tag is classified</text><rect x="20" y="202" width="940" height="202" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="226" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">EVERY IR TAG IS IN EXACTLY ONE OF TWO SETS</text><g filter="url(#sh)"><rect x="44" y="238" width="420" height="72" rx="10" class="surface" stroke-width="1.2"/></g><text x="254.0" y="274.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">translated</text><text x="254.0" y="293.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">SUPPORTED_OPS  /  exprs._HANDLERS</text><text x="254" y="332" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">filter, project, aggregate, sort, distinct, limit,</text><text x="254" y="349" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">window, unnest, unpivot, row_id -- and the</text><text x="254" y="366" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">expression vocabularies keyed beside them</text><g filter="url(#sh)"><rect x="516" y="238" width="420" height="72" rx="10" class="surface" stroke-width="1.2"/></g><text x="726.0" y="274.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">declined, with a reason</text><text x="726.0" y="293.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">DECLINED_OPS  /  DECLINED_EXPRS</text><text x="726" y="332" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">asof_join, range_join, sample: not translated.</text><text x="726" y="349" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">image / audio / geo: Rust kernels with no</text><text x="726" y="366" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">dataframe equivalent to translate onto</text><text x="490" y="282" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">no third state</text><text x="490" y="390" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">a tag in neither set fails test_gpu_vocabulary_contract -- so a new operator is a decision, not an oversight</text><path d="M 254 404 L 254 442" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="266" y="432" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">all nodes translate</text><path d="M 726 404 L 726 442" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="738" y="432" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">any node declines</text><rect x="20" y="448" width="940" height="148" rx="16" class="band-amber" stroke-width="1.5"/><text x="38" y="472" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#f59e0b">THE PLAN GOES ONE WAY OR THE OTHER, WHOLE</text><g filter="url(#sh)"><rect x="44" y="474" width="420" height="66" rx="10" class="surface" stroke-width="1.2"/></g><text x="254.0" y="507.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">run on the device</text><text x="254.0" y="526.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">cuDF, one shard per device</text><g filter="url(#sh)"><rect x="516" y="474" width="420" height="66" rx="10" class="surface" stroke-width="1.2"/></g><text x="726.0" y="507.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">run on the CPU engine</text><text x="726.0" y="526.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">the same rows, more slowly</text><text x="254" y="562" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">eligible only as a chain over a scan, a join of two</text><text x="254" y="579" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">chains, or a union of chains</text><text x="726" y="562" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">a decline costs time; an approximation would cost a</text><text x="726" y="579" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">wrong answer, so backend="gpu" is always safe to ask for</text></svg>