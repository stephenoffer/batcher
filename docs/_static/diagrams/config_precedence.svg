.0" y="453.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Built-in defaults</text><text x="380.0" y="472.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">the dataclass field values</text><path d="M 76 486 L 76 74" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="76" y="54" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">wins</text><text x="76" y="508" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">loses</text><path d="M 668 76 L 676 76 L 676 210 L 668 210" fill="none" stroke="#2563eb" stroke-width="2"/><path d="M 668 266 L 676 266 L 676 480 L 668 480" fill="none" stroke="#94a3b8" stroke-width="2"/><text x="130" y="54" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="1.8" fill="#2563eb">SET AT RUNTIME</text><text x="700" y="107.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Innermost with block, restored on exit</text><text x="700" y="187.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Process-wide until changed</text><text x="130" y="244" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="1.8" fill="#5b6675">READ ONCE AT IMPORT</text><text x="700" y="297.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Overlays the file</text><text x="700" y="377.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Overlays the defaults</text><text x="700" y="448.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">What reset_option restores, not</text><text x="700" y="466.0" text-anchor="start