<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 684" role="img" width="980" height="684"><defs><style>
  .surface { fill: #ffffff; stroke: #cbd5e1; }
  .band-blue { fill: #eff6ff; stroke: #3b82f6; }
  .band-amber { fill: #fffbeb; stroke: #f59e0b; }
  .band-grey { fill: #f8fafc; stroke: #cbd5e1; }
  .t-title { fill: #1e293b; }
  .t-sub { fill: #5b6675; }
  .t-arrow { fill: #475569; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1e293b; stroke: #334155; }
    .band-blue { fill: #172554; stroke: #3b82f6; }
    .band-amber { fill: #2c1f06; stroke: #f59e0b; }
    .band-grey { fill: #131c31; stroke: #334155; }
    .t-title { fill: #e2e8f0; }
    .t-sub { fill: #94a3b8; }
    .t-arrow { fill: #cbd5e1; }
  }
</style>
<filter id="sh" x="-20%" y="-30%" width="140%" height="180%">
  <feDropShadow dx="0" dy="2.5" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.18"/>
</filter>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><text x="490" y="50" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">One statement over a target holding keys 1, 2, 3 and a change set holding keys 2, 3, 4. Each key falls into exactly one population.</text><rect x="20" y="78" width="940" height="222" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="102" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">THREE POPULATIONS, THREE CLAUSES</text><g filter="url(#sh)"><rect x="50" y="148" width="280" height="84" rx="10" class="surface" stroke-width="1.2"/></g><text x="190.0" y="190.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">NOT MATCHED BY SOURCE</text><text x="190.0" y="209.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">target key 1, absent from the change set</text><text x="190.0" y="252" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">update · update_all · delete</text><text x="190.0" y="274" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">1 target row</text><g filter="url(#sh)"><rect x="350" y="148" width="250" height="84" rx="10" class="surface" stroke-width="1.2"/></g><text x="475.0" y="190.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">MATCHED</text><text x="475.0" y="209.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">keys 2 and 3, present in both</text><text x="475.0" y="252" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">update · update_all · delete</text><text x="475.0" y="274" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">2 matched rows</text><g filter="url(#sh)"><rect x="630" y="148" width="280" height="84" rx="10" class="surface" stroke-width="1.2"/></g><text x="770.0" y="190.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">NOT MATCHED</text><text x="770.0" y="209.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">source key 4, new to the target</text><text x="770.0" y="252" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">insert · insert_all</text><text x="770.0" y="274" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">1 new row</text><rect x="20" y="320" width="940" height="136" rx="16" class="band-amber" stroke-width="1.5"/><text x="38" y="344" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#f59e0b">ALL OF IT IN ONE VERSION</text><path d="M 190 286 L 380 360" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><path d="M 475 286 L 490.0 360" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><path d="M 770 286 L 600 360" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><g filter="url(#sh)"><rect x="320" y="366" width="340" height="76" rx="10" class="surface" stroke-width="1.2"/></g><text x="490.0" y="404.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">one Delta commit</text><text x="490.0" y="423.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">only the files the join touches are rewritten</text><text x="50" y="400" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">clauses are tried in</text><text x="50" y="416" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">the order they were</text><text x="50" y="432" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">added; first match wins</text><text x="700" y="408" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">no clause of the three</text><text x="700" y="424" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">is visible on its own</text><rect x="20" y="476" width="940" height="190" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="500" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">THE ALTERNATIVE: DELETE, THEN APPEND</text><text x="40" y="542" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">MERGE INTO</text><path d="M 230 538 H 900" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arG)"/><text x="40" y="600" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">DELETE, THEN APPEND</text><path d="M 230 596 H 900" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arG)"/><path d="M 330 524 V 552" stroke="#2563eb" stroke-width="3"/><text x="330" y="518" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">one commit</text><text x="560" y="518" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">readers see the table before it, or after it</text><rect x="420" y="582" width="240" height="28" rx="5" fill="#d97706" fill-opacity="0.16" stroke="#d97706" stroke-width="1.4"/><path d="M 420 582 V 610" stroke="#d97706" stroke-width="3"/><path d="M 660 582 V 610" stroke="#d97706" stroke-width="3"/><text x="420" y="576" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">delete commits</text><text x="660" y="576" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">append commits</text><text x="540" y="600" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">rows gone, not yet replaced</text><text x="40" y="634" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">One commit is a property of a transactional target. On a plain directory there is no log: the merge writes its new files and then deletes the ones it</text><text x="40" y="652" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">replaced, so a crash between the two leaves both copies of a key. A when_not_matched_by_source clause forces a full rewrite: no file can be skipped.</text></svg>