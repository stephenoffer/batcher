ont-weight="700" class="t-title">class Classifier</text><text x="733.0" y="128.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">__init__ loads the model once</text><path d="M 730.0 146 L 730.0 177" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="742.0" y="168" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">one instance</text><g filter="url(#sh)"><rect x="530" y="180" width="400" height="62" rx="10" class="surface" stroke-width="1.2"/></g><text x="730.0" y="211.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">batch 1</text><text x="730.0" y="230.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">__call__ scores</text><rect x="864.25" y="189" width="47.5" height="20" rx="10" class="pill-blue"/><text x="888.0" y="203" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.4" class="pt-blue">reuse</text><g filter="url(#sh)"><rect x="530" y="268" width="400" height="62" rx="10" class="surface" stroke-width="1.2"/></g><text x="730.0" y="299.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">batch 2</text><text x="730.0" y="318.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">__call__ scores</text><rect x="864.25" y="277" width="47.5" height="20" rx="10" class="pill-blue"/><text x="888.0" y="291" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.4" class="pt-blue">reuse</text><path d="M 730.0 242 L 730.0 265" fill="none" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arG)"/><text x="742.0" y="259.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" 