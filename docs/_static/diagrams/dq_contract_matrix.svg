</defs><text x="490" y="40" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">All three live on ds.dq and chain together. They part company at the terminal.</text><rect x="20" y="62" width="940" height="498" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="86" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8"></text><text x="430" y="100" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="1.8" fill="#2563eb">ROW-LEVEL</text><text x="634" y="100" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="1.8" fill="#d97706">RELATION-LEVEL</text><text x="838" y="100" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="1.8" fill="#5b6675">SCHEMA</text><text x="430" y="120" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">data-quality page</text><text x="634" y="120" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">this page</text><text x="838" y="120" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">this page</text><path d="M 36 140 L 944 140" stroke="#cbd5e1" stroke-width="1"/><path d="M 36 201 L 944 201" stroke="#cbd5e1" stroke-width="1"/><path d="M 36 263 L 944 263" stroke="#cbd5e1" stroke-width="1"/><path d="M 36 325 L 944 325" stroke="#cbd5e1" stroke-width="1"/><path d="M 36 410 L 944 410" stroke="#cbd5e1" stroke-width="1"/><text x="38" y="175" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">What it decides</text><text x="430" y="175" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-title">each row: valid or not</text><text x="634" y="175" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-title">one number for the table</text><text x="838" y="175" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-title">column names and types</text><text x="38" y="237" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">For example</text><text x="430" y="228" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" class="t-sub">not_null, in_range,</text><text x="430" y="245" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" class="t-sub">not_in_future</text><text x="634" y="228" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" class="t-sub">row_count_between,</text><text x="634" y="245" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" class="t-sub">mean_between, fresh_within</text><text x="838" y="228" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" class="t-sub">has_columns,</text><text x="838" y="245" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" class="t-sub">column_types</text><text x="38" y="299" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">What it costs</text><text x="430" y="290" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" class="t-sub">one keyless aggregate;</text><text x="430" y="307" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" class="t-sub">unique, references add a pass</text><text x="634" y="290" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" class="t-sub">the same</text><text x="634" y="307" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" class="t-sub">keyless aggregate</text><text x="838" y="290" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" class="t-sub">nothing: known</text><text x="838" y="307" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" class="t-sub">before anything runs</text><text x="38" y="366" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">validate() / fail()</text><text x="38" y="384" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">report, or raise</text><circle cx="430" cy="360" r="10" fill="#2563eb"/><path d="M 425.5 360 L 429 363.8 L 435 356.2" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="430" y="390" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" class="t-sub">counts violations</text><circle cx="634" cy="360" r="10" fill="#2563eb"/><path d="M 629.5 360 L 633 363.8 L 639 356.2" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="634" y="390" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" class="t-sub">carries the measured value</text><circle cx="838" cy="360" r="10" fill="#2563eb"/><path d="M 833.5 360 L 837 363.8 L 843 356.2" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="838" y="390" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" class="t-sub">names the mismatch</text><text x="38" y="440" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">drop() / quarantine() /</text><text x="38" y="458" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">annotate()</text><text x="38" y="476" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">act on individual rows</text><circle cx="430" cy="440" r="10" fill="#2563eb"/><path d="M 425.5 440 L 429 443.8 L 435 436.2" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="430" y="470" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" class="t-sub">removes, splits or</text><text x="430" y="486" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" class="t-sub">labels failing rows</text><circle cx="634" cy="440" r="10" fill="none" stroke="#94a3b8" stroke-width="1.8"/><path d="M 630.2 436.2 L 637.8 443.8 M 637.8 436.2 L 630.2 443.8" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/><text x="634" y="470" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-title">refused with PlanError:</text><text x="634" y="486" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" class="t-sub">no violating row exists</text><path d="M 838 429 L 849 440 L 838 451 L 827 440 Z" fill="#d97706"/><path d="M 838 435 L 838 441.5" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/><circle cx="838" cy="445" r="1.3" fill="#ffffff"/><text x="838" y="470" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-title">a gate: DataQualityError</text><text x="838" y="486" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" class="t-sub">first, if the schema is unmet</text><text x="490" y="538" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Check relation-level bounds with validate() or fail(), and keep row-level checks in the chain you drop or quarantine on.</text></svg>