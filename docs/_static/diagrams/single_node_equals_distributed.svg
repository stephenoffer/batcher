<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 690" role="img" width="980" height="690"><defs><style>
  .surface { fill: #ffffff; stroke: #cbd5e1; }
  .band-blue { fill: #eff6ff; stroke: #3b82f6; }
  .band-amber { fill: #fffbeb; stroke: #f59e0b; }
  .band-grey { fill: #f8fafc; stroke: #cbd5e1; }
  .t-title { fill: #1e293b; }
  .t-sub { fill: #5b6675; }
  .t-arrow { fill: #475569; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1e293b; stroke: #334155; }
    .band-blue { fill: #172554; stroke: #3b82f6; }
    .band-amber { fill: #2c1f06; stroke: #f59e0b; }
    .band-grey { fill: #131c31; stroke: #334155; }
    .t-title { fill: #e2e8f0; }
    .t-sub { fill: #94a3b8; }
    .t-arrow { fill: #cbd5e1; }
  }
</style>
<filter id="sh" x="-20%" y="-30%" width="140%" height="180%">
  <feDropShadow dx="0" dy="2.5" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.18"/>
</filter>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><rect x="20" y="24" width="940" height="196" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="48" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">ONE OPERATOR, THREE DEPLOYMENTS</text><g filter="url(#sh)"><rect x="76" y="56" width="200" height="60" rx="10" class="surface" stroke-width="1.2"/></g><text x="176.0" y="86.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">one core</text><text x="176.0" y="105.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">bc-interp::execute</text><path d="M 176 118 L 490 154" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><g filter="url(#sh)"><rect x="390" y="56" width="200" height="60" rx="10" class="surface" stroke-width="1.2"/></g><text x="490.0" y="86.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">many cores</text><text x="490.0" y="105.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">bc-interp::par</text><path d="M 490 118 L 490 154" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><g filter="url(#sh)"><rect x="704" y="56" width="200" height="60" rx="10" class="surface" stroke-width="1.2"/></g><text x="804.0" y="86.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">many machines</text><text x="804.0" y="105.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">bc-interp::dist</text><path d="M 804 118 L 490 154" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="300" y="140" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">the same three functions</text><g filter="url(#sh)"><rect x="340" y="158" width="300" height="56" rx="10" class="surface" stroke-width="1.2"/></g><text x="490.0" y="186.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">partial / combine / finalize</text><text x="490.0" y="205.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">written once</text><text x="490" y="206" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">combine is associative and commutative, so arrival order cannot change which rows come back</text><path d="M 490 226 L 490 262" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="504" y="252" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">therefore</text><rect x="20" y="268" width="940" height="96" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="292" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">EXACT, HOWEVER MANY PARTITIONS</text><text x="166" y="314" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">the multiset of rows</text><text x="490" y="314" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">every column name</text><text x="814" y="314" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">every column type</text><text x="490" y="342" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">no tolerance and no qualification -- these three have no exceptions</text><path d="M 490 370 L 490 406" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="504" y="396" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">except where the query fixes no answer</text><rect x="20" y="412" width="940" height="238" rx="16" class="band-amber" stroke-width="1.5"/><text x="38" y="436" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#f59e0b">THREE PLACES THE QUERY ITSELF DOES NOT DETERMINE AN ANSWER</text><g filter="url(#sh)"><rect x="44" y="446" width="300" height="62" rx="10" class="surface" stroke-width="1.2"/></g><text x="194.0" y="477.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">float reassociation</text><text x="194.0" y="496.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">a SUM over partitions</text><text x="194" y="532" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">IEEE addition is not associative.</text><text x="194" y="549" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Neumaier and Chan bound the error to</text><text x="194" y="566" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">near the last bits; nothing removes it.</text><text x="194" y="596" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">still exact here:</text><text x="194" y="614" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">the row count and every type</text><g filter="url(#sh)"><rect x="340" y="446" width="300" height="62" rx="10" class="surface" stroke-width="1.2"/></g><text x="490.0" y="477.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">an open window tie</text><text x="490.0" y="496.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">row_number over tied rows</text><text x="490" y="532" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">SQL leaves the tie undefined, so the</text><text x="490" y="549" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">two paths break it by different physical</text><text x="490" y="566" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">orders. rank / dense_rank are unaffected.</text><text x="490" y="596" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">still exact here:</text><text x="490" y="614" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">the partitions, and the ranks 1..n</text><g filter="url(#sh)"><rect x="636" y="446" width="300" height="62" rx="10" class="surface" stroke-width="1.2"/></g><text x="786.0" y="477.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">LIMIT with no order</text><text x="786.0" y="496.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">limit over a group_by</text><text x="786" y="532" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">A hash walk is not a query property, so</text><text x="786" y="549" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">LIMIT n keeps some n groups.</text><text x="786" y="566" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">sort(...).limit(n) does not diverge.</text><text x="786" y="596" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">still exact here:</text><text x="786" y="614" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">n rows, each one of the full result</text><text x="490" y="672" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">A divergence that is not one of these three is a defect, however plausible its rows look.</text></svg>