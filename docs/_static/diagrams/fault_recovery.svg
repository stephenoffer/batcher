<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 664" role="img" width="980" height="664"><defs><style>
  .surface { fill: #ffffff; stroke: #cbd5e1; }
  .band-blue { fill: #eff6ff; stroke: #3b82f6; }
  .band-amber { fill: #fffbeb; stroke: #f59e0b; }
  .band-grey { fill: #f8fafc; stroke: #cbd5e1; }
  .t-title { fill: #1e293b; }
  .t-sub { fill: #5b6675; }
  .t-arrow { fill: #475569; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1e293b; stroke: #334155; }
    .band-blue { fill: #172554; stroke: #3b82f6; }
    .band-amber { fill: #2c1f06; stroke: #f59e0b; }
    .band-grey { fill: #131c31; stroke: #334155; }
    .t-title { fill: #e2e8f0; }
    .t-sub { fill: #94a3b8; }
    .t-arrow { fill: #cbd5e1; }
  }
</style>
<filter id="sh" x="-20%" y="-30%" width="140%" height="180%">
  <feDropShadow dx="0" dy="2.5" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.18"/>
</filter>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><rect x="20" y="24" width="940" height="100" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="48" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">A TASK DID NOT RETURN</text><g filter="url(#sh)"><rect x="310" y="48" width="360" height="56" rx="10" class="surface" stroke-width="1.2"/></g><text x="490.0" y="76.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">a map or reduce task raised</text><text x="490.0" y="95.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">or its worker stopped answering</text><path d="M 490 130 L 490 166" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="504" y="158" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">classify before retrying</text><rect x="20" y="172" width="940" height="244" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="196" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">THREE VERDICTS, AND ONLY ONE OF THEM RETRIES</text><g filter="url(#sh)"><rect x="44" y="206" width="274" height="62" rx="10" class="surface" stroke-width="1.2"/></g><text x="181.0" y="237.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">lost data</text><text x="181.0" y="256.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">recompute it</text><text x="181" y="292" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">A RayError that is not a RayTaskError:</text><text x="181" y="309" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">an actor, a worker or a node died.</text><text x="181" y="326" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Also RetryableShuffleError (an</text><text x="181" y="343" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">unreachable peer) and ResourceError</text><text x="181" y="360" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">(a spill file on an ephemeral disk).</text><g filter="url(#sh)"><rect x="356" y="206" width="274" height="62" rx="10" class="surface" stroke-width="1.2"/></g><text x="493.0" y="237.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">a deterministic bug</text><text x="493.0" y="256.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">re-raise it</text><text x="493" y="292" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">A UDF exception, a bad cast, a schema</text><text x="493" y="309" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">mismatch, a broken runtime env.</text><text x="493" y="326" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Every retry re-runs it, burns the</text><text x="493" y="343" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">job-wide budget, and reports a</text><text x="493" y="360" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">resource error for a Python bug.</text><g filter="url(#sh)"><rect x="668" y="206" width="274" height="62" rx="10" class="surface" stroke-width="1.2"/></g><text x="805.0" y="237.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">results untrusted</text><text x="805.0" y="256.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">refuse to continue</text><text x="805" y="292" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">An uncontained ECC fault: the device</text><text x="805" y="309" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">kept running and answered wrongly.</text><text x="805" y="326" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Work already finished on it is as</text><text x="805" y="343" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">suspect as the task that failed, so</text><text x="805" y="360" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">retrying writes out corruption.</text><path d="M 181 392 L 181 440" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="193" y="424" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">only this one</text><rect x="20" y="446" width="940" height="138" rx="16" class="band-amber" stroke-width="1.5"/><text x="38" y="470" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#f59e0b">WHAT A RECOMPUTE COSTS, AND WHAT WAS ARRANGED BEFOREHAND</text><g filter="url(#sh)"><rect x="44" y="472" width="274" height="58" rx="10" class="surface" stroke-width="1.2"/></g><text x="181.0" y="501.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">re-read and re-map</text><text x="181.0" y="520.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">the default</text><text x="181" y="550" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Re-read the source partition and re-run</text><text x="181" y="567" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">the map. Usually the longest phase.</text><g filter="url(#sh)"><rect x="356" y="472" width="274" height="58" rx="10" class="surface" stroke-width="1.2"/></g><text x="493.0" y="501.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">fetch a replica</text><text x="493.0" y="520.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">shuffle_replication > 1</text><text x="493" y="550" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">An off-node copy was acknowledged</text><text x="493" y="567" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">before the bucket was advertised.</text><g filter="url(#sh)"><rect x="668" y="472" width="274" height="58" rx="10" class="surface" stroke-width="1.2"/></g><text x="805.0" y="501.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">migrate while alive</text><text x="805.0" y="520.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">on advance notice</text><text x="805" y="550" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Spot metadata, SIGTERM or a Slurm</text><text x="805" y="567" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">deadline: one copy, not a re-read.</text><rect x="20" y="596" width="940" height="56" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="620" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">AND THE HAZARD RECOVERY INTRODUCES</text><text x="44" y="632" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">a worker presumed dead may not be</text><text x="340" y="632" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">so each round carries a higher epoch, and a reducer discards any batch arriving under a stale one</text></svg>