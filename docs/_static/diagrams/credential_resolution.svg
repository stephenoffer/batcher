</defs><rect x="20" y="20" width="940" height="450" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">HOW A PATH GETS ITS FILESYSTEM AND CREDENTIALS</text><circle cx="54" cy="91" r="14" fill="#2563eb"/><text x="54" y="95.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffffff">1</text><g filter="url(#sh)"><rect x="95.0" y="62" width="330" height="58" rx="10" class="surface" stroke-width="1.2"/></g><text x="260.0" y="91.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">filesystem= passed?</text><text x="260.0" y="110.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">a pyarrow or fsspec filesystem</text><path d="M 429.0 91 L 600 91" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="510" y="79" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">yes</text><g filter="url(#sh)"><rect x="606" y="62" width="330" height="58" rx="11" fill="url(#tintAmber)" stroke="#fcd34d" stroke-width="1.2"/></g><rect x="606" y="74" width="4" height="34" rx="2" fill="#f59e0b"/><text x="774.0" y="90.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Used verbatim</text><text x="774.0" y="108.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">wins over storage_options</text><path d="M 260 124 L 260 164" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="272" y="150" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">no</text><circle cx="54" cy="199" r="14" fill="#2563eb"/><text x="54" y="203.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffffff">2</text><g filter="url(#sh)"><rect x="95.0" y="170" width="330" height="58" rx="10" class="surface" stroke-width="1.2"/></g><text x="260.0" y="199.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Scheme native to pyarrow?</text><text x="260.0" y="218.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">s3, gs, abfs, hdfs, and aliases</text><path d="M 429.0 199 L 600 199" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="510" y="187" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">no</text><g filter="url(#sh)"><rect x="606" y="170" width="330" height="58" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="606" y="182" width="4" height="34" rx="2" fill="#3b82f6"/><text x="774.0" y="198.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">fsspec backend</text><text x="774.0" y="216.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">storage_options as keyword arguments</text><text x="771" y="248" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">oss, cos, obs, oci, swift, lakefs</text><path d="M 260 232 L 260 272" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="272" y="258" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">yes</text><circle cx="54" cy="307" r="14" fill="#2563eb"/><text x="54" y="311.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffffff">3</text><g filter="url(#sh)"><rect x="95.0" y="278" width="330" height="58" rx="10" class="surface" stroke-width="1.2"/></g><text x="260.0" y="307.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Native backend from the URI</text><text x="260.0" y="326.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">?query options, storage_options added</text><text x="606" y="302" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Explicit keys, an endpoint_override or a role_arn</text><text x="606" y="320" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">set here apply to this path only.</text><path d="M 260 340 L 260 380" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="272" y="366" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">anything left unset</text><circle cx="54" cy="415" r="14" fill="#2563eb"/><text x="54" y="419.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffffff">4</text><g filter="url(#sh)"><rect x="95.0" y="386" width="330" height="58" rx="10" class="surface" stroke-width="1.2"/></g><text x="260.0" y="415.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">The provider SDK's chain</text><text x="260.0" y="434.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">environment, instance or role identity</text><text x="606" y="400" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">AWS_ACCESS_KEY_ID, AZURE_STORAGE_*,</text><text x="606" y="418" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">GOOGLE_APPLICATION_CREDENTIALS: the</text><text x="606" y="436" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">variables each vendor's own tooling reads.</text><text x="490" y="504" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">An env:, file: or cmd: value in storage_options resolves on the machine that opens the connection,</text><text x="490" y="524" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">so a distributed read ships the reference to each worker and never the secret.</text></svg>