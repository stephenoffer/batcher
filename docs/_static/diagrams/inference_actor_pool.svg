<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 750" role="img" width="980" height="750"><defs><style>
  .surface { fill: #ffffff; stroke: #cbd5e1; }
  .band-blue { fill: #eff6ff; stroke: #3b82f6; }
  .band-amber { fill: #fffbeb; stroke: #f59e0b; }
  .band-grey { fill: #f8fafc; stroke: #cbd5e1; }
  .t-title { fill: #1e293b; }
  .t-sub { fill: #5b6675; }
  .t-arrow { fill: #475569; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1e293b; stroke: #334155; }
    .band-blue { fill: #172554; stroke: #3b82f6; }
    .band-amber { fill: #2c1f06; stroke: #f59e0b; }
    .band-grey { fill: #131c31; stroke: #334155; }
    .t-title { fill: #e2e8f0; }
    .t-sub { fill: #94a3b8; }
    .t-arrow { fill: #cbd5e1; }
  }
</style>
<filter id="sh" x="-20%" y="-30%" width="140%" height="180%">
  <feDropShadow dx="0" dy="2.5" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.18"/>
</filter>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><rect x="20" y="20" width="940" height="96" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">ONE PLAN NODE, NOTHING RUNS YET</text><g filter="url(#sh)"><rect x="190" y="44" width="600" height="56" rx="10" class="surface" stroke-width="1.2"/></g><text x="490.0" y="72.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">ds.map_batches(Scorer, num_gpus=1, concurrency=(2, 8))</text><text x="490.0" y="91.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">ds.ml.infer is this call with inference defaults, not a separate operator</text><path d="M 490 102 L 490 190" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="504" y="146" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">each partition goes to the emptiest actor</text><rect x="20" y="152" width="940" height="158" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="176" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">ONE RAY ACTOR PER GPU  -  THE DISTRIBUTED PATH ONLY</text><g filter="url(#sh)"><rect x="80" y="200" width="280" height="78" rx="10" class="surface" stroke-width="1.2"/></g><text x="220.0" y="239.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">actor 1</text><text x="220.0" y="258.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">Scorer() built once, in __init__</text><g filter="url(#sh)"><rect x="620" y="200" width="280" height="78" rx="10" class="surface" stroke-width="1.2"/></g><text x="760.0" y="239.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">actor N</text><text x="760.0" y="258.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">Scorer() built once, in __init__</text><text x="490" y="234" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">num_gpus is a Ray reservation.</text><text x="490" y="252" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">concurrency=(min, max) grows the pool</text><text x="490" y="270" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">while work waits, reaps an idle actor.</text><rect x="20" y="342" width="940" height="278" rx="16" class="band-amber" stroke-width="1.5"/><text x="38" y="366" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#f59e0b">INSIDE ONE ACTOR</text><text x="337" y="382" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">in input order</text><text x="647" y="382" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">rows/s and VRAM</text><g filter="url(#sh)"><rect x="60" y="394" width="250" height="88" rx="10" class="surface" stroke-width="1.2"/></g><text x="185.0" y="438.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">InferencePool</text><text x="185.0" y="457.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">threads, one shared model</text><g filter="url(#sh)"><rect x="370" y="394" width="250" height="88" rx="10" class="surface" stroke-width="1.2"/></g><text x="495.0" y="438.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">your __call__(batch)</text><text x="495.0" y="457.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">a whole Arrow RecordBatch</text><g filter="url(#sh)"><rect x="680" y="394" width="250" height="88" rx="10" class="surface" stroke-width="1.2"/></g><text x="805.0" y="438.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">autobatch</text><text x="805.0" y="457.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">hill-climb under a VRAM cap</text><path d="M 310 438 L 364 438" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><path d="M 620 438 L 674 438" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><path d="M 805 482 Q 490 544 185 482" fill="none" stroke="#d97706" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#arA)"/><text x="490" y="562" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">the next batch size</text><text x="490" y="586" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">The threads share one model and one CUDA context, so they buy overlap with host work, not replicas.</text><text x="490" y="606" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">An OOM bisects the batch and records a ceiling for the run; the size that worked is written back for the next one.</text><rect x="20" y="652" width="940" height="86" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="676" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">THE BATCH-FIRST BOUNDARY</text><text x="490" y="692" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Your callable is handed a whole pyarrow.RecordBatch. batch_format reframes only the call; the data plane stays Arrow.</text><text x="490" y="712" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">ds.map is the row-at-a-time escape hatch, and it is marked as one so a profile can price what it costs.</text></svg>