<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><rect x="20" y="24" width="940" height="142" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="48" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">CUT THE PLAN AT ITS PIPELINE BREAKERS</text><text x="44" y="62" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">the cut set is decided from the plan alone (plan_analysis._has_breaker); the cluster does not enter into it</text><g filter="url(#sh)"><rect x="44" y="76" width="230" height="62" rx="10" class="surface" stroke-width="1.2"/></g><text x="159.0" y="107.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">scan / filter / project</text><text x="159.0" y="126.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">row-wise: no cut</text><path d="M 278 107 L 326 107" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="302" y="94" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">rows</text><g filter="url(#sh)"><rect x="332" y="76" width="190" height="62" rx="10" class="surface" stroke-width="1.2"/></g><text x="427.0" y="107.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">aggregate</text><text x="427.0" y="126.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">BREAKER</text><path d="M 526 107 L 574 107" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="550" y="94" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">groups</text><g filter="url(#sh)"><rect x="580" y="76" width="190" height="62" rx="10" class="surface" stroke-width="1.2"/></g><text x="675.0" y="107.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">sort</text><text x="675.0" y="126.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">BREAKER</text><path d="M 774 107 L 822 107" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="798" y="94" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">rows</text><g filter="url(#sh)"><rect x="828" y="76" width="110" height="62" rx="10" class="surface" stroke-width="1.2"/></g><text x="883.0" y="107.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">limit</text><text x="883.0" y="126.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">BREAKER</text><path d="M 328 70 L 328 150" fill="none" stroke="#d97706" stroke-width="2.4" stroke-dasharray="5 5"/><path d="M 576 70 L 576 150" fill="none" stroke="#d97706" stroke-width="2.4" stroke-dasharray="5 5"/><path d="M 824 70 L 824 150" fill="none" stroke="#d97706" stroke-width="2.4" stroke-dasharray="5 5"/><text x="452" y="162" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Aggregate, Sort, Join, Distinct, Limit -- every other node runs inside the stage it is in</text><path d="M 490 172 L 490 208" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="504" y="196" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">one cut = one stage</text><rect x="20" y="214" width="940" height="216" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="238" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">ONE STAGE: MAP TASKS, A BARRIER, REDUCE TASKS</text><text x="150" y="250" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">workers x 4 partitions</text><rect x="44" y="262" width="48" height="96" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="98" y="262" width="48" height="96" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="152" y="262" width="48" height="96" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="206" y="262" width="48" height="96" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><text x="150" y="378" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">each a durable descriptor:</text><text x="150" y="394" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">splits + pushed projection</text><path d="M 266 306 L 322 306" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="294" y="292" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">dealt to</text><text x="294" y="326" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">an idle actor</text><g filter="url(#sh)"><rect x="328" y="262" width="214" height="96" rx="10" class="surface" stroke-width="1.2"/></g><text x="435.0" y="310.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">map tasks</text><text x="435.0" y="329.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">partial_aggregate</text><text x="435" y="378" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">exactly `workers` in flight,</text><text x="435" y="394" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">the slow node takes fewer</text><path d="M 546 306 L 618 306" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="582" y="292" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">one bucket</text><text x="582" y="326" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">per reducer</text><g filter="url(#sh)"><rect x="624" y="262" width="214" height="96" rx="10" class="surface" stroke-width="1.2"/></g><text x="731.0" y="310.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">reduce tasks</text><text x="731.0" y="329.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">combine / combine_finalize</text><text x="731" y="378" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">a bucket is reduced by the</text><text x="731" y="394" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">one worker it hashes to</text><text x="896" y="300" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">BARRIER</text><path d="M 584 250 L 584 370" fill="none" stroke="#d97706" stroke-width="2.4" stroke-dasharray="5 5"/><path d="M 490 436 L 490 470" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="504" y="460" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">and then?</text><rect x="20" y="476" width="940" height="118" rx="16" class="band-amber" stroke-width="1.5"/><text x="38" y="500" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#f59e0b">WHAT CROSSES TO THE NEXT STAGE</text><g filter="url(#sh)"><rect x="44" y="508" width="268" height="66" rx="10" class="surface" stroke-width="1.2"/></g><text x="178.0" y="541.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">handles</text><text x="178.0" y="560.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">one per reducer bucket</text><path d="M 316 541 L 386 541" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="351" y="528" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">scanned in place</text><g filter="url(#sh)"><rect x="392" y="508" width="268" height="66" rx="10" class="surface" stroke-width="1.2"/></g><text x="526.0" y="541.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">the next stage</text><text x="526.0" y="560.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">an ordinary scan of them</text><text x="680" y="526" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">The rows stay on the worker that computed them.</text><text x="680" y="544" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">A multi-join query never round-trips an</text><text x="680" y="562" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">intermediate through the driver.</text></svg>