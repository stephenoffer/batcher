</defs><g filter="url(#sh)"><rect x="360" y="22" width="320" height="64" rx="10" class="surface" stroke-width="1.2"/></g><text x="520.0" y="54.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Where is the data now?</text><text x="520.0" y="73.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">every answer is a lazy Dataset</text><path d="M 356 54 L 275 54 Q 265 54 265 64 L 265 126" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="310" y="42" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">in Python</text><path d="M 684 54 L 765 54 Q 775 54 775 64 L 775 126" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="730" y="42" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">at a path</text><rect x="20" y="132" width="490" height="356" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="156" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">IN MEMORY: bt.from_*</text><rect x="530" y="132" width="490" height="356" rx="16" class="band-amber" stroke-width="1.5"/><text x="548" y="156" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#f59e0b">IN FILES OR A BUCKET: bt.read</text><text x="44" y="180" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">you hold ...</text><text x="300" y="180" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">start with</text><text x="554" y="180" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">the input is ...</text><text x="810" y="180" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">start with</text><text x="44" y="209" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">a column dict</text><path d="M 258 205 L 288 205" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><rect x="300" y="195" width="99.4" height="21" rx="10" class="pill-blue"/><text x="349.7" y="209.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" class="pt-blue">from_pydict</text><text x="44" y="253" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">an Arrow table or batches</text><path d="M 258 249 L 288 249" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><rect x="300" y="239" width="92.0" height="21" rx="10" class="pill-blue"/><text x="346.0" y="253.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" class="pt-blue">from_arrow</text><text x="44" y="297" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">a NumPy array</text><path d="M 258 293 L 288 293" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><rect x="300" y="283" width="92.0" height="21" rx="10" class="pill-blue"/><text x="346.0" y="297.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" class="pt-blue">from_numpy</text><text x="44" y="341" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">a pandas or Polars frame</text><path d="M 258 337 L 288 337" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><rect x="300" y="327" width="195.60000000000002" height="21" rx="10" class="pill-blue"/><text x="397.8" y="341.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" class="pt-blue">from_pandas, from_polars</text><text x="44" y="385" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">a list of Python items</text><path d="M 258 381 L 288 381" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><rect x="300" y="371" width="92.0" height="21" rx="10" class="pill-blue"/><text x="346.0" y="385.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" class="pt-blue">from_items</text><text x="44" y="429" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">a factory yielding batches</text><path d="M 258 425 L 288 425" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><rect x="300" y="415" width="106.80000000000001" height="21" rx="10" class="pill-blue"/><text x="353.4" y="429.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" class="pt-blue">from_batches</text><text x="554" y="209" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">the extension names it</text><path d="M 768 205 L 798 205" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><rect x="810" y="195" width="114.2" height="21" rx="10" class="pill-amber"/><text x="867.1" y="209.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" class="pt-amber">bt.read(path)</text><text x="554" y="253" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">a directory of one format</text><path d="M 768 249 L 798 249" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><rect x="810" y="239" width="151.20000000000002" height="21" rx="10" class="pill-amber"/><text x="885.6" y="253.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" class="pt-amber">bt.read(directory)</text><text x="554" y="297" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">you name the format</text><path d="M 768 293 L 798 293" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><rect x="810" y="283" width="180.8" height="21" rx="10" class="pill-amber"/><text x="900.4" y="297.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" class="pt-amber">read.parquet, read.csv</text><text x="554" y="341" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">a Delta or Iceberg table</text><path d="M 768 337 L 798 337" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><rect x="810" y="327" width="195.60000000000002" height="21" rx="10" class="pill-amber"/><text x="907.8" y="341.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" class="pt-amber">read.delta, read.iceberg</text><text x="554" y="385" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">images, audio or video</text><path d="M 768 381 L 798 381" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><rect x="810" y="371" width="188.20000000000002" height="21" rx="10" class="pill-amber"/><text x="904.1" y="385.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" class="pt-amber">read.images, read.video</text><text x="554" y="429" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">a database or warehouse</text><path d="M 768 425 L 798 425" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><rect x="810" y="415" width="195.60000000000002" height="21" rx="10" class="pill-amber"/><text x="907.8" y="429.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" class="pt-amber">read.sql, read.snowflake</text><text x="265" y="468" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">No files and no credentials needed.</text><text x="775" y="468" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Two formats in one directory: pass format=.</text><text x="520" y="524" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Both columns are lazy. Nothing is read until a terminal operation such as collect runs.</text></svg>