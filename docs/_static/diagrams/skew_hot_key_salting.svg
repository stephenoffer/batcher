</defs><rect x="20" y="20" width="456" height="482" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">BEFORE: HASH(KEY) ONLY</text><rect x="504" y="20" width="456" height="482" rx="16" class="band-blue" stroke-width="1.5"/><text x="522" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">AFTER: HOT KEY SALTED</text><g filter="url(#sh)"><rect x="44" y="60" width="408" height="52" rx="11" fill="url(#tintAmber)" stroke="#fcd34d" stroke-width="1.2"/></g><rect x="44" y="72" width="4" height="28" rx="2" fill="#f59e0b"/><text x="251.0" y="85.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">probe side</text><text x="251.0" y="103.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">customer_id = -1 is most rows</text><path d="M 248 116 L 248 156" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="260" y="142" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">shuffle</text><g filter="url(#sh)"><rect x="528" y="60" width="408" height="52" rx="11" fill="url(#tintAmber)" stroke="#fcd34d" stroke-width="1.2"/></g><rect x="528" y="72" width="4" height="28" rx="2" fill="#f59e0b"/><text x="735.0" y="85.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">probe side</text><text x="735.0" y="103.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">-1 marked hot by the sketch</text><path d="M 732 116 L 732 156" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="744" y="142" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">shuffle</text><text x="248" y="184" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">equal keys hash to one place, by construction</text><text x="148" y="223" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-title">reducer 0</text><rect x="164" y="208" width="290" height="22" rx="5" fill="none" stroke="#cbd5e1" stroke-dasharray="3 3"/><rect x="164" y="208" width="196.88" height="22" rx="5" fill="#d97706" fill-opacity="0.85"/><rect x="360.88" y="208" width="17.12" height="22" rx="5" fill="#3b82f6" fill-opacity="0.45"/><text x="148" y="244" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="10.5" class="t-sub">all -1 rows</text><text x="148" y="279" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-title">reducer 1</text><rect x="164" y="264" width="290" height="22" rx="5" fill="none" stroke="#cbd5e1" stroke-dasharray="3 3"/><rect x="164.0" y="264" width="42.800000000000004" height="22" rx="5" fill="#3b82f6" fill-opacity="0.45"/><text x="148" y="300" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="10.5" class="t-sub">cold keys</text><text x="148" y="335" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-title">reducer 2</text><rect x="164" y="320" width="290" height="22" rx="5" fill="none" stroke="#cbd5e1" stroke-dasharray="3 3"/><rect x="164.0" y="320" width="38.519999999999996" height="22" rx="5" fill="#3b82f6" fill-opacity="0.45"/><text x="148" y="356" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="10.5" class="t-sub">cold keys</text><text x="148" y="391" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-title">reducer 3</text><rect x="164" y="376" width="290" height="22" rx="5" fill="none" stroke="#cbd5e1" stroke-dasharray="3 3"/><rect x="164.0" y="376" width="47.08" height="22" rx="5" fill="#3b82f6" fill-opacity="0.45"/><text x="148" y="412" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="10.5" class="t-sub">cold keys</text><text x="248" y="448" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#d97706">one reducer carries the key</text><text x="248" y="470" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">No bucket count or re-hash separates</text><text x="248" y="486" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">rows that share a key.</text><text x="732" y="184" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">hot rows fan out; cold keys hash as before</text><text x="632" y="223" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-title">reducer 0</text><rect x="648" y="208" width="290" height="22" rx="5" fill="none" stroke="#cbd5e1" stroke-dasharray="3 3"/><rect x="648" y="208" width="66.34" height="22" rx="5" fill="#d97706" fill-opacity="0.85"/><rect x="714.34" y="208" width="17.12" height="22" rx="5" fill="#3b82f6" fill-opacity="0.45"/><text x="632" y="244" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="10.5" class="t-sub">-1 share + build copy</text><text x="632" y="279" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-title">reducer 1</text><rect x="648" y="264" width="290" height="22" rx="5" fill="none" stroke="#cbd5e1" stroke-dasharray="3 3"/><rect x="648" y="264" width="66.34" height="22" rx="5" fill="#d97706" fill-opacity="0.85"/><rect x="714.34" y="264" width="42.800000000000004" height="22" rx="5" fill="#3b82f6" fill-opacity="0.45"/><text x="632" y="300" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="10.5" class="t-sub">-1 share + build copy</text><text x="632" y="335" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-title">reducer 2</text><rect x="648" y="320" width="290" height="22" rx="5" fill="none" stroke="#cbd5e1" stroke-dasharray="3 3"/><rect x="648" y="320" width="64.2" height="22" rx="5" fill="#d97706" fill-opacity="0.85"/><rect x="712.2" y="320" width="38.519999999999996" height="22" rx="5" fill="#3b82f6" fill-opacity="0.45"/><text x="632" y="356" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="10.5" class="t-sub">-1 share + build copy</text><text x="632" y="391" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-title">reducer 3</text><rect x="648" y="376" width="290" height="22" rx="5" fill="none" stroke="#cbd5e1" stroke-dasharray="3 3"/><rect x="648.0" y="376" width="47.08" height="22" rx="5" fill="#3b82f6" fill-opacity="0.45"/><text x="632" y="412" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="10.5" class="t-sub">cold keys</text><text x="732" y="448" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#3b82f6">the key&apos;s load is split</text><text x="732" y="470" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Matching build rows are copied to each share,</text><text x="732" y="486" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">so the joined relation is unchanged.</text><rect x="44" y="524" width="22" height="12" rx="3" fill="#d97706" fill-opacity="0.85"/><text x="74" y="534" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">rows of the hot key</text><rect x="226" y="524" width="22" height="12" rx="3" fill="#3b82f6" fill-opacity="0.45"/><text x="256" y="534" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">cold-key rows</text><line x1="372" y1="520" x2="372" y2="540" stroke="#94a3b8"/><text x="390" y="534" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">A key is hot when it covers skew_join_fraction of the rows, 10% by default.</text></svg>