ns-serif" font-size="12.5" font-weight="700" fill="#d97706" letter-spacing="1.2">MEASURES</text><text x="715.0" y="424" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#2563eb">core.execute</text><g filter="url(#sh)"><rect x="150" y="340" width="230" height="96" rx="10" class="surface" stroke-width="1.2"/></g><text x="265.0" y="388.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">MetadataHub</text><text x="265.0" y="407.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">sketches and measured rows</text><text x="265.0" y="366" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#d97706" letter-spacing="1.2">REMEMBERS</text><text x="265.0" y="424" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#2563eb">collect_source_metadata</text><path d="M 388 138.0 L 590 138.0" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="490.0" y="122.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">a PhysicalPlan</text><text x="490.0" y="164.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">with a resource bound per operator</text><path d="M 715.0 194 L 715.0 330" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="729.0" y="244" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">it fits:</text><text x="729.0" y="262" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">reserve, then run</text><path d="M 590 388.0 L 388 388.0" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="490.0" y="372.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">per-operator metrics</text><text x="490.0" y="414.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">actual rows, time, peak bytes</text><path d="M 265.0 330 L 265.0 194" fill="none" stroke="#d97706" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#arA)"/><text x="249.0" y="244" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#d97706">read on the</text><text x="249.0" y="262" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#d97706">next run, not this one</text><g filter="url(#sh)"><rect x="395" y="206" width="190" height="76" rx="10" class="surface" stroke-width="1.2"/></g><text x="490.0" y="244.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Out-of-core</text><text x="490.0" y="263.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">a counter-offer</text><path d="M 630 194 L 595 224" fill="none" stroke="#d97706" stroke-width="2.2" marker-end="url(#arA)"/><path d="M 595 268 L 646 330" fill="none" stroke="#d97706" stroke-width="2.2" marker-end="url(#arA)"/><text x="490.0" y="190" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">won't fit in memory: spill, then run</text><text x="490.0" y="302" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Any other binding constraint raises instead:</text><text x="490.0" y="320" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">spilling only ever answers a memory constraint.</text><path d="M 265.0 44 L 265.0 80" fill="none" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arG)"/><text x="265.0" y="34" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">collect() / write(): the first real work</text><path d="M 715.0 444 L 715.0 488" fill="none" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arG)"/><text x="715.0" y="506" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Arrow batches, zero-copy</text></svg>