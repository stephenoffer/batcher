</defs><rect x="16" y="20" width="948" height="402" rx="16" class="band-blue" stroke-width="1.5"/><text x="34" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">THREE WAYS TO MAKE A VECTOR CHEAPER</text><text x="36" y="80" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="1.8" fill="#5b6675">OPTION</text><text x="208" y="80" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="1.8" fill="#5b6675">CALL</text><text x="438" y="80" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="1.8" fill="#5b6675">RESULT</text><text x="630" y="80" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="1.8" fill="#5b6675">SEARCH WITH</text><text x="798" y="80" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="1.8" fill="#5b6675">RECALL</text><rect x="192" y="98" width="752" height="98" rx="10" class="surface" stroke-width="1"/><g filter="url(#sh)"><rect x="36" y="98" width="140" height="98" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="36" y="110" width="4" height="74" rx="2" fill="#3b82f6"/><text x="109.0" y="152.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Normalize</text><text x="208" y="143.0" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="12.5" class="t-code">normalize=True</text><text x="208" y="163.0" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="12.5" class="t-code">.list.normalize()</text><text x="438" y="143.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">unit length,</text><text x="438" y="162.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">same dimensions</text><text x="630" y="143.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">dot product,</text><text x="630" y="162.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">ranks like cosine</text><circle cx="808" cy="146.0" r="10" fill="#2563eb"/><path d="M 803.5 146.0 L 807 149.8 L 813 142.2" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="826" y="150.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">no loss vs cosine</text><rect x="192" y="208" width="752" height="98" rx="10" class="surface" stroke-width="1"/><g filter="url(#sh)"><rect x="36" y="208" width="140" height="98" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="36" y="220" width="4" height="74" rx="2" fill="#3b82f6"/><text x="109.0" y="262.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Binarize</text><text x="208" y="253.0" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="12.5" class="t-code">ml.binarize_embeddings</text><text x="208" y="273.0" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="12.5" class="t-code">(col)</text><text x="438" y="253.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">one 0 or 1 per</text><text x="438" y="272.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">dimension, by sign</text><text x="630" y="253.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Hamming distance,</text><text x="630" y="272.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">metric="hamming"</text><circle cx="808" cy="256.0" r="10" fill="none" stroke="#94a3b8" stroke-width="1.8"/><path d="M 804.2 252.2 L 811.8 259.8 M 811.8 252.2 L 804.2 259.8" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/><text x="826" y="260.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">small recall loss</text><rect x="192" y="318" width="752" height="98" rx="10" class="surface" stroke-width="1"/><g filter="url(#sh)"><rect x="36" y="318" width="140" height="98" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="36" y="330" width="4" height="74" rx="2" fill="#3b82f6"/><text x="109.0" y="372.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Shrink</text><text x="208" y="363.0" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="12.5" class="t-code">ml.truncate_embeddings</text><text x="208" y="383.0" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="12.5" class="t-code">(col, dim)</text><text x="438" y="363.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">first dim values,</text><text x="438" y="382.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">re-normalized</text><text x="630" y="363.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">a smaller, faster</text><text x="630" y="382.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">index</text><circle cx="808" cy="366.0" r="10" fill="none" stroke="#94a3b8" stroke-width="1.8"/><path d="M 804.2 362.2 L 811.8 369.8 M 811.8 362.2 L 804.2 369.8" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/><text x="826" y="370.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">small recall cost</text><text x="490" y="452" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Shrink only a Matryoshka-trained model, such as text-embedding-3-*, Nomic or mxbai.</text></svg>