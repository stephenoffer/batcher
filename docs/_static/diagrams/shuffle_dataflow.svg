<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><rect x="20" y="24" width="940" height="118" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="48" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">CONTROL PLANE -- THROUGH RAY</text><g filter="url(#sh)"><rect x="300" y="52" width="380" height="62" rx="10" class="surface" stroke-width="1.2"/></g><text x="490.0" y="83.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Ray tasks and actors</text><text x="490.0" y="102.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">schedules the workers</text><text x="490" y="128" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">an address, a ticket, a file path, a row count, a metrics JSON string -- and nothing else</text><path d="M 150 246 L 150 118 L 296 118" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arG)"/><text x="160" y="174" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">flight address</text><path d="M 684 118 L 830 118 L 830 246" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arG)"/><text x="824" y="174" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">ticket</text><rect x="20" y="216" width="940" height="234" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="240" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">DATA PLANE -- ARROW FLIGHT, NEVER THE OBJECT STORE</text><g filter="url(#sh)"><rect x="44" y="252" width="212" height="92" rx="10" class="surface" stroke-width="1.2"/></g><text x="150.0" y="298.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">mappers</text><text x="150.0" y="317.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">partition_batches</text><rect x="60" y="362" width="42" height="30" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="108" y="362" width="42" height="30" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="156" y="362" width="42" height="30" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="204" y="362" width="42" height="30" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><text x="150" y="412" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">every bucket published,</text><text x="150" y="428" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">including the empty ones</text><path d="M 262 298 L 718 298" fill="none" stroke="#2563eb" stroke-width="7" marker-end="url(#arB)"/><text x="490" y="276" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">Arrow record batches, credit-bounded</text><text x="490" y="320" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">one credit is one batch slot; the producer blocks at zero</text><text x="490" y="342" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">do_exchange over gRPC, LZ4 by default</text><g filter="url(#sh)"><rect x="724" y="252" width="212" height="92" rx="10" class="surface" stroke-width="1.2"/></g><text x="830.0" y="298.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">reducers</text><text x="830.0" y="317.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">gather_combine, in Rust</text><text x="830" y="382" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">folded into a running partial:</text><text x="830" y="398" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">the intermediate never crosses</text><text x="830" y="414" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">back into Python</text><rect x="20" y="464" width="940" height="78" rx="16" class="band-amber" stroke-width="1.5"/><text x="38" y="488" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#f59e0b">THE ONE THING TO TAKE AWAY</text><path d="M 300 504 L 680 504" fill="none" stroke="#d97706" stroke-width="2.4" stroke-dasharray="7 5"/><path d="M 476 488 L 504 520" fill="none" stroke="#d97706" stroke-width="3"/><path d="M 504 488 L 476 520" fill="none" stroke="#d97706" stroke-width="3"/><text x="296" y="509" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">bulk batches</text><text x="684" y="509" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">the Ray object store</text><text x="490" y="534" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">routing them through it reintroduces the serialization the columnar design removes</text></svg>