<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 630" role="img" width="980" height="630"><defs><style>
  .surface { fill: #ffffff; stroke: #cbd5e1; }
  .band-blue { fill: #eff6ff; stroke: #3b82f6; }
  .band-amber { fill: #fffbeb; stroke: #f59e0b; }
  .band-grey { fill: #f8fafc; stroke: #cbd5e1; }
  .t-title { fill: #1e293b; }
  .t-sub { fill: #5b6675; }
  .t-arrow { fill: #475569; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1e293b; stroke: #334155; }
    .band-blue { fill: #172554; stroke: #3b82f6; }
    .band-amber { fill: #2c1f06; stroke: #f59e0b; }
    .band-grey { fill: #131c31; stroke: #334155; }
    .t-title { fill: #e2e8f0; }
    .t-sub { fill: #94a3b8; }
    .t-arrow { fill: #cbd5e1; }
  }
</style>
<filter id="sh" x="-20%" y="-30%" width="140%" height="180%">
  <feDropShadow dx="0" dy="2.5" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.18"/>
</filter>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><rect x="20" y="20" width="940" height="150" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">THE REGION, AND HOW HARD TO LOOK AT IT</text><g filter="url(#sh)"><rect x="50" y="62" width="340" height="84" rx="10" class="surface" stroke-width="1.2"/></g><text x="220.0" y="104.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Join region</text><text x="220.0" y="123.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">connected inner joins, three leaves or more</text><text x="220" y="136" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#2563eb">fewer: build-side selection handles it</text><g filter="url(#sh)"><rect x="570" y="62" width="340" height="84" rx="10" class="surface" stroke-width="1.2"/></g><text x="740.0" y="104.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Search budget</text><text x="740.0" y="123.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">512 to 200,000 evaluated pairs</text><text x="740" y="136" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#2563eb">and it is re-checked inside the loop</text><path d="M 398 104 L 560 104" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="479" y="92" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">cost the region as written</text><text x="479" y="126" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">10% of its estimated run time</text><rect x="20" y="186" width="940" height="230" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="210" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">THE SEARCH, AND THE SEARCH IT FALLS BACK TO</text><g filter="url(#sh)"><rect x="510" y="236" width="400" height="96" rx="10" class="surface" stroke-width="1.2"/></g><text x="710.0" y="284.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Connected-subset DP</text><text x="710.0" y="303.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">each subset split into two connected halves</text><text x="710" y="322" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#2563eb">bushy shapes, up to 20 leaves</text><g filter="url(#sh)"><rect x="50" y="236" width="400" height="96" rx="10" class="surface" stroke-width="1.2"/></g><text x="250.0" y="284.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Greedy</text><text x="250.0" y="303.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">smallest leaf, then the cheapest next join</text><text x="250" y="322" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#2563eb">left-deep by construction</text><path d="M 740 150 L 716 228" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="756" y="182" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">search inside</text><text x="756" y="200" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">the budget</text><path d="M 540 340 V 368 H 420 V 338" fill="none" stroke="#d97706" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#arA)"/><text x="480" y="392" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#d97706">budget spent, over 20 leaves, or a disconnected graph</text><text x="710" y="352" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">a bushy tree</text><text x="250" y="352" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">a left-deep tree</text><rect x="20" y="432" width="940" height="150" rx="16" class="band-amber" stroke-width="1.5"/><text x="38" y="456" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#f59e0b">WHAT EVERY CANDIDATE IS RANKED BY, IN BOTH SEARCHES</text><g filter="url(#sh)"><rect x="50" y="478" width="400" height="80" rx="10" class="surface" stroke-width="1.2"/></g><text x="250.0" y="518.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Cardinality</text><text x="250.0" y="537.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">|L| x |R| / max(ndv), then skew and range</text><text x="250" y="554" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#2563eb">HLL, Misra-Gries, KLL</text><g filter="url(#sh)"><rect x="510" y="478" width="400" height="80" rx="10" class="surface" stroke-width="1.2"/></g><text x="710.0" y="518.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Cost</text><text x="710.0" y="537.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">build rows, probe rows, cache residency</text><text x="710" y="554" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#2563eb">priced at the cheaper build side</text><path d="M 180 476 L 180 338" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arB)"/><path d="M 780 476 L 780 338" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arB)"/><text x="490" y="606" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6675">Both searches build the same relation. They differ only in how much of the space they read.</text><text x="490" y="624" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6675">An exhaustive subset DP exists beside them, as the test oracle, and is never on the live path.</text></svg>