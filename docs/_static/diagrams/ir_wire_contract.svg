</defs><rect x="20" y="20" width="940" height="244" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">ONE DOCUMENT, WRITTEN ONCE AND READ ONCE</text><g filter="url(#sh)"><rect x="44" y="92" width="268" height="104" rx="10" class="surface" stroke-width="1.2"/></g><text x="178.0" y="144.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Python to_ir()</text><text x="178.0" y="163.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">control plane</text><text x="178.0" y="186" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#2563eb">plan/ir_tags.py</text><g filter="url(#sh)"><rect x="380" y="92" width="220" height="104" rx="10" class="surface" stroke-width="1.2"/></g><text x="490.0" y="144.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">JSON IR</text><text x="490.0" y="163.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">the wire</text><text x="490.0" y="186" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#2563eb">{"op": "hash_join"}</text><g filter="url(#sh)"><rect x="716" y="92" width="220" height="104" rx="10" class="surface" stroke-width="1.2"/></g><text x="826.0" y="144.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Rust serde</text><text x="826.0" y="163.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">data plane</text><text x="826.0" y="186" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#2563eb">bc_ir::RelOp</text><text x="346" y="124" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">writes the tag</text><text x="346" y="142" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">string</text><text x="634" y="124" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">must accept it</text><text x="634" y="142" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">deny_unknown_fields</text><text x="490" y="236" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">16 RelOp tags and 55 Expr tags today, plus 19 function vocabularies underneath them.</text><path d="M 320 144.0 L 370 144.0" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><path d="M 608 144.0 L 706 144.0" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><rect x="20" y="276" width="940" height="264" rx="16" class="band-amber" stroke-width="1.5"/><text x="38" y="300" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#f59e0b">WHAT DRIFT LOOKS LIKE, AND WHO NOTICES</text><g filter="url(#sh)"><rect x="340" y="304" width="300" height="76" rx="10" class="surface" stroke-width="1.2"/></g><text x="490.0" y="342.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">lint_ir_contract.py</text><text x="490.0" y="361.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">compares whole vocabularies</text><text x="660" y="336" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">It runs no query, so a tag that no</text><text x="660" y="354" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">differential test names is still checked.</text><path d="M 164 206 V 342 H 328" fill="none" stroke="#94a3b8" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#arG)"/><path d="M 816 206 V 342 H 652" fill="none" stroke="#94a3b8" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#arG)"/><text x="174" y="332" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">reads the class</text><text x="808" y="332" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">reads the enum body</text><g filter="url(#sh)"><rect x="52" y="428" width="420" height="92" rx="10" class="surface" stroke-width="1.2"/></g><text x="262.0" y="474.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Python emits, Rust rejects</text><text x="262.0" y="493.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">the plan fails to deserialize</text><text x="262" y="506" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Loud, but only for a query that uses that tag.</text><g filter="url(#sh)"><rect x="508" y="428" width="420" height="92" rx="10" class="surface" stroke-width="1.2"/></g><text x="718.0" y="474.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Rust accepts, Python never emits</text><text x="718.0" y="493.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">an engine capability goes unreachable</text><text x="718" y="506" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Silent. Nothing raises, nothing is slower to notice.</text><path d="M 440 384 L 300 418" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><path d="M 540 384 L 680 418" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="326" y="404" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#d97706">one side has a tag</text><text x="654" y="404" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#d97706">the other side has a tag</text><text x="490" y="552" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#5b6675">Both sides change in one commit, or neither does.</text></svg>