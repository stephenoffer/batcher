</style>
<filter id="sh" x="-20%" y="-30%" width="140%" height="180%">
  <feDropShadow dx="0" dy="2.5" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.18"/>
</filter>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><rect x="20" y="24" width="940" height="148" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="48" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">SORT, THEN SLICE</text><text x="126" y="66" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">morsels</text><rect x="44" y="76" width="28" height="40" rx="3" fill="#94a3b8" fill-opacity="0.28" stroke="#94a3b8" stroke-width="1.4"/><rect x="77" y="76" width="28" height="40" rx="3" fill="#94a3b8" fill-opacity="0.28" stroke="#94a3b8" stroke-width="1.4"/><rect x="110" y="76" width="28" height="40" rx="3" fill="#94a3b8" fill-opacity="0.28" stroke="#94a3b8" stroke-width="1.4"/><rect x="143" y="76" width="28" height="40" rx="3" fill="#94a3b8" fill-opacity="0.28" stroke="#94a3b8" stroke-width="1.4"/><rect x="176" y="76" width="28" height="40" rx="3" fill="#94a3b8" fill-opacity="0.28" stroke="#94a3b8" stroke-width="1.4"/><rect x="209" y="76" width="28" height="40" rx="3" fill="#94a3b8" fill-opacity="0.28" stroke="#94a3b8" stroke-width="1.4"/><path d="M 248 96 L 306 96" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="277" y="84" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">concat</text><g filter="url(#sh)"><rect x="312" y="68" width="214" height="56" rx="10" class="surface" stroke-width="1.2"/></g><text x="419.0" y="96.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">the whole relation</text><text x="419.0" y="115.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">one giant batch</text><path d="M 536 96 L 594 96" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="565" y="84" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">full sort</text><g filter="url(#sh)"><rect x="600" y="68" width="214" height="56" rx="10" class="surface" stroke-width="1.2"/></g><text x="707.0" y="96.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">every row ordered</text><text x="707.0" y="115.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">every column gathered</text><path d="M 824 96 L 882 96" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="853" y="84" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">slice</text><rect x="888" y="76" width="54" height="40" rx="3" fill="#94a3b8" fill-opacity="0.28" stroke="#94a3b8" stroke-width="1.4"/><text x="915" y="136" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">k rows</text><text x="490" y="158" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">The relation is copied twice and ordered once, to keep k rows of it.</text><rect x="20" y="190" width="940" height="296" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="214" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">TOP-N: ops::parallel_top_n</text><text x="126" y="234" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">morsels</text><rect x="44" y="244" width="28" height="40" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="77" y="244" width="28" height="40" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="110" y="244" width="28" height="40" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="143" y="244" width="28" height="40" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="176" y="244" width="28" height="40" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><rect x="209" y="244" width="28" height="40" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><path d="M 248 264 L 306 264" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="277" y="252" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">select k</text><g filter="url(#sh)"><rect x="312" y="236" width="214" height="56" rx="10" class="surface" stroke-width="1.2"/></g><text x="419.0" y="264.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">heap_select_k</text><text x="419.0" y="283.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">a heap of k, per morsel</text><text x="419" y="312" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">a row that cannot reach the answer costs</text><text x="419" y="330" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">one comparison against the current worst</text><path d="M 536 264 L 594 264" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="565" y="252" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">keys only</text><g filter="url(#sh)"><rect x="600" y="236" width="214" height="56" rx="10" class="surface" stroke-width="1.2"/></g><text x="707.0" y="264.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">narrow candidates</text><text x="707.0" y="283.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">the payload stays behind</text><path d="M 824 264 L 882 264" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="853" y="252" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">merge</text><rect x="888" y="244" width="54" height="40" rx="3" fill="#3b82f6" fill-opacity="0.28" stroke="#3b82f6" stroke-width="1.4"/><text x="915" y="304" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">k rows</text><text x="707" y="330" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">ties break on (morsel, row), so the</text><text x="707" y="348" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">survivor matches the stable sort's</text><g filter="url(#sh)"><rect x="340" y="386" width="300" height="56" rx="10" class="surface" stroke-width="1.2"/></g><text x="490.0" y="414.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">gather the payload once</text><text x="490.0" y="433.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">interleave, over k rows</text><path d="M 908 306 Q 908 414 646 414" fill="none" stroke="#d97706" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#arA)"/><text x="676" y="442" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">the wide columns are touched once, at the end</text><text x="180" y="414" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">The relation is never</text><text x="180" y="432" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">concatenated and never</text><text x="180" y="450" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">fully sorted.</text><text x="490" y="508" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">The heap is used when k is small against the morsel. Above that the morsel is sorted and sliced, because a linear sort costs no more.</text><text x="490" y="530" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">A shared bound can skip a whole morsel whose key range cannot reach the answer, and switches itself off after 32 checks that excluded nothing.</text></svg>