<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" role="img" width="980" height="430"><defs><style>
  .surf { fill: #ffffff; }
  .card { fill: #ffffff; stroke: #cbd5e1; }
  .card-oracle { fill: #eff6ff; stroke: #2563eb; }
  .card-src { fill: #f8fafc; stroke: #94a3b8; }
  .t-head { fill: #1e293b; }
  .t-sub { fill: #5b6675; }
  .t-tag { fill: #2563eb; }
  @media (prefers-color-scheme: dark) {
    .surf { fill: #131c31; }
    .card { fill: #1e293b; stroke: #334155; }
    .card-oracle { fill: #172554; stroke: #3b82f6; }
    .card-src { fill: #0f172a; stroke: #475569; }
    .t-head { fill: #e2e8f0; }
    .t-sub { fill: #94a3b8; }
    .t-tag { fill: #60a5fa; }
  }
</style>
<filter id="sh" x="-20%" y="-30%" width="140%" height="180%">
  <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.16"/>
</filter>
<marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="aA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><rect x="0" y="0" width="980" height="430" rx="14" class="surf"/><text x="40" y="48" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="700" class="t-head">One expression type, three ways to run it</text><text x="40" y="72" font-family="Helvetica,Arial,sans-serif" font-size="13" class="t-sub">Speed comes from scheduling and compilation, never from a second set of semantics.</text><g filter="url(#sh)"><rect x="40" y="150" width="200" height="108" rx="11" class="card-src" stroke-width="1.6"/></g><text x="58" y="182" font-family="Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" class="t-head">One Expr, one RelOp</text><text x="58" y="206" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-tag">bc-expr / bc-ir</text><text x="58" y="230" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">every tier consumes this</text><g filter="url(#sh)"><rect x="330" y="60" width="208" height="108" rx="11" class="card-oracle" stroke-width="1.6"/></g><text x="348" y="90" font-family="Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" class="t-head">Tier-0 sequential</text><text x="348" y="112" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" class="t-tag">bc-interp::execute</text><text x="348" y="136" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">the correctness oracle</text><g filter="url(#sh)"><rect x="330" y="176" width="208" height="108" rx="11" class="card" stroke-width="1.6"/></g><text x="348" y="206" font-family="Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" class="t-head">Tier-0 parallel</text><text x="348" y="228" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" class="t-tag">bc-interp::par</text><text x="348" y="252" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">same operators, morselized</text><g filter="url(#sh)"><rect x="330" y="292" width="208" height="108" rx="11" class="card" stroke-width="1.6"/></g><text x="348" y="322" font-family="Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" class="t-head">Tier-1 JIT</text><text x="348" y="344" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" class="t-tag">bc-codegen (Cranelift)</text><text x="348" y="368" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">compiled once per operator</text><path d="M 248 204.0 L 320 114.0" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#aB)"/><path d="M 248 204.0 L 320 230.0" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#aB)"/><path d="M 248 204.0 L 320 346.0" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#aB)"/><text x="292" y="142.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#2563eb">the same</text><text x="292" y="158.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#2563eb">tree</text><path d="M 546 230.0 H 564 V 128.0 H 546" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#aB)"/><path d="M 546 346.0 H 564 V 128.0" fill="none" stroke="#2563eb" stroke-width="2.2"/><text x="576" y="220.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#2563eb">must equal the oracle</text><text x="576" y="336.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#2563eb">bit-for-bit on its subset</text><path d="M 546 378 H 770 V 100.0 H 546" fill="none" stroke="#d97706" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#aA)"/><text x="782" y="206" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#d97706">unsupported expression:</text><text x="782" y="222" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#d97706">falls back, never diverges</text><text x="40" y="406" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">The parity edges are enforced by tests, not convention: seq == par == JIT on every supported input, and the interpreter is the reference for both.</text></svg>