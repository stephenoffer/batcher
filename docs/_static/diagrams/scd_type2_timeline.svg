  <feDropShadow dx="0" dy="2.5" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.18"/>
</filter>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><text x="490" y="50" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">One natural key, id = 1, tracked on the city column. Each bar is a row of the dimension table and the interval it is valid over.</text><rect x="20" y="74" width="940" height="128" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="98" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">THE TABLE BEFORE THE 2024-06-01 LOAD</text><rect x="150" y="114" width="630" height="70" rx="7" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.8"/><text x="164" y="136" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-title">city = NYC</text><text x="164" y="153" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" class="t-sub">valid_from = 2024-01-01 · valid_to = NULL</text><text x="164" y="170" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" class="t-sub">is_current = true</text><path d="M 780 149 L 814 149" fill="none" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arG)"/><text x="822" y="153" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">open</text><path d="M 80 210 L 80 252" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="96" y="228" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">ds.scd.type2(as_of='2024-06-01') with city = LA for id = 1</text><rect x="20" y="258" width="940" height="214" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="282" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">THE SAME TABLE AFTER IT</text><rect x="150" y="300" width="370" height="70" rx="7" fill="#f59e0b" fill-opacity="0.16" stroke="#f59e0b" stroke-width="1.8"/><text x="164" y="322" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-title">city = NYC</text><text x="164" y="339" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" class="t-sub">valid_from = 2024-01-01 (unchanged)</text><text x="164" y="356" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" class="t-sub">valid_to = 2024-06-01 · is_current = false</text><rect x="520" y="386" width="260" height="70" rx="7" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.8"/><text x="534" y="408" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-title">city = LA</text><text x="534" y="425" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" class="t-sub">valid_from = 2024-06-01</text><text x="534" y="442" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" class="t-sub">valid_to = NULL · is_current = true</text><path d="M 780 421 L 814 421" fill="none" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arG)"/><text x="822" y="425" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">open</text><text x="40" y="334" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">expired</text><text x="40" y="420" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">appended</text><path d="M 150 452 H 860" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arG)"/><path d="M 150 448 V 456 M 520 448 V 456 M 780 448 V 456" stroke="#94a3b8" stroke-width="1.4"/><text x="150" y="470" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">2024-01-01</text><text x="520" y="470" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">2024-06-01</text><text x="780" y="470" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">now</text><path d="M 520 284 V 300 M 520 370 V 386" stroke="#d97706" stroke-width="2" stroke-dasharray="5 4"/><text x="530" y="296" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">as_of</text><rect x="20" y="492" width="940" height="108" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="516" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">WHAT THE LOAD DID</text><text x="40" y="532" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">The previous version keeps its valid_from. Only valid_to and is_current change on it, and the new version starts exactly where the old one ends.</text><text x="40" y="554" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">A key whose tracked columns did not change is not touched at all, and a key the target has never seen is inserted as a first open version.</text><text x="40" y="578" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">No new operator is involved: history, untouched current rows, expired rows and new versions are unioned and written back over the target.</text></svg>