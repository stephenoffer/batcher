</defs><rect x="16" y="20" width="948" height="180" rx="16" class="band-blue" stroke-width="1.5"/><text x="34" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">INGEST  ·  A BATCH JOB OVER THE CORPUS</text><g filter="url(#sh)"><rect x="36" y="74" width="172" height="80" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="36" y="86" width="4" height="56" rx="2" fill="#3b82f6"/><text x="125.0" y="113.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Load, clean</text><text x="125.0" y="131.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">str.strip_html()</text><g filter="url(#sh)"><rect x="280" y="74" width="172" height="80" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="280" y="86" width="4" height="56" rx="2" fill="#3b82f6"/><text x="369.0" y="113.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Chunk</text><text x="369.0" y="131.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">str.chunk, explode</text><g filter="url(#sh)"><rect x="524" y="74" width="172" height="80" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="524" y="86" width="4" height="56" rx="2" fill="#3b82f6"/><text x="613.0" y="113.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Dedupe</text><text x="613.0" y="131.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">exact, then near</text><g filter="url(#sh)"><rect x="768" y="74" width="172" height="80" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="768" y="86" width="4" height="56" rx="2" fill="#3b82f6"/><text x="857.0" y="113.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Embed, index</text><text x="857.0" y="131.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">ml.embed, Lance</text><path d="M 214 114.0 L 274 114.0" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="244.0" y="104.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">text</text><path d="M 458 114.0 L 518 114.0" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="488.0" y="104.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">chunks</text><path d="M 702 114.0 L 762 114.0" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="732.0" y="104.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">unique</text><text x="490" y="184" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Every stage is an engine operator, so the job streams and distributes.</text><rect x="16" y="264" width="948" height="214" rx="16" class="band-amber" stroke-width="1.5"/><text x="34" y="288" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#f59e0b">QUERY TIME  ·  PER QUESTION</text><g filter="url(#sh)"><rect x="36" y="318" width="172" height="80" rx="11" fill="url(#tintAmber)" stroke="#fcd34d" stroke-width="1.2"/></g><rect x="36" y="330" width="4" height="56" rx="2" fill="#f59e0b"/><text x="125.0" y="357.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Embed question</text><text x="125.0" y="375.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">the same model</text><g filter="url(#sh)"><rect x="280" y="318" width="172" height="80" rx="11" fill="url(#tintAmber)" stroke="#fcd34d" stroke-width="1.2"/></g><rect x="280" y="330" width="4" height="56" rx="2" fill="#f59e0b"/><text x="369.0" y="357.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Retrieve</text><text x="369.0" y="375.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">top_k or vector_search</text><g filter="url(#sh)"><rect x="524" y="318" width="172" height="80" rx="11" fill="url(#tintAmber)" stroke="#fcd34d" stroke-width="1.2"/></g><rect x="524" y="330" width="4" height="56" rx="2" fill="#f59e0b"/><text x="613.0" y="357.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Rerank</text><text x="613.0" y="375.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">100 -> 20 -> 5</text><g filter="url(#sh)"><rect x="768" y="318" width="172" height="80" rx="11" fill="url(#tintAmber)" stroke="#fcd34d" stroke-width="1.2"/></g><rect x="768" y="330" width="4" height="56" rx="2" fill="#f59e0b"/><text x="857.0" y="357.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Generate</text><text x="857.0" y="375.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">array_agg, ml.generate</text><path d="M 214 358.0 L 274 358.0" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="244.0" y="348.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">vector</text><path d="M 458 358.0 L 518 358.0" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="488.0" y="348.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">top 100</text><path d="M 702 358.0 L 762 358.0" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="732.0" y="348.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" class="t-arrow">top 5</text><path d="M 854 160 Q 640 262 380 310" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#arB)"/><text x="560" y="234" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">the chunk vectors</text><text x="610" y="426" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">A cross-encoder keeps 20 by relevance,</text><text x="610" y="444" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">then MMR keeps 5 by diversity.</text><text x="366" y="426" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Brute force on a small corpus,</text><text x="366" y="444" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">the Lance index at scale.</text><rect x="16" y="500" width="948" height="44" rx="16" class="band-grey" stroke-width="1.5"/><text x="34" y="524" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8"></text><text x="490" y="527" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Carry url and chunk_id from ingest through retrieval, so the answer can cite its sources.</text></svg>