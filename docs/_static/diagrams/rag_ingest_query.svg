<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 562" role="img" width="980" height="562"><defs><style>
  .surface { fill: #ffffff; stroke: #cbd5e1; }
  .band-blue { fill: #eff6ff; stroke: #3b82f6; }
