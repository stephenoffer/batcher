</defs><text x="490" y="40" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">One unbounded stream, four triggers. Event times are illustrative; the window is 1 hour and the allowed lateness 10 minutes.</text><rect x="20" y="62" width="940" height="432" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="86" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">WHAT EACH SHAPE EMITS, TRIGGER BY TRIGGER</text><text x="38" y="142" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">max event time seen</text><text x="38" y="166" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">watermark</text><text x="304.0" y="120" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">trigger 1</text><text x="304.0" y="142" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">10:40</text><text x="304.0" y="166" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">10:30</text><text x="444.0" y="120" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">trigger 2</text><text x="444.0" y="142" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">11:05</text><text x="444.0" y="166" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">10:55</text><text x="584.0" y="120" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">trigger 3</text><text x="584.0" y="142" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">11:25</text><text x="584.0" y="166" text-anchor="middle" font-family="Helveti