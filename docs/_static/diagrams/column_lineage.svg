<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 650" role="img" width="980" height="650"><defs><style>
  .surface { fill: #ffffff; stroke: #cbd5e1; }
  .band-blue { fill: #eff6ff; stroke: #3b82f6; }
  .band-amber { fill: #fffbeb; stroke: #f59e0b; }
  .band-grey { fill: #f8fafc; stroke: #cbd5e1; }
  .t-title { fill: #1e293b; }
  .t-sub { fill: #5b6675; }
  .t-arrow { fill: #475569; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1e293b; stroke: #334155; }
    .band-blue { fill: #172554; stroke: #3b82f6; }
    .band-amber { fill: #2c1f06; stroke: #f59e0b; }
    .band-grey { fill: #131c31; stroke: #334155; }
    .t-title { fill: #e2e8f0; }
    .t-sub { fill: #94a3b8; }
    .t-arrow { fill: #cbd5e1; }
  }
</style>
<filter id="sh" x="-20%" y="-30%" width="140%" height="180%">
  <feDropShadow dx="0" dy="2.5" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.18"/>
</filter>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><rect x="20" y="20" width="940" height="200" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">ONE PLAN, ANALYZED WITHOUT RUNNING IT</text><g filter="url(#sh)"><rect x="40" y="56" width="178" height="58" rx="10" class="surface" stroke-width="1.2"/></g><text x="129.0" y="85.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">scan orders</text><text x="129.0" y="104.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">customer_id, amount</text><g filter="url(#sh)"><rect x="40" y="144" width="178" height="58" rx="10" class="surface" stroke-width="1.2"/></g><text x="129.0" y="173.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">scan customers</text><text x="129.0" y="192.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">id, region, ssn</text><g filter="url(#sh)"><rect x="288" y="92" width="150" height="74" rx="10" class="surface" stroke-width="1.2"/></g><text x="363.0" y="129.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">join</text><text x="363.0" y="148.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">customer_id = id</text><g filter="url(#sh)"><rect x="500" y="92" width="166" height="74" rx="10" class="surface" stroke-width="1.2"/></g><text x="583.0" y="129.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">filter</text><text x="583.0" y="148.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">ssn is not null</text><g filter="url(#sh)"><rect x="728" y="92" width="208" height="74" rx="10" class="surface" stroke-width="1.2"/></g><text x="832.0" y="129.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">aggregate</text><text x="832.0" y="148.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">group by region</text><path d="M 218 85 L 282 110" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="230" y="74" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">left</text><path d="M 218 173 L 282 148" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="230" y="190" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">right</text><path d="M 438 129 L 494 129" fill="none" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arG)"/><text x="466" y="112" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">rows only</text><path d="M 666 129 L 722 129" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="694" y="112" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">reduce</text><rect x="20" y="252" width="940" height="268" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="276" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">column_lineage(plan, ["orders", "customers"])</text><g filter="url(#sh)"><rect x="44" y="300" width="280" height="86" rx="10" class="surface" stroke-width="1.2"/></g><text x="184.0" y="343.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">region</text><text x="184.0" y="362.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">customers.region</text><g filter="url(#sh)"><rect x="350" y="300" width="280" height="86" rx="10" class="surface" stroke-width="1.2"/></g><text x="490.0" y="343.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">total</text><text x="490.0" y="362.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">orders.amount</text><g filter="url(#sh)"><rect x="656" y="300" width="280" height="86" rx="10" class="surface" stroke-width="1.2"/></g><text x="796.0" y="343.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">n</text><text x="796.0" y="362.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">no origin at all</text><text x="184" y="408" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">the group key's own expression</text><text x="490" y="408" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">the sum's input column</text><text x="796" y="408" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">count() reads no column</text><text x="490" y="448" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">customers.ssn appears in none of them. The filter chose which rows survived,</text><text x="490" y="466" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">not what any value is, so it carries no lineage. Data flow, not control flow.</text><text x="490" y="498" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Tag customers.ssn as PII and the tag follows nothing here. Tag customers.region and it follows the first column.</text><rect x="20" y="552" width="940" height="86" rx="16" class="band-amber" stroke-width="1.5"/><text x="38" y="576" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#f59e0b">AN OPERATOR THE ANALYSIS DOES NOT MODEL</text><text x="490" y="596" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">map_batches is opaque, so every output column is reported as deriving from every input column.</text><text x="490" y="618" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">It over-approximates on purpose: a false 'might carry PII' costs a review, a false 'cannot' costs a breach.</text></svg>