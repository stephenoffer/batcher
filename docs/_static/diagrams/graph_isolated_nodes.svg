</defs><rect x="20" y="20" width="400" height="360" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">EDGES ONLY</text><rect x="40" y="56" width="120" height="59.0" rx="9" class="code-bg" stroke-width="1"/><text x="54" y="82.25" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="12.5" class="t-code" xml:space="preserve">src  dst</text><text x="54" y="101.75" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="12.5" class="t-code" xml:space="preserve">  1    2</text><text x="176" y="76" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Graph.from_edges(...)</text><text x="176" y="94" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">one edge row</text><circle cx="120" cy="196" r="22" class="surface" style="stroke: #2563eb; stroke-width: 2.4; "/><text x="120" y="201" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="800" class="t-title">1</text><circle cx="320" cy="196" r="22" class="surface" style="stroke: #2563eb; stroke-width: 2.4; "/><text x="320" y="201" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="800" class="t-title">2</text><path d="M 142 196 L 294 196" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="220" y="184" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">edge</text><text x="220" y="276" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">a node with no edges is in</text><text x="220" y="294" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">no row, so it does not exist</text><path d="M 40 314 L 400 314" stroke="#94a3b8" stroke-width="1"/><text x="130" y="338" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">num_nodes()</text><text x="130" y="368" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="800" class="t-title">2</text><text x="310" y="338" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">average_degree</text><text x="310" y="368" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="800" class="t-title">1.0</text><path d="M 426 196 L 552 196" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="489" y="182" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">with_nodes()</text><text x="489" y="220" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">node: 1, 2, 3, 4</text><rect x="560" y="20" width="400" height="360" rx="16" class="band-blue" stroke-width="1.5"/><text x="578" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">EDGES PLUS A NODE TABLE</text><rect x="580" y="56" width="120" height="59.0" rx="9" class="code-bg" stroke-width="1"/><text x="594" y="82.25" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="12.5" class="t-code" xml:space="preserve">src  dst</text><text x="594" y="101.75" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="12.5" class="t-code" xml:space="preserve">  1    2</text><text x="716" y="76" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">the same edge row,</text><text x="716" y="94" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">plus every node</text><circle cx="660" cy="160" r="22" class="surface" style="stroke: #2563eb; stroke-width: 2.4; "/><text x="660" y="165" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="800" class="t-title">1</text><circle cx="860" cy="160" r="22" class="surface" style="stroke: #2563eb; stroke-width: 2.4; "/><text x="860" y="165" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="800" class="t-title">2</text><path d="M 682 160 L 834 160" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="760" y="148" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">edge</text><circle cx="660" cy="244" r="22" class="surface" style="stroke: #d97706; stroke-width: 2.4; stroke-dasharray: 5 4;"/><text x="660" y="249" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="800" class="t-title">3</text><circle cx="860" cy="244" r="22" class="surface" style="stroke: #d97706; stroke-width: 2.4; stroke-dasharray: 5 4;"/><text x="860" y="249" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="800" class="t-title">4</text><text x="760" y="238" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="1.8" fill="#d97706">ISOLATED</text><text x="760" y="256" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">no edges</text><path d="M 580 314 L 940 314" stroke="#94a3b8" stroke-width="1"/><text x="670" y="338" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">num_nodes()</text><text x="670" y="368" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="800" class="t-title">4</text><text x="850" y="338" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">average_degree</text><text x="850" y="368" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="800" class="t-title">0.5</text><text x="490" y="418" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Both answers are correct for their question. Attach the node table when the denominator should include every node.</text></svg>