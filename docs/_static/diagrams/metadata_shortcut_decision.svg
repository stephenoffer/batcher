<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img" width="980" height="560"><defs><style>
  .surface { fill: #ffffff; stroke: #cbd5e1; }
  .band-blue { fill: #eff6ff; stroke: #3b82f6; }
  .band-amber { fill: #fffbeb; stroke: #f59e0b; }
  .band-grey { fill: #f8fafc; stroke: #cbd5e1; }
  .t-title { fill: #1e293b; }
  .t-sub { fill: #5b6675; }
  .t-arrow { fill: #475569; }
  .t-code { fill: #1e40af; }
  .code-bg { fill: #f1f5f9; stroke: #e2e8f0; }
  .pill-blue { fill: #dbeafe; } .pill-amber { fill: #fef3c7; } .pill-grey { fill: #e2e8f0; }
  .pt-blue { fill: #1d4ed8; } .pt-amber { fill: #b45309; } .pt-grey { fill: #334155; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1e293b; stroke: #334155; }
    .band-blue { fill: #172554; stroke: #3b82f6; }
    .band-amber { fill: #2c1f06; stroke: #f59e0b; }
    .band-grey { fill: #131c31; stroke: #334155; }
    .t-title { fill: #e2e8f0; }
    .t-sub { fill: #94a3b8; }
    .t-arrow { fill: #cbd5e1; }
    .t-code { fill: #93c5fd; }
    .code-bg { fill: #0f172a; stroke: #334155; }
    .pill-blue { fill: #1e3a8a; } .pill-amber { fill: #78350f; } .pill-grey { fill: #334155; }
    .pt-blue { fill: #bfdbfe; } .pt-amber { fill: #fde68a; } .pt-grey { fill: #e2e8f0; }
    #tintBlue stop[offset="0"] { stop-color: #16233d; }
    #tintBlue stop[offset="1"] { stop-color: #1e3a8a; }
    #tintAmber stop[offset="0"] { stop-color: #2a1e07; }
    #tintAmber stop[offset="1"] { stop-color: #78350f; }
  }
</style>
<filter id="sh" x="-20%" y="-30%" width="140%" height="180%">
  <feDropShadow dx="0" dy="2.5" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.18"/>
</filter>
<filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
  <feDropShadow dx="0" dy="4" stdDeviation="9" flood-color="#2563eb" flood-opacity="0.35"/>
</filter>
<linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="0.5" stop-color="#2563eb"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
<linearGradient id="heroAmber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#d97706"/></linearGradient>
<linearGradient id="tintBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5f9ff"/><stop offset="1" stop-color="#dbeafe"/></linearGradient>
<linearGradient id="tintAmber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf5"/><stop offset="1" stop-color="#fdecc8"/></linearGradient>
<linearGradient id="ribbonBlue" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#93c5fd"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
<linearGradient id="ribbonAmber" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><rect x="20" y="14" width="940" height="460" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="38" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8"></text><g filter="url(#sh)"><rect x="126" y="34" width="260" height="56" rx="10" class="surface" stroke-width="1.2"/></g><text x="256.0" y="62.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">a question about the data</text><text x="256.0" y="81.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">count, min, a filter, a join</text><path d="M 256.0 90 L 256.0 128" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="268.0" y="114" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">any terminal</text><g filter="url(#sh)"><rect x="96" y="130" width="320" height="72" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="96" y="142" width="4" height="48" rx="2" fill="#3b82f6"/><text x="259.0" y="165.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Is an exact statistic recorded?</text><text x="259.0" y="183.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">footer bound, manifest count, immutable relation</text><path d="M 416 166.0 L 562 166.0" fill="none" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arG)"/><text x="490.0" y="154.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">no</text><text x="490.0" y="188.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">or only estimated</text><g filter="url(#sh)"><rect x="564" y="130" width="320" height="72" rx="10" class="surface" stroke-width="1.2"/></g><text x="724.0" y="166.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">run the query</text><text x="724.0" y="185.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">the same answer, at full cost</text><path d="M 256.0 202 L 256.0 254" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="268.0" y="236" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">yes</text><g filter="url(#sh)"><rect x="96" y="256" width="320" height="72" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="96" y="268" width="4" height="48" rx="2" fill="#3b82f6"/><text x="259.0" y="291.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Rows unchanged since measured?</text><text x="259.0" y="309.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">no filter, join, computed column or map_batches</text><path d="M 256.0 328 L 256.0 386" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="268.0" y="364" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">yes</text><g filter="url(#glow)"><rect x="96" y="388" width="320" height="72" rx="16" fill="url(#hero)"/></g><text x="256.0" y="422.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="800" fill="#ffffff">answered from metadata</text><text x="256.0" y="444.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#ffffff" fill-opacity="0.88">the same value, no scan</text><path d="M 416 292.0 L 562 292.0" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="490.0" y="280.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">no</text><text x="490.0" y="314.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">only a bound now</text><g filter="url(#sh)"><rect x="564" y="256" width="320" height="72" rx="11" fill="url(#tintBlue)" stroke="#bfdbfe" stroke-width="1.2"/></g><rect x="564" y="268" width="4" height="48" rx="2" fill="#3b82f6"/><text x="727.0" y="291.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Does a bound refute it?</text><text x="727.0" y="309.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">past the recorded max, disjoint key ranges</text><path d="M 724.0 256 L 724.0 204" fill="none" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arG)"/><text x="736.0" y="236" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">no: a bound is not an answer</text><path d="M 724.0 328 L 724.0 386" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="736.0" y="364" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">yes</text><g filter="url(#sh)"><rect x="564" y="388" width="320" height="72" rx="11" fill="url(#tintAmber)" stroke="#fcd34d" stroke-width="1.2"/></g><rect x="564" y="400" width="4" height="48" rx="2" fill="#f59e0b"/><text x="727.0" y="423.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">provably empty</text><text x="727.0" y="441.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">a filter reads no files, a join no shuffle</text><text x="490" y="504" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Which path ran is invisible: every branch returns what executing would return, and only the cost moves.</text><text x="490" y="526" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">The one named exception is ds.meta.approx, which never executes and answers from a sketch or returns None.</text></svg>