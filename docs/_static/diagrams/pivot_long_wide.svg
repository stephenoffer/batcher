60" height="30" fill="#f59e0b" fill-opacity="0.28" stroke="#f59e0b" stroke-opacity="0.7" stroke-width="1"/><text x="482.0" y="220" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="800" class="t-title">15.0</text><rect x="512" y="200" width="60" height="30" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-opacity="0.7" stroke-width="1"/><text x="542.0" y="220" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" class="t-title">20.0</text><rect x="732" y="155" width="66" height="30" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-opacity="0.7" stroke-width="1"/><text x="765.0" y="175" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" class="t-title">east</text><rect x="798" y="155" width="66" height="30" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-opacity="0.7" stroke-width="1"/><text x="831.0" y="175" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" class="t-title">q1</text><rect x="864" y="155" width="72" height="30" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-opacity="0.7" stroke-width="1"/><text x="900.0" y="175" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" class="t-title">30.0</text><rect x="732" y="185" width="66" height="30" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-opacity="0.7" stroke-width="1"/><text x="765.0" y="205" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" class="t-title">east</text><rect x="798" y="185" width="66" height="30" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-opacity="0.7" stroke-width="1"/><text x="831.0" y="205" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" class="t-title">q2</text><rect x="864" y="185" width="72" height="30" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-opacity="0.7" stroke-width="1"/><text x="900.0" y="205" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" class="t-title">40.0</text><rect x="732" y="215" width="66" height="30" fill="#f59e0b" fill-opacity="0.28" stroke="#f59e0b" stroke-opacity="0.7" stroke-width="1"/><text x="765.0" y="235" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="800" class="t-title">west</text><rect x="798" y="215" width="66" height="30" fill="#f59e0b" fill-opacity="0.28" stroke="#f59e0b" stroke-opacity="0.7" stroke-width="1"/><text x="831.0" y="235" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="800" class="t-title">q1</text><rect x="864" y="215" width="72" height="30" fill="#f59e0b" fill-opacity="0.28" stroke="#f59e0b" stroke-opacity="0.7" stroke-width="1"/><text x="900.0" y="235" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="800" class="t-title">15.0</text><rect x="732" y="245" width="66" height="30" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-opacity="0.7" stroke-width="1"/><text x="765.0" y="265" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" class="t-title">west</text><rect x="798" y="245" width="66" height="30" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-opacity="0.7" stroke-width="1"/><text x="831.0" y="265" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" class="t-title">q2</text><rect x="864" y="245" width="72" height="30" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-opacity="0.7" stroke-width="1"/><text x="900.0" y="265" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" class="t-title">20.0</text><path d="M 262 215 L 372 215" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="317" y="203" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">pivot</text><text x="317" y="237" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">sums each cell</text><path d="M 588 215 L 718 215" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="653" y="203" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">unpivot</text><text x="653" y="237" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">columns to rows</text><text x="479" y="258" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">west q1: 10.0 + 5.0 = 15.0</text><text x="490" y="290" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">on="quarter" names the columns, and aggregate="sum" fills them.</text><rect x="20" y="328" width="460" height="104" rx="16" class="band-amber" stroke-width="1.5"/><text x="38" y="352" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#f59e0b">PIVOT</text><text x="44" y="374" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Output columns come from the data, so a</text><text x="44" y="392" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">pre-pass reads quarter unless you pass columns=.</text><text x="44" y="410" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">It groups, so it is a pipeline breaker.</text><rect x="500" y="328" width="460" height="104" rx="16" class="band-grey" stroke-width="1.5"/><text x="518" y="352" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">UNPIVOT</text><text x="524" y="374" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">The schema is fixed by the arguments.</text><text x="524" y="392" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">No pre-pass and no breaker: it streams</text><text x="524" y="410" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">and distributes like a select.</text></svg>