<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 632" role="img" width="980" height="632"><defs><style>
  .surface { fill: #ffffff; stroke: #cbd5e1; }
  .band-blue { fill: #eff6ff; stroke: #3b82f6; }
  .band-amber { fill: #fffbeb; stroke: #f59e0b; }
  .band-grey { fill: #f8fafc; stroke: #cbd5e1; }
  .t-title { fill: #1e293b; }
  .t-sub { fill: #5b6675; }
  .t-arrow { fill: #475569; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1e293b; stroke: #334155; }
    .band-blue { fill: #172554; stroke: #3b82f6; }
    .band-amber { fill: #2c1f06; stroke: #f59e0b; }
    .band-grey { fill: #131c31; stroke: #334155; }
    .t-title { fill: #e2e8f0; }
    .t-sub { fill: #94a3b8; }
    .t-arrow { fill: #cbd5e1; }
  }
</style>
<filter id="sh" x="-20%" y="-30%" width="140%" height="180%">
  <feDropShadow dx="0" dy="2.5" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.18"/>
</filter>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><text x="490" y="52" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">A streaming aggregate keeps one row per group. The checkpoint is what lets a restart pick that up rather than re-read the stream.</text><rect x="20" y="66" width="940" height="138" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="90" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">BETWEEN MICRO-BATCHES, IN MEMORY</text><g filter="url(#sh)"><rect x="110" y="100" width="250" height="82" rx="10" class="surface" stroke-width="1.2"/></g><text x="235.0" y="141.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">micro-batch 8</text><text x="235.0" y="160.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">the rows this trigger read</text><g filter="url(#sh)"><rect x="560" y="100" width="300" height="82" rx="10" class="surface" stroke-width="1.2"/></g><text x="710.0" y="141.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">running state</text><text x="710.0" y="160.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">one partial row per group, in Arrow</text><path d="M 360 141.0 L 554 141.0" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="465" y="88" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">partial, then combine, in Rust</text><text x="465" y="200" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">bounded by the group count, not by how many rows produced it</text><rect x="20" y="222" width="940" height="160" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="246" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">IN THE CHECKPOINT DIRECTORY</text><g filter="url(#sh)"><rect x="60" y="262" width="260" height="96" rx="10" class="surface" stroke-width="1.2"/></g><text x="190.0" y="310.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">offsets/</text><text x="190.0" y="329.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">each source's position</text><g filter="url(#sh)"><rect x="360" y="262" width="260" height="96" rx="10" class="surface" stroke-width="1.2"/></g><text x="490.0" y="310.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">state/</text><text x="490.0" y="329.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">batch-4.arrow plus a delta each</text><g filter="url(#sh)"><rect x="660" y="262" width="250" height="96" rx="10" class="surface" stroke-width="1.2"/></g><text x="785.0" y="310.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">commits/</text><text x="785.0" y="329.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">batch id and sink token</text><text x="190.0" y="350" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">written before the batch runs</text><text x="490.0" y="350" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">batch 8's partial only</text><text x="785.0" y="350" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">written last of all</text><path d="M 710.0 208 L 530.0 256" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="724" y="238" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">snapshot</text><rect x="20" y="402" width="940" height="206" rx="16" class="band-amber" stroke-width="1.5"/><text x="38" y="426" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#f59e0b">WHAT A RESTART REBUILDS</text><g filter="url(#sh)"><rect x="250" y="462" width="460" height="76" rx="10" class="surface" stroke-width="1.2"/></g><text x="480.0" y="500.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">batch 9 runs again, with batch 8's state</text><text x="480.0" y="519.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">a batch in offsets but not in commits is the one to replay</text><path d="M 170 362 L 340 456" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="60" y="444" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">seek each source</text><path d="M 490.0 362 L 480.0 456" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="500" y="432" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">combine the snapshot with every delta after it</text><path d="M 790 362 L 620 456" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="812" y="452" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">resume at 9</text><text x="490" y="568" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Combining a base snapshot with the deltas recorded after it reaches the same state a full snapshot would, because combine is associative and commutative.</text><text x="490" y="590" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">A windowed aggregate evicts too, and its eviction is always a prefix, so one bound in each entry describes it.</text></svg>