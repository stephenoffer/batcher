<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" role="img" width="960" height="660"><defs><style>
  .surface { fill: #ffffff; stroke: #cbd5e1; }
  .band-blue { fill: #eff6ff; stroke: #3b82f6; }
  .band-amber { fill: #fffbeb; stroke: #f59e0b; }
  .band-grey { fill: #f8fafc; stroke: #cbd5e1; }
  .t-title { fill: #1e293b; }
  .t-sub { fill: #5b6675; }
  .t-arrow { fill: #475569; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1e293b; stroke: #334155; }
    .band-blue { fill: #172554; stroke: #3b82f6; }
    .band-amber { fill: #2c1f06; stroke: #f59e0b; }
    .band-grey { fill: #131c31; stroke: #334155; }
    .t-title { fill: #e2e8f0; }
    .t-sub { fill: #94a3b8; }
    .t-arrow { fill: #cbd5e1; }
  }
</style>
<filter id="sh" x="-20%" y="-30%" width="140%" height="180%">
  <feDropShadow dx="0" dy="2.5" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.18"/>
</filter>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><rect x="30" y="26" width="900" height="180" rx="16" class="band-grey" stroke-width="1.5"/><text x="48" y="50" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">THE ENVELOPE, DIVIDED BY ONE SOFT LINE</text><rect x="62" y="86" width="590" height="46" rx="6" class="band-blue" stroke-width="1.5"/><rect x="652" y="86" width="168" height="46" rx="6" class="band-amber" stroke-width="1.5"/><path d="M 820 74 L 820 144" stroke="#d97706" stroke-width="4"/><text x="62" y="76" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">0</text><text x="652" y="76" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">soft line: 80% of the limit</text><text x="820" y="76" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">limit</text><text x="357.0" y="108" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">NOMINAL</text><text x="357.0" y="126" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">no throttling</text><text x="736.0" y="108" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">ELEVATED</text><text x="736.0" y="126" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">spill early</text><text x="820" y="158" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">CRITICAL is used == limit: a line, not a region, because growth past it is refused.</text><text x="62" y="182" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">used moves right as operators reserve and back as they release. The pool counts bytes; it never allocates them.</text><path d="M 480 206 L 480 250" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="492" y="234" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">try_reserve(n bytes)</text><rect x="30" y="258" width="900" height="342" rx="16" class="band-blue" stroke-width="1.5"/><text x="48" y="282" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">WHAT A RESERVATION IS, AND WHAT A REFUSAL COSTS</text><text x="480" y="302" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">does used + n still fit under the limit?</text><path d="M 430 310 L 250 330" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="296" y="316" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">yes</text><path d="M 530 310 L 640 330" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="556" y="316" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">no</text><g filter="url(#sh)"><rect x="62" y="330" width="300" height="84" rx="10" class="surface" stroke-width="1.2"/></g><text x="212.0" y="372.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Granted</text><text x="212.0" y="391.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">an RAII guard on n bytes</text><text x="212" y="436" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Every byte returns when the guard drops,</text><text x="212" y="454" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">on a panic as much as on a clean finish.</text><g filter="url(#sh)"><rect x="560" y="330" width="300" height="84" rx="10" class="surface" stroke-width="1.2"/></g><text x="710.0" y="372.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Refused</text><text x="710.0" y="391.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">denied += 1; used is untouched</text><path d="M 710 414 L 710 452" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="722" y="438" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">ask the largest other consumer</text><g filter="url(#sh)"><rect x="560" y="456" width="300" height="84" rx="10" class="surface" stroke-width="1.2"/></g><text x="710.0" y="498.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">Cooperative retry</text><text x="710.0" y="517.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">it spills, then re-reserve</text><text x="710" y="560" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">At most 32 rounds, and it stops the moment a round frees nothing.</text><path d="M 556 528 L 368 528" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="462" y="514" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" class="t-arrow">still short</text><g filter="url(#sh)"><rect x="62" y="486" width="300" height="84" rx="10" class="surface" stroke-width="1.2"/></g><text x="212.0" y="528.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">The caller spills</text><text x="212.0" y="547.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">the refusal is the signal</text><text x="480" y="626" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Two pools count different bytes and are read side by side, never summed: Carbonite's holds one coarse</text><text x="480" y="644" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">reservation per query, the engine's holds the operator state and the Flight transit buffers it became.</text></svg>