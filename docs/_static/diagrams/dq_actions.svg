<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 610" role="img" width="980" height="610"><defs><style>
  .surface { fill: #ffffff; stroke: #cbd5e1; }
  .band-blue { fill: #eff6ff; stroke: #3b82f6; }
  .band-amber { fill: #fffbeb; stroke: #f59e0b; }
  .band-grey { fill: #f8fafc; stroke: #cbd5e1; }
  .t-title { fill: #1e293b; }
  .t-sub { fill: #5b6675; }
  .t-arrow { fill: #475569; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1e293b; stroke: #334155; }
    .band-blue { fill: #172554; stroke: #3b82f6; }
    .band-amber { fill: #2c1f06; stroke: #f59e0b; }
    .band-grey { fill: #131c31; stroke: #334155; }
    .t-title { fill: #e2e8f0; }
    .t-sub { fill: #94a3b8; }
    .t-arrow { fill: #cbd5e1; }
  }
</style>
<filter id="sh" x="-20%" y="-30%" width="140%" height="180%">
  <feDropShadow dx="0" dy="2.5" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.18"/>
</filter>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
</defs><rect x="20" y="20" width="940" height="96" rx="16" class="band-grey" stroke-width="1.5"/><text x="38" y="44" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">ONE CHAIN, ONE VALIDITY PREDICATE</text><g filter="url(#sh)"><rect x="210" y="44" width="560" height="56" rx="10" class="surface" stroke-width="1.2"/></g><text x="490.0" y="72.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">ds.dq.not_null("id").in_range("age", 0, 120)</text><text x="490.0" y="91.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">each constraint is a boolean Expr, TRUE for a valid row</text><path d="M 490 116 L 490 152" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="504" y="140" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">lowers to FILTER, count() OVER, LEFT JOIN</text><g filter="url(#sh)"><rect x="300" y="152" width="380" height="64" rx="10" class="surface" stroke-width="1.2"/></g><text x="490.0" y="184.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">valid = every constraint</text><text x="490.0" y="203.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">non-null, so valid and invalid are the whole input</text><path d="M 430 218 L 200 300" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arA)"/><text x="286" y="250" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">any violation</text><path d="M 490 218 L 490 300" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="504" y="266" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">the passing rows</text><path d="M 550 218 L 780 300" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arB)"/><text x="700" y="250" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" class="t-arrow">both sides</text><rect x="20" y="288" width="940" height="302" rx="16" class="band-blue" stroke-width="1.5"/><text x="38" y="312" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#3b82f6">THREE TERMINALS, THREE OUTCOMES</text><g filter="url(#sh)"><rect x="44" y="318" width="272" height="70" rx="10" class="surface" stroke-width="1.2"/></g><text x="180.0" y="353.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">fail()</text><text x="180.0" y="372.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">the data-contract gate</text><g filter="url(#sh)"><rect x="354" y="318" width="272" height="70" rx="10" class="surface" stroke-width="1.2"/></g><text x="490.0" y="353.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">drop()</text><text x="490.0" y="372.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">keep the rows that pass</text><g filter="url(#sh)"><rect x="664" y="318" width="272" height="70" rx="10" class="surface" stroke-width="1.2"/></g><text x="800.0" y="353.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" class="t-title">quarantine()</text><text x="800.0" y="372.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" class="t-sub">returns (clean, rejected)</text><text x="180" y="414" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Output: none. It raises</text><text x="180" y="432" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">DataQualityError, carrying a</text><text x="180" y="450" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">count per constraint.</text><text x="180" y="474" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Dead-letter sink: nothing</text><text x="180" y="492" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">is written. The run stops.</text><text x="490" y="414" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Output: the valid rows,</text><text x="490" y="432" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">as one lazy Dataset.</text><text x="490" y="456" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Dead-letter sink: none.</text><text x="490" y="474" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">The violating rows are gone</text><text x="490" y="492" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">and nothing records them.</text><text x="800" y="414" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Output: the valid rows, and</text><text x="800" y="432" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">the violating ones as a</text><text x="800" y="450" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">second lazy Dataset.</text><text x="800" y="474" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">Dead-letter sink: write that</text><text x="800" y="492" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">second Dataset to it.</text><text x="490" y="532" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">annotate() is the fourth: it keeps every row and names what each one failed, so a quarantined row carries its reason.</text><text x="490" y="560" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" class="t-sub">NULL is not a violation. mostly=0.99 passes while 1% violate, and severity='warn' reports without enforcing anywhere.</text></svg>