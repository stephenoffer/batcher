[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

# The PyPI distribution name is `batcher-engine` (the bare `batcher` name is taken
# by an unrelated project). The IMPORT name stays `batcher` — it is derived from the
# first component of `tool.maturin.module-name` below, not from this name.
[project]
name = "batcher-engine"
description = "A native, JIT-compiling, adaptive data engine — single-node sub-second to PB-scale."
# 3.11, not 3.10: the control plane uses `enum.StrEnum` (in `plan.expr_ir.fn_names`, which
# every expression import reaches), `datetime.UTC`, `tomllib`, and `BaseException.add_note`,
# all of which arrived in 3.11. The floor said 3.10 and the release workflow built the abi3
# wheel on 3.10, so pip installed happily on 3.10 and `import batcher` then failed outright.
# CI only ever ran 3.11, so nothing could see it. `tests/unit/test_python_floor.py` now pins
# this declaration against the features the code actually uses.
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Batcher contributors" }]
readme = "README.md"
keywords = ["arrow", "dataframe", "sql", "query-engine", "jit", "distributed", "etl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Scientific/Engineering",
]
dynamic = ["version"]
dependencies = [
    "pyarrow>=16",
    "typing_extensions>=4.7",
    # Carbonite reads live memory pressure (available RAM) to size its envelope and
    # decide when to spill. Optional at runtime — it degrades to os.sysconf totals.
    "psutil>=5.9",
    # The SQL frontend (`bt.sql`, `Session`, `Dataset.sql`) parses queries with
    # sqlglot. It is the engine's own parser, not an optional oracle backend, so it
    # is a core dependency — a documented headline feature must not fail on a clean
    # install. Pure-Python and dependency-light.
    "sqlglot>=23",
]

[project.urls]
Homepage = "https://github.com/stephenoffer/batcher"
Documentation = "https://stephenoffer.github.io/batcher/"
Repository = "https://github.com/stephenoffer/batcher"
Issues = "https://github.com/stephenoffer/batcher/issues"

[project.optional-dependencies]
# Distribution is opt-in: Ray is only used for scheduling/actors, never the data plane.
ray = ["ray[default]>=2.9"]
# Optional fallback backends + benchmark oracles (NOT part of the core engine).
polars = ["polars>=1.0"]
duckdb = ["duckdb>=1.0"]
# Pluggable MetadataHub backends.
redis = ["redis>=5"]
# One extra that covers every object store the filesystem façade routes to fsspec: S3,
# GCS, Azure (`adlfs` — `az://`, and the fallback for `abfs://` when pyarrow is built
# without its native Azure backend), and HTTP(S) presigned URLs (`aiohttp`). Without adlfs
# and aiohttp the error told users to install this extra and installing it did not help.
cloud = ["fsspec", "s3fs", "gcsfs", "adlfs", "aiohttp"]
# OpenTelemetry span export (observability.otel_traces). Only the API is needed to emit;
# the host app owns the SDK + OTLP exporter that ships spans to its collector.
otel = ["opentelemetry-api>=1.20"]
# ML / GPU data plane.
torch = ["torch>=2.2"]
tensorflow = ["tensorflow>=2.15"]
# Text embeddings via sentence-transformers (ds.ml.embed_text).
st = ["sentence-transformers>=2.2"]
# LLM batch inference operator (ds.ml.llm / batcher.ml.vllm_engine); needs a GPU.
vllm = ["vllm>=0.6"]
# Model-serving batch adapters (batcher.ml.serving.triton_client).
triton = ["tritonclient[all]>=2.40"]
# Online (low-latency) model serving (batcher.ml.serving.serve_deployment).
serve = ["ray[serve]>=2.9"]
# --- File formats (deferred imports; each raises a clear error if absent) ---
lance = ["pylance>=0.10"]
avro = ["fastavro>=1.9"]
excel = ["python-calamine>=0.2"]
xml = ["xml2arrow>=0.1"]
protobuf = ["protobuf>=4", "protarrow>=0.3"]
msgpack = ["ormsgpack>=1"]
hdf5 = ["h5py>=3.10"]
zarr = ["zarr>=2.17"]
tfrecord = ["tfr-reader>=0.1"]
pdf = ["pypdf>=4"]
# --- Lakehouse (ACID table formats + catalogs) ---
delta = ["deltalake>=0.18"]
iceberg = ["pyiceberg>=0.7"]
hudi = ["hudi>=0.2"]
delta-sharing = ["delta-sharing>=1.1"]
# --- SQL / warehouses (single-submission, Arrow-native) ---
sql = ["adbc-driver-manager>=1.0", "adbc-driver-flightsql>=1.0"]
connectorx = ["connectorx>=0.3"]
snowflake = ["snowflake-connector-python>=3.7"]
databricks = ["databricks-sql-connector>=3", "databricks-sdk>=0.20"]
bigquery = ["google-cloud-bigquery-storage>=2.24", "google-cloud-bigquery>=3"]
clickhouse = ["clickhouse-connect>=0.7"]
odbc = ["turbodbc>=4.11"]
# --- NoSQL / operational stores ---
mongo = ["pymongo>=4.6", "pymongoarrow>=1.3"]
elasticsearch = ["elasticsearch>=8.18"]
couchbase = ["couchbase-columnar>=1"]
cassandra = ["cassandra-driver>=3.29"]
nosql-redis = ["redis>=5"]
dynamodb = ["boto3>=1.34"]
neo4j = ["neo4j>=5.18"]
hbase = ["happybase>=1.2"]
# --- Streaming brokers ---
kafka = ["confluent-kafka>=2.3"]
kinesis = ["boto3>=1.34"]
eventhubs = ["azure-eventhub>=5.11"]
pubsub = ["google-cloud-pubsub>=2.21"]
pulsar = ["pulsar-client>=3.4"]
# --- Multimodal sources ---
image = ["pillow>=10"]
audio = ["soundfile>=0.12"]
video = ["av>=12"]
# --- Robotics / ADAS logs ---
# `mcap` reads the container; `mcap-ros2-support` decodes ROS 2 message payloads out of
# the `data` column, which is a downstream step the reader deliberately does not do.
mcap = ["mcap>=1.1"]
ros2 = ["mcap-ros2-support>=0.5"]
# --- Tabular / classical ML (ds.ml.predict) ---
# Each is only needed to score a model of that framework; the feature-matrix assembly and
# the metric aggregates need none of them.
xgboost = ["xgboost>=2"]
lightgbm = ["lightgbm>=4"]
catboost = ["catboost>=1.2"]
onnx = ["onnxruntime>=1.17"]
sklearn = ["scikit-learn>=1.3", "joblib>=1.3"]
# --- Framework interop (Ray Data `from_*` parity) ---
pandas = ["pandas>=2"]
huggingface = ["datasets>=2.18"]
# --- Convenience bundles (self-referencing extras use the distribution name) ---
lakehouse = ["batcher-engine[delta,iceberg,hudi,delta-sharing]"]
warehouse = ["batcher-engine[sql,connectorx,snowflake,databricks,bigquery,clickhouse,odbc]"]
nosql = ["batcher-engine[mongo,elasticsearch,couchbase,cassandra,nosql-redis,dynamodb,neo4j,hbase]"]
streaming = ["batcher-engine[kafka,kinesis,eventhubs,pubsub,pulsar]"]
multimodal = ["batcher-engine[image,audio,video,pdf]"]
robotics = ["batcher-engine[mcap,ros2,hdf5]"]
ml-formats = ["batcher-engine[lance,avro,hdf5,zarr,tfrecord]"]
tabular = ["batcher-engine[xgboost,lightgbm,catboost,onnx,sklearn]"]
dev = [
    "maturin>=1.7,<2",
    "pytest>=8",
    "pytest-benchmark>=4",
    "pytest-cov>=5",
    "hypothesis>=6",
    "import-linter>=2",
    "ruff>=0.6",
    # Runs the dashboard's JavaScript in `tests/unit/test_observe.py`. That JS has no other
    # gate — a syntax error would ship a blank dashboard with every Python test green.
    # QuickJS, not esprima: esprima is stuck at ES2017 and fails on object spread, `?.`,
    # and `??`, so it flagged correct code as broken.
    "quickjs>=1.19",
    "duckdb>=1.0",
    "polars>=1.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    # The tabular-inference adapters (`ds.ml.predict`) are optional for a user but not for
    # the suite: without them `tests/unit/test_ml_tabular_predict.py` skips its booster
    # coverage and the XGBoost/LightGBM paths ship unexercised.
    "xgboost>=2",
    "lightgbm>=4",
    # The lakehouse backends are optional *for a user*, but not for the suite: the
    # lakehouse guides, the Delta/Iceberg integration pages, and `examples/lakehouse_scd.py`
    # are executed for real by `tests/docs/`, and `tests/io/test_lakehouse.py` round-trips
    # a real table. Without these the suite skips its way to green while the docs it
    # publishes go unchecked — so a dev/CI environment carries them.
    "deltalake>=0.18",
    "pyiceberg>=0.7",
]
# Competitive benchmarking lineup: the single-node and multi-node engines Batcher is
# measured against (`benchmarks/`). DuckDB/Polars are also the correctness oracles;
# PySpark and Daft are the heavier comparators, pulled in only here.
bench = [
    "batcher-engine[duckdb,polars,ray,pandas,cloud]",
    "daft>=0.3",
    "pyspark>=3.5",
]
# Documentation toolchain (Sphinx + MyST Markdown + Furo theme). Mirrors
# docs/requirements.txt; `just docs` builds the site and runs the doctest blocks.
docs = [
    "sphinx>=7",
    "myst-parser>=2",
    "furo>=2024.0.0",
    "sphinx-autodoc-typehints>=2",
    "sphinx-design>=0.6",
    "sphinx-copybutton>=0.5",
]
all = [
    "batcher-engine[ray,polars,duckdb,redis,cloud,torch,tensorflow]",
    "batcher-engine[lance,avro,excel,xml,protobuf,msgpack,hdf5,zarr,tfrecord,pdf]",
    "batcher-engine[lakehouse,warehouse,nosql,streaming,multimodal,pandas,huggingface]",
]

[tool.maturin]
# src-layout: the importable Python package lives under python/.
python-source = "python"
# The compiled Rust extension is exposed as batcher._native.
module-name = "batcher._native"
# Only bc-py links PyO3; it is the workspace member we build into the wheel.
manifest-path = "crates/bc-py/Cargo.toml"
features = ["pyo3/extension-module"]

# --- Layer separation (enforced in CI) ---------------------------------------
# The three subsystems are fully independent: Kyber (optimization), Carbonite
# (resources), and Core (execution) may each depend on the neutral `plan`,
# `metadata`, `config`, and `_internal` packages, but NEVER on one another. Only
# `api` (the conductor) may import all three. `plan` is the neutral contract layer
# and imports none of them.
[tool.importlinter]
root_package = "batcher"

# The import matrix from `.claude/rules/architecture.md`, as a contract rather than as prose.
#
# Until this existed the matrix was enforced in five narrow spots — one `independence` contract
# and four `forbidden` ones — which left most of it unchecked. Nothing forbade a subsystem
# importing `dist`, and nothing forbade `core` or `dist` reaching up into `ml`: eighteen such
# edges had accumulated with every gate green, all of them function-local imports, and only one
# of the eighteen was recorded anywhere as debt.
#
# Higher layers may import lower ones, never the reverse. Within a layer, `|` marks siblings
# that are *independent* (may not import each other) and `:` marks siblings that may — so the
# four layer-3 subsystems and the two neutral sinks are `|`, and `plan`/`metadata` and
# `config`/`_internal`, which the matrix lets depend on each other, are `:`.
[[tool.importlinter.contracts]]
name = "the import matrix is a layered stack"
type = "layers"
containers = ["batcher"]
layers = [
    # `api` and the front-end libraries are ONE layer, and mutually dependent by design.
    # `api/dataset/ml.py` is the `ds.ml` façade and calls down into `ml/`; `ml/` is written
    # against `Dataset` and calls back up. Stating them as separate layers made 17 ordinary
    # façade-to-implementation calls look like violations while describing the coupling as
    # one-way, which it is not (`ml` imports `api` 77 times, `api` imports `ml` 17). `:` is
    # import-linter's "these siblings may import each other" — the accurate statement.
    # Everything BELOW still may not reach up into any of them, which is the part that matters.
    "api : ml : graph : _sql",
    "dist",
    "kyber | carbonite | core | governance",
    "interop",
    "io | observe",
    "plan : metadata",
    "config : _internal",
]
# The upward edges left after the layered contract landed. Started at 28; these six remain.
# `tools/lint_layer_debt.py` fails if the list grows, so the contract blocks new violations
# while these are paid down. Do not add an entry to make a new import pass.
#
# **What was paid off.** Five `ml.batch_format` edges went when the Arrow-to-framework
# conversion moved down into the new `interop` layer, where the executor can reach it
# (`batcher/interop/`). Seventeen `api -> ml`/`_sql` edges went when the layer spec above was
# corrected: `api` and its front-end libraries are mutually dependent by design, not stacked,
# so stating them as one layer describes the code instead of contradicting it.
#
# **What is left, and why it is still here.** All six are `core`/`dist` reaching into
# `ml.gpu` and `ml.inference` for execution concerns — autocast, the inference actor pool,
# device sizing — that grew in the user-facing package instead of in the executor. They belong
# in `interop` beside the conversion helpers.
#
# The move was measured rather than deferred on a hunch: the transitive closure of the eight
# symbols `core` and `dist` import is **28 definitions, ~785 lines** — half of `ml/gpu.py` —
# and it drags in NVML handle management, the autocast speed probe, visible-device ordinal
# mapping and backend detection. That is not a seam, it is a bisection, and it is a bisection
# of the one surface in this repo with no automated verification at all: the device tier is
# tested on a pandas stand-in and CI has no GPU (`.claude/rules/device-tier.md`). Trading six
# documented, ratcheted exemptions for an untestable 785-line split of the inference path is
# the wrong way round. Do it with a GPU and a recorded `gpu_shadow_verify` run.
ignore_imports = [
    "batcher.core.udf.apply -> batcher.ml.gpu",
    "batcher.core.udf.apply -> batcher.ml.inference",
    "batcher.core.udf.call -> batcher.ml.inference",
    "batcher.core.udf.stream -> batcher.ml.gpu",
    "batcher.dist.executors.map -> batcher.ml.gpu",
    "batcher.dist.streaming.consumers -> batcher.ml.gpu",
]

[[tool.importlinter.contracts]]
name = "Kyber, Carbonite, Core, and Governance are independent"
type = "independence"
modules = [
    "batcher.kyber",
    "batcher.carbonite",
    "batcher.core",
    "batcher.governance",
]
# No `ignore_imports`, deliberately. There used to be one entry per module that wrote
# `import batcher._native` — grimp cannot see into a compiled extension, so it attributed
# each such import to the ROOT `batcher` package, which re-exports `api`, which imports every
# subsystem: a phantom `core -> batcher -> api -> kyber` cycle that broke this contract. The
# allowlist silenced the symptom, and grew by one line per new module — until a new IO format
# added the same import, was not on the list, and broke all six independence directions at once.
# The engine is now reached through the single accessor `batcher._internal.native`, so the
# phantom edge does not exist and nothing needs excusing. If you find yourself adding an entry
# here, you have almost certainly bypassed that shim — don't.

[[tool.importlinter.contracts]]
name = "plan is the neutral contract layer"
type = "forbidden"
source_modules = ["batcher.plan"]
forbidden_modules = [
    "batcher.kyber",
    "batcher.carbonite",
    "batcher.core",
    "batcher.governance",
    "batcher.api",
]

# `io` sits below every subsystem (layer 2 in the import matrix in
# `.claude/rules/architecture.md`): sources/sinks/formats are infrastructure that `kyber`,
# `core`, and `dist` all legitimately depend on. That only holds while `io` itself stays
# neutral — the moment a format reaches back up into a subsystem, `io` stops being a shared
# foundation and becomes a cycle, taking the independence contract down with it.
[[tool.importlinter.contracts]]
name = "io is neutral infrastructure"
type = "forbidden"
source_modules = ["batcher.io"]
forbidden_modules = [
    "batcher.kyber",
    "batcher.carbonite",
    "batcher.core",
    "batcher.governance",
    "batcher.dist",
    "batcher.api",
    "batcher.ml",
    "batcher.graph",
]

# `observe` holds the observability *sinks* (terminal reporter, activity store, web UI). Every
# subsystem publishes to the event bus in `_internal.events`; only this package consumes it. It
# sits at layer 2 beside `io` for exactly one reason: if a sink could import a subsystem, the
# subsystem it observes would end up importing it back through the bus wiring, and "observability
# is decoupled from the engine" would stop being true. A sink reads events, never the engine.
[[tool.importlinter.contracts]]
name = "observe is a neutral sink layer"
type = "forbidden"
source_modules = ["batcher.observe"]
forbidden_modules = [
    "batcher.kyber",
    "batcher.carbonite",
    "batcher.core",
    "batcher.governance",
    "batcher.dist",
    "batcher.api",
    "batcher.ml",
    "batcher.graph",
    "batcher.io",
]

# `dist` is a *backend* of the conductor, not a peer of it: `api` decides to distribute and
# calls `dist`. If `dist` imports `api` back, the conductor becomes a dependency of the thing
# it conducts, and "api is the only conductor" stops meaning anything.
[[tool.importlinter.contracts]]
name = "dist is a backend, not a second conductor"
type = "forbidden"
source_modules = ["batcher.dist"]
forbidden_modules = ["batcher.api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast, no native engine required",
    "differential: cross-check results against DuckDB/Polars",
    "integration: end-to-end pipelines",
    "property: hypothesis-driven invariants",
    "docs: runnable code blocks extracted from the documentation",
    "io: readers, writers, and lakehouse round-trips",
]

# --- Coverage (pytest-cov) ----------------------------------------------------
# Measures the Python control plane. The Rust data plane is measured separately
# via `just cov-rust` (cargo-llvm-cov). The floor is a ratchet: it sits just below
# the achieved baseline so it blocks regressions, and is raised as coverage grows.
[tool.coverage.run]
source = ["batcher"]
branch = true
omit = [
    # The compiled extension and its thin FFI shim are exercised through the data
    # plane, not the Python suite; measuring them here would be misleading.
    "*/batcher/_native*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.",
]

# --- Python lint + format (ruff is the single source of truth) ----------------
# The control plane is the public face of the engine: lint-clean, typed, no
# duplication, no dead code. See .claude/rules/python-quality.md.
[tool.ruff]
# Matches `requires-python`. It is not cosmetic: at py310 ruff classified `tomllib` as a
# third-party import (it is stdlib from 3.11) and sorted it into the wrong block, and `UP`
# withheld the rewrites the real floor allows.
target-version = "py311"
line-length = 100
src = ["python", "tests", "benchmarks", "examples"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes — unused/dead imports & vars (F401/F811/F841)
    "I",        # import sorting
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # flake8-simplify
    "C4",       # flake8-comprehensions
    "ARG",      # unused arguments (dead code)
    "ERA",      # eradicate — commented-out code (v1 carried ~2,587 such lines)
    "RUF",      # ruff-native rules
]
# RUF003 flags "ambiguous" Unicode in comments. The engine documents its control
# theory and math in comments using intentional notation (Greek α/β, typographic
# dashes); enforcing ASCII there would corrupt meaning, not catch bugs.
ignore = ["RUF003"]

[tool.ruff.lint.per-file-ignores]
# Tests may shadow/redefine fixtures and assert freely.
"tests/**" = ["ARG"]
# Examples define mock model/callable signatures with deliberately-unused params to
# show the real API shape; that is illustrative, not dead code. E402 is the import of
# `_common` (the shared S3 dataset loader), which must follow the `sys.path` line that
# makes it importable — a script has to work when run directly, not only under the
# test runner, so there is nowhere earlier to put it.
"examples/**" = ["ARG", "E402"]
