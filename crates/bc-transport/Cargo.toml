[package]
name = "bc-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
arrow.workspace = true
# The DAG root, for `create_private_file`/`create_private_dir`. A published shm partition is
# the query's actual rows on a world-writable mount, so it must be owner-only — and the spill
# store and the gather staging files need exactly the same thing. The alternative was a third
# copy of a nine-line `OpenOptions` builder, which is how one of them ends up 0644 while the
# others are 0600. `bc-arrow` is the lowest crate all three see; it adds no third-party code
# to a graph that already carries arrow, libc and chrono.
bc-arrow.workspace = true
# Arrow Flight (gRPC) inter-node transport. Pinned to 56.x to match arrow 56 so
# the RecordBatch/Schema types are identical across the dependency graph.
arrow-flight = "56"
# tonic 0.13 is the gRPC stack arrow-flight 56 is built against; keeping it in
# lockstep avoids a duplicate tonic/prost in the graph. `tls-ring` adds
# rustls-over-ring TLS (server identity + mTLS client-cert verification) so the
# inter-node shuffle can be encrypted and mutually authenticated — required to run
# the data plane across an untrusted network. `ring`/`rustls`/`tokio-rustls` are
# already in the graph (the cloud IO stack pulls them), so this adds no new C build.
tonic = { version = "0.13", features = ["tls-ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
# TcpListenerStream: lets us bind an ephemeral port, read it back, then hand the
# listener to tonic via serve_with_incoming.
tokio-stream = { version = "0.1", features = ["net"] }
futures = "0.3"
dashmap = { workspace = true }
# async-stream: lets the producer express the credit-gated send loop as a
# straight-line `async` generator (await a credit, yield a batch) instead of a
# hand-rolled Stream state machine.
async-stream = "0.3"
# Error type. thiserror is the workspace's chosen error-derive crate.
thiserror = { workspace = true }
# Memory-mapped files for the same-node, cross-process SHARED_MEMORY transfer path:
# a mapper writes a bucket as Arrow IPC to a tmpfs/temp file, a same-node reducer in
# another process mmaps and reads it — no gRPC, no loopback TCP (the plasma-class
# same-node fast path). Linux prefers /dev/shm; a regular temp file works elsewhere.
memmap2 = "0.9"

[lints]
workspace = true
