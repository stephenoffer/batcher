[package]
name = "bc-expr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
bc-arrow.workspace = true
bc-secrets.workspace = true
arrow.workspace = true
serde.workspace = true
thiserror.workspace = true
regex = "1"
# Prebuilt SIMD substring search (Two-Way + memchr prefilter). SQL `LIKE`/`contains`
# search the SAME needle across every row of a column; `str::contains` rebuilds its
# searcher per call, so a prebuilt `memmem::Finder` reused across the whole column is
# the difference between ~80 ns/row and DuckDB-class ~7 ns/row.
memchr = "2"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# IANA timezone database for `convert_timezone` (DST-aware tz conversion).
chrono-tz = { version = "0.10", default-features = false }
serde_json = "1"
# Cryptographic / non-cryptographic hashes for the `md5`/`sha1`/`sha256`/`crc32`/
# `xxhash64` string functions (all pure-Rust). Differential-tested vs DuckDB where it
# has the same function (md5/sha1/sha256), fixture-tested otherwise (crc32/xxhash64).
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
crc32fast = "1"
twox-hash = "1"
# Data-protection functions (`hmac_sha256`, `aes_encrypt`, `aes_decrypt`). Pure-Rust
# RustCrypto. AES-GCM-**SIV** is chosen over plain GCM because the engine needs a
# deterministic ciphertext (the interpreter is the oracle; a random nonce would make the
# parallel path disagree, and would make an encrypted column unjoinable). SIV is the
# AEAD whose security does not collapse under the fixed nonce that determinism forces.
# `getrandom` is off: nothing here samples randomness.
hmac = "0.12"
aes-gcm-siv = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
# Image decode for the `.image` expression namespace (interpreter oracle path);
# limited to common codecs to keep the dependency footprint small.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "bmp",
    "webp",
] }
# DCT-scaled JPEG decode for the decode→resize hot path. Physical-AI ingest decodes
# large camera frames (720p–4K) down to a small model input (224–512); decoding at full
# resolution first wastes ~N× the pixels and memory bandwidth. `jpeg-decoder` decodes at a
# 1/2·1/4·1/8 DCT scale directly, so a downscale reads far fewer pixels. Used only when the
# source is ≥2× the target (else zune-jpeg's full decode via `image` is faster per pixel).
jpeg-decoder = "0.3"
# SIMD image resize for the `.image` decode/resize kernels. `image`'s own
# `imageops::resize_exact` is a scalar convolution and was the bottleneck on the
# decode→resize→train hot path (JPEG decode via zune is already SIMD; resize was not),
# leaving Batcher behind Daft on `img-resize`. `fast_image_resize` is pure-Rust SIMD
# (SSE4.1/AVX2/NEON), several× faster on downscale. Bilinear == the previous Triangle
# (tent) filter, so the produced pixels stay a linear resample.
fast_image_resize = "6"
# Audio decode for the `.audio` expression namespace (interpreter oracle path, like
# `image`). Pure-Rust; scoped to WAV/PCM + FLAC to keep the footprint small.
symphonia = { version = "0.5", default-features = false, features = [
    "wav",
    "pcm",
    "flac",
] }
# Band-limited (sinc) audio resampling for `.audio.resample(target_sr)` — the canonical
# audio-ML preprocessing step (e.g. 16 kHz for Whisper/wav2vec). `dasp`'s sinc interpolator
# gives librosa-comparable quality in pure Rust, replacing the per-file Python `librosa`
# fallback (a control-plane hot-path tuple touch) with a native, parallel data-plane kernel.
dasp_signal = "0.11"
dasp_interpolate = { version = "0.11", features = ["sinc"] }
dasp_ring_buffer = "0.11"
# Real-input FFT for `.audio.mel_spectrogram` — the log-mel front end every speech model
# (Whisper, wav2vec2, HuBERT) consumes. `realfft` wraps `rustfft` (pure-Rust, SIMD) for
# real signals, returning the n_fft/2+1 half-spectrum directly. Doing the STFT + mel
# filterbank natively keeps audio preprocessing in the data plane instead of a per-file
# Python `torchaudio`/`librosa` UDF (a control-plane hot-path touch). Conventions match
# `torchaudio.transforms.MelSpectrogram` defaults so results are model-drop-in.
realfft = "3"
# Video decode for the `.video` namespace — OPTIONAL (links the system FFmpeg C
# libraries). Off by default; build with `--features video` to enable. Without it,
# the `Expr::Video` variant still deserializes but evaluating it errors clearly.
ffmpeg-next = { version = "8", optional = true }
# Intra-kernel parallelism for the heavy per-row media decoders (JPEG/PNG decode +
# resize is milliseconds/row and embarrassingly parallel). The morsel-level rayon
# pool in `bc-interp` runs a whole morsel of images on ONE thread, so decode needs
# its own row-level fan-out; nested rayon shares the same global pool (work-stealing,
# no oversubscription). Cheap scalar kernels stay serial — only media decode uses it.
rayon.workspace = true

[features]
video = ["dep:ffmpeg-next"]

[lints]
workspace = true
