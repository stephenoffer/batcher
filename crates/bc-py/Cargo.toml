[package]
name = "bc-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# Compiled into the `batcher._native` extension module (maturin renames the
# cdylib). The pymodule init fn below must be named `_native` to match.
name = "_native"
crate-type = ["cdylib"]

[dependencies]
bc-arrow.workspace = true
bc-ir.workspace = true
bc-interp.workspace = true
bc-sketches.workspace = true
bc-transport.workspace = true
bc-io.workspace = true
bc-resource.workspace = true
arrow.workspace = true
arrow-pyarrow.workspace = true
mimalloc.workspace = true
# The allocator's own accounting and its release valve, which the `mimalloc` wrapper does
# not re-export. `mi_process_info` is what lets a memory envelope be computed from the
# *engine's* footprint rather than from process RSS (which counts freed-but-retained pages),
# and `mi_collect` is what makes that difference actionable: hand the retained arena back
# before spilling a hash table to disk. `default-features = false` keeps the `local_dynamic_tls`
# model the workspace pins — see the `mimalloc` note in the root manifest for why a dlopen'd
# cdylib must not use `initial-exec` TLS. Same version the wrapper already links, so this adds
# no code to the build, only a header surface.
libmimalloc-sys = { version = "0.1.49", default-features = false, features = ["extended"] }
pyo3.workspace = true
rayon.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
# Forward to the optional FFmpeg-backed video decode in bc-expr.
video = ["bc-ir/video", "bc-interp/video"]

[lints]
workspace = true
