[package]
name = "bc-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
arrow.workspace = true
# The base of the crate DAG, for `usable_cores` — the one place that reads the cgroup CFS
# quota as well as the affinity mask. Sizing this crate's decode runtime from tokio's default
# (`available_parallelism`, quota-blind) oversubscribes a CPU-limited pod and gets the whole
# cgroup throttled. A downward edge onto the DAG's root, and the alternative would be pasting
# the quota parse into a second crate.
bc-arrow.workspace = true
# Native Parquet decode. `async` + `object_store` give the streaming reader that
# fetches column chunks concurrently straight from object storage (the throughput
# win over a per-chunk pyarrow read). Pinned to 56 to match arrow 56 so the
# RecordBatch/Schema types are identical across the graph.
parquet = { version = "56", features = ["async", "object_store"] }
# Native Avro (OCF) decode to Arrow — the columnar replacement for the row-by-row
# `fastavro` Python path (measured ~33x faster). Version matched to arrow 56.
arrow-avro = "56"
# Uniform object storage: S3 (+ MinIO/Ceph via endpoint), GCS, Azure, local, HTTP.
# Version matched to parquet 56's `object_store` integration so `ParquetObjectReader`
# accepts the store we build.
object_store = { version = "0.12", features = ["aws", "gcp", "azure", "http"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
futures = "0.3"
bytes = "1"
url = "2"
thiserror = { workspace = true }
# Parse the pushed predicate handed over the FFI boundary (a compact JSON the Python
# `to_native_predicate` emits) for footer-statistics row-group pruning.
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
